ectness); A/D là câu hỏi về phương pháp khảo sát/thời lượng pilot, không trực tiếp liên quan bằng chứng đã có; E là kết luận sai (chính là premise cần phản bác).</p>"},"options":[{"k":"A","t":{"en":"The survey response rate may not be statistically representative of all specialists."}},{"k":"B","t":{"en":"The unconsidered criteria represent a scope gap in the assistant's input space."}},{"k":"C","t":{"en":"Acceptance does not establish whether recommendations remain correct after specialist review."}},{"k":"D","t":{"en":"The pilot duration was probably too short to demonstrate reliability across the full year."}},{"k":"E","t":{"en":"The acceptance rate alone proves readiness for general production use"}}],"answer":["B","C"],"multi":true},{"id":"t1q96","n":96,"topic":1,"type":"mcq","stem":{"en":"After a prompt-template update, several previously passing test cases now produce unexpected outputs. Which test type is specifically designed to detect this category of failure?"},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Sau khi update prompt-template, các test case trước đây pass nay cho output không mong đợi — loại test nào được thiết kế chuyên biệt để phát hiện loại lỗi này.</p><p><b>Đáp án: A.</b> Regression tests scored against stable reference set of known-good behavior — đây chính là cơ chế phát hiện khi thay đổi (prompt-template update) làm behavior trước đây đúng nay bị sai lệch; B/C/D đều nhắm mục tiêu khác (security, availability, cross-component integration), không phải để phát hiện regression về behavior sau thay đổi prompt.</p>"},"options":[{"k":"A","t":{"en":"Regression tests scored against a stable reference set of known-good behavior."}},{"k":"B","t":{"en":"Adversarial tests that probe for prompt-injection vulnerabilities."}},{"k":"C","t":{"en":"Smoke tests that confirm high-level system availability after the change."}},{"k":"D","t":{"en":"Integration tests that validate cross-component pipeline behavior."}}],"answer":["A"],"multi":false},{"id":"t1q97","n":97,"topic":1,"type":"mcq","stem":{"en":"You are reviewing an integration specification for security gaps. Which two findings constitute valid security gaps in the specification? (Select two.) Each correct answer presents a complete solution."},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Chọn 2 finding đúng là security gap trong integration specification.</p><p><b>Đáp án: B và C.</b> RBAC chỉ enforce tại response-rendering layer SAU KHI model đã access restricted data (B) — enforcement quá muộn, model đã đọc data trước khi filter, đây là gap thật sự; service credentials đặt trong prompt context có thể leak vào logs/traces (C) — rủi ro rõ ràng về secret exposure; A/D/E đều là thực hành đúng (least-privilege, TLS encryption, scoped OAuth với refresh) chứ không phải gap.</p>"},"options":[{"k":"A","t":{"en":"Tool calls execute server-side under a least-privilege service principal scoped to the requested action."}},{"k":"B","t":{"en":"Role-based access control is enforced only at the response-rendering layer after the model accesses restricted data."}},{"k":"C","t":{"en":"Service credentials are placed in the prompt context, where they can leak into logs and traces."}},{"k":"D","t":{"en":"Tool inputs and outputs are encrypted in transit using transport-layer security between services."}},{"k":"E","t":{"en":"Per-user OAuth tokens are exchanged with scope-restricted permissions and refreshed within the active session."}}],"answer":["B","C"],"multi":true},{"id":"t1q98","n":98,"topic":1,"type":"mcq","stem":{"en":"The compliance team at a firm has approved a Claude Skill that generates client-facing investment summaries. The Skill includes the firm's required disclaimers and prohibited-language list. A product manager has asked whether additional guardrails are needed at the application layer or whether the Skill alone is sufficient. Which two guardrail responsibilities should remain at the application layer rather than the Skill? (Select two.) Each correct answer presents part of the solution."},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Skill đã bao gồm disclaimer + prohibited-language list cho investment summary — chọn 2 trách nhiệm guardrail nên <b>giữ ở application layer</b> thay vì đặt trong Skill.</p><p><b>Đáp án: A và B.</b> Log mọi summary vào compliance audit trail (A) và verify user có authorization để generate summary hay không (B) — đây là các control mang tính deterministic, thuộc về infrastructure/access-control, phải xảy ra độc lập với (và thường trước khi) Skill được invoke; C/D/E đều là nội dung/format mà compliance team đã chuẩn hóa và phù hợp để đặt ngay trong Skill (prompt-based, vì đề bài nói Skill đã include disclaimer và prohibited-language list).</p>"},"options":[{"k":"A","t":{"en":"Log every generated summary to the firm's compliance audit trail for retention."}},{"k":"B","t":{"en":"Verify the requesting user is authorized to generate investment summaries at all."}},{"k":"C","t":{"en":"Apply the disclaimer template that the compliance team has standardized firm-wide."}},{"k":"D","t":{"en":"Format output sections according to the firm's standardized house style guidelines."}},{"k":"E","t":{"en":"Apply the prohibited-language list that the compliance team maintains and updates."}}],"answer":["A","B"],"multi":true},{"id":"t1q99","n":99,"topic":1,"type":"mcq","stem":{"en":"A business sponsor has requested an AI solution to \"improve customer experience.\" The sponsor cannot articulate which customer journey is failing, which metric reflects the failure, or which decisions the AI should support. The sponsor is asking you to begin design work next week. Which delegation-competency action should you take first?"},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Sponsor yêu cầu \"improve customer experience\" nhưng chưa xác định được journey nào failing, metric nào phản ánh, hay decision nào AI cần support — hành động \"delegation-competency\" nào nên làm trước tiên.</p><p><b>Đáp án: A.</b> Facilitate structured discovery để xác định rõ failing decision và target metric — đây là bước cần thiết trước khi có thể scope bất kỳ design work nào; B trì hoãn không giúp ích, C bắt đầu prototype khi chưa rõ mục tiêu sẽ lãng phí và sai hướng, D tự đưa ra assumption và cam kết scope mà không xác minh với sponsor là rủi ro cao (vi phạm nguyên tắc không đoán mò khi thiếu thông tin).</p>"},"options":[{"k":"A","t":{"en":"Facilitate a structured discovery to define the failing decision and the target metric."}},{"k":"B","t":{"en":"Recommend that the sponsor revise the request and resubmit it later for evaluation."}},{"k":"C","t":{"en":"Begin prototyping a generic assistant against the broad request before the next deadline."}},{"k":"D","t":{"en":"Propose a fixed scope that you commit to by default based on your own assumptions."}}],"answer":["A"],"multi":false},{"id":"t1q100","n":100,"topic":1,"type":"mcq","stem":{"en":"You are preparing an operational runbook for a Claude-based service. Which content is essential to include in the runbook?"},"explain":{"text":"<p>Đáp án: A. Runbook cần đầy đủ: common alerts + triage steps, escalation paths, rollback procedures, và tham chiếu dashboards/logs — đủ để on-call engineer xử lý end-to-end một incident; B/C/D đều thiếu ít nhất một thành phần thiết yếu, không đủ cho việc dùng thực tế.</p>"},"options":[{"k":"A","t":{"en":"Common alerts and their triage steps, escalation paths, rollback procedures, and references to the relevant dashboards and logs."}},{"k":"B","t":{"en":"Escalation paths and rollback procedures only, without alert definitions, triage steps, or dashboard references to guide initial incident response."}},{"k":"C","t":{"en":"Alert definitions and triage steps only, without escalation paths, rollback procedures, or references to dashboards and logs for on-call use."}},{"k":"D","t":{"en":"Dashboard and log references only, without alert definitions, triage steps, escalation paths, or rollback procedures for the on-call engineer to act on."}}],"answer":["A"],"multi":false},{"id":"t1q101","n":101,"topic":1,"type":"mcq","stem":{"en":"You are explaining the precedence of Claude Code configuration scopes to the team. Which precedence ordering, from highest to lowest, is correct?"},"explain":{"text":"<p>Đã kiểm tra</p><p><b>Tóm tắt câu hỏi:</b> Thứ tự precedence đúng của các Claude Code configuration scope, từ cao đến thấp.</p><p><b>Đáp án: A.</b> Managed &gt; command-line arguments &gt; local &gt; project &gt; user — managed config (enterprise/admin) luôn cao nhất vì không thể override; command-line arguments áp dụng tức thời cho session hiện tại nên đứng sau managed; local scope (cá nhân, không commit) cao hơn project (shared, committed); user scope (thấp nhất, áp dụng rộng nhất across mọi project) đứng cuối. B/C/D đều đảo sai vị trí managed hoặc user.</p>"},"options":[{"k":"A","t":{"en":"Managed &gt; command-line arguments &gt; local &gt; project &gt; user"}},{"k":"B","t":{"en":"Project &gt; user &gt; managed &gt; local &gt; command-line arguments"}},{"k":"C","t":{"en":"Local &gt; managed &gt; user &gt; command-line arguments &gt; project"}},{"k":"D","t":{"en":"User &gt; project &gt; local &gt; command-line arguments &gt; managed"}}],"answer":["A"],"multi":false},{"id":"t1q102","n":102,"topic":1,"type":"mcq","stem":{"en":"A technical team is debating whether to implement a new capability for generating regulatory filings from internal data as a Claude Skill or as an MCP server. The capability requires a fixed authoring procedure with embedded examples, does not need to call live external systems, and must be portable across three Claude deployments: claude.ai, an internal API integration, and Claude Code. Which factor most strongly favors implementing the capability as a Skill?"},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Cần chọn implement capability tạo regulatory filings (fixed authoring procedure, embedded examples, không cần call live external system, cần portable qua 3 deployment) dưới dạng Claude Skill hay MCP server — yếu tố nào thiên về Skill nhất.</p><p><b>Đáp án: D.</b> Capability là procedural knowledge (fixed authoring procedure + examples), không cần live external-system call — đây chính là bản chất phù hợp với Skill (packaged instructions/knowledge), trong khi MCP server tồn tại để kết nối live system/tool; A là yêu cầu portability chung (không phân biệt Skill vs MCP), B/C nếu đúng sẽ thiên về MCP (cần auth và live query), nhưng đề bài đã loại trừ (không cần live external system).</p>"},"options":[{"k":"A","t":{"en":"The capability must also be callable from a developer's command-line interface."}},{"k":"B","t":{"en":"The capability requires direct authentication against the corporate identity provider."}},{"k":"C","t":{"en":"The capability needs to query a live database for the most recent regulatory filings."}},{"k":"D","t":{"en":"The capability is procedural knowledge with no live external-system calls required."}}],"answer":["D"],"multi":false},{"id":"t1q103","n":103,"topic":1,"type":"mcq","stem":{"en":"You are presenting an architectural decision to a mixed audience that includes an executive sponsor and the engineering leads who will implement the decision. Which presentation strategy best serves both audiences?"},"explain":{"text":"<p>Đã kiểm tra</p><p><b>Tóm tắt câu hỏi:</b> Trình bày architectural decision cho audience hỗn hợp (executive sponsor + engineering leads) — strategy nào phù hợp nhất cho cả hai.</p><p><b>Đáp án: C.</b> Mở đầu bằng decision, business outcomes, và trade-offs (phù hợp executive sponsor), sau đó tiếp tục với technical rationale, alternatives, implementation implications (phù hợp engineering leads) — cấu trúc layered từ business xuống technical phục vụ cả hai audience mà không ép ai đọc phần không cần thiết trước; A bỏ hoàn toàn executive, B thiếu context cho cả hai, D không phân tầng nên lãng phí thời gian của cả hai nhóm.</p>"},"options":[{"k":"A","t":{"en":"Open with a deep dive into low-level implementation details targeted at engineering leads, and stop there without addressing the business outcomes or trade-offs the executive sponsor needs."}},{"k":"B","t":{"en":"Skip the rationale, alternatives, and trade-off discussion entirely and simply announce the chosen decision, leaving both audiences without the context needed to implement or validate it."}},{"k":"C","t":{"en":"Lead with the decision, the business outcomes it serves, and the trade-offs accepted; follow with the technical rationale, alternatives, and implementation implications for the engineering audience."}},{"k":"D","t":{"en":"Present a single undifferentiated narrative that addresses technical and business concerns with equal weight throughout, treating both audiences as requiring the same depth on every section."}}],"answer":["C"],"multi":false},{"id":"t1q104","n":104,"topic":1,"type":"mcq","stem":{"en":"You are operating an interactive assistant whose dominant performance constraint is perturn latency. Quality on routine turns is already acceptable. Which configuration adjustment most directly improves latency without disproportionately damaging quality?"},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Assistant tương tác có constraint chính là per-turn latency, quality routine turns đã đạt yêu cầu — điều chỉnh config nào cải thiện latency trực tiếp nhất mà không ảnh hưởng nặng đến quality.</p><p><b>Đáp án: A.</b> Giảm retrieval depth xuống top-k passages đã historically cover câu trả lời (giảm token xử lý không cần thiết) và cache stable system-prompt content (tận dụng prompt caching cho phần ổn định) — cả hai đều giảm latency trực tiếp mà ít ảnh hưởng quality vì routine turns đã đủ tốt; B làm latency tệ hơn, C tăng latency để đổi lấy recall không cần thiết (quality đã ổn), D tắt prompt caching sẽ làm latency TỆ HƠN chứ không tốt hơn — đi ngược mục tiêu.</p>"},"options":[{"k":"A","t":{"en":"Reduce retrieval depth to the top-k passages that historically cover the answer, and cache stable system- prompt content."}},{"k":"B","t":{"en":"Switch every turn to the heaviest available model to maximize output quality, accepting that the increased model latency will worsen the per-turn SLO rather than improve it."}},{"k":"C","t":{"en":"Increase retrieval depth to the corpus maximum to improve recall regardless of latency."}},{"k":"D","t":{"en":"Disable prompt caching entirely to ensure fresh context processing on every request, preventing stale prefix content from affecting latency-sensitive interactions."}}],"answer":["A"],"multi":false},{"id":"t1q105","n":105,"topic":1,"type":"dropdown","stem":{"en":"You are classifying token-management tactics by where each tactic applies in the request lifecycle: \"Input Preparation,\" \"Prompt Construction,\" or \"Output Handling.\""},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Phân loại 6 tactic quản lý token theo giai đoạn: Input Preparation / Prompt Construction / Output Handling.</p><p><b>Đáp án:</b></p><ul><li>Persist validated output for downstream/audit → <b>Output Handling</b></li><li>Order prompt sections (cacheable trước per-request) → <b>Prompt Construction</b></li><li>Summarize prior conversation history khi không cần full history → <b>Input Preparation</b></li><li>Validate structured output against schema → <b>Output Handling</b> (đã cho sẵn)</li><li>Move stable repeated content into cacheable prefix ở đầu prompt → <b>Prompt Construction</b></li><li>Trim retrieved passages to relevant spans → <b>Input Preparation</b> (đã cho sẵn)</li></ul>"},"blanks":[{"label":{"en":"Persist the validated output for downstream consumption and audit."},"opts":[{"en":"Output Handling"},{"en":"Prompt Construction"},{"en":"Input Preparation"}],"a":0},{"label":{"en":"Order the prompt sections so cacheable content sits before per-request content."},"opts":[{"en":"Output Handling"},{"en":"Prompt Construction"},{"en":"Input Preparation"}],"a":1},{"label":{"en":"Summarize prior conversation history when full history is no longer needed."},"opts":[{"en":"Output Handling"},{"en":"Prompt Construction"},{"en":"Input Preparation"}],"a":2},{"label":{"en":"Validate the model's structured output against the expected schema."},"opts":[{"en":"Output Handling"},{"en":"Prompt Construction"},{"en":"Input Preparation"}],"a":0},{"label":{"en":"Move stable repeated content into a cacheable prefix at the head of the prompt."},"opts":[{"en":"Output Handling"},{"en":"Prompt Construction"},{"en":"Input Preparation"}],"a":1},{"label":{"en":"Trim retrieved passages to spans relevant to the user's question."},"opts":[{"en":"Output Handling"},{"en":"Prompt Construction"},{"en":"Input Preparation"}],"a":2}]},{"id":"t1q106","n":106,"topic":1,"type":"mcq","stem":{"en":"You are defining escalation criteria for ambiguous cases in an automated workflow. Which set of criteria best supports consistent escalation?"},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Chọn bộ tiêu chí escalation phù hợp nhất cho các case ambiguous trong automated workflow.</p><p><b>Đáp án: A.</b> Bộ tiêu chí cụ thể, đo lường được: confidence score dưới threshold, high-impact decision categories, ambiguity flags từ classifier, và user request review — đây là các tiêu chí deterministic/rõ ràng đảm bảo consistency; B/C/D đều thiếu tiêu chí cụ thể (phụ thuộc discretion, complaint sau sự cố, hoặc không có tiêu chí nào) nên không đảm bảo escalation nhất quán.</p>"},"options":[{"k":"A","t":{"en":"A confidence score below a defined threshold, presence of high-impact decision categories, ambiguity flags raised by content classifiers, and the user's explicit request for review."}},{"k":"B","t":{"en":"No escalation criteria; the model decides independently on every turn whether to escalate, without explicit confidence thresholds, impact categories, or classifier-based ambiguity flags."}},{"k":"C","t":{"en":"Escalation at the discretion of whoever is available when the team's on-call engineer has spare capacity, without a defined threshold, category, or ambiguity criterion."}},{"k":"D","t":{"en":"Escalation only after an affected customer has contacted support to complain, after the automated workflow has already completed without human review."}}],"answer":["A"],"multi":false},{"id":"t1q107","n":107,"topic":1,"type":"mcq","stem":{"en":"You are building a feedback-and-alignment routine for a multi-stakeholder deployment. Which two practices belong in the routine? (Select two.) Each correct answer presents a complete solution."},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Chọn 2 thực hành thuộc \"feedback-and-alignment routine\" cho deployment nhiều bên liên quan.</p><p><b>Đáp án: D và E.</b> Cadence định kỳ revisit expectations/assumptions khi conditions thay đổi (D) đảm bảo alignment liên tục theo thời gian; reconcile explicitly các vị trí khác biệt giữa stakeholder thay vì che giấu (E) đảm bảo feedback thực chất, tránh xung đột ngầm; A/C là thực hành logistics hỗ trợ nhưng không phải bản chất cốt lõi của feedback-alignment, B là escalation cứng nhắc không phải cơ chế alignment/reconciliation.</p>"},"options":[{"k":"A","t":{"en":"Rotate facilitation among the participating stakeholder groups to share ownership of the routine."}},{"k":"B","t":{"en":"Escalate any disagreement among stakeholders to the executive sponsor for binding resolution."}},{"k":"C","t":{"en":"Record each session and distribute the recording to stakeholders who could not attend live."}},{"k":"D","t":{"en":"Set a regular cadence for revisiting expectations and assumptions as conditions evolve over time."}},{"k":"E","t":{"en":"Reconcile divergent stakeholder positions explicitly rather than papering over them in the moment."}}],"answer":["D","E"],"multi":true},{"id":"t1q108","n":108,"topic":1,"type":"mcq","stem":{"en":"You are rolling out monitoring for a Claude-based deployment and must complete the specification steps before instrumenting the deployment. Which two steps must be completed BEFORE instrumenting the deployment to emit metrics and traces? (Select two.) Each correct answer presents part of the solution."},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Trước khi instrument deployment để emit metrics/traces, cần hoàn thành 2 bước specification nào.</p><p><b>Đáp án: B và D.</b> Định nghĩa metrics và slices sẽ monitor trên normal + adversarial traffic (B) và định nghĩa SLOs/error budgets deployment sẽ bị held to (D) — đây là bước specification/thiết kế phải có TRƯỚC khi instrument (phải biết đo gì, đo để so với chuẩn nào trước khi code emit metric); A/C/E đều là bước xảy ra SAU khi đã có dữ liệu thực tế (dashboard cần metrics đã emit, tune threshold cần observed distribution, document runbook cần dashboard đã build).</p>"},"options":[{"k":"A","t":{"en":"Build the dashboards that surface metrics across slices at the cadence the team operates on."}},{"k":"B","t":{"en":"Define the metrics and the slices the deployment will monitor across normal and adversarial traffic."}},{"k":"C","t":{"en":"Document the dashboards, alerts, and runbooks for the on-call rotation that will respond."}},{"k":"D","t":{"en":"Define the service-level objectives (SLOs) and the error budgets the deployment will be held to."}},{"k":"E","t":{"en":"Tune the alert thresholds based on observed normal-state distributions to reduce false positives."}}],"answer":["B","D"],"multi":true},{"id":"t1q109","n":109,"topic":1,"type":"mcq","stem":{"en":"A team manager wants all engineers working on the same repository to share identical MCP server definitions without manual synchronization. Which configuration approach satisfies this requirement?"},"options":[{"k":"A","t":{"en":"managed configuration pushed to all endpoints by the administrator"}},{"k":"B","t":{"en":"environment variables set at the operating-system level on each workstation"}},{"k":"C","t":{"en":"project-scope .claude/settings.json and .mcp.json files committed to the repository"}},{"k":"D","t":{"en":"each engineer maintains a personal ~/.claude/settings.json with the shared definitions"}}],"answer":["C"],"multi":false,"explain":{"text":"<p>Cấu hình <b>project-scope</b> (<code>.claude/settings.json</code> và <code>.mcp.json</code>) được commit vào repository sẽ tự động áp dụng cho mọi engineer khi họ pull code — không cần đồng bộ thủ công. <b>A</b> (managed) là cấu hình cấp tổ chức/thiết bị, không gắn với từng repository cụ thể. <b>B</b> và <b>D</b> đều yêu cầu mỗi engineer tự cấu hình thủ công trên máy riêng, dễ lệch nhau và không tự động đồng bộ.</p>"}},{"id":"t1q110","n":110,"topic":1,"type":"mcq","stem":{"en":"You are designing a content moderation classifier that processes high volumes of user-generated comments under a tight per-message latency budget using well-defined classification labels. Which model selection best aligns with the workload?"},"options":[{"k":"A","t":{"en":"Opus, because every moderation decision requires maximum reasoning depth regardless of classification complexity."}},{"k":"B","t":{"en":"Haiku, because its latency and cost profile align with high-volume classification workloads that require limited reasoning depth."}},{"k":"C","t":{"en":"Sonnet, because larger general-purpose models are preferred even when workload latency requirements are strict."}},{"k":"D","t":{"en":"Sonnet with extended thinking enabled, because deeper reasoning should be applied to every moderation request to improve edge-case handling."}}],"answer":["B"],"multi":false,"explain":{"text":"<p><b>Haiku</b> có độ trễ và chi phí thấp nhất trong dòng model, phù hợp cho khối lượng phân loại lớn với nhãn đã được định nghĩa rõ ràng (không đòi hỏi reasoning sâu). Chọn Opus/Sonnet hay bật extended thinking cho tác vụ classification đơn giản là lãng phí, vi phạm nguyên tắc \"chọn tầng model rẻ nhất thực sự thỏa mãn yêu cầu\".</p>"}},{"id":"t1q111","n":111,"topic":1,"type":"mcq","stem":{"en":"You are assessing data-exfiltration risk in a Claude-based assistant that has tools for both internal-document retrieval and outbound HTTP calls. Which scenario most directly indicates a data-exfiltration risk?"},"options":[{"k":"A","t":{"en":"The outbound HTTP tool returns a 200 response when the assistant calls an allow-listed domain to fulfil a user-initiated data-lookup request."}},{"k":"B","t":{"en":"The user submits a routine question and receives a routine answer."}},{"k":"C","t":{"en":"Adversarial content in a retrieved document instructs the model to call the outbound HTTP tool and send sensitive content to an attacker-controlled URL."}},{"k":"D","t":{"en":"The internal-document retrieval tool returns a document that the user is authorized to view."}}],"answer":["C"],"multi":false,"explain":{"text":"<p>Đây là ví dụ điển hình của <b>indirect prompt injection</b> dẫn đến <b>data exfiltration</b>: nội dung đối kháng ẩn trong tài liệu được truy xuất về chỉ thị model gọi tool HTTP outbound để gửi dữ liệu nhạy cảm ra một URL do kẻ tấn công kiểm soát — người dùng không hề thấy chỉ thị độc hại này nhưng vẫn là nạn nhân bị rò rỉ dữ liệu. Các phương án còn lại đều mô tả hành vi sử dụng tool bình thường, hợp lệ.</p>"}},{"id":"t1q112","n":112,"topic":1,"type":"mcq","stem":{"en":"A Claude Architect is reviewing a post-deployment performance report for an AI-assisted legal-document summarization system. The report includes these observations: (1) Average summarization time decreased from 47 minutes to 6 minutes per document. (2) Associates spend less time on summaries, but overall billable output has not measurably changed. (3) Infrastructure costs increased by 22% because redundant retry logic generated additional API calls. (4) Some summaries require attorney correction, adding an average of 8 minutes of review per document. Which analysis correctly attributes each observation to the appropriate business-value pillar?"},"options":[{"k":"A","t":{"en":"Observations 1 and 2 both indicate efficiency gains; Observation 3 is a solution-cost issue; Observation 4 is a performance-SLA issue."}},{"k":"B","t":{"en":"Observation 1 is a transformation outcome; Observation 2 is an efficiency gain; Observation 3 is a performance-SLA degradation; Observation 4 is a solution-cost issue."}},{"k":"C","t":{"en":"Observations 1 and 4 together indicate a net performance-SLA improvement; Observation 2 is a transformation gap; Observation 3 is a productivity drain from over-engineering."}},{"k":"D","t":{"en":"Observation 1 indicates an efficiency gain; Observation 2 shows that productivity has not yet been realized; Observation 3 is a solution-cost issue; Observation 4 is an efficiency loss that partially offsets Observation 1."}}],"answer":["D"],"multi":false,"explain":{"text":"<p><b>Efficiency (Observation 1):</b> Giảm thời gian tóm tắt trung bình từ 47 phút xuống 6 phút/tài liệu là cải thiện hiệu suất trực tiếp trên một đơn vị công việc — đúng nghĩa <i>efficiency gain</i>.<br><b>Productivity (Observation 2):</b> Dù mỗi tài liệu tốn ít thời gian hơn, tổng sản lượng thanh toán (billable output) chưa đổi — nghĩa là giá trị về năng suất tổng thể (<i>productivity</i>) chưa thực sự được hiện thực hóa.<br><b>Solution Cost (Observation 3):</b> Chi phí hạ tầng tăng 22% do logic retry dư thừa là vấn đề quản lý chi phí giải pháp (<i>solution-cost issue</i>), không liên quan đến hiệu suất hay chất lượng.<br><b>Efficiency loss (Observation 4):</b> Thời gian đính chính 8 phút/tài liệu là một khoản hao tổn hiệu suất (<i>efficiency loss</i>) làm giảm bớt phần lợi ích thời gian đã đạt được ở Observation 1 — không phải một pillar riêng biệt.</p>"}},{"id":"t1q113","n":113,"topic":1,"type":"mcq","stem":{"en":"You are integrating Claude Code into a team workflow and must complete the design and configuration steps before piloting the integrated workflow with a small group. Which two steps must be completed BEFORE piloting the integrated workflow? (Select two.) Each correct answer presents part of the solution."},"options":[{"k":"A","t":{"en":"Document the integrated workflow with handoff criteria, permission boundaries, and on-call runbooks."}},{"k":"B","t":{"en":"Identify the workflow steps where AI-assisted tooling adds value and where human authority must remain."}},{"k":"C","t":{"en":"Negotiate the workflow change with affected teams and obtain formal sign-off from each manager."}},{"k":"D","t":{"en":"Iterate the integrated workflow based on pilot findings before broader rollout to the team."}},{"k":"E","t":{"en":"Configure the project-scope MCP servers, permissions, subagents, and persistent project context."}}],"answer":["B","E"],"multi":true,"explain":{"text":"<p><b>Identify value & human authority (B):</b> Trước khi thử nghiệm, cần xác định rõ bước nào AI hỗ trợ tạo giá trị và bước nào bắt buộc phải giữ quyền quyết định của con người (nguyên tắc Human-in-the-loop) — đây là bước thiết kế tiên quyết.<br><b>Configure project-scope setup (E):</b> Cấu hình kỹ thuật thực tế (MCP servers, permissions, subagents, project context) phải hoàn tất để hệ thống sẵn sàng vận hành trước khi pilot.<br><i>Loại trừ:</i> <b>A</b> (tài liệu hóa handoff/runbook chi tiết) và <b>C</b> (đàm phán ký duyệt chính thức với các team) thuộc giai đoạn bàn giao/rollout quy mô lớn, chưa cần ở bước pilot hẹp; <b>D</b> (lặp cải tiến theo kết quả pilot) là bước xảy ra <i>sau</i> khi đã có dữ liệu từ pilot.</p>"}}]}]};

    get(k){ try{ return ok ? localStorage.getItem(k) : (mem[k] ?? null); }catch(e){ return mem[k] ?? null; } },
    set(k,v){ try{ ok ? localStorage.setItem(k,v) : (mem[k]=v); }catch(e){ mem[k]=v; } },
    del(k){ try{ ok ? localStorage.removeItem(k) : delete mem[k]; }catch(e){ delete mem[k]; } } };

let L = "vi";
const t = (k,...a) => { const v = T[L][k]; return typeof v === "function" ? v(...a) : v; };
/* văn bản song ngữ: luôn hiện bản tiếng Anh (đề gốc), kèm bản Việt khi giao diện là VI */
const tx = o => !o ? "" : o.en + (L === "vi" && o.vi ? `<span class="gloss">${o.vi}</span>` : "");

/* ---------- dữ liệu phẳng ---------- */
const ALL = [], BY_ID = {};
DATA.topics.forEach(tp => tp.questions.forEach(q => {
  q.idx = ALL.length + 1;
  q.hay = fold(strip([q.stem.en, q.stem.vi,
    (q.options||[]).map(o => o.t.en + " " + (o.t.vi||"")).join(" "),
    (q.rows||[]).map(r => r.t.en + " " + (r.t.vi||"")).join(" "),
    (q.blanks||[]).map(b => (b.opts||[]).map(o => o.en).join(" ")).join(" "),
    q.explain && (q.explain.key || q.explain.text), (q.explain && q.explain.elim || []).join(" ")
  ].filter(Boolean).join(" ")));
  ALL.push(q); BY_ID[q.id] = q;
}));
const TOPICS = DATA.topics.map(d => d.n);
const TYPES = [...new Set(ALL.map(q => q.type))];
const PASS = DATA.meta.pass || 70;

/* ============================================================
   LOGIC THEO DẠNG CÂU
   ============================================================ */
function blankAnswer(q){
  if(q.type === "mcq")   return [];
  if(q.type === "yesno") return q.rows.map(() => null);
  return q.blanks.map(() => null);
}
function answeredCount(q, a){
  if(q.type === "mcq") return (a||[]).length;
  return (a||[]).filter(v => v !== null && v !== undefined).length;
}
function totalParts(q){
  if(q.type === "mcq") return q.answer.length;
  if(q.type === "yesno") return q.rows.length;
  return q.blanks.length;
}
function isComplete(q, a){ return answeredCount(q,a) >= totalParts(q); }
function isCorrect(q, a){
  if(!a) return false;
  if(q.type === "mcq")
    return a.length === q.answer.length && [...a].sort().join("") === [...q.answer].sort().join("");
  if(q.type === "yesno") return q.rows.every((r,i) => a[i] === r.a);
  return q.blanks.every((b,i) => a[i] === b.a);
}
function stampHTML(q){
  if(q.type === "mcq")
    return `<div class="stamp"><span class="t">${t("ansTitle")}</span><span class="v">${q.answer.join(" ")}</span></div>`;
  if(q.type === "yesno")
    return `<div class="stamp"><span class="t">${t("ansTitle")}</span><span class="v">${
      q.rows.map(r => r.a === "Y" ? "Y" : "N").join(" ")}</span></div>`;
  return `<div class="stamp txt"><span class="t">${t("ansTitle")}</span><span class="v">${
    q.blanks.map(b => strip(b.opts[b.a].en)).join(" · ")}</span></div>`;
}

/* ---------- thân câu hỏi (dùng chung cho ôn tập / thi / xem lại) ---------- */
function bodyHTML(q, a, done, act){
  const P = act ? `data-act="${act}"` : "";
  if(q.type === "mcq"){
    return `<ul class="opts">` + q.options.map(o => {
      const right = q.answer.includes(o.k), pick = (a||[]).includes(o.k);
      return `<li><button class="opt" ${P} data-k="${o.k}" data-right="${right?1:0}" data-pick="${pick?1:0}"
          ${done?'aria-disabled="true"':""}>
        <span class="k">${o.k}</span><span class="tx">${tx(o.t)}</span>
        <span class="mk mk-you">${t("markYou")}</span><span class="mk mk-ok">${t("markOk")}</span>
      </button></li>`; }).join("") + `</ul>`;
  }
  if(q.type === "yesno"){
    return `<ul class="ynlist">` + q.rows.map((r,i) => {
      const v = a ? a[i] : null;
      const right = v !== null && v === r.a;
      return `<li class="yn" data-right="${right?1:0}">
        <div class="ynt">${tx(r.t)}</div>
        <div class="ynb" role="group">
          <button ${P} data-i="${i}" data-v="Y" data-correct="${r.a==="Y"?1:0}" aria-pressed="${v==="Y"}">${t("yes")}</button>
          <button ${P} data-i="${i}" data-v="N" data-correct="${r.a==="N"?1:0}" aria-pressed="${v==="N"}">${t("no")}</button>
        </div></li>`; }).join("") + `</ul>`;
  }
  return `<div class="blanks">` + q.blanks.map((b,i) => {
    const v = a ? a[i] : null;
    const right = v !== null && v === b.a;
    return `<div class="blank" data-right="${right?1:0}">
      ${b.label ? `<span class="blabel">${tx(b.label)}</span>` : ""}
      <label class="sel ${v!==null?"on":""}">
        <select ${P} data-i="${i}">
          <option value="">— —</option>
          ${b.opts.map((o,j) => {
            const en = strip(o.en), vi = o.vi ? strip(o.vi) : "";
            return `<option value="${j}" ${v===j?"selected":""}${vi?` title="${esc(vi)}"`:""}>${esc(en)}</option>`;
          }).join("")}
        </select><span class="cap"></span>
      </label>
      <span class="ansline ${right?"ok":"bad"}">${t("ansTitle")}: ${esc(strip(b.opts[b.a].en))}${
        L === "vi" && b.opts[b.a].vi ? ` — ${esc(strip(b.opts[b.a].vi))}` : ""}</span>
    </div>`; }).join("") + `</div>`;
}

/* ---------- khối giải thích ---------- */
function noteHTML(r){
  return `<div class="notewrap"><span class="lbl">${t("secNote")}</span>
    <textarea data-act="note" rows="2" placeholder="${esc(t("notePh"))}">${esc(r.note||"")}</textarea></div>`;
}
function revealHTML(q, verdict, extra){
  const e = q.explain || {};
  const two = !!(e.key && e.elim && e.elim.length);
  let secs = "";
  if(e.key)  secs += `<div><h4 class="sech">${t("secKey")}</h4><p class="prose">${e.key}</p></div>`;
  if(e.elim && e.elim.length)
    secs += `<div><h4 class="sech">${t("secElim")}</h4><ul class="elim">${e.elim.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  if(e.text) secs += `<div><h4 class="sech">${t("secExp")}</h4><p class="prose">${e.text}</p></div>`;
  const conf = q.conf ? `<span class="conf ${q.conf.toLowerCase()}">${t("conf"+q.conf.toUpperCase())}</span>` : "";
  return `<div class="rev">
    <div class="revtop">${stampHTML(q)}${verdict}${conf}</div>
    <div class="revgrid ${two?"two":""}">${secs}</div>
    ${q.cite ? `<p class="cite">${t("source")}: ${q.cite}</p>` : ""}
    ${extra || ""}
  </div>`;
}

/* ============================================================
   TRẠNG THÁI
   ============================================================ */
const S = { mode:"study", f:{topic:"all",status:"all",type:"all",q:""},
            p:{}, history:[], cur:null, exam:null, reviewWrongOnly:false };
const rec = id => (S.p[id] ||= { a:null, done:0, ok:null, flag:0, note:"", n:0 });
const ansOf = q => { const r = rec(q.id); if(!r.a) r.a = blankAnswer(q); return r.a; };

function save(){
  const e = S.exam;
  const exam = (e && e.phase === "run") ? {
    ids:e.list.map(x=>x.id), order:e.order, answers:e.answers, flags:e.flags,
    pos:e.pos, started:e.started, duration:e.duration, cfg:e.cfg } : null;
  store.set(KEY, JSON.stringify({ v:2, lang:L, theme:document.documentElement.dataset.theme,
                                  p:S.p, history:S.history, exam }));
}
function load(){
  try{
    const d = JSON.parse(store.get(KEY) || "{}");
    if(d.p) S.p = d.p;
    if(Array.isArray(d.history)) S.history = d.history;
    if(d.lang) L = d.lang;
    if(d.exam && d.exam.ids){
      const list = d.exam.ids.map(id => {
        const q = BY_ID[id]; if(!q) return null;
        const ord = d.exam.order && d.exam.order[id];
        if(ord && q.options) return Object.assign({}, q, { options: ord.map(k => q.options.find(o=>o.k===k)).filter(Boolean) });
        return q;
      }).filter(Boolean);
      if(list.length === d.exam.ids.length)
        S.exam = { phase:"run", list, order:d.exam.order, answers:d.exam.answers||{}, flags:d.exam.flags||{},
                   pos:d.exam.pos||0, started:d.exam.started, duration:d.exam.duration, cfg:d.exam.cfg, timer:null };
    }
  }catch(e){}
}

/* ---------- lọc ---------- */
function filtered(){
  const term = fold(S.f.q.trim());
  return ALL.filter(q => {
    if(S.f.topic !== "all" && q.topic !== +S.f.topic) return false;
    if(S.f.type !== "all" && q.type !== S.f.type) return false;
    const r = S.p[q.id];
    if(S.f.status === "todo"  && r && r.done) return false;
    if(S.f.status === "right" && !(r && r.ok === true)) return false;
    if(S.f.status === "wrong" && !(r && r.ok === false)) return false;
    if(S.f.status === "flag"  && !(r && r.flag)) return false;
    if(term && !q.hay.includes(term)) return false;
    return true;
  });
}
function statsOf(list){
  let done=0, right=0, flag=0;
  list.forEach(q => { const r=S.p[q.id]; if(!r) return;
    if(r.ok === true || r.ok === false){ done++; if(r.ok) right++; }
    if(r.flag) flag++; });
  return { done, right, flag, total:list.length };
}

function renderAll(){ renderRail(); renderMain(); renderAside(); applyI18n(); }

function applyI18n(){
  document.documentElement.lang = L;
  $$("[data-t]").forEach(el => { const v = T[L][el.dataset.t]; if(typeof v === "string") el.textContent = v; });
  $$("[data-t-ph]").forEach(el => { const v = T[L][el.dataset.tPh]; if(typeof v === "string") el.placeholder = v; });
  $("#storeNote").textContent = store.ok ? t("okStore") : t("noStore");
  $$("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === L));
  $$("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === S.mode));
}

function renderRail(){
  // một hàm dựng hàng dùng chung cho MỌI danh sách lọc — thêm bộ lọc mới thì
  // gọi lại nó, đừng đẻ ra kiểu hiển thị thứ hai.
  const listRow = (key, cur, v, lab, count, mark) =>
    `<button class="srow" data-f-key="${key}" data-v="${v}" aria-pressed="${String(v)===String(cur)}">
      <span class="dot ${mark||""}"></span><span class="nm">${esc(lab)}</span><span class="ct">${count}</span>
    </button>`;

  // ----- trạng thái -----
  const counts = (() => {
    let todo=0, right=0, wrong=0, flag=0;
    ALL.forEach(q => { const r = S.p[q.id];
      if(!r || !r.done) todo++;
      if(r && r.ok === true) right++;
      if(r && r.ok === false) wrong++;
      if(r && r.flag) flag++; });
    return {all:ALL.length, todo, right, wrong, flag};
  })();
  $("#fStatus").innerHTML = [
    ["all", t("sAll"), ""], ["todo", t("sTodo"), ""], ["right", t("sRight"), "g"],
    ["wrong", t("sWrong"), "r"], ["flag", t("sFlag"), "f"]
  ].map(([v,lab,mk]) => listRow("status", S.f.status, v, lab, counts[v], mk)).join("");

  // ----- dạng câu: chỉ hiện khi đề có từ hai dạng trở lên -----
  const typeInfo = {mcq:[t("kMcq"),"m-mcq"], yesno:[t("kYesno"),"m-yesno"], dropdown:[t("kDrop"),"m-drop"]};
  const typeBlock = $("#fTypeBlk");
  if(TYPES.length < 2) typeBlock.classList.add("hide");
  else {
    typeBlock.classList.remove("hide");
    const tc = Object.fromEntries(TYPES.map(x => [x, ALL.filter(q => q.type === x).length]));
    $("#fType").innerHTML = listRow("type", S.f.type, "all", t("kAll"), ALL.length, "")
      + TYPES.map(x => listRow("type", S.f.type, x, typeInfo[x][0], tc[x], typeInfo[x][1])).join("");
  }

  const row = (v, name, list) => {
    const s = statsOf(list);
    return `<button class="trow" data-f-key="topic" data-v="${v}" aria-pressed="${String(v)===String(S.f.topic)}">
      <span class="nm">${esc(name)}</span><span class="ct">${s.done}/${s.total}</span>
      <span class="meter"><i class="g" style="width:${pct(s.right,s.total)}%"></i><i class="r" style="width:${pct(s.done-s.right,s.total)}%"></i></span>
    </button>`;
  };
  $("#fTopics").innerHTML = row("all", t("sAll"), ALL) +
    TOPICS.map(n => row(n, t("topicN", n), ALL.filter(q => q.topic === n))).join("");
}

function renderAside(){
  const box = $("#asideBody");
  if(S.mode === "exam" && S.exam && S.exam.phase === "run"){ box.innerHTML = asideExam(); return; }
  if(S.mode === "stats"){ box.innerHTML = asideKeys(); return; }
  box.innerHTML = asideStudy() + asideKeys();
}
function asideStudy(){
  const s = statsOf(ALL);
  const queue = ALL.filter(q => { const r = S.p[q.id]; return r && (r.ok === false || r.flag); }).slice(0,40);
  return `<div class="blk">
    <span class="lbl">${t("progress")}</span>
    <div class="bigbar"><i style="width:${pct(s.right,s.total)}%;background:var(--ok)"></i><i style="width:${pct(s.done-s.right,s.total)}%;background:var(--bad)"></i></div>
    <div class="kv"><span>${t("attempted")}</span><b>${s.done}/${s.total}</b></div>
    <div class="kv"><span>${t("accuracy")}</span><b>${s.done?pct(s.right,s.done)+"%":"—"}</b></div>
    <div class="kv"><span>${t("flagged")}</span><b>${s.flag}</b></div>
  </div>
  <div class="blk only-lg">
    <span class="lbl">${t("queue")} · ${queue.length}</span>
    ${queue.length ? `<div class="queue">` + queue.map(q => {
        const r = S.p[q.id];
        return `<button class="qbtn ${r.ok===false?"is-wrong":"is-flag"}" data-jump="${q.id}">
          <span class="n">${pad2(q.idx)}</span><span class="t">${esc(strip(q.stem.en).slice(0,64))}</span></button>`;
      }).join("") + `</div>` : `<p class="note">${t("queueEmpty")}</p>`}
  </div>`;
}
function asideKeys(){
  const r = (k,d) => `<div class="keyrow"><kbd>${k}</kbd><span>${d}</span></div>`;
  return `<div class="blk only-lg"><span class="lbl">${t("keysTitle")}</span><div class="keys">
    ${r("A–D",t("kPick"))}${r("↵",t("kCheck"))}${r("F",t("kFlag"))}${r("← →",t("kNav"))}${r("/",t("kSearch"))}
  </div></div>`;
}
function asideExam(){
  const e = S.exam;
  const left = e.duration ? Math.max(0, e.duration - Math.floor((Date.now()-e.started)/1000)) : null;
  const ans = e.list.filter((q,i) => isComplete(q, e.answers[i])).length;
  return `<div class="blk">
    <span class="lbl">${t("timeLeft")}</span>
    <div class="timer ${left!==null&&left<60?"low":""}" id="timerOut">${left===null?"∞":clock(left)}</div>
  </div>
  <div class="blk">
    <span class="lbl">${t("answeredN")}</span>
    <div class="bigbar"><i style="width:${pct(ans,e.list.length)}%;background:var(--pick)"></i></div>
    <div class="kv"><span>${t("answeredN")}</span><b>${ans}/${e.list.length}</b></div>
  </div>
  <div class="blk"><span class="lbl">${t("palette")}</span>
    <div class="pal">${e.list.map((q,i)=>`<button class="pd ${isComplete(q,e.answers[i])?"is-ans":""} ${e.flags[i]?"is-flag":""} ${i===e.pos?"is-cur":""}" data-go="${i}">${i+1}</button>`).join("")}</div>
  </div>`;
}

/* ---------- vùng chính ---------- */
function renderMain(){
  const v = $("#view");
  v.innerHTML = S.mode === "study" ? viewStudy() : S.mode === "stats" ? viewStats() : viewExam();
}

function viewStudy(){
  const list = filtered();
  const head = `<header class="head">
      <div><h2>${t("studyTitle")}</h2><p>${t("studyLead", list.length)}</p></div>
      <div class="r"><span class="lbl">${esc(DATA.meta.code)}</span></div></header>`;
  if(!list.length) return head + `<div class="empty"><b>${t("emptyT")}</b>${t("emptyD")}</div>`;
  return head + list.map(recordHTML).join("");
}

function typeTag(q){
  if(q.type === "yesno") return `<span class="tag multi">${t("tYesno")}</span>`;
  if(q.type === "dropdown") return `<span class="tag multi">${t("tDrop")}</span>`;
  if(q.multi) return `<span class="tag multi">${t("multi", q.answer.length)}</span>`;
  return "";
}

function recordHTML(q){
  const r = rec(q.id), a = ansOf(q);
  const tags = [`<span class="tag">${esc(t("topicN", q.topic))}</span>`,
                `<span class="tag">${esc(t("qN", q.n))}</span>`, typeTag(q)];
  if(r.done && r.ok === true)  tags.push(`<span class="tag ok">${t("verdictOk")}</span>`);
  if(r.done && r.ok === false) tags.push(`<span class="tag bad">${t("verdictBad")}</span>`);
  tags.push(`<button class="flagbtn" data-act="flag" aria-pressed="${!!r.flag}"
      title="${esc(r.flag?t("unflag"):t("flag"))}" aria-label="${esc(r.flag?t("unflag"):t("flag"))}">${ICON.flag}</button>`);

  const n = answeredCount(q,a), total = totalParts(q);
  const bar = r.done
    ? `<button class="btn" data-act="again">${t("again")}</button>`
    : `<button class="btn solid" data-act="check" ${isComplete(q,a)?"":"disabled"}>${t("check")}</button>
       <button class="btn" data-act="reveal">${t("reveal")}</button>
       <span class="note">${n===0 ? t("pickFirst") : n>=total ? t("answered") : t("partial", n, total)}</span>`;

  const verdict = r.ok === true  ? `<span class="verdict ok">${t("verdictOk")}</span>`
                : r.ok === false ? `<span class="verdict bad">${t("verdictBad")}</span>`
                : `<span class="note">${t("verdictNone")}</span>`;

  return `<article class="rec ${S.cur===q.id?"cur":""}" id="rec-${q.id}" data-id="${q.id}" data-done="${r.done?1:0}">
    <div class="rechead"><span class="idx">${pad2(q.idx)}</span><div class="tags">${tags.join("")}</div></div>
    <p class="stem">${tx(q.stem)}</p>
    ${q.img ? `<img class="qimg" src="${q.img}" alt="" data-zoom>` : ""}
    <div class="qbody">${bodyHTML(q, a, r.done, "ans")}</div>
    <div class="bar">${bar}</div>
    ${revealHTML(q, verdict, noteHTML(r))}
  </article>`;
}

function refreshRecord(id, focusSel){
  const q = BY_ID[id];
  let node = document.getElementById("rec-"+id);
  if(!q || !node) return;
  node.outerHTML = recordHTML(q);
  node = document.getElementById("rec-"+id);
  if(node && focusSel){ const n = node.querySelector(focusSel); if(n) n.focus(); }
}

/* ---------- ghi nhận câu trả lời ---------- */
function applyAnswer(q, a, el){
  if(q.type === "mcq"){
    const k = el.dataset.k;
    if(q.answer.length > 1){
      const i = a.indexOf(k);
      if(i >= 0) a.splice(i,1);
      else { if(a.length >= q.answer.length) a.shift(); a.push(k); }
    } else { a.length = 0; if(!el.dataset.was) a.push(k); }
  } else if(q.type === "yesno"){
    const i = +el.dataset.i;
    a[i] = a[i] === el.dataset.v ? null : el.dataset.v;
  } else {
    const i = +el.dataset.i;
    a[i] = el.value === "" ? null : +el.value;
  }
}

/* ============================================================
   THI THỬ
   ============================================================ */
function examPool(cfg){
  let p = ALL;
  if(cfg.topic !== "all") p = p.filter(q => q.topic === +cfg.topic);
  if(cfg.source === "wrong") p = p.filter(q => { const r=S.p[q.id]; return r && r.ok === false; });
  if(cfg.source === "flag")  p = p.filter(q => { const r=S.p[q.id]; return r && r.flag; });
  return p;
}
function viewExam(){
  const e = S.exam;
  if(!e || e.phase === "setup") return examSetup();
  if(e.phase === "run") return examRun();
  return examResult();
}
function selectHTML(name, cur, opts){
  return `<label class="fldw"><span class="lbl">${name}</span>
    <span class="sel"><select data-cfg="${opts.key}">${
      opts.items.map(([v,lab]) => `<option value="${esc(v)}" ${String(v)===String(cur)?"selected":""}>${esc(lab)}</option>`).join("")
    }</select><span class="cap"></span></span></label>`;
}
function examSetup(){
  const cfg = (S.exam && S.exam.cfg) || { count:30, mins:45, topic:"all", shuffle:"yes", source:"all" };
  const n = examPool(cfg).length;
  const resume = S.exam && S.exam.phase === "run";
  return `<header class="head"><div><h2>${t("examSetup")}</h2><p>${t("examLead")}</p></div></header>
  ${resume ? `<div class="panel"><p class="prose" style="margin-bottom:14px">${t("inProgress")}</p>
     <div class="act"><button class="btn solid" data-act="resume">${t("resume")}</button>
     <button class="btn danger" data-act="discard">${t("discard")}</button></div></div>` : ""}
  <div class="panel">
    <div class="grid2">
      ${selectHTML(t("fSource"), cfg.source, {key:"source", items:[["all",t("srcAll")],["wrong",t("srcWrong")],["flag",t("srcFlag")]]})}
      ${selectHTML(t("fScope"), cfg.topic, {key:"topic", items:[["all",t("allTopics")], ...TOPICS.map(x=>[x,t("topicN",x)])]})}
      <label class="fldw"><span class="lbl">${t("fCount")}</span>
        <input class="fld" style="padding:9px 12px;font-size:13.5px;background:var(--paper)" type="number" data-cfg="count" min="1" max="${Math.max(1,n)}" value="${Math.min(cfg.count,Math.max(1,n))}"></label>
      <label class="fldw"><span class="lbl">${t("fTime")}</span>
        <input class="fld" style="padding:9px 12px;font-size:13.5px;background:var(--paper)" type="number" data-cfg="mins" min="0" value="${cfg.mins}"></label>
      ${selectHTML(t("fShuffle"), cfg.shuffle, {key:"shuffle", items:[["yes",t("optYes")],["no",t("optNo")]]})}
    </div>
    <p class="note" style="margin:18px 0 14px">${n ? t("poolInfo", n, Math.min(cfg.count,n)) : t("notEnough")}</p>
    <button class="btn solid" data-act="start" ${n?"":"disabled"}>${t("start")}</button>
  </div>`;
}
function examRun(){
  const e = S.exam, q = e.list[e.pos];
  const a = e.answers[e.pos] || (e.answers[e.pos] = blankAnswer(q));
  const left = e.duration ? Math.max(0, e.duration - Math.floor((Date.now()-e.started)/1000)) : null;
  return `<header class="head">
      <div><h2>${t("examRun")}</h2><p>${t("qPos", e.pos+1, e.list.length)}</p></div>
      <div class="r"><span class="lbl">${t("timeLeft")}</span><div class="timer" id="timerHead">${left===null?"∞":clock(left)}</div></div>
    </header>
  <article class="rec" data-done="0">
    <div class="rechead"><span class="idx">${pad2(e.pos+1)}</span>
      <div class="tags"><span class="tag">${esc(t("topicN", q.topic))}</span>${typeTag(q)}${e.flags[e.pos]?`<span class="tag flag">${t("flag")}</span>`:""}</div></div>
    <p class="stem">${tx(q.stem)}</p>
    ${q.img ? `<img class="qimg" src="${q.img}" alt="" data-zoom>` : ""}
    <div class="qbody">${bodyHTML(q, a, false, "eans")}</div>
    <div class="bar">
      <button class="btn" data-act="eprev" ${e.pos?"":"disabled"}>← ${t("prev")}</button>
      <button class="btn" data-act="enext" ${e.pos<e.list.length-1?"":"disabled"}>${t("next")} →</button>
      <button class="btn sm" data-act="eflag">${e.flags[e.pos]?t("unflag"):t("flag")}</button>
      <span class="grow"></span>
      <button class="btn solid" data-act="esubmit">${t("submit")}</button>
    </div>
  </article>`;
}
function examResult(){
  const R = S.exam.result;
  const p = R.pct >= PASS, C = 2*Math.PI*58;
  const rows = TOPICS.map(n => {
    const d = R.detail.filter(x => x.q.topic === n);
    if(!d.length) return "";
    const c = d.filter(x => x.ok).length;
    return `<tr><td>${esc(t("topicN",n))}</td><td class="num">${d.length}</td><td class="num">${c}</td>
      <td class="num">${pct(c,d.length)}%</td>
      <td><span class="sbar"><i style="width:${pct(c,d.length)}%;background:var(--ok)"></i><i style="width:${pct(d.length-c,d.length)}%;background:var(--bad)"></i></span></td></tr>`;
  }).join("");

  const shown = S.reviewWrongOnly ? R.detail.filter(x => !x.ok) : R.detail;
  const review = shown.map(d => {
    const q = d.q;
    const verdict = `<span class="verdict ${d.ok?"ok":"bad"}">${d.ok?t("verdictOk"):t("verdictBad")}</span>`;
    return `<article class="rec" data-done="1">
      <div class="rechead"><span class="idx">${pad2(R.detail.indexOf(d)+1)}</span>
        <div class="tags"><span class="tag">${esc(t("topicN",q.topic))}</span>${typeTag(q)}
        <span class="tag ${d.ok?"ok":"bad"}">${d.ok?t("verdictOk"):t("verdictBad")}</span></div></div>
      <p class="stem">${tx(q.stem)}</p>
      ${q.img ? `<img class="qimg" src="${q.img}" alt="" data-zoom>` : ""}
      <div class="qbody">${bodyHTML(q, d.given, true, null)}</div>
      ${revealHTML(q, verdict)}
    </article>`;
  }).join("");

  return `<header class="head"><div><h2>${t("resultTitle")}</h2><p>${t("passNote",PASS)}</p></div></header>
  <div class="panel"><div class="score">
    <div class="ring"><svg width="132" height="132" viewBox="0 0 132 132">
      <circle cx="66" cy="66" r="58" fill="none" stroke="var(--rule)" stroke-width="9"/>
      <circle cx="66" cy="66" r="58" fill="none" stroke="${p?"var(--ok)":"var(--flag)"}" stroke-width="9"
              stroke-dasharray="${C}" stroke-dashoffset="${C*(1-R.pct/100)}"/></svg>
      <div class="n"><b>${R.pct}%</b><span>${t("scoreLbl")}</span></div></div>
    <div>
      <div class="result-h ${p?"ok":"bad"}">${p?t("passed"):t("failed")}</div>
      <div class="figs">
        <div class="fig"><b style="color:var(--ok)">${R.correct}</b><span class="lbl">${t("fCorrect")}</span></div>
        <div class="fig"><b style="color:var(--bad)">${R.wrong}</b><span class="lbl">${t("fWrong")}</span></div>
        <div class="fig"><b>${R.blank}</b><span class="lbl">${t("fBlank")}</span></div>
        <div class="fig"><b>${clock(R.secs)}</b><span class="lbl">${t("fTime2")}</span></div>
      </div>
      <div class="act" style="margin-top:18px">
        <button class="btn solid" data-act="newexam">${t("retry")}</button>
        <button class="btn" data-act="togglewrong">${S.reviewWrongOnly?t("reviewAll"):t("reviewWrong")}</button>
      </div></div></div></div>
  <div class="panel"><span class="lbl">${t("byTopic")}</span>
    <div class="tw"><table><thead><tr><th>${t("colTopic")}</th><th class="num">${t("colDone")}</th>
    <th class="num">${t("colRight")}</th><th class="num">${t("colAcc")}</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div></div>
  ${review}`;
}

  const s = statsOf(ALL);
  const rows = TOPICS.map(n => {
    const st = statsOf(ALL.filter(q => q.topic === n));
    return `<tr><td>${esc(t("topicN",n))}</td><td class="num">${st.done}/${st.total}</td>
      <td class="num">${st.right}</td><td class="num">${st.done?pct(st.right,st.done)+"%":"—"}</td>
      <td><span class="sbar"><i style="width:${pct(st.right,st.total)}%;background:var(--ok)"></i><i style="width:${pct(st.done-st.right,st.total)}%;background:var(--bad)"></i></span></td></tr>`;
  }).join("");
  const hist = S.history.length ? S.history.slice().reverse().map(h =>
      `<tr><td>${esc(new Date(h.at).toLocaleString(L==="vi"?"vi-VN":"en-GB"))}</td><td>${esc(h.scope)}</td>
       <td class="num">${h.pct}%</td><td class="num">${h.c}/${h.t}</td><td class="num">${clock(h.secs)}</td></tr>`).join("")
    : `<tr><td colspan="5" style="color:var(--ink-3);font-family:var(--serif);font-weight:400">${t("histEmpty")}</td></tr>`;

  return `<header class="head"><div><h2>${t("statsTitle")}</h2><p>${t("statsLead")}</p></div></header>
  <div class="panel"><div class="figs">
    <div class="fig"><b>${s.done}/${s.total}</b><span class="lbl">${t("attempted")}</span></div>
    <div class="fig"><b style="color:var(--ok)">${s.done?pct(s.right,s.done):0}%</b><span class="lbl">${t("accuracy")}</span></div>
    <div class="fig"><b style="color:var(--flag)">${s.flag}</b><span class="lbl">${t("flagged")}</span></div>

  <div class="panel"><span class="lbl">${t("byTopic")}</span><div class="tw"><table><thead><tr>
    <th>${t("colTopic")}</th><th class="num">${t("colDone")}</th><th class="num">${t("colRight")}</th>
    <th class="num">${t("colAcc")}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>

/* ============================================================
   HÀNH ĐỘNG
   ============================================================ */
function checkRecord(id, revealOnly){
  const q = BY_ID[id], r = rec(id), a = ansOf(q);
  r.done = 1;
  r.ok = (revealOnly && answeredCount(q,a) === 0) ? null : isCorrect(q, a);
  r.n = (r.n||0) + 1;
  save(); refreshRecord(id); renderRail(); renderAside();
}
function setMode(m){
  S.mode = m;
  if(m === "exam" && !S.exam) S.exam = { phase:"setup", cfg:{count:30,mins:45,topic:"all",shuffle:"yes",source:"all"} };
  if(m === "exam" && S.exam.phase === "run" && !S.exam.timer && S.exam.duration){
    tickTimer(); S.exam.timer = setInterval(tickTimer, 1000);
  }
  renderAll(); window.scrollTo({top:0});
}
function startExam(){
  const cfg = S.exam.cfg, pool = examPool(cfg);
  if(!pool.length) return;
  const count = Math.max(1, Math.min(+cfg.count || 1, pool.length));
  const picked = shuffle(pool).slice(0, count);
  const order = {};
  const list = picked.map(q => {
    if(cfg.shuffle === "yes" && q.options){
      const opts = shuffle(q.options);
      order[q.id] = opts.map(o => o.k);
      return Object.assign({}, q, { options: opts });
    }
    return q;
  });
  clearInterval(S.exam.timer);
  S.exam = { phase:"run", list, order, answers:{}, flags:{}, pos:0, started:Date.now(),
             duration:(+cfg.mins||0)*60, cfg, timer:null };
  if(S.exam.duration){ tickTimer(); S.exam.timer = setInterval(tickTimer, 1000); }
  save(); renderAll(); window.scrollTo({top:0});
}
function tickTimer(){
  const e = S.exam;
  if(!e || e.phase !== "run" || !e.duration) return;
  const left = e.duration - Math.floor((Date.now()-e.started)/1000);
  const txt = clock(Math.max(0,left));
  ["timerOut","timerHead"].forEach(id => {
    const n = document.getElementById(id);
    if(n){ n.textContent = txt; n.classList.toggle("low", left < 60); }
  });
  if(left <= 0){ gradeExam(); toast(t("timeUp")); }
}
function gradeExam(){
  const e = S.exam;
  if(!e || e.phase !== "run") return;
  clearInterval(e.timer); e.timer = null;
  let correct = 0, blank = 0;
  const detail = e.list.map((q,i) => {
    const given = e.answers[i] || blankAnswer(q);
    const filled = answeredCount(q, given) > 0;
    if(!filled) blank++;
    const ok = filled && isCorrect(q, given);
    if(ok) correct++;
    const r = rec(q.id);
    if(filled){ r.a = JSON.parse(JSON.stringify(given)); r.done = 1; r.ok = ok; r.n = (r.n||0)+1; }
    if(e.flags[i]) r.flag = 1;
    return { q, given, ok };
  });
  const secs = Math.floor((Date.now()-e.started)/1000);
  const scope = e.cfg.topic === "all" ? t("allTopics") : t("topicN", e.cfg.topic);
  e.result = { detail, correct, wrong:e.list.length-correct, blank, pct:pct(correct,e.list.length), secs };
  e.phase = "result"; S.mode = "exam"; S.reviewWrongOnly = false;
  S.history.push({ at:new Date().toISOString(), pct:e.result.pct, c:correct, t:e.list.length, secs, scope });
  save(); renderAll(); window.scrollTo({top:0});
}

/* ---------- hộp thoại ---------- */
function dialog(title, body, confirmLabel, onYes, danger){
  const ov = document.createElement("div");
  ov.className = "ov";
  ov.innerHTML = `<div class="box" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(body)}</p>
    <div class="act"><button class="btn" data-no>${esc(t("cancel"))}</button>
    ${confirmLabel?`<button class="btn ${danger?"danger":"solid"}" data-yes>${esc(confirmLabel)}</button>`:""}</div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click", ev => {
    if(ev.target === ov || ev.target.hasAttribute("data-no")) ov.remove();
    if(ev.target.hasAttribute("data-yes")){ ov.remove(); onYes && onYes(); }
  });
  (ov.querySelector("[data-yes]") || ov.querySelector("[data-no]")).focus();
}
function helpDialog(){
  const rows = [["A B C D",t("kPick")],["Enter",t("kCheck")],["F",t("kFlag")],["← →",t("kNav")],["/",t("kSearch")],["?",t("kHelp")],["Esc",t("kEsc")]];
  const ov = document.createElement("div");
  ov.className = "ov";
  ov.innerHTML = `<div class="box" role="dialog" aria-modal="true"><h3>${esc(t("keysTitle"))}</h3>
    <div class="keys" style="margin-bottom:18px">${rows.map(([k,d])=>`<div class="keyrow"><kbd>${esc(k)}</kbd><span>${esc(d)}</span></div>`).join("")}</div>
    <div class="act"><button class="btn" data-no>${esc(t("close"))}</button></div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click", ev => { if(ev.target === ov || ev.target.hasAttribute("data-no")) ov.remove(); });
  ov.querySelector("[data-no]").focus();
}
function zoom(src){
  const ov = document.createElement("div");
  ov.className = "ov zoom";
  ov.innerHTML = `<img src="${src}" alt="">`;
  ov.addEventListener("click", () => ov.remove());
  document.body.appendChild(ov);
}
let toastTimer = null;
function toast(msg){
  $$(".toast").forEach(n => n.remove());
  const n = document.createElement("div");
  n.className = "toast"; n.textContent = msg; n.setAttribute("role","status");
  document.body.appendChild(n);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => n.remove(), 2800);
}

/* ---------- xuất / nhập ---------- */
function exportData(){
  const blob = new Blob([JSON.stringify({v:2, code:DATA.meta.code, exportedAt:new Date().toISOString(),
                                         p:S.p, history:S.history}, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${DATA.meta.code.toLowerCase()}-progress-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href); toast(t("exported"));
}
function importData(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const d = JSON.parse(fr.result);
      if(!d || typeof d.p !== "object") throw 0;
      S.p = d.p; S.history = Array.isArray(d.history) ? d.history : [];
      save(); renderAll(); toast(t("imported"));
    }catch(e){ toast(t("badFile")); }
  };
  fr.onerror = () => toast(t("badFile"));
  fr.readAsText(file);
}

/* ============================================================
   SỰ KIỆN
   ============================================================ */
document.addEventListener("click", ev => {
  if(ev.target.matches("[data-zoom]")){ zoom(ev.target.src); return; }
  // <select> do bộ lắng nghe "change" lo. Nếu để lọt vào đây, việc vẽ lại bản
  // ghi sẽ thay thế chính phần tử đang mở, làm danh sách đóng sập ngay khi bấm.
  if(ev.target.tagName === "SELECT") return;
  const el = ev.target.closest("[data-mode],[data-lang],[data-f-key],[data-act],[data-jump],[data-go]");
  if(!el) return;

  if(el.dataset.mode){ setMode(el.dataset.mode); return; }
  if(el.dataset.lang){ L = el.dataset.lang; save(); renderAll(); return; }
  if(el.dataset.fKey){
    S.f[el.dataset.fKey] = el.dataset.v;
    renderRail(); renderMain();
    if(window.innerWidth < 900) document.body.classList.remove("rail-open");
    return;
  }
  if(el.dataset.jump){
    const id = el.dataset.jump;
    if(S.mode !== "study") S.mode = "study";
    S.f = {topic:"all",status:"all",type:"all",q:""}; $("#search").value = "";
    renderAll();
    const n = document.getElementById("rec-"+id);
    if(n) n.scrollIntoView({behavior:"smooth",block:"start"});
    return;
  }
  if(el.dataset.go !== undefined && S.exam && S.exam.phase === "run"){
    S.exam.pos = +el.dataset.go; save(); renderMain(); renderAside(); window.scrollTo({top:0}); return;
  }

  const recEl = el.closest(".rec"), id = recEl && recEl.dataset.id, act = el.dataset.act;
  switch(act){
    case "ans": {
      if(!id) break;
      const q = BY_ID[id], r = rec(id);
      if(r.done) break;
      const a = ansOf(q);
      if(q.type === "mcq" && q.answer.length === 1 && a[0] === el.dataset.k) el.dataset.was = "1";
      applyAnswer(q, a, el);
      save();
      refreshRecord(id, q.type === "mcq" ? `[data-act="ans"][data-k="${el.dataset.k}"]`
                                         : `[data-act="ans"][data-i="${el.dataset.i}"]`);
      break;
    }
    case "check":  if(id) checkRecord(id, false); break;
    case "reveal": if(id) checkRecord(id, true);  break;
    case "again": {
      if(!id) break;
      const r = rec(id); r.a = blankAnswer(BY_ID[id]); r.done = 0; r.ok = null;
      save(); refreshRecord(id, '[data-act="check"]'); renderRail(); renderAside(); break;
    }
    case "flag": {
      if(!id) break;
      const r = rec(id); r.flag = r.flag ? 0 : 1;
      save(); refreshRecord(id, '.flagbtn'); renderRail(); renderAside(); break;
    }
    case "start":  startExam(); break;
    case "resume": S.exam.phase = "run"; renderAll(); break;
    case "discard": clearInterval(S.exam.timer);
                    S.exam = {phase:"setup", cfg:S.exam.cfg}; save(); renderAll(); break;
    case "eans": {
      const e = S.exam, q = e.list[e.pos];
      const a = e.answers[e.pos] || (e.answers[e.pos] = blankAnswer(q));
      if(q.type === "mcq" && q.answer.length === 1 && a[0] === el.dataset.k) el.dataset.was = "1";
      applyAnswer(q, a, el);
      save(); renderMain(); renderAside(); break;
    }
    case "eprev": S.exam.pos = Math.max(0, S.exam.pos-1); save(); renderMain(); renderAside(); window.scrollTo({top:0}); break;
    case "enext": S.exam.pos = Math.min(S.exam.list.length-1, S.exam.pos+1); save(); renderMain(); renderAside(); window.scrollTo({top:0}); break;
    case "eflag": S.exam.flags[S.exam.pos] = !S.exam.flags[S.exam.pos]; save(); renderMain(); renderAside(); break;
    case "esubmit": {
      const e = S.exam;
      const blank = e.list.filter((q,i) => answeredCount(q, e.answers[i]) === 0).length;
      dialog(t("confirmSubmitT"), blank ? t("confirmSubmitD", blank) : t("confirmSubmitD0"), t("confirm"), gradeExam);
      break;
    }
    case "newexam": clearInterval(S.exam.timer);
                    S.exam = {phase:"setup", cfg:S.exam.cfg}; save(); renderAll(); window.scrollTo({top:0}); break;
    case "togglewrong": S.reviewWrongOnly = !S.reviewWrongOnly; renderMain(); break;
  }
});

document.addEventListener("input", ev => {
  const el = ev.target;
  if(el.id === "search"){ S.f.q = el.value; renderMain(); return; }
  if(el.dataset.act === "note"){
    const r = el.closest(".rec");
    if(r){ rec(r.dataset.id).note = el.value; clearTimeout(el._tm); el._tm = setTimeout(save, 400); }
    return;
  }
  if(el.dataset.cfg && S.exam){ S.exam.cfg[el.dataset.cfg] = el.value; renderMain(); }
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if(el.dataset.cfg && S.exam){ S.exam.cfg[el.dataset.cfg] = el.value; renderMain(); return; }
  if(el.dataset.act === "ans"){
    const r = el.closest(".rec"), q = BY_ID[r.dataset.id];
    if(rec(q.id).done) return;
    applyAnswer(q, ansOf(q), el);
    save(); refreshRecord(q.id, `[data-act="ans"][data-i="${el.dataset.i}"]`); return;
  }
  if(el.dataset.act === "eans"){
    const e = S.exam, q = e.list[e.pos];
    const a = e.answers[e.pos] || (e.answers[e.pos] = blankAnswer(q));
    applyAnswer(q, a, el); save(); renderMain(); renderAside(); return;
  }
  if(el.id === "fileIn" && el.files && el.files[0]){ importData(el.files[0]); el.value = ""; }
});

document.addEventListener("focusin", ev => {
  const r = ev.target.closest && ev.target.closest(".rec");
  if(r && r.dataset.id && r.dataset.id !== S.cur){
    const prev = S.cur ? document.getElementById("rec-"+S.cur) : null;
    if(prev) prev.classList.remove("cur");
    S.cur = r.dataset.id; r.classList.add("cur");
  }
});

$("#themeBtn").addEventListener("click", () => {
  document.documentElement.dataset.theme = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  save();
});
$("#helpBtn").addEventListener("click", helpDialog);
$("#railToggle").addEventListener("click", e => {
  e.currentTarget.setAttribute("aria-expanded", document.body.classList.toggle("rail-open"));
});
$("#btnExport").addEventListener("click", exportData);
$("#btnImport").addEventListener("click", () => $("#fileIn").click());
$("#btnReset").addEventListener("click", () =>
  dialog(t("resetT"), t("resetD"), t("del"), () => {
    S.p = {}; S.history = []; S.cur = null;
    if(S.exam) clearInterval(S.exam.timer);
    S.exam = null;
    store.del(KEY); save(); renderAll(); toast(t("del"));
  }, true));

document.addEventListener("keydown", ev => {
  const tag = (ev.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea" || tag === "select";
  if(ev.key === "Escape"){ $$(".ov").forEach(n => n.remove()); if(typing) ev.target.blur(); return; }
  if(typing) return;
  if(ev.key === "/"){ ev.preventDefault(); $("#search").focus(); return; }
  if(ev.key === "?"){ ev.preventDefault(); helpDialog(); return; }
  if(document.querySelector(".ov")) return;

  const e = S.exam, inExam = S.mode === "exam" && e && e.phase === "run";
  if(inExam){
    if(ev.key === "ArrowLeft"  && e.pos > 0){ e.pos--; save(); renderMain(); renderAside(); return; }
    if(ev.key === "ArrowRight" && e.pos < e.list.length-1){ e.pos++; save(); renderMain(); renderAside(); return; }
    if(/^[a-fA-F]$/.test(ev.key) && ev.key.toLowerCase() !== "f"){
      const b = document.querySelector(`[data-act="eans"][data-k="${ev.key.toUpperCase()}"]`);
      if(b) b.click(); return;
    }
    if(ev.key.toLowerCase() === "f"){ e.flags[e.pos] = !e.flags[e.pos]; save(); renderMain(); renderAside(); return; }
    return;
  }
  if(S.mode === "study" && S.cur){
    const node = document.getElementById("rec-"+S.cur);
    if(!node) return;
    if(/^[a-fA-F]$/.test(ev.key) && ev.key.toLowerCase() !== "f"){
      const b = node.querySelector(`[data-act="ans"][data-k="${ev.key.toUpperCase()}"]`);
      if(b) b.click(); return;
    }
    if(ev.key === "Enter"){
      const b = node.querySelector('[data-act="check"]:not([disabled])') || node.querySelector('[data-act="reveal"]');
      if(b) b.click(); return;
    }
    if(ev.key.toLowerCase() === "f"){ const b = node.querySelector('[data-act="flag"]'); if(b) b.click(); return; }
    if(ev.key === "ArrowDown" || ev.key === "ArrowRight"){ ev.preventDefault(); stepRecord(1); return; }
    if(ev.key === "ArrowUp"   || ev.key === "ArrowLeft"){  ev.preventDefault(); stepRecord(-1); return; }
  }
});
function stepRecord(d){
  const list = $$(".rec");
  const i = list.findIndex(n => n.dataset.id === S.cur);
  const next = list[Math.max(0, Math.min(list.length-1, i+d))];
  if(next){ const b = next.querySelector(".opt, .ynb button, select"); if(b) b.focus(); next.scrollIntoView({block:"nearest"}); }
}

/* ---------- khởi động ---------- */
$("#markCode").textContent = DATA.meta.code;
$$("[data-icon]").forEach(el => el.outerHTML = ICON[el.dataset.icon]);
load();
if(S.exam && S.exam.phase === "run"){ S.mode = "exam"; if(S.exam.duration){ tickTimer(); S.exam.timer = setInterval(tickTimer,1000); } }
renderAll();

</script>
</body>
</html>
