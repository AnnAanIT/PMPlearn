cửa sổ thời gian đánh giá (<b>evaluation window</b> - ví dụ: 28 ngày)</li><li>chế tài xử lý khi xảy ra vi phạm (<b>breach consequence</b>).</li></ul><li>Việc thiết lập đầy đủ các yếu tố này giúp loại bỏ hoàn toàn sự mơ hồ và đưa ra một quy chuẩn thực thi nhất quán, định lượng được cho cả đội ngũ vận hành và khách hàng.</li></ul><p><b>Gợi ý tài liệu tham khảo:</b></p><p><b>Tên file:</b> <code>CCA-P_D6_Stakeholder_Lifecycle.md</code></p><p><b>Mục:</b> <b>4. Stakeholder Feedback Loops &amp; SLA Alignment</b> (Mục 4.1 và 4.3 phân tích chi tiết về 4 khái niệm SLA-adjacent, sự khác biệt giữa các tuyên bố khát vọng với cam kết thực tế, và lỗi thiết kế khi để các mốc cam kết ở trạng thái định tính mơ hồ).</p><p><b>Tên file:</b> <code>CCA-P_D1_Solution_Design.md</code></p><p><b>Mục:</b> <b>1.3 Constraints</b> (Mục 1.3 quy định việc thiết lập các ràng buộc cứng về Latency/Accuracy SLA định lượng như một đầu vào bắt buộc để giới hạn và lựa chọn mẫu thiết kế kiến trúc phù hợp).</p>"},"options":[{"k":"A","t":{"en":"A measurable target with a defined metric, threshold, evaluation window, and consequence for breach- for example, \"p95 per-request latency under 800 ms over a 28-day window.\""}},{"k":"B","t":{"en":"A target that names the metric and threshold but omits the evaluation window and breach consequence, leaving compliance periods and remediation triggers undefined."}},{"k":"C","t":{"en":"A qualitative commitment such as \"the system will be fast and reliable,\" which names no metric, threshold, or evaluation window."}},{"k":"D","t":{"en":"A target tied to a stakeholder sentiment measure such as \"the team feels satisfied,\" which cannot be measured objectively or used to trigger a documented breach response."}}],"answer":["A"],"multi":false},{"id":"t1q55","n":55,"topic":1,"type":"mcq","stem":{"en":"You are designing a feedback session for a deployment in flight. Which structure best supports productive stakeholder feedback?"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Thiết lập cấu trúc một buổi họp thu thập ý kiến phản hồi (feedback session) hiệu quả từ các stakeholder trong quá trình triển khai thực tế giải pháp Claude nhằm tránh thất lạc thông tin quyết định.</p><p><b>Giải pháp:</b> A. Define a focused agenda, share the artifacts in advance, capture decisions and follow-ups in writing, and confirm action owners and dates.</p><p><b>Keyword quan trọng:</b></p><ul><li><b>Focused agenda</b> và <b>Share artifacts in advance</b>: Việc xác định trước chương trình nghị sự tập trung và gửi sớm các tài liệu giúp các stakeholder có thời gian chuẩn bị và nghiên cứu kỹ lưỡng trước khi thảo luận.</li><li><b>Documented decisions &amp; Action owners</b>: Ghi chép tường minh các quyết định, nhiệm vụ kế tiếp (follow-ups) và người chịu trách nhiệm (action owners) giúp lưu giữ lịch sử quyết định bền vững, tránh thất thoát thông tin khi thay đổi nhân sự.</li></ul><p>Các phương án còn lại sai vì: Phương án <b>B</b>, <b>C</b> và <b>D</b> đều tạo ra sự mơ hồ, lãng phí thời gian họp do thiếu chuẩn bị trước hoặc phó mặc kết quả sau cuộc họp cho trí nhớ tự nhiên của những người tham gia, trực tiếp vi phạm nguyên tắc quản trị và bàn giao tri thức bền vững.</p><p>Gợi ý tài liệu tham khảo:</p><p>Tên file: <code>CCA-P_D6_Stakeholder_Lifecycle.md</code></p><p>Mục: <code>3. Communicating AI Decisions &amp; Value to Stakeholders</code> (Mục 3.5 quy định việc thiết lập cấu trúc giao tiếp chính thức và lưu trữ hồ sơ quyết định thay vì liên lạc ad-hoc).</p>"},"options":[{"k":"A","t":{"en":"Define a focused agenda, share the artifacts in advance, capture decisions and follow-ups in writing, and confirm action owners and dates."}},{"k":"B","t":{"en":"Distribute artifacts at the session start rather than in advance, so stakeholders review materials in real time without preparation before the discussion begins."}},{"k":"C","t":{"en":"End the session without recording decisions, follow-up items, action owners, or dates, relying on participant memory to carry the session's outcomes forward."}},{"k":"D","t":{"en":"Hold an open-ended meeting with no pre-distributed agenda or artifacts, and rely on participants' memory to carry decisions and follow-up owners forward."}}],"answer":["A"],"multi":false},{"id":"t1q56","n":56,"topic":1,"type":"yesno","stem":{"en":"You are evaluating retrieval-strategy claims used by a peer team. For each claim, select yes if the statement is generally accurate. Otherwise, select no."},"explain":{"text":"<ul><li>Dense vector retrieval phù hợp để tìm ý định được diễn đạt lại trong unstructured text — Có</li><li>Sparse term-matching tìm exact term như identifier và rare token đáng tin cậy hơn dense-only — Có</li><li>Structured query retrieval phù hợp với filter-and-aggregate workload trên relational store có schema và index — Có</li><li>Hybrid retrieval giống hệt dense-only retrieval và có cùng recall characteristic — Không</li><li>Random sampling từ data store là retrieval strategy tốt cho production Q&amp;A — Không</li></ul>"},"rows":[{"t":{"en":"Dense vector retrieval is well suited to recovering paraphrased intent against unstructured text"},"a":"Y"},{"t":{"en":"Sparse term-matching retrieval recovers exact terms (such as identifiers and rare tokens) more reliably than dense alone"},"a":"Y"},{"t":{"en":"Structured query retrieval is the right fit for filter-and-aggregate workloads against a relational store with schema and indexes"},"a":"Y"},{"t":{"en":"Hybrid retrieval is identical to dense-only retrieval and shares the same recall characteristics"},"a":"N"},{"t":{"en":"Random sampling of a data store is a sound retrieval strategy for production Q&amp;A"},"a":"N"}]},{"id":"t1q57","n":57,"topic":1,"type":"yesno","stem":{"en":"You are reviewing a peer's end-to-end design for a Claude-based platform expected to scale to thousands of concurrent users. For each statement, indicate Yes if it reflects sound architectural practice. Otherwise, select No."},"explain":{"text":"<ul><li><b>Auth before retrieval</b> (S1 -  <b>Yes</b> <b>): Đảm bảo an toàn thông tin và tuân thủ nguyên lý quyền tối thiểu (least privilege)</b>. Việc xác thực và phân quyền (authentication &amp; authorization) bắt buộc phải diễn ra trước khi truy xuất dữ liệu để lọc thông tin chính xác theo định danh người dùng, tránh rò rỉ tài liệu nhạy cảm<b>.</b></li><li><b>Asynchronous queue</b> (S2 -  <b>Yes</b> <b>): Đóng vai trò là bộ đệm hấp thụ lưu lượng truy cập tăng đột biến (bursty traffic) giữa tầng tiếp nhận (intake) và tầng gọi mô hình (model invocation), giúp hệ thống không bị sập hoặc gặp lỗi quá tải tần suất gọi API (429/529 Rate Limit &amp; Overload)</b>.</li><li><b>Deterministic code over probabilistic prompt</b> (S3 -  <b>No</b> <b>): Các tác vụ tính toán toán học chính xác như tính thuế (tax computation) bắt buộc phải được thực thi bằng mã nguồn lập trình cố định (deterministic code/tool) để đảm bảo độ chính xác tuyệt đối</b>. Đưa logic tính toán vào system prompt vốn mang tính xác suất (probabilistic) sẽ dẫn đến sai số nghiêm trọng<b>.</b></li><li><b>Data privacy &amp; PII redaction</b> (S4 -  <b>No</b> <b>): Việc lưu trữ mã định danh chính phủ chưa che mờ (unredacted government identifiers) trong log hội thoại để huấn luyện/tinh chỉnh mô hình là hành vi vi phạm nghiêm trọng các quy định pháp lý an toàn bảo mật và quyền riêng tư (như GDPR, HIPAA, SOC 2)</b>.</li></ul>"},"rows":[{"t":{"en":"Authentication and authorization run before retrieval so retrieval can filter by identity"},"a":"Y"},{"t":{"en":"An asynchronous queue absorbs bursty traffic between intake and the model invocation layer"},"a":"Y"},{"t":{"en":"Tax computation is encoded directly in the system prompt rather than in code"},"a":"N"},{"t":{"en":"Conversation logs include unredacted government identifiers to maximize signal for tuning"},"a":"N"}]},{"id":"t1q58","n":58,"topic":1,"type":"mcq","stem":{"en":"A security audit uncovers two issues: (1) all end users share a single API key, and (2) tool calls are executed without logging the initiating user. Which two mitigations directly address these specific findings? (Select two.)"},"explain":{"text":"<p><b>Evaluating Answer Structure...</b></p><p>Tóm tắt vấn đề: Khắc phục hai lỗ hổng bảo mật cụ thể liên quan đến việc sử dụng chung khóa API (shared API key) và thiếu cơ chế ghi nhận danh tính người dùng (actor attribution) khi thực thi gọi công cụ (tool calls).</p><p>Giải pháp: A và D</p><p>Keyword quan trọng:</p><ul><li><b>Per-user OAuth tokens</b>: Giải quyết triệt để vấn đề dùng chung một API key bằng cách cấp phát các token ngắn hạn riêng biệt cho từng người dùng. Việc này đi kèm với phân quyền giới hạn phạm vi (scope-restricted permissions) giúp cô lập quyền hạn và tuân thủ nguyên tắc Quyền tối thiểu (least privilege).</li><li><b>Actor attribution</b>: Việc bổ sung định danh người dùng kích hoạt vào nhật ký gọi công cụ (tool-call logs) trực tiếp giải quyết lỗi thiếu thông tin kiểm toán hệ thống, cung cấp đầy đủ dữ liệu ngữ cảnh (ai, công cụ nào, khi nào) phục vụ cho quá trình giám sát truy cập chủ động (active access monitoring).</li></ul><p>Các phương án còn lại sai/không phù hợp: <b>B</b> (RBAC ở tầng truy xuất dữ liệu) và <b>C</b> (chuyển credentials sang server-side secret store) là các biện pháp bảo mật tốt nhưng không giải quyết được vấn đề dùng chung định danh của người dùng cuối; <b>E</b> (kiểm tra schema của output) chỉ dùng để đảm bảo định dạng dữ liệu đầu ra không bị lỗi cấu trúc, hoàn toàn không liên quan đến kiểm soát truy cập hay ghi nhật ký hệ thống.</p><p>Gợi ý tài liệu tham khảo:</p><p>Tên file: <code>CCA-P_D3_Integration.md</code></p><p>Mục: <code>5. Authentication &amp; Access Control for Agent Systems</code> (Mục 5.5 phân tích rủi ro của việc dùng chung khóa API và mục 5.6 phân tích sự cần thiết của việc ghi nhận thông tin định danh actor cụ thể trong logs để phục vụ giám sát truy cập chủ động).</p>"},"options":[{"k":"A","t":{"en":"Replace the shared API key with per-user OAuth tokens carrying scope-restricted permissions."}},{"k":"B","t":{"en":"Enforce RBAC at the retrieval layer before content enters the model context."}},{"k":"C","t":{"en":"Move credentials out of the prompt context and resolve them from a server-side secret store."}},{"k":"D","t":{"en":"Add actor attribution to tool-call logs so each call records the initiating user identity."}},{"k":"E","t":{"en":"Validate structured outputs against a schema before downstream actions are executed."}}],"answer":["A","D"],"multi":true},{"id":"t1q59","n":59,"topic":1,"type":"mcq","stem":{"en":"You are defining when to introduce a project subagent versus relying on Claude Code's general capabilities. Which scenario most directly justifies a dedicated subagent?"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Xác định thời điểm và tình huống tối ưu để triển khai một project subagent chuyên biệt thay vì dựa vào các năng lực chung của Claude Code.</p><p><b>Giải pháp: B.</b></p><p><b>Keyword quan trọng:</b> <b>System prompt</b> ,  <b>tool permissions</b> ,  <b>model selection</b> , và  <b>task specialization</b> . Một subagent chuyên biệt được định nghĩa bởi khả năng sở hữu riêng ba thuộc tính cấu hình độc lập: system prompt chuyên biệt, phân quyền công cụ thu hẹp (least privilege), và cấu hình lựa chọn dòng mô hình tối ưu. Thiết kế này đặc biệt phù hợp cho các tác vụ chuyên môn hóa có tính lặp lại (recurring specialized tasks) nhằm duy trì ngữ cảnh cô lập, tăng cường bảo mật và tránh quá tải thông tin hệ thống (context creep).</p><p>Các phương án còn lại sai/không phù hợp: Các phương án  <b>A</b> ,  <b>C</b> , và <b>D</b> mô tả những tác vụ ad-hoc một lần, hoặc các tương tác thông thường, sử dụng prompt chung chung mà không yêu cầu giới hạn công cụ hay chuyên môn hóa hành vi, do đó việc khởi tạo một subagent là dư thừa và làm tăng độ phức tạp hệ thống một cách không cần thiết.</p><p>Gợi ý tài liệu tham khảo:</p><p>Tên file: <code>CCA-P_D1_Solution_Design.md</code></p><p>Mục: <code>4. Subagents</code> (Mục 4.1 và Phụ lục A định nghĩa chính xác 3 thuộc tính riêng biệt mà subagent sở hữu và cơ chế chạy trong session cô lập).</p><p>Tên file: <code>CCA-P_D7_Developer_Productivity.md</code></p><p>Mục: <code>1. Developer Productivity Agent</code> (Mục 1.1 và 1.3 phân tích thiết kế của specialist subagent với tool whitelist hẹp để tối ưu hóa độ chính xác định tuyến).</p>"},"options":[{"k":"A","t":{"en":"The team has no recurring specialized tasks and uses Claude Code only for isolated generalpurpose work that does not justify a dedicated system prompt or tool scope."}},{"k":"B","t":{"en":"The team has a recurring specialized task, such as database schema review, that requires a focused system prompt, narrow tool permissions, and a specific model selection across many sessions."}},{"k":"C","t":{"en":"The team has a one-time ad hoc question that will not recur and does not require a focused system prompt, narrow tool permissions, or dedicated model selection."}},{"k":"D","t":{"en":"The team wants every Claude Code interaction to use the same generic system prompt with no task- specific specialization, narrow tool permissions, or dedicated model selection."}}],"answer":["B"],"multi":false},{"id":"t1q60","n":60,"topic":1,"type":"mcq","stem":{"en":"You are identifying the highest-impact optimization for a deployment whose token cost is dominated by a long, repeated system prompt and a large retrieved context per request. Which optimization most directly targets the dominant cost driver?"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Xác định giải pháp tối ưu hiệu quả nhất để giảm thiểu chi phí token khi chi phí hệ thống bị chiếm dụng phần lớn bởi system prompt dài lặp lại và ngữ cảnh truy xuất (retrieved context) lớn trên mỗi yêu cầu.</p><p><b>Giải pháp:</b> A.</p><p><b>Keyword quan trọng:</b></p><ul><li><b>Prompt Caching</b>: Cơ chế tối ưu hóa hàng đầu giúp lưu trữ tạm thời phần tiền tố tĩnh và bất biến (như system prompt, tool definitions, few-shot) để giảm tới <b>90%</b> chi phí đọc (read rate = 0.1x) và cải thiện tốc độ phản hồi cho các lượt gọi lặp lại.</li><li><b>Context Trimming</b>: Việc chủ động cắt tỉa và thu hẹp phần ngữ cảnh truy xuất (retrieved context) chỉ giữ lại các phân đoạn thực sự liên quan trực tiếp giải quyết tác nhân gây lãng phí chi phí token đầu vào thứ hai, tránh hiện tượng loãng sự chú ý của mô hình.</li></ul><p><i>Loại trừ các phương án còn lại:</i></p><ul><li><b>B</b> sai vì việc bổ sung thêm nội dung lặp lại vào system prompt chỉ làm phình to context, gây phân tán sự chú ý (attention dilution) và làm tăng chi phí.</li><li><b>C</b> sai vì việc nâng cấp lên dòng mô hình nặng nhất (heaviest model) sẽ làm chi phí suy luận tăng vọt thay vì giải quyết gốc rễ của việc tối ưu hóa dòng dữ liệu đầu vào.</li><li><b>D</b> sai vì tăng độ sâu truy xuất (retrieval depth) sẽ nạp thêm nhiều token dư thừa vào context window, làm trầm trọng hơn gánh nặng chi phí.</li></ul><p><b>Gợi ý tài liệu tham khảo:</b></p><p><b>Tên file:</b> <code>CCA-P_D2_Models_Prompting_Context.md</code></p><ul><li><b>Mục:</b> <b>5. Prompt Caching</b> (Phân tích cơ chế hoạt động, lợi ích giảm 90% chi phí của Prompt Caching đối với phần prefix tĩnh lặp lại).</li><li><b>Mục:</b> <b>1. Context Window Management</b> (Mục 1.4 chứng minh gửi ít context hơn là tối ưu rẻ nhất và chủ động nhất để kiểm soát ngân sách).</li></ul><p><b>Tên file:</b> <code>CCA-P_D3_Integration.md</code></p><ul><li><b>Mục:</b> <b>4. Long Document Processing</b> (Mục 4.3 phân tích lý do giới hạn Top-K chunks thay vì lấy tất cả chunk tương tự để tránh làm loãng context).</li></ul>"},"options":[{"k":"A","t":{"en":"Move the long, repeated system prompt into a cacheable prefix and trim retrieved context to the spans relevant to each query."}},{"k":"B","t":{"en":"Add additional repeated content to the system prompt to give the model more guidance."}},{"k":"C","t":{"en":"Switch every request to the heaviest available model to maximize output quality, accepting that higher per-request inference cost compounds rather than addresses the dominant cost driver."}},{"k":"D","t":{"en":"Increase retrieval depth on every request to maximize recall, worsening the dominant cost driver by adding more retrieved tokens per request rather than reducing them."}}],"answer":["A"],"multi":false},{"id":"t1q61","n":61,"topic":1,"type":"mcq","stem":{"en":"When communicating an architectural decision to a security and compliance reviewer, which content set is most aligned with that audience's primary concerns?"},"explain":{"text":"<p>Đã kiểm tra</p><p>Tóm tắt vấn đề: Truyền đạt các quyết định kiến trúc hệ thống Claude cho kiểm duyệt viên bảo mật và tuân thủ (security and compliance reviewer) bằng tập hợp nội dung phù hợp nhất với mối quan tâm cốt lõi của họ.</p><p>Giải pháp: C</p><p>Keyword quan trọng:</p><ul><li><b>Threat model</b> (mô hình đe dọa), <b>control mappings</b> (bản đồ kiểm soát), <b>residual-risk acceptance criteria</b> (tiêu chí chấp nhận rủi ro còn lại), và <b>audit traceability</b> (khả năng truy vết kiểm toán): Đây là những công cụ, ngôn ngữ chuyên môn và mối quan tâm cốt lõi của đội ngũ bảo mật và tuân thủ nhằm đánh giá, phê duyệt rủi ro vận hành cũng như đảm bảo tính minh bạch, khả năng kiểm toán của hệ thống AI phi tuyến tính trước khi đưa vào sản xuất.</li></ul><p>Các phương án còn lại sai/không phù hợp:</p><ul><li>Phương án <b>A</b> (lộ trình tính năng, phạm vi sản phẩm) được thiết kế riêng cho <b>Product Manager</b>.</li><li>Phương án <b>B</b> (mục tiêu kinh doanh, rủi ro vĩ mô) được thiết kế riêng cho <b>Executive Review</b> (ban giám đốc).</li><li>Phương án <b>D</b> (giao diện thành phần, trình tự triển khai) được thiết kế riêng cho <b>Engineering Team</b> (đội ngũ kỹ sư).</li></ul><p>Gợi ý tài liệu tham khảo:</p><p>Tên file: <code>CCA-P_D6_Stakeholder_Lifecycle.md</code></p><p>Mục: <code>3. Communicating AI Decisions &amp; Value to Stakeholders</code> (Mục 3.2 và 3.4 hướng dẫn cách chuyển ngữ các quyết định kiến trúc kỹ thuật sang các chiều giá trị và rủi ro phù hợp với từng nhóm đối tượng stakeholder cụ thể).</p><p>Tên file: <code>CCA-P_D5_Governance_Safety_Risk.md</code></p><p>Mục: <code>2. Guardrails &amp; Safe Deployment Practices</code> và <code>4. Regulatory Compliance</code> (Phân tích cơ chế xây dựng các tầng phòng thủ, ranh giới an toàn và quy trình lập tài liệu kiểm soát bảo mật để kiểm toán).</p>"},"options":[{"k":"A","t":{"en":"Feature delivery schedule, roadmap dependencies, and scope boundaries for the product manager."}},{"k":"B","t":{"en":"Decision rationale, business outcomes, and high-level risk summary for executive review."}},{"k":"C","t":{"en":"Threat model, control mappings, residual-risk acceptance criteria, and audit traceability."}},{"k":"D","t":{"en":"Implementation timeline, component interfaces, and deployment sequence for the engineering team."}}],"answer":["C"],"multi":false},{"id":"t1q62","n":62,"topic":1,"type":"mcq","stem":{"en":"You are supporting a team whose Claude Code sessions consistently load 60 or more MCP tools from many servers, exhausting context budget before the session begins. Which adjustment most directly addresses this issue without removing capability?"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Giải quyết tình trạng cạn kiệt ngân sách ngữ cảnh (context budget) khi khởi động phiên làm việc Claude Code do tải sẵn quá nhiều định nghĩa công cụ (MCP tools) cùng lúc mà không làm suy giảm năng lực hệ thống.</p><p><b>Giải pháp:</b> A. Enable Tool Search so tool definitions are deferred and discovered on demand rather than loaded into context upfront.</p><p><b>Keyword quan trọng:</b></p><ul><li><b>Progressive Discovery</b> và <b>Tool Search</b>: Thay vì tải toàn bộ định nghĩa chi tiết của 60+ công cụ cùng lúc khi khởi chạy (Monolithic), việc kích hoạt Tool Search cho phép áp dụng cơ chế khám phá lũy tiến. Hệ thống chỉ tải một chỉ mục (index) siêu nhẹ gồm tên và mô tả sơ bộ lúc startup; khi phát sinh tác vụ thực tế cần đến công cụ cụ thể, Claude Code mới kích hoạt tìm kiếm và nạp định nghĩa chi tiết của công cụ đó một cách tự động (on-demand), giúp bảo toàn tối đa context budget.</li></ul><p>Gợi ý tài liệu tham khảo:</p><p>Tên file: <code>CCA-P_D3_Integration.md</code></p><p>Mục: <code>3. Progressive Discovery vs Monolithic Context</code> (Mục 3.1 và 3.4 phân tích chi tiết về sự đánh đổi giữa hai chiến lược nạp công cụ và cơ chế tự động tìm kiếm/defer của Claude Code).</p>"},"options":[{"k":"A","t":{"en":"Enable Tool Search so tool definitions are deferred and discovered on demand rather than loaded into context upfront."}},{"k":"B","t":{"en":"Increase the prompt's verbosity with additional instructions and context, which consumes more of the context budget rather than reducing the tool-definition overhead causing the issue."}},{"k":"C","t":{"en":"Add additional MCP servers to give the team more capability, which increases rather than reduces the number of tool definitions loaded into the session's context budget."}},{"k":"D","t":{"en":"Disable every MCP server in the configuration to free up context budget, accepting that the team loses all tool access and cannot perform any MCP-dependent task in the session."}}],"answer":["A"],"multi":false},{"id":"t1q63","n":63,"topic":1,"type":"mcq","stem":{"en":"You are reviewing instrumentation in a multi-agent system. Which two findings constitute valid observability gaps in the instrumentation? (Select two.) Each correct answer presents a complete solution."},"explain":{"text":"<p>Tóm tắt vấn đề: Xác định các lỗ hổng giám sát (<b>observability gaps</b>) hợp lệ trong việc thiết lập đo lường (<b>instrumentation</b>) của hệ thống <b>multi-agent</b> dựa trên Claude.</p><p>Giải pháp: B và E</p><p>Keyword quan trọng:</p><ul><li><b>Correlation identifiers (B):</b> Việc lan truyền (<b>propagate</b>) mã định danh tương quan (<b>correlation ID</b>) xuyên suốt các cuộc gọi giữa các agent và công cụ là bắt buộc để tái dựng chuỗi quyết định end-to-end. Không thực hiện việc này sẽ tạo ra lỗ hổng lớn khiến các vết thực thi bị cô lập và không thể liên kết với nhau.</li><li><b>Model identity and version tracking (E):</b> Việc ghi lại định danh và phiên bản cụ thể của mô hình trong từng turn là điều kiện tiên quyết để chẩn đoán lỗi trôi dạt hành vi (<b>drift</b>) hoặc đánh giá hiệu năng suy luận. Thiếu thông tin này sẽ ngăn cản việc phân tích nguyên nhân gốc rễ (<b>root-cause analysis</b>) khi có sự thay đổi giữa các phiên bản mô hình.</li></ul><p>Gợi ý tài liệu tham khảo:</p><p>Tên file: <code>CCA-P_D3_Integration.md</code></p><p>Mục: <code>7. Observability &amp; Monitoring for Agents at Scale</code> (Mục 7.1, 7.2 và 7.4 phân tích về sự cần thiết của việc thu thập đầy đủ ngữ cảnh bao gồm agent, tool, environment và cấu trúc trace spans OTel tái dựng decision path).</p><p>Tên file: <code>CCA-P_D2_Models_Prompting_Context.md</code></p><p>Mục: <code>2. Claude Model Selection &amp; Tradeoffs</code> (Mục 2.3 phân tích về hành vi thay đổi sâu sắc qua các phiên bản và tầm quan trọng của việc ghim model ID tĩnh).</p>"},"options":[{"k":"A","t":{"en":"Trace spans for each agent step are exported to the shared distributed-tracing backend."}},{"k":"B","t":{"en":"Request-scoped correlation identifiers do not propagate across agent and tool calls."}},{"k":"C","t":{"en":"Latency and token usage on every span are emitted to the central metrics pipeline."}},{"k":"D","t":{"en":"Tool-call payloads and outcomes are recorded with redaction applied to known sensitive fields."}},{"k":"E","t":{"en":"Model identity and version on each turn are not recorded with the turn artifacts."}}],"answer":["B","E"],"multi":true},{"id":"t1q64","n":64,"topic":1,"type":"mcq","stem":{"en":"You are reviewing a peer's draft system prompt that contains contradictory instructions: one section says never to speculate beyond the supplied source, while another says to confidently fill in any gaps. Which response is most appropriate?"},"explain":{"text":"<p><b>Câu hỏi:</b> Peer review một system prompt có 2 chỉ dẫn mâu thuẫn — một bên nói không được suy đoán ngoài nguồn, bên kia nói phải tự tin lấp khoảng trống. Chọn cách xử lý đúng.</p><p><b>Đáp án đúng: B</b> — Xóa hoặc viết lại chỉ dẫn \"gap-filling instruction\" để prompt nhất quán, chỉ giới hạn model trong nội dung có nguồn hỗ trợ.</p>"},"options":[{"k":"A","t":{"en":"Increase temperature so output randomness masks the contradiction."}},{"k":"B","t":{"en":"Add a priority instruction directing the model to evaluate all instructions and apply whichever appears most contextually appropriate on each request."}},{"k":"C","t":{"en":"Keep both instructions and rely on the model to decide which one to follow on each request."}},{"k":"D","t":{"en":"Remove or rewrite the gap-filling instruction so the prompt consistently constrains the model to source- supported content."}}],"answer":["B"],"multi":false},{"id":"t1q65","n":65,"topic":1,"type":"yesno","stem":{"en":"You are evaluating model-selection claims used by a peer team. For each statement, select yes if the statement is generally true. Otherwise, select no."},"explain":{"text":"<p><b>Keyword quan trọng:</b></p><ul><li>Latency-cost trade-off (S1 -  Yes ): Các dòng mô hình có năng lực suy luận phức tạp hơn <b>(heavier-reasoning models) như Opus hoặc Fable</b> sẽ hoạt động chậm hơn và tiêu tốn nhiều giới hạn tần suất gọi API (rate limit) cũng như chi phí token hơn dòng mô hình nhẹ hơn (Haiku/Sonnet) trên cùng một khối lượng đầu vào.</li><li>Benchmark evaluation (S2 -  Yes ): Việc <b>xác thực lựa chọn mô hình</b> bắt buộc phải dựa trên <b>kết quả kiểm thử thực tế</b> (benchmark eval) với t<b>ập dữ liệu mẫu đại diện cho luồng công việc mục tiêu</b> chứ không thể dựa vào trực giác hay suy đoán.</li><li>Tiered routing (S4 -  Yes ): Kỹ thuật định tuyến phân tầng (<b>Tiered routing</b>) cho phép tối ưu hóa tài nguyên bằng cách phân phối các yêu cầu thông thường cho mô hình nhẹ <b>(Haiku/Sonnet)</b> xử lý và chỉ kích hoạt mô hình lớn <b>(Opus/Fable)</b> đối với các <b>truy vấn phức tạp</b> hoặc yêu cầu thẩm quyền cao hơn.</li></ul><p><b>[Nếu có đáp án sai khác cần loại trừ]:</b></p><ul><li>S3 - No vì việc luôn chọn mô hình mạnh nhất bất kể hồ sơ tác vụ là một bẫy thiết kế cổ điển, vi phạm nghiêm trọng nguyên lý \"c<b>họn tầng rẻ nhất thực sự thỏa mãn yêu cầu</b>\" và làm bùng nổ chi phí không đáng có.</li><li><b>S5 - </b>No<b> vì việc chọn mô hình dựa trên ngày công bố mới nhất là thực hành vận hành sai lầm; một phiên bản mô hình mới có thể thay đổi sâu sắc về mặt tokenizer làm tăng chi phí hoặc gây trôi dạt hành vi, do đó bắt buộc phải được xử lý như một sự thay đổi (change) cần re-validate chặt chẽ thông qua hệ thống kiểm thử (eval suite) trước khi deploy.</b></li></ul><p>*</p>"},"rows":[{"t":{"en":"Heavier-reasoning models typically consume more of the rate limit and run more slowly than lighter models on the same input"},"a":"Y"},{"t":{"en":"A representative-sample evaluation on the target workload is the right basis for confirming a model selection"},"a":"Y"},{"t":{"en":"The most capable model is always the right choice regardless of the workload profile"},"a":"N"},{"t":{"en":"Tiered routing can serve routine traffic with a lighter model while reserving a heavier model for traffic that needs its capability"},"a":"Y"},{"t":{"en":"Selecting a model based on which version was most recently announced is the right basis for production decisions"},"a":"N"}]},{"id":"t1q66","n":66,"topic":1,"type":"mcq","stem":{"en":"You are designing a human-in-the-loop validation workflow for a new Claude-based deployment and must complete the design steps before piloting the workflow. Which two steps must be completed BEFORE piloting the workflow with a representative subset of traffic? (Select two.) Each correct answer presents part of the solution."},"explain":{"text":"<p>Tóm tắt vấn đề: Xác định hai bước thiết kế cốt lõi bắt buộc phải hoàn thành trước khi tiến hành chạy thử nghiệm (piloting) quy trình kiểm duyệt có sự tham gia của con người (human-in-the-loop validation workflow) trên một tập dữ liệu lưu lượng đại diện.</p><p>Giải pháp: <b>B và E</b></p><ul><li><b>B. Identify the decision points in the pipeline that require human oversight by impact and reversibility.</b></li><li><b>E. Define the sampling strategy and the escalation criteria at each oversight point in the pipeline.</b></li></ul><p>Keyword quan trọng:</p><ul><li><b>Impact and reversibility (B):</b> Để thiết kế một quy trình HITL hiệu quả, bước đầu tiên là phải phân loại và xác định các điểm quyết định trong pipeline cần sự can thiệp của con người dựa trên mức độ ảnh hưởng (<b>impact</b>) và khả năng đảo ngược (<b>reversibility</b>) của hành động (các hành động có độ rủi ro cao hoặc không thể đảo ngược bắt buộc phải có con người kiểm duyệt).</li><li><b>Sampling strategy and escalation criteria (E):</b> Việc xác định chiến lược lấy mẫu (<b>sampling strategy</b> — ví dụ: kiểm duyệt 100% giao dịch giá trị cao, lấy mẫu ngẫu nhiên 5% giao dịch thường) và tiêu chí leo thang (<b>escalation criteria</b> — các điều kiện cụ thể để hệ thống tự động chuyển tiếp công việc cho con người) là bước thiết kế kỹ thuật bắt buộc để định hình khung vận hành trước khi chạy thử nghiệm trên một phần lưu lượng thực tế.</li></ul><p>[Nếu có đáp án sai khác cần loại trừ]:</p><ul><li><b>A</b> và <b>C</b> là các hoạt động tài liệu hóa quy trình (documentation) và đào tạo nhân sự (onboarding/training) thuộc giai đoạn chuẩn bị vận hành thực tế sau khi thiết kế đã hoàn thành.</li><li><b>D</b> (lặp lại thiết kế dựa trên kết quả pilot) sai hoàn toàn về mặt thứ tự thời gian vì đây là bước tối ưu hóa diễn ra <b>sau</b> khi đã có dữ liệu từ quá trình chạy thử nghiệm (post-pilot).</li></ul><p>Gợi ý tài liệu tham khảo:</p><p>Tên file: <code>CCA-P_D5_Governance_Safety_Risk.md</code></p><p>Mục: <code>3. Human-in-the-Loop Escalation</code> (Mục 3.2, 3.3 và 3.7 quy định về việc xác định các trigger leo thang deterministic, phân nhóm workflow theo mức độ rủi ro và thiết lập các ngưỡng phê duyệt tự động/thủ công trước khi vận hành).</p><p>Tên file: <code>CCA-P_D1_Solution_Design.md</code></p><p>Mục: <code>1. Translating Business Requirements into Claude Solutions</code> (Mục 1.3 quy định việc xác định các ràng buộc về tỷ lệ quyết định tự động vs cần con người kiểm duyệt — unattended vs human-in-the-loop — ngay từ giai đoạn thiết kế đặc tả spec).</p>"},"options":[{"k":"A","t":{"en":"Onboard the reviewer pool with role-specific training on the check criteria and escalation procedures."}},{"k":"B","t":{"en":"Identify the decision points in the pipeline that require human oversight by impact and reversibility."}},{"k":"C","t":{"en":"Document the workflow with check criteria, escalation paths, and service-level agreements (SLAs) for each step."}},{"k":"D","t":{"en":"Iterate the workflow design based on observed pilot findings before broader rollout to production."}},{"k":"E","t":{"en":"Define the sampling strategy and the escalation criteria at each oversight point in the pipeline."}}],"answer":["B","E"],"multi":true},{"id":"t1q67","n":67,"topic":1,"type":"mcq","stem":{"en":"You are designing a test strategy for a Claude-based pipeline that handles sensitive financial data. Which two test types should be prioritized to cover both safety under attack and cross-component correctness? (Select two.)"},"explain":{"text":"<p>Tóm tắt vấn đề: Thiết lập chiến duyệt kiểm thử cho pipeline dựa trên Claude xử lý dữ liệu tài chính nhạy cảm nhằm bảo mật trước hành vi tấn công đối kháng (safety under attack) và đảm bảo tính chính xác liên kết giữa các thành phần (cross-component correctness).</p><p>Giải pháp: <b>A và C</b> (Integration tests that verify end-to-end pipeline behavior across all components và Adversarial tests using prompt-injection and malformed-input cases).</p><p>Keyword quan trọng:</p><ul><li><b>Adversarial tests (C):</b> Phương pháp trực tiếp kiểm chứng mức độ an toàn của hệ thống trước các cuộc tấn công bảo mật thông qua việc mô phỏng các kịch bản chèn lệnh (<b>prompt-injection</b>) và đầu vào lỗi/dị dạng (<b>malformed-input</b>). Đối với hệ thống tài chính nhạy cảm, đây là chốt chặn bắt buộc để ngăn chặn các rủi ro nghiêm trọng như rò rỉ thông tin hoặc tự ý thực thi giao dịch ngoài thẩm quyền.</li><li><b>Integration tests (A):</b> Đảm bảo tính chính xác xuyên suốt của pipeline nhờ việc kiểm thử tích hợp toàn diện hành vi đầu-cuối (end-to-end) trên tất cả các thành phần (như mô hình trích xuất, logic gọi công cụ, và cơ chế định tuyến) thay vì chỉ kiểm thử đơn lẻ.</li></ul><p>Gợi ý tài liệu tham khảo:</p><p>Tên file: <code>CCA-P_D4_Evaluation_Testing_Optimization.md</code></p><p>Mục: <code>1. Tool Evaluation &amp; Testing</code> và <code>2. Debugging LLM System Failures</code> (Phân biệt phạm vi kiểm thử, hạn chế của việc chỉ kiểm tra text-output đơn thuần và sự cần thiết của kiểm thử tích hợp đa thành phần).</p><p>Tên file: <code>CCA-P_D5_Governance_Safety_Risk.md</code></p><p>Mục: <code>1. LLM System Risks &amp; Failure Modes</code> và <code>2. Guardrails &amp; Safe Deployment Practices</code> (Phân tích rủi ro chèn lệnh trực tiếp/gián tiếp và các phương án thiết lập các lớp phòng thủ đối kháng).</p>"},"options":[{"k":"A","t":{"en":"Integration tests that verify end-to-end pipeline behavior across all components."}},{"k":"B","t":{"en":"Regression tests against a stable reference set of previously known-good outputs."}},{"k":"C","t":{"en":"Adversarial tests using prompt-injection and malformed-input cases."}},{"k":"D","t":{"en":"Unit tests targeting only individual prompt-template rendering logic."}},{"k":"E","t":{"en":"Smoke tests that verify core paths after each deployment."}}],"answer":["A","C"],"multi":true},{"id":"t1q68","n":68,"topic":1,"type":"mcq","stem":{"en":"The compliance team has authored a regulatory disclosure procedure that must be applied identically across customer service, sales, and onboarding workflows. The procedure changes when regulators issue updates, currently four to six times per year. You are designing how the procedure will be packaged for use by Claude across all three workflows. Which two design decisions should you include? (Select two.) Each correct answer presents part of the solution."},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Thiết kế phương án đóng gói một quy trình công bố thông tin pháp lý (regulatory disclosure procedure) thay đổi thường xuyên (4-6 lần/năm) để áp dụng đồng nhất (identically) xuyên suốt ba workflow độc lập của Claude.</p><p><b>Giải pháp:</b> A và D</p><p><b>Keyword quan trọng:</b></p><p><i> <b>Claude Skill</b>: Việc đóng gói quy trình thành một <b>Claude Skill</b> chuyên biệt giúp đóng vai trò làm </i>single source of truth* (nguồn chân lý duy nhất). Khi đó, đội ngũ pháp chế (compliance team) có thể trực tiếp sở hữu và cập nhật nội dung quy trình (<code>SKILL.md</code> và mã script đi kèm) tại một nơi duy nhất mỗi khi có thay đổi từ cơ quan quản lý.</p><ul><li><b>Reference identical skill</b>: Việc cả ba workflow (customer service, sales, onboarding) cùng tham chiếu (<b>reference</b>) chung một <b>Claude Skill</b> giúp loại bỏ việc sao chép thủ công (duplicate inline), bảo đảm quy trình được thực thi hoàn toàn đồng nhất và tự động đồng bộ hóa mỗi khi phiên bản mới của Skill được phát hành.</li></ul><p><b>[Nếu có đáp án sai khác cần loại trừ]:</b></p><ul><li>Phương án <b>B</b> và <b>C</b> vi phạm nguyên lý đồng nhất và bảo trì hệ thống; việc tự viết lại quy trình theo từng ngữ cảnh hoặc nhúng trực tiếp (embed) văn bản quy trình vào system prompt tại thời điểm tích hợp (integration time) sẽ tạo ra sự phân mảnh, gây khó khăn cho việc cập nhật liên tục 4-6 lần/năm và tăng rủi ro không tuân thủ (non-compliance).</li><li>Phương án <b>E</b> (lưu trữ trong một shared retrieval corpus) không phù hợp vì quy trình pháp lý yêu cầu tính chính xác và nhất quán tuyệt đối trong thực thi (deterministic logic), trong khi cơ chế truy xuất tìm kiếm (RAG/retrieval) mang tính xác suất (probabilistic) và dễ gặp rủi ro thất bại khi truy xuất (discovery failure).</li></ul><p><b>Gợi ý tài liệu tham khảo:</b></p><p><b>Tên file:</b> <code>CCA-P_D3_Integration.md</code></p><ul><li><b>Mục:</b> <code>2. Model Context Protocol (MCP)</code> (Triết lý thiết kế single source of truth thay vì duplicate inline) và <code>3. Progressive Discovery vs Monolithic Context</code> (Cách thức hoạt động và nạp động theo nhu cầu của Agent Skills).</li></ul><p><b>Tên file:</b> <code>CCA-P_D6_Stakeholder_Lifecycle.md</code></p><ul><li><b>Mục:</b> <code>5. Architecture Documentation &amp; Implementation Handoff</code> (Định nghĩa cấu trúc thư mục cấu hình bao gồm <code>skills</code> nằm trong phân lớp conditional layer).</li></ul>"},"options":[{"k":"A","t":{"en":"Reference the same Claude Skill from all three workflow integrations."}},{"k":"B","t":{"en":"Have each workflow team rewrite the procedure for its own context."}},{"k":"C","t":{"en":"Embed the procedure text into each workflow's system prompt at integration time."}},{"k":"D","t":{"en":"Package the procedure as a Claude Skill owned directly by the compliance team."}},{"k":"E","t":{"en":"Store the procedure in a shared retrieval corpus accessed by all three workflows."}}],"answer":["A","D"],"multi":true},{"id":"t1q69","n":69,"topic":1,"type":"mcq","stem":{"en":"A customer support team has proposed delegating customer refund decisions to a Claudedriven workflow with no human review for refunds under 50 USD. The team's reasoning is that small refunds are low-risk and human review would erase the efficiency gain. Which Delegation-competency principle should guide your response?"},"explain":{"text":"<p>Tóm tắt vấn đề: Xác định nguyên lý phân quyền (<b>Delegation-competency principle</b>) khi quyết định tự động hóa các giao dịch hoàn tiền giá trị nhỏ (&lt; 50 USD) không có con người kiểm duyệt.</p><p>Giải pháp: B.</p><p>Keyword quan trọng:</p><ul><li><b>Type of risk</b> và <b>transaction size</b>: Việc xác định phạm vi ủy quyền cho mô hình (<b>delegation scope</b>) phải phản ánh bản chất của loại rủi ro liên quan (<b>type of risk</b>) thay vì chỉ phụ thuộc vào giá trị giao dịch (<b>transaction size</b>). Các rủi ro nghiêm trọng như tấn công chèn lệnh gián tiếp (<b>indirect prompt injection</b>) có thể bị kẻ tấn công khai thác tự động để thực hiện hàng loạt giao dịch nhỏ lũy kế, tạo ra thiệt hại khổng lồ. Sự tin tưởng của các bên liên quan (<b>Trust</b>) là điều kiện tiên quyết để hiện thực hóa giá trị hiệu năng. Nếu hệ thống hoạt động thiếu tin cậy, các stakeholder sẽ từ chối áp dụng và triệt tiêu hoàn toàn giá trị mà giải pháp mang lại.</li></ul><p>Gợi ý tài liệu tham khảo:</p><p>Tên file: <code>CCA-P_D5_Governance_Safety_Risk.md</code></p><p>Mục: <code>3. Human-in-the-Loop Escalation</code> (Mục 3.2, 3.3 và 3.7 phân tích việc thiết kế các trigger leo thang và phân quyền tự động hóa dựa trên bản chất rủi ro của loại workflow và khả năng kiểm soát giao dịch).</p><p>Tên file: <code>CCA-P_D1_Solution_Design.md</code></p><p>Mục: <code>6. Aligning Solutions to Business Value Pillars</code> (Mục 6.1 và 6.2 nhấn mạnh vai trò của <b>Trust</b> là điều kiện tiên quyết bắt buộc để hiện thực hóa các giá trị về hiệu suất và chi phí của hệ thống).</p>"},"options":[{"k":"A","t":{"en":"Delegation should always include human review on every decision the workflow produces."}},{"k":"B","t":{"en":"Delegation scope should reflect the type of risk involved, not the transaction size alone."}},{"k":"C","t":{"en":"Delegation should be avoided entirely wherever financial transactions occur in the workflow."}},{"k":"D","t":{"en":"Delegation scope should be set primarily by maximizing efficiency gains across the workflow."}}],"answer":["B"],"multi":false},{"id":"t1q70","n":70,"topic":1,"type":"mcq","stem":{"en":"You are identifying signals that a deployment should re-enter design rather than continue iterating in place. Which signal most directly indicates the need for a new design cycle?"},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Cần xác định tín hiệu nào cho thấy một deployment phải quay lại pha thiết kế (design cycle) thay vì tiếp tục iterate tại chỗ.</p><p><b>Đáp án: C.</b> Khi kiến trúc hiện tại không thể đáp ứng yêu cầu mới nếu không thay đổi component responsibilities hoặc core contracts — đây là dấu hiệu trực tiếp cần re-design; các phương án A, B, D đều là thay đổi cục bộ (docs, copy, config) không đụng đến contracts/responsibilities nên xử lý bằng iteration bình thường là đủ.</p>"},"options":[{"k":"A","t":{"en":"A runbook step requires a clarification edit to improve on-call guidance accuracy, which can be handled as a documentation update without changes to component responsibilities or core contracts."}},{"k":"B","t":{"en":"A minor copy edit is requested in a customer-facing string within the existing UI, which can be handled as a localized content change without altering component responsibilities or contracts."}},{"k":"C","t":{"en":"The system's current architecture cannot meet the new requirements without changes to component responsibilities or core contracts."}},{"k":"D","t":{"en":"A dashboard alert threshold needs a small numerical adjustment to reduce false-positive noise, which can be handled as an operational configuration change without a new design cycle."}}],"answer":["C"],"multi":false},{"id":"t1q71","n":71,"topic":1,"type":"mcq","stem":{"en":"You are running a risk assessment on a planned Claude-based deployment and must complete the inventory steps before assessing threats against assets. Which two steps must be completed BEFORE assessing threats against assets to estimate likelihood and impact? (Select two.) Each correct answer presents part of the solution."},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Trong risk assessment cho Claude-based deployment, cần xác định 2 bước inventory nào phải hoàn thành TRƯỚC khi assess threats against assets để ước tính likelihood/impact.</p><p><b>Đáp án: C và E.</b> Phải identify assets (và sensitivity của chúng) và enumerate threat actors/attack vectors trước — đây là bước inventory (asset + threat) làm nền tảng; A/B/D đều là các bước sau (mitigation, documentation), xảy ra sau khi đã assess threats.</p>"},"options":[{"k":"A","t":{"en":"Recommend mitigations and residual-risk acceptance for the risks that remain after analysis."}},{"k":"B","t":{"en":"Recommend mitigations and residual-risk acceptance for risks that remain."}},{"k":"C","t":{"en":"Identify the assets that the deployment touches, along with the sensitivity of each asset."}},{"k":"D","t":{"en":"Document the assessment outcome with risks, mitigations, residual risk, and acceptance owners."}},{"k":"E","t":{"en":"Enumerate the threat actors and attack vectors relevant to the deployment."}}],"answer":["C","E"],"multi":true},{"id":"t1q72","n":72,"topic":1,"type":"mcq","stem":{"en":"A Claude architect is auditing configuration scope assignments. Which two statements correctly identify an appropriate use of user-scope configuration versus other scopes? (Select two.)"},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Xác định 2 phát biểu đúng về việc dùng đúng <b>user-scope configuration</b> so với các scope khác (enterprise/project/local).</p><p><b>Đáp án: B và C.</b> User-scope dùng cho personal preferences theo engineer xuyên suốt mọi project — theme editor (B) và response language (C) đều là preferences cá nhân \"follow the engineer across projects/repositories\", đúng bản chất user-scope; A là enterprise/policy scope, D thường là local scope (không commit trong 1 project cụ thể), E là project-scope (shared theo repo).</p>"},"options":[{"k":"A","t":{"en":"Enforcing a company-wide policy that disables a feature for all engineers."}},{"k":"B","t":{"en":"Persisting personal editor theme preferences that follow an engineer across projects."}},{"k":"C","t":{"en":"Saving a preferred Claude response language that applies to all repositories the engineer uses."}},{"k":"D","t":{"en":"Storing API authentication keys so they are not committed to version control."}},{"k":"E","t":{"en":"Defining MCP server endpoints shared by all contributors to a specific repository."}}],"answer":["B","C"],"multi":true},{"id":"t1q73","n":73,"topic":1,"type":"mcq","stem":{"en":"You are choosing the level of detail for an implementation guide. The audience is a delivery team that will build the deployment. Which guidance composition best serves them?"},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Chọn mức độ chi tiết phù hợp cho implementation guide dành cho delivery team (đội trực tiếp build deployment).</p><p><b>Đáp án: B.</b> Delivery team cần đầy đủ: component responsibilities, interface contracts, sequence diagrams cho dominant flows, configuration parameters với defaults, và operational runbooks — đủ chi tiết để build và vận hành; A/C/D đều thiếu ít nhất một thành phần thiết yếu (contracts, diagrams, hoặc runbooks) nên không đủ cho việc build thực tế.</p>"},"options":[{"k":"A","t":{"en":"Component responsibilities and interface contracts only, without sequence diagrams of the dominant flows, configuration parameters with defaults, or runbooks to guide operational tasks."}},{"k":"B","t":{"en":"Component responsibilities, contracts between components, sequence diagrams of the dominant flows, configuration parameters with defaults, and operational runbooks."}},{"k":"C","t":{"en":"An architecture overview and sequence diagrams for the dominant flows, without interface contracts, configuration-parameter tables, or operational runbooks for the delivery team to follow."}},{"k":"D","t":{"en":"An architecture overview and a list of known limitations, without component-level diagrams, interface contracts, configuration parameters, or operational runbooks to support implementation."}}],"answer":["B"],"multi":false},{"id":"t1q74","n":74,"topic":1,"type":"mcq","stem":{"en":"You are investigating an MCP server that fails on first launch but succeeds on subsequent runs. System permission dialogs appeared during the first launch. Which response is most appropriate?"},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> MCP server fail ở lần chạy đầu (kèm system permission dialog xuất hiện) nhưng chạy thành công ở các lần sau — nên xử lý thế nào.</p><p><b>Đáp án: A.</b> Nhận diện đúng nguyên nhân là first-run permission grant (bình thường với OS-level permission dialogs), document lại trong onboarding guidance, và confirm các lần chạy sau đều thành công; B/C/D đều là phản ứng thái quá (tắt security, thay thế server, cài lại OS) không cần thiết cho một hành vi first-run bình thường.</p>"},"options":[{"k":"A","t":{"en":"Recognize the first-run permission grant as the cause, document the expected behavior in onboarding guidance, and confirm that subsequent runs succeed."}},{"k":"B","t":{"en":"Disable operating-system permission dialogs entirely, accept the resulting security implications, and proceed without confirming whether the failure recurs."}},{"k":"C","t":{"en":"Treat the first-run failure as a permanent fault, replace the MCP server, and do not verify whether subsequent runs succeed."}},{"k":"D","t":{"en":"Reinstall the operating system to clear all permission state without first confirming whether the one- time permission grant caused the failure."}}],"answer":["A"],"multi":false},{"id":"t1q75","n":75,"topic":1,"type":"mcq","stem":{"en":"You are listing characteristics of strong architectural-decision communication. Which two characteristics belong on the list? (Select two.) Each correct answer presents a complete solution."},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Chọn 2 đặc điểm thuộc \"strong architectural-decision communication\" (giao tiếp quyết định kiến trúc tốt).</p><p><b>Đáp án: D và E.</b> Alternatives considered + criteria đánh giá (E) và ownership/review cadence khi conditions thay đổi (D) là 2 yếu tố cốt lõi của decision record chất lượng (kiểu ADR); A chỉ là hình thức template (không đảm bảo nội dung tốt), B sai vì omit alternatives làm mất tính minh bạch, C là quy trình họp không phải đặc điểm của bản thân communication.</p>"},"options":[{"k":"A","t":{"en":"Use of a consistent template across the team to standardize the visual presentation of decisions."}},{"k":"B","t":{"en":"Omission of rejected alternatives to keep the decision document focused and concise for readers."}},{"k":"C","t":{"en":"Distribution to a standing review forum with mandatory attendance from senior engineering leaders."}},{"k":"D","t":{"en":"Ownership and review cadence for revisiting the decision when conditions or assumptions change."}},{"k":"E","t":{"en":"Alternatives considered along with the criteria that were used to evaluate each alternative."}}],"answer":["D","E"],"multi":true},{"id":"t1q76","n":76,"topic":1,"type":"mcq","stem":{"en":"You are preparing a HIPAA-eligible deployment for a healthcare customer. Which configuration supports HIPAA compliance using Anthropic-offered tools?"},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Chọn cấu hình phù hợp để hỗ trợ HIPAA compliance cho một healthcare customer, dùng Anthropic-offered tools.</p><p><b>Đáp án: C.</b> Claude Enterprise với BAA đã ký, Zero Data Retention bật, và audit logging được cấu hình — đây là bộ 3 yêu cầu tối thiểu cho HIPAA-eligible deployment; A/D dùng personal/Free account không có BAA nên không đủ điều kiện, B sai vì tắt logging không thay thế được BAA và còn ảnh hưởng compliance tracking.</p>"},"options":[{"k":"A","t":{"en":"An ad-hoc personal Claude account used by individual clinicians for PHI-related tasks, with no Business Associate Agreement, no Zero Data Retention, and no audit logging configured."}},{"k":"B","t":{"en":"Disabling all audit logging so that no PHI is recorded in any log store, on the assumption that the absence of logs satisfies HIPAA requirements without a signed BAA."}},{"k":"C","t":{"en":"Claude Enterprise with a signed Business Associate Agreement, Zero Data Retention enabled, and audit logging configured for compliance tracking."}},{"k":"D","t":{"en":"Claude Free with no contractual addendum, since consumer products meet HIPAA requirements out of the box."}}],"answer":["C"],"multi":false},{"id":"t1q77","n":77,"topic":1,"type":"mcq","stem":{"en":"You are compiling guardrail tactics for a customer-facing assistant. Which two tactics belong on the guardrail list? Each correct answer presents a complete solution."},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Chọn 2 tactic thuộc \"guardrail list\"(danh sách hàng rào bảo vệ) cho customer-facing assistant.</p><p><b>Đáp án: A và C.</b> Validate output theo structured schema trước khi thực hiện downstream action (A) là kiểm soát deterministic; layer prompt-level guardrails + runtime content checks (C) thể hiện defense-in-depth, không phụ thuộc vào một lớp duy nhất; B sai vì chỉ dựa vào 1 system prompt (probabilistic, không đủ), D tạo lỗ hổng bypass nguy hiểm, E chỉ giảm nhẹ off-policy nhưng không phải guardrail cơ chế thật sự.</p>"},"options":[{"k":"A","t":{"en":"Validate the model output against a structured schema before downstream actions are taken."}},{"k":"B","t":{"en":"Rely on a single hardened system prompt that enumerates every disallowed behavior."}},{"k":"C","t":{"en":"Layer prompt-level guardrails with runtime content checks rather than relying on either alone."}},{"k":"D","t":{"en":"Embed approved override phrases that let trusted users relax guardrails on demand."}},{"k":"E","t":{"en":"Lower sampling temperature globally to reduce the chance of off-policy completions."}}],"answer":["A","C"],"multi":true},{"id":"t1q78","n":78,"topic":1,"type":"mcq","stem":{"en":"You are supporting an engineer whose newly added MCP server does not appear in their Claude Code session. Which diagnostic step should be tried first?"},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Engineer thêm MCP server mới nhưng không xuất hiện trong Claude Code session — bước chẩn đoán nào nên thử đầu tiên.</p><p><b>Đáp án: B.</b> Verify server đã được register bằng listing command, rồi reconnect session nếu cần — vì thay đổi config thường cần restart để có hiệu lực; đây là bước chẩn đoán đơn giản, targeted nhất trước khi leo thang; A/C/D đều là phản ứng thái quá, không cần thiết cho vấn đề registration đơn giản này.</p>"},"options":[{"k":"A","t":{"en":"Disable every MCP server in the configuration to isolate the issue, removing all tool access rather than confirming whether the new server is registered."}},{"k":"B","t":{"en":"Verify the MCP server is registered using the listing command, then reconnect the session if needed, since configuration changes typically require a restart to take effect."}},{"k":"C","t":{"en":"Reinstall the developer's operating system from scratch, discarding all local configuration and tool state before attempting any targeted diagnostic steps."}},{"k":"D","t":{"en":"Switch the team to a different Claude product family unrelated to the existing workflow, abandoning the current configuration rather than diagnosing the registration issue."}}],"answer":["B"],"multi":false},{"id":"t1q79","n":79,"topic":1,"type":"mcq","stem":{"en":"You are identifying inefficiency in a Claude Code workflow where each engineer manually re-explains the project's conventions and architecture in every session. Which adjustment most directly removes this inefficiency?"},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Mỗi engineer phải giải thích lại conventions/architecture thủ công mỗi session trong Claude Code workflow — điều chỉnh nào loại bỏ trực tiếp sự kém hiệu quả này.</p><p><b>Đáp án: B.</b> Đưa conventions/architecture vào project-scoped CLAUDE.md (hoặc file persistent context tương đương) commit vào repo, để mỗi session tự động load — giải quyết tận gốc việc lặp lại thủ công; A/C là loại bỏ giá trị thay vì fix vấn đề, D chỉ giảm nhẹ chứ không loại bỏ được sự lặp lại.</p>"},"options":[{"k":"A","t":{"en":"Remove all documented project conventions and architectural standards so engineers have nothing to re- explain at session start, accepting the loss of consistency and shared coding standards."}},{"k":"B","t":{"en":"Capture the project's conventions and architecture in a project-scoped CLAUDE.md (or equivalent persistent project-context file) committed to the repository, so each session loads it automatically."}},{"k":"C","t":{"en":"Forbid the use of Claude Code on the project entirely to avoid the session-initialization overhead, accepting that the team loses all AI-assisted development productivity for this codebase."}},{"k":"D","t":{"en":"Tell each engineer to retype the project conventions and architecture context more quickly at the start of each session, reducing time lost without eliminating the repeated manual effort."}}],"answer":["B"],"multi":false},{"id":"t1q80","n":80,"topic":1,"type":"mcq","stem":{"en":"A Claude architect needs to ensure that a security-hardening flag cannot be disabled by any individual engineer after it is set. Which configuration scope correctly enforces this requirement?"},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Cần đảm bảo một security-hardening flag không thể bị bất kỳ engineer nào tắt sau khi đã set — scope cấu hình nào enforce đúng yêu cầu này.</p><p><b>Đáp án: A.</b> Managed configuration áp dụng tập trung và đánh dấu non-overridable — đây là cơ chế enforcement deterministic, engineer không thể ghi đè; C và D đều nằm ở scope engineer có thể sửa/override (project settings có thể edit trong repo, user scope hoàn toàn nằm dưới quyền engineer); B chỉ áp dụng trong CI/CD, không chặn được việc engineer tắt flag ở local session.</p>"},"options":[{"k":"A","t":{"en":"Managed configuration applied centrally and marked as non-overridable"}},{"k":"B","t":{"en":"Environment variable defined in the CI/CD pipeline only"}},{"k":"C","t":{"en":"Project scope (.claude/settings.json) committed to the repository"}},{"k":"D","t":{"en":"User scope (~/.claude/settings.json) on each engineer's machine"}}],"answer":["A"],"multi":false},{"id":"t1q81","n":81,"topic":1,"type":"yesno","stem":{"en":"You are a solution architect evaluating candidate use cases for a Claude-based program. For each scenario, select Yes if Claude is appropriate as the primary solution at the architectural level. Otherwise, select No."},"explain":{"text":"<p>Đánh dấu Có nếu Claude phù hợp làm giải pháp chính ở cấp kiến trúc, ngược lại chọn Không.</p><ul><li>Soạn bản đầu báo cáo điều tra từ incident log bán cấu trúc để analyst review — Có</li><li>Tính fraud score thời gian thực với latency dưới 50 ms trên streaming pipeline — Không</li><li>Review hợp đồng long-context, trích xuất clause có cấu trúc và đánh dấu deviation — Có</li><li>Thay thế vector index để semantic retrieval trên hàng triệu tài liệu — Không</li><li>Phân loại support ticket vào 30 category và giải thích lựa chọn — Có</li></ul>"},"rows":[{"t":{"en":"drafting first-pass investigative reports from semi-structured incident logs for analyst review"},"a":"Y"},{"t":{"en":"computing real-time fraud scores at sub-50-millisecond latency on a streaming pipeline"},"a":"N"},{"t":{"en":"long-context contract review with structured clause extraction and deviation flagging"},"a":"Y"},{"t":{"en":"replacing a vector index for semantic retrieval over a multi-million-document corpus"},"a":"N"},{"t":{"en":"routing inbound support tickets into 30 categories with reasoning for the chosen routing"},"a":"Y"}]},{"id":"t1q82","n":82,"topic":1,"type":"mcq","stem":{"en":"You are compiling factors that should drive the choice between Model Context Protocol (MCP), direct API integration, and agent-to-agent handoff. Which two factors belong on the list? (Select two.) Each correct answer presents a complete solution."},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Chọn 2 yếu tố nên dùng để quyết định giữa MCP, direct API integration, và agent-to-agent handoff.</p><p><b>Đáp án: A và D.</b> Bản chất interaction (stateless/latency-sensitive vs stateful/longer-running) quyết định pattern phù hợp (A); yêu cầu portability xuyên nhiều AI client trong ecosystem là lý do cốt lõi chọn MCP — chuẩn hóa interface (D); B/C là yếu tố về tài liệu/kinh nghiệm sẵn có, không phải tiêu chí kỹ thuật quyết định kiến trúc; E là thuộc tính triển khai/security chung, không phải yếu tố phân biệt giữa 3 pattern này.</p>"},"options":[{"k":"A","t":{"en":"Whether the interaction is stateless and latency-sensitive or stateful and longer-running."}},{"k":"B","t":{"en":"Whether the vendor publishes detailed reference documentation for each candidate protocol."}},{"k":"C","t":{"en":"Whether the team has prior implementation experience with any of the candidate protocols."}},{"k":"D","t":{"en":"Whether the integration must be portable across multiple AI clients in the ecosystem."}},{"k":"E","t":{"en":"Whether the underlying transport supports encryption in transit between the integrated services."}}],"answer":["A","D"],"multi":true},{"id":"t1q83","n":83,"topic":1,"type":"mcq","stem":{"en":"You are listing characteristics of robust guardrail design for an enterprise deployment. Which two characteristics belong on the list? (Select two.) Each correct answer presents a complete solution."},"explain":{"text":"<p>Đã kiểm tra</p><p><b>Tóm tắt câu hỏi:</b> Chọn 2 đặc điểm thuộc \"robust guardrail design\" cho enterprise deployment.</p><p><b>Đáp án: A và C.</b> Per-role tool allow-lists enforced ở orchestration layer trước khi tool call thực thi (A) là deterministic enforcement mechanism thực sự; adversarial-input coverage trong eval set kèm regression tracking (C) đảm bảo guardrail được kiểm chứng và không suy giảm theo thời gian; B/D/E đều là process hỗ trợ hữu ích (logging, feedback, prompt maintenance) nhưng không phải bản thân cơ chế guardrail robust.</p>"},"options":[{"k":"A","t":{"en":"Per-role tool allow-lists enforced at the orchestration layer before any tool call executes."}},{"k":"B","t":{"en":"Centralized log retention for guardrail violations with quarterly review by the security team."}},{"k":"C","t":{"en":"Adversarial-input coverage in the evaluation set with regression tracking on guardrail performance."}},{"k":"D","t":{"en":"User feedback channels that route reported guardrail failures into the product backlog for triage."}},{"k":"E","t":{"en":"Periodic refresh of the system prompt wording to keep refusal language current and clear."}}],"answer":["A","C"],"multi":true},{"id":"t1q84","n":84,"topic":1,"type":"mcq","stem":{"en":"A research summarization assistant has been deployed for six months. A user has flagged that a generated summary contained a fabricated citation. The product team has asked whether the incident requires architectural action or whether it is an isolated case. Which two Diligence-competency actions should you take? (Select two.) Each correct answer presents part of the solution."},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Assistant tóm tắt research bị flag lỗi fabricated citation sau 6 tháng vận hành — cần xác định 2 hành động \"Diligence-competency\" phù hợp để xem đây là isolated case hay cần architectural action.</p><p><b>Đáp án: B và D.</b> Review xem citation-grounding controls có tồn tại trong pipeline hiện tại không (B) và sample các summary gần đây để ước tính fabrication frequency trên toàn population (D) — đây là điều tra có hệ thống dựa trên bằng chứng; A là tuyên bố sai lệch (không kiểm chứng), C bỏ qua điều tra cần thiết, E là phản ứng thái quá không có phân tích chẩn đoán trước.</p>"},"options":[{"k":"A","t":{"en":"Communicate to users that the assistant does not fabricate output as a matter of design."}},{"k":"B","t":{"en":"Review whether citation-grounding controls exist anywhere in the current generation pipeline."}},{"k":"C","t":{"en":"Treat the incident as an anecdotal isolated case and take no further investigative action."}},{"k":"D","t":{"en":"Sample recent summaries to estimate the fabrication frequency across the population."}},{"k":"E","t":{"en":"Disable the assistant immediately for all current users without any prior diagnostic analysis."}}],"answer":["B","D"],"multi":true},{"id":"t1q85","n":85,"topic":1,"type":"mcq","stem":{"en":"You are diagnosing a Claude Code session whose subagent uses 50,000 tokens of context before the engineer types a single message. Which root cause is most likely?"},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Subagent trong Claude Code session dùng 50,000 token context ngay cả trước khi engineer gõ message đầu tiên — nguyên nhân gốc rễ khả dĩ nhất là gì.</p><p><b>Đáp án: D.</b> Nhiều MCP servers được config, mỗi server đóng góp tool definitions vào context budget; nếu Tool Search không được bật, tất cả definitions load ngay từ đầu (upfront) — đây chính là root cause hợp lý về mặt kỹ thuật; A/B/C đều không liên quan (keyboard, font rendering không ảnh hưởng token; model không có \"personal preferences\" tự tiêu tốn context).</p>"},"options":[{"k":"A","t":{"en":"The developer's keyboard layout or input-method configuration is the cause of the elevated context consumption, introducing extra tokens before the engineer types any message."}},{"k":"B","t":{"en":"The font rendering or display-scaling settings of the IDE are converting visual output into additional context tokens, causing the high pre-session context consumption."}},{"k":"C","t":{"en":"The model has internal personal preferences or default behaviors that silently consume large portions of context budget before any user message is processed, independent of tool configuration."}},{"k":"D","t":{"en":"Many MCP servers are configured, each contributing tool definitions to the context budget; Tool Search is not enabled, so all definitions load upfront."}}],"answer":["D"],"multi":false},{"id":"t1q86","n":86,"topic":1,"type":"mcq","stem":{"en":"You are an architect supporting the iteration phase of a deployed Claude-based system. Which activity most directly fits this phase?"},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Ở pha iteration của một deployed Claude-based system, hoạt động nào phù hợp trực tiếp nhất.</p><p><b>Đáp án: A.</b> Review production telemetry, sampled output evaluations, và stakeholder feedback để xác định thay đổi có impact cao nhất cho chu kỳ tiếp theo, sau đó plan thay đổi đó dựa trên evaluation framework — đây là vòng lặp iteration chuẩn dựa trên bằng chứng; B/C/D đều là hành động cực đoan sai (bỏ eval framework, rebuild toàn bộ mỗi lần, dừng đo lường sau go-live) đi ngược lại bản chất continuous iteration.</p>"},"options":[{"k":"A","t":{"en":"Review production telemetry, sampled output evaluations, and stakeholder feedback to identify the highest-impact change for the next cycle, then plan the change against the evaluation framework ."}},{"k":"B","t":{"en":"Discard the evaluation framework and reference set once the deployment is in production, accepting that future iterations will have no structured basis for measuring the impact of changes."}},{"k":"C","t":{"en":"Rebuild the entire system architecture from scratch at the start of every iteration cycle regardless of what production telemetry, evaluations, and stakeholder feedback indicate is needed."}},{"k":"D","t":{"en":"Stop measuring production outcomes once the deployment has successfully launched, treating the go- live milestone as the end of the evaluation and iteration cycle"}}],"answer":["A"],"multi":false},{"id":"t1q87","n":87,"topic":1,"type":"mcq","stem":{"en":"You are supporting an engineer whose Claude Code session reports a permission denial when the engineer expected the action to be allowed. Which resolution step is most appropriate?"},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Claude Code session báo permission denial ngoài dự đoán của engineer — bước xử lý nào phù hợp nhất.</p><p><b>Đáp án: A.</b> Kiểm tra các permission rules đang active trên tất cả scope (managed, command-line, local, project, user) để xác định rule nào đang deny action, rồi xác nhận rule đó nên được amend hay giữ nguyên deny — đây là chẩn đoán chính xác, targeted; B/C/D đều là phản ứng thái quá hoặc bỏ qua chẩn đoán (retry mù quáng, tắt toàn bộ permission system, cấp quyền unrestricted).</p>"},"options":[{"k":"A","t":{"en":"Inspect the active permission rules across all scopes-managed, command-line, local, project, and user-to identify which rule is denying the action and confirm whether it should be amended or remain denied."}},{"k":"B","t":{"en":"Tell the engineer to retry the denied action verbatim repeatedly until the denial stops appearing, without inspecting the active permission rules to determine whether the denial is intentional."}},{"k":"C","t":{"en":"Disable the permission system entirely across all scopes to remove the denial, eliminating all toolpattern and deny-rule controls rather than identifying and amending the specific rule."}},{"k":"D","t":{"en":"Grant the engineer unrestricted Bash access to bypass the specific rule causing the denial, removing all tool-pattern constraints rather than amending only the rule in question."}}],"answer":["A"],"multi":false},{"id":"t1q88","n":88,"topic":1,"type":"mcq","stem":{"en":"The engineering lead at Trenova Systems, Inc. is evaluating two proposals for improving developer workflows using Claude-assisted tooling. Proposal A adds Claude Code to the IDE for inline code generation and review. Proposal B routes all code-generation requests through a shared Slack bot without IDE integration. Which two observations most accurately evaluate these proposals against workflow-improvement objectives? (Select two.)"},"explain":{"text":"<p>Đã kiểm tra</p><p><b>Tóm tắt câu hỏi:</b> So sánh 2 proposal cải thiện developer workflow: A tích hợp Claude Code vào IDE, B route qua Slack bot không tích hợp IDE — chọn 2 nhận định đúng nhất đánh giá theo mục tiêu cải thiện workflow.</p><p><b>Đáp án: B và D.</b> Proposal B gây friction vì buộc developer phải rời IDE, đi ngược mục tiêu productivity (B); Proposal A giảm context switching vì cung cấp AI assistance ngay tại điểm phát triển code, không cần tool riêng (D); A sai vì async queue không đồng nghĩa velocity tốt hơn (thực ra gây chậm/friction), C sai vì integration point ảnh hưởng trực tiếp đến workflow dù model capability giống nhau, E sai vì auditability không phải mục tiêu chính ở đây và không bù đắp được friction.</p>"},"options":[{"k":"A","t":{"en":"Proposal B improves workflow velocity because Slack notifications create an asynchronous review queue."}},{"k":"B","t":{"en":"Proposal B introduces workflow friction by requiring developers to leave the IDE, undermining the productivity objective."}},{"k":"C","t":{"en":"Both proposals are equivalent because the model capabilities are identical regardless of the integration point."}},{"k":"D","t":{"en":"Proposal A reduces context switching by providing AI assistance at the point of development without requiring a separate tool."}},{"k":"E","t":{"en":"Proposal B is superior because centralizing requests in Slack creates an auditable log of all codegeneration activity."}}],"answer":["B","D"],"multi":true},{"id":"t1q89","n":89,"topic":1,"type":"mcq","stem":{"en":"You are producing an architecture guide for a new deployment and must complete the planning steps before drafting each section. Which two steps must be completed BEFORE drafting each section of the guide? (Select two.) Each correct answer presents part of the solution."},"explain":{"text":"<p>Đã kiểm tra</p><p><b>Tóm tắt câu hỏi:</b> Trước khi draft từng section của architecture guide, cần hoàn thành 2 bước planning nào.</p><p><b>Đáp án: A và B.</b> Xác định audience và câu hỏi guide phải trả lời cho audience đó (B) đi trước để định hướng nội dung; outline các section cần có (overview, components, contracts, flows, runbooks, limitations) (A) là bước cấu trúc trước khi viết chi tiết; C là quản trị document, D/E đều là bước xảy ra SAU khi đã draft (validate, translate).</p>"},"options":[{"k":"A","t":{"en":"Outline the guide sections covering the overview, components, contracts, flows, runbooks, and limitations."}},{"k":"B","t":{"en":"Identify the audience and the questions the guide must answer for that audience."}},{"k":"C","t":{"en":"Establish the document under version control with a defined review cadence and approver list."}},{"k":"D","t":{"en":"Validate the guide with the implementation team and incorporate corrections."}},{"k":"E","t":{"en":"Translate the guide into the supported regional languages for the candidate population."}}],"answer":["A","B"],"multi":true},{"id":"t1q90","n":90,"topic":1,"type":"mcq","stem":{"en":"You are a solution architect designing a Claude-based assistant with access to 60 internal tools across multiple business domains. Loading every tool definition on every request increases token usage and time to first response. Which design pattern best addresses this issue without sacrificing capability breadth?"},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Assistant có 60 internal tools, load hết mỗi request tốn token và tăng latency — pattern nào giải quyết tốt nhất mà không mất capability breadth.</p><p><b>Đáp án: C.</b> Progressive tool discovery — expose subset ban đầu đã curated, load thêm tool on-demand theo task (chính là cơ chế Tool Search tương tự Q90) — giữ được đầy đủ 60 tools khi cần nhưng không tốn token/latency mỗi request; A tốn thêm 1 model call không giải quyết gốc vấn đề, B giới hạn cứng làm mất capability breadth, D không giải quyết vấn đề mà còn chấp nhận chi phí cao hơn.</p>"},"options":[{"k":"A","t":{"en":"Use a separate model call to summarize all 60 tool definitions before each user turn."}},{"k":"B","t":{"en":"Hard-code a fixed set of five tools per request to reduce token usage, regardless of whether those tools are relevant to the current task."}},{"k":"C","t":{"en":"Apply progressive tool discovery so a curated initial subset is exposed and additional tools are loaded on demand based on the task."}},{"k":"D","t":{"en":"Increase the maximum context length and load all 60 tool definitions on every request, accepting the higher token cost and latency as necessary for full capability."}}],"answer":["C"],"multi":false},{"id":"t1q91","n":91,"topic":1,"type":"mcq","stem":{"en":"You are reviewing a peer's Claude Code permission rules for an enterprise rollout. The rules grant unrestricted Bash access to all projects across all developers. Which response is most appropriate?"},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Peer's Claude Code permission rules cấp unrestricted Bash access cho tất cả project/developer trong enterprise rollout — phản hồi nào phù hợp nhất.</p><p><b>Đáp án: B.</b> Thay unrestricted Bash bằng narrowly scoped tool patterns chỉ cho phép đúng command mà workflow cần, kèm explicit deny rules cho sensitive operations — đây là nguyên tắc least-privilege chuẩn; A/C/D đều làm attack surface tệ hơn (mở rộng thêm quyền, chấp nhận nguyên trạng, hoặc tắt hết permission system).</p>"},"options":[{"k":"A","t":{"en":"Add unrestricted access to additional tool categories as well, so that Bash is not asymmetrically more permissive than other tools, expanding the attack surface further in the name of consistency."}},{"k":"B","t":{"en":"Replace unrestricted Bash with narrowly scoped tool patterns that allow only the specific commands the workflows require, and add explicit deny rules for sensitive operations."}},{"k":"C","t":{"en":"Approve the unrestricted Bash access as written on the grounds that narrowing the rules would add configuration complexity, accepting the full attack surface for all engineers across all projects."}},{"k":"D","t":{"en":"Disable all permission rules for the enterprise rollout so every command across every project runs without any tool-pattern scoping or explicit deny rules for sensitive operations."}}],"answer":["B"],"multi":false},{"id":"t1q92","n":92,"topic":1,"type":"mcq","stem":{"en":"A managed agent deployment for claims triage has grown from 6 tools to 34 tools over 18 months as product teams added capabilities. Triage accuracy has declined from 91 percent to 78 percent, and average tool- selection latency has increased by 2.3 seconds. A junior engineer has proposed adding a tool-router agent in front of the current agent to filter the tool list per request. Which two findings should you present to justify capability decomposition before adding the router? (Select two.) Each correct answer presents part of the solution."},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Agent claims triage tăng từ 6 lên 34 tools, accuracy giảm từ 91% xuống 78%, latency tool-selection tăng 2.3s. Junior engineer đề xuất thêm tool-router agent. Chọn 2 finding cần trình bày để justify <b>capability decomposition</b> (chia nhỏ theo domain) thay vì chỉ thêm router.</p><p><b>Đáp án: B và C.</b> 34 tools phục vụ 4 domain claim-workflow riêng biệt (B) cho thấy nên decompose thành sub-agent theo domain thay vì router phẳng trên 1 tool set lớn; tool descriptions overlap giữa nhiều claim category (C) là nguyên nhân gốc gây nhầm lẫn tool-selection mà router đơn thuần không giải quyết triệt để; A/D/E là thông tin phụ hoặc liên quan đến đánh giá router (không phải lý do biện minh cho decomposition).</p>"},"options":[{"k":"A","t":{"en":"Several tools have not been invoked across the most recent 90 days of traffic."}},{"k":"B","t":{"en":"The 34 tools serve four distinct claim-workflow domains within the triage scope."}},{"k":"C","t":{"en":"Tool descriptions overlap across multiple claim categories within the agent's tool set."}},{"k":"D","t":{"en":"The router pattern is well documented across publicly available agent literature."}},{"k":"E","t":{"en":"The proposed router introduces an additional model call on every incoming request."}}],"answer":["B","C"],"multi":true},{"id":"t1q93","n":93,"topic":1,"type":"mcq","stem":{"en":"You are rolling out a standardized Claude Code configuration to an engineering team and must complete the planning steps before piloting the configuration. Which two steps must be completed BEFORE piloting the configuration with a small group of engineers? (Select two.) Each correct answer presents part of the solution."},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Trước khi pilot standardized Claude Code configuration với một nhóm nhỏ engineer, cần hoàn thành 2 bước planning nào.</p><p><b>Đáp án: C và E.</b> Xác định team workflows, security boundaries, và phân định decision nào thuộc managed configuration vs project scope (C) là bước phân tích nền tảng; định nghĩa project-scope baseline gồm MCP servers, permission rules, subagents (E) là bước thiết kế cụ thể cần có trước khi pilot; A/D là các bước xảy ra SAU pilot (dựa trên pilot findings), B là rollout toàn org — quá sớm, chưa qua pilot.</p>"},"options":[{"k":"A","t":{"en":"Iterate the configuration based on the pilot findings and stabilize the baseline before broader rollout."}},{"k":"B","t":{"en":"Onboard every engineer in the organization to the new configuration through mandatory training sessions."}},{"k":"C","t":{"en":"Identify the team workflows, security boundaries, and which decisions belong to managed configuration versus project scope."}},{"k":"D","t":{"en":"Roll out the stabilized configuration to additional teams with documentation and a defined support channel."}},{"k":"E","t":{"en":"Define the project-scope baseline covering Model Context Protocol (MCP) servers, permission rules, and subagents."}}],"answer":["C","E"],"multi":true},{"id":"t1q94","n":94,"topic":1,"type":"mcq","stem":{"en":"You are building an ethics-review checklist for deployments supported by artificial intelligence. Which two checks belong on the list? (Select two.) Each correct answer presents a complete solution."},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Chọn 2 check thuộc \"ethics-review checklist\" cho deployment AI-supported.</p><p><b>Đáp án: C và D.</b> Đảm bảo high-impact decisions vẫn giữ human accountability, không bị đổ trách nhiệm cho model (C); verify output không dựa trên generalization về con người mà data không hỗ trợ — tức tránh bias/stereotype không có căn cứ (D) — cả hai đều là mối quan tâm cốt lõi về ethics (accountability, fairness/bias); A là legal/licensing check, B giới hạn sai phạm vi review (ethics phải áp dụng rộng, không chỉ theo confidence threshold), E là performance/non-functional requirement, không thuộc ethics.</p>"},"options":[{"k":"A","t":{"en":"Confirm that vendor licensing terms permit the planned production use of the model."}},{"k":"B","t":{"en":"Restrict ethics review to outputs that exceed a defined model-confidence threshold."}},{"k":"C","t":{"en":"Confirm that high-impact decisions retain human accountability rather than being attributed to the model."}},{"k":"D","t":{"en":"Verify that outputs do not rely on generalizations about people that the underlying data does not support."}},{"k":"E","t":{"en":"Confirm that latency and throughput targets are met across supported user populations."}}],"answer":["C","D"],"multi":true},{"id":"t1q95","n":95,"topic":1,"type":"mcq","stem":{"en":"A pilot AI assistant for procurement specialists shows 89 percent first-response acceptance, but follow-up surveys reveal that specialists frequently override the assistant's vendor recommendations after considering criteria the assistant did not evaluate. The pilot owner wants to ship the assistant unchanged because of the strong acceptance rate. Which two Discernment-competency observations should you raise BEFORE approving the launch? (Select two.)"},"explain":{"text":"<p><b>Tóm tắt câu hỏi:</b> Pilot procurement assistant có 89% first-response acceptance, nhưng specialist thường override recommendation vì assistant bỏ sót tiêu chí. Pilot owner muốn ship nguyên trạng vì tỷ lệ acceptance cao. Chọn 2 quan sát \"Discernment-competency\" cần nêu trước khi approve launch.</p><p><b>Đáp án: B và C.</b> Các tiêu chí chưa được đánh giá thể hiện một scope gap trong input space của assistant (B) — chỉ ra thiếu sót thiết kế cụ thể cần fix; acceptance rate không chứng minh recommendation vẫn đúng sau khi specialist review/override (C) — chỉ ra metric hiện tại đo sai thứ cần đo (first-response acceptance ≠ corr
