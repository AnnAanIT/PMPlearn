rt agent's configuration. Each candidate tool falls into one of four categories: (1) required to complete defined tasks, (2) frequently used and reduces handoffs, (3) occasionally useful for unrelated work, (4) speculative future utility. Which categories should typically remain in the agent configuration?"},"explain":{"text":"<p>Đã kiểm tra</p><p><b>Tóm tắt vấn đề:</b> Xác định nhóm công cụ (tool categories) tối ưu cần giữ lại trong cấu hình của một Agent nhằm tránh lỗi dư thừa công cụ (<b>tool overscoping</b>), đảm bảo hiệu năng định tuyến (<b>routing accuracy</b>) và tối ưu hóa chi phí ngữ cảnh.</p><p><b>Giải pháp:</b><b>C. Categories 1 and 2 only, because they map to defined tasks and the agent's regular hand-offs.</b></p><ul><li><b>Keyword quan trọng:</b></li><ul><li><b>Least privilege &amp; Tool overscoping:</b> Theo nguyên lý kiến trúc Claude, việc cấp các công cụ thỉnh thoảng mới dùng cho công việc không liên quan (Category 3) hoặc chỉ mang tính dự phòng tương lai (Category 4) là một lỗi thiết kế nghiêm trọng về dư thừa quyền hạn (<b>tool overscoping</b>). Agent chỉ nên được cấu hình các công cụ thực sự cần thiết (Category 1) hoặc được sử dụng thường xuyên (Category 2) để phục vụ đúng vai trò hẹp của mình.</li><li><b>Routing accuracy:</b> Điểm tối ưu của một bảng đăng ký công cụ (tool registry) là từ <b>4–5 công cụ</b>. Nếu vượt quá ngưỡng này, độ chính xác khi định tuyến và chọn công cụ của mô hình sẽ giảm trung bình <b>~8% cho mỗi công cụ thêm vào</b> do các mô tả công cụ dễ bị chồng lấn.</li></ul></ul><p><i> </i>Loại trừ các phương án khác:* <b>A, B, D</b> đều đề xuất giữ lại nhóm công cụ 3 và 4. Việc nạp các công cụ dư thừa này vào cấu hình sẽ làm lãng phí token, tăng độ trễ (latency), làm loãng sự tập trung attention và trực tiếp kéo sụt hiệu năng suy luận của mô hình.</p><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D3_Integration.md</code></li><ul><li><b>Mục:</b> <b>1. Agentic Tool Design</b> (Mục 1.1 phân tích chi tiết về điểm tối ưu registry 4–5 tool và tác động giảm 8% hiệu năng định tuyến khi phình to công cụ).</li></ul><li><b>Tên file:</b> <code>CCA-P_D1_Solution_Design.md</code></li></ul><p><i> <b>Mục:</b> <b>4. Subagents</b> (Mục 4.2 giải thích nguyên lý phân quyền tối thiểu — </i>least privilege<i> và lỗi thiết kế </i>tool overscoping*).</p>"},"options":[{"k":"A","t":{"en":"Only category 4, because speculative future-utility tools provide the most flexibility and should be configured even when no defined task currently requires them."}},{"k":"B","t":{"en":"All four categories, because broader tool access is categorically better for agent performance regardless of whether the tools map to defined tasks or regular hand-offs."}},{"k":"C","t":{"en":"Categories 1 and 2 only, because they map to defined tasks and the agent's regular hand-offs."}},{"k":"D","t":{"en":"Only category 3, because occasionally useful tools for unrelated work provide broader coverage and should take priority over tools required for the agent's defined tasks."}}],"answer":["C"],"multi":false},{"id":"t1q25","n":25,"topic":1,"type":"mcq","stem":{"en":"A Claude architect is implementing safety controls for a customer-facing advice assistant that must never provide regulated investment recommendations. Which two guardrail implementations most directly enforce this constraint? (Select two.)"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Thiết lập các biện pháp kiểm soát an toàn (safety controls) để ngăn chặn trợ lý ảo cung cấp các khuyến nghị đầu tư có tính chất pháp lý (regulated investment recommendations) cho người dùng.</p><p><b>Giải pháp:A.</b> và <b>E.</b></p><ul><li><b>Keyword quan trọng:</b></li><ul><li><b>Capability boundaries &amp; Fixed refusal (A):</b> Định nghĩa rõ ranh giới năng lực trong system prompt bằng các danh mục nằm ngoài phạm vi (out-of-scope) kèm cụm từ từ chối cố định (fixed refusal phrasing) là biện pháp ngôn ngữ cấp cơ bản nhất để mô hình tự nhận diện và từ chối sinh nội dung vi phạm chính sách.</li><li><b>Output classifier (E):</b> Sử dụng bộ phân loại độc lập quét nội dung đầu ra (output classifier / harmlessness filter) là chốt chặn quan trọng nằm trong hệ thống phòng thủ chiều sâu (defense-in-depth), giúp phát hiện và ngăn chặn runtime các câu trả lời chứa từ ngữ khuyến nghị đầu tư trước khi chúng tiếp cận người dùng.</li></ul></ul><p><i> </i>Loại trừ các phương án khác:* <b>B</b> (chỉ giới hạn phiên chat, không ngăn được nội dung vi phạm phát sinh trong phiên); <b>C</b> (hậu kiểm SIEM hữu ích cho audit nhưng không ngăn chặn được trực tiếp tại runtime); <b>D</b> (tăng temperature làm tăng tính ngẫu nhiên và dễ gây lỗi hallucination hoặc bẻ lái prompt ngoài tầm kiểm soát).</p><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D5_Governance_Safety_Risk.md</code></li><ul><li><b>Mục:</b> <b>2. Guardrails &amp; Safe Deployment Practices</b> (Mục 2.1 và 2.3 về việc thiết lập hệ thống phòng thủ nhiều lớp bao gồm Input/Output screen và System prompt để đảm bảo an toàn vận hành).</li></ul><li><b>Tên file:</b> <code>CCA-P_D2_Models_Prompting_Context.md</code></li><ul><li><b>Mục:</b> <b>3. System Prompts &amp; Instructions</b> (Mục 3.1 và 3.3 về cách phân chia ranh giới năng lực và xử lý quy tắc từ chối trong prompt).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Define explicit out-of-scope categories in the system prompt with fixed refusal phrasing for investment advice requests."}},{"k":"B","t":{"en":"Limit session length to reduce the volume of queries processed per user per day."}},{"k":"C","t":{"en":"Log all user queries to a SIEM for post-hoc compliance review."}},{"k":"D","t":{"en":"Increase response temperature to introduce variability that reduces the likelihood of specific recommendations."}},{"k":"E","t":{"en":"Add an output classifier that detects and blocks responses containing regulated investmentrecommendation language."}}],"answer":["A","E"],"multi":true},{"id":"t1q26","n":26,"topic":1,"type":"mcq","stem":{"en":"The platform team at Trenova Systems, Inc. needs to reduce per-query cost and p95 latency for a high-volume Claude pipeline without degrading output quality on the core use case. Which two optimizations directly target both cost and latency simultaneously? (Select two.)"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Đánh giá và lựa chọn các giải pháp tối ưu hóa kiến trúc Claude nhằm giảm đồng thời cả chi phí (per-query cost) lẫn độ trễ (p95 latency) mà không làm suy giảm chất lượng đầu ra trên các trường hợp sử dụng cốt lõi.</p><p><b>Giải pháp:</b><b>B và D</b></p><ul><li><b>Keyword quan trọng:</b></li><ul><li><b>Prompt Caching (D):</b> Là đòn bẩy tối ưu hóa \"double-win\" hiếm hoi giúp cải thiện đồng thời cả hai trục <b>cost</b> và <b>latency</b>. Khi được kích hoạt trên phần prefix tĩnh (system-prompt, công cụ, ví dụ cố định), nó giúp <b>giảm tới ~90% chi phí</b> token đầu vào và <b>tăng tốc độ phản hồi TTFB nhanh hơn ~2 lần</b> cho các lượt gọi lặp lại.</li><li><b>Model Tier Routing (B):</b> Khớp đúng tier với đặc thù tác vụ (task) thay vì chạy một mô hình lớn duy nhất. Việc định tuyến các truy vấn đơn giản sang mô hình nhỏ hơn, nhanh hơn (như Haiku) và chỉ giữ mô hình lớn hơn (như Sonnet/Opus) cho các ca phức tạp giúp giảm mạnh chi phí lẫn thời gian xử lý trung bình của toàn hệ thống mà vẫn bảo toàn chất lượng xử lý.</li></ul></ul><p><i> </i>Loại trừ các phương án khác:* <b>A</b> (phình prompt bằng few-shot) và <b>C</b> (nhét toàn bộ corpus vào context) làm tăng mạnh số lượng token input đầu vào, trực tiếp kéo tăng chi phí và độ trễ xử lý; <b>E</b> (tăng <code>max_tokens</code>) chỉ là tăng giới hạn ngân sách con dành riêng cho output, không giúp tối ưu hóa chi phí hay thời gian phản hồi thực tế trên mỗi query.</p><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D3_Integration.md</code></li></ul><p><i> <b>Mục:</b> <b>6. Accuracy-Latency-Cost Tradeoff Analysis</b> (Mục 6.1 định nghĩa chi tiết các đòn bẩy tối ưu hóa, phân biệt đặc tính của </i>Prompt caching<i> giúp giảm cả cost/latency và </i>Model tier* giúp phân cấp tác vụ).</p><ul><li><b>Tên file:</b> <code>CCA-P_D2_Models_Prompting_Context.md</code></li><ul><li><b>Mục:</b> <b>5. Prompt Caching</b> (Mục 5.1 phân tích cơ chế giảm 90% chi phí và tăng tốc độ TTFB gấp 2 lần của cache).</li><li><b>Mục:</b> <b>2. Claude Model Selection &amp; Tradeoffs</b> (Mục 2.1 phân cấp năng lực, chi phí và độ trễ giữa các model tier để khớp đúng tác vụ).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Expand the system prompt to include additional few-shot examples on every request."}},{"k":"B","t":{"en":"Route straightforward query types to a smaller, faster Claude model and reserve the full model for complex cases."}},{"k":"C","t":{"en":"Add a retrieval step that fetches the full source corpus into the context window before generation."}},{"k":"D","t":{"en":"Enable prompt caching on the static system-prompt prefix to reduce billable input tokens on repeated calls."}},{"k":"E","t":{"en":"Increase max_tokens to reduce the frequency of truncated responses requiring follow-up calls."}}],"answer":["B","D"],"multi":true},{"id":"t1q27","n":27,"topic":1,"type":"mcq","stem":{"en":"A Claude-based research assistant begins producing responses that confidently contradict its retrieved source documents despite no change to the retrieval pipeline. Which two diagnostic actions most directly identify the root cause of this behavior? (Select two.)"},"explain":{"text":"<p><b>Lưu ý:</b> Nguồn không có đáp án tường minh cho câu này; đáp án C và D được suy luận theo quy trình chẩn đoán lỗi (kiểm tra cấu hình prompt và so sánh phiên bản model), khác với các hành động khắc phục (A, E) hoặc không liên quan (B).</p>"},"options":[{"k":"A","t":{"en":"Reduce the temperature setting to lower response variance across all query types."}},{"k":"B","t":{"en":"Increase the context-window size to allow more retrieved chunks per query."}},{"k":"C","t":{"en":"Inspect the system-prompt grounding instructions to determine whether citation constraints remain intact."}},{"k":"D","t":{"en":"Determine whether the failure reproduces on the previous model version to test for a model mismatch."}},{"k":"E","t":{"en":"Switch the retrieval index to a denser embedding model to improve chunk-relevance scores."}}],"answer":["C","D"],"multi":true},{"id":"t1q28","n":28,"topic":1,"type":"mcq","stem":{"en":"You are evaluating an evaluation set used to score a Claude-based hiring-support tool. The set is drawn from one geographic region and one tenure band. Which response is most appropriate?"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Đánh giá mức độ phù hợp và độ tin cậy của bộ dữ liệu kiểm thử (evaluation set) cho một công cụ hỗ trợ tuyển dụng sử dụng Claude khi bộ dữ liệu này bị giới hạn hẹp (chỉ lấy từ một khu vực địa lý và một nhóm thâm niên), dễ dẫn đến lỗi thiên vị (bias) và suy giảm khả năng tổng quát hóa (generalization failure) trong thực tế.</p><p><b>Giải pháp:A.</b></p><ul><li><b>Keyword quan trọng:</b></li><ul><li><b>Evaluation set coverage &amp; Overfitting</b>: Khi bộ dữ liệu kiểm thử quá hẹp, điểm số cao trên benchmark cố định chỉ phản ánh việc hệ thống bị <b>overfit</b> vào nhóm dữ liệu đặc thù đó chứ không đảm bảo chất lượng vận hành thực tế.</li><li><b>Demographic representation / Bias mitigation</b>: Đối với các tác vụ nhạy cảm như nhân sự, việc mở rộng tập eval để phủ đầy đủ các nhóm địa lý và thâm niên mà công cụ sẽ phục vụ là bắt buộc để đo lường chính xác hiệu năng và kiểm soát rủi ro định kiến/thiên vị (outcome disparity / disparate impact) trước khi đưa vào sản xuất.</li></ul></ul><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D4_Evaluation_Testing_Optimization.md</code></li><ul><li><b>Mục:</b> <b>1. Tool Evaluation &amp; Testing</b> (mục 1.4 về bẫy overfitting trên một suite cố định; mục 1.8 về giới hạn tự nhiên của suite cố định và bước 3 của lộ trình 8 bước xây dựng bộ task kiểm thử cân bằng).</li></ul><li><b>Tên file:</b> <code>CCA-P_D5_Governance_Safety_Risk.md</code></li><ul><li><b>Mục:</b> <b>5. Ethical AI (Bias, Fairness, Transparency)</b> (mục 5.4 về việc thiết lập các chỉ số giám sát kết quả thực nghiệm - outcome monitoring - qua các nhóm nhân khẩu học để đảm bảo tính công bằng).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Expand the evaluation set to cover the geographic regions and tenure bands the tool will serve, and rescore the system on the expanded set before broader release."}},{"k":"B","t":{"en":"Discard all quantitative evaluation and replace it with qualitative impressions collected from a small, convenience-selected group that may not represent the tool's full user population."}},{"k":"C","t":{"en":"Reduce the evaluation set further to a single demographic subgroup to simplify score interpretation, narrowing coverage rather than expanding it to match the intended user population."}},{"k":"D","t":{"en":"Continue using the narrow evaluation set drawn from one region and one tenure band because the existing benchmark scores are already high on that subset."}}],"answer":["A"],"multi":false},{"id":"t1q29","n":29,"topic":1,"type":"mcq","stem":{"en":"You are integrating human review into a high-volume classification pipeline where reviewing every output is infeasible. Which sampling strategy best balances throughput with quality oversight?"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Phương pháp lấy mẫu (sampling strategy) tối ưu để tích hợp sự kiểm duyệt của con người (human review) vào một pipeline phân loại khối lượng lớn (high-volume classification pipeline) nhằm cân bằng giữa throughput (hiệu suất xử lý) và chất lượng giám sát.</p><p><b>Giải pháp:</b><b>C. Risk-stratified sampling that reviews all low-confidence and high-impact outputs and a smaller random sample of high-confidence routine outputs.</b></p><ul><li><b>Keyword quan trọng:</b></li><ul><li><b>Risk-stratified sampling (Phân tầng rủi ro):</b> Đây là chiến lược tối ưu nhất để phân bổ nguồn lực kiểm duyệt có giới hạn của con người trong các hệ thống xử lý khối lượng lớn. Bằng cách tập trung nhân lực vào các đầu ra có rủi ro cao hoặc độ tin cậy thấp (high-impact / low-confidence), hệ thống đảm bảo các lỗi nghiêm trọng nhất luôn được con người kiểm soát (human-in-the-loop).</li><li><b>Random sample of high-confidence:</b> Việc kết hợp lấy mẫu ngẫu nhiên nhỏ đối với các ca thông thường giúp phát hiện hiện tượng \"trôi dạt\" chất lượng (silent degradation/drift) và cung cấp dữ liệu sạch để liên tục cập nhật bộ kiểm thử (eval suite). Cách tiếp cận nhiều lớp này hoạt động như mô hình \"bánh mỳ Thụy Sĩ\" (Swiss Cheese model) trong kiểm soát an toàn hệ thống.</li></ul></ul><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D5_Governance_Safety_Risk.md</code></li><ul><li><b>Mục:</b> <b>3. Human-in-the-Loop Escalation</b> (mục 3.7 về thiết kế các mẫu xử lý khác nhau cho batch workflow và mục 2.1 về mô hình xếp chồng 5 tầng guardrail để bảo vệ hệ thống).</li></ul><li><b>Tên file:</b> <code>CCA-P_D4_Evaluation_Testing_Optimization.md</code></li><ul><li><b>Mục:</b> <b>1.11 Bổ sung từ nguồn chính thống — lấp khoảng trống stub</b> (Phần mô tả \"Sáu phương pháp hiểu agent\" và mô hình Swiss Cheese trong việc kết hợp giám sát tự động với nghiên cứu/kiểm duyệt của con người).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"No sampling, relying entirely on user complaints to reveal quality and safety problems after they affect users."}},{"k":"B","t":{"en":"Universal review of every output regardless of confidence or throughput impact."}},{"k":"C","t":{"en":"Risk-stratified sampling that reviews all low-confidence and high-impact outputs and a smaller random sample of high-confidence routine outputs."}},{"k":"D","t":{"en":"Inverse sampling that reviews only high-confidence routine outputs and skips low-confidence and high- impact outputs."}}],"answer":["C"],"multi":false},{"id":"t1q30","n":30,"topic":1,"type":"mcq","stem":{"en":"You are assessing a Claude-based system whose dominant risk is silent quality drift on safetyrelevant outputs after a model-version upgrade. Which assessment activity most directly addresses this risk?"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Ngăn chặn rủi ro trôi dạt chất lượng âm thầm (silent quality drift) trên các đầu ra liên quan đến an toàn sau khi nâng cấp phiên bản mô hình (model-version upgrade).</p><p><b>Giải pháp:</b> <b>D.</b></p><ul><li><b>Keyword quan trọng:</b> <b>Adversarial evaluation set</b> và <b>regression eval</b>. Việc duy trì và chạy lại một tập kiểm thử đối kháng cố định đóng vai trò như một bộ lọc regression chuyên biệt giúp phát hiện các lỗi bảo mật hoặc trôi dạt chất lượng trước khi chính thức phê duyệt nâng cấp mô hình.</li></ul><p><i> </i>Loại trừ các đáp án khác:* Phương án A phá vỡ tính nhất quán của phép đo so sánh phiên bản; phương án B và C vi phạm quy tắc an toàn khi bỏ qua kiểm thử hoặc đẩy rủi ro phát hiện lỗi sang phía người dùng cuối ở production.</p><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D4_Evaluation_Testing_Optimization.md</code></li><ul><li><b>Mục:</b> <b>1.11 Bổ sung từ nguồn chính thống — lấp khoảng trống stub</b> (Phân tích cơ chế \"Capability eval vs Regression eval\" để liên tục chạy bắt chất lượng trôi dạt).</li></ul><li><b>Tên file:</b> <code>CCA-P_D5_Governance_Safety_Risk.md</code></li><ul><li><b>Mục:</b> <b>2. Guardrails &amp; Safe Deployment Practices</b> (Hệ thống phòng thủ nhiều lớp trước khi release thực tế).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Rotate adversarial inputs randomly so no two upgrades are scored on the same set."}},{"k":"B","t":{"en":"Skip evaluation on each model-version upgrade and rely on user-submitted complaints to surface safety drift after the upgraded model has already served production traffic."}},{"k":"C","t":{"en":"Disable adversarial evaluation entirely during model-version upgrade cycles to reduce evaluation cost, accepting that safety drift will go undetected until it appears in production."}},{"k":"D","t":{"en":"Maintain an adversarial evaluation set with version-attributed scoring so each upgrade is measured against the same set before promotion."}}],"answer":["D"],"multi":false},{"id":"t1q31","n":31,"topic":1,"type":"mcq","stem":{"en":"You are supporting an EU-based deployment with GDPR obligations. Which combination of measures best supports the deployment's GDPR posture?"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Thiết lập tổ hợp các biện pháp kỹ thuật và pháp lý tối ưu nhất để đáp ứng đầy đủ các nghĩa vụ tuân thủ GDPR khi triển khai giải pháp Claude tại thị trường Châu Âu.</p><p><b>Giải pháp:</b> <b>D. enterprise-tier deployment with a signed Data Processing Addendum, defined data-retention configuration, redaction of personal data not needed for the task, and documented data-subjectrights handling</b></p><ul><li><b>Keyword quan trọng:</b> <b>Enterprise-tier</b>, <b>Data Processing Addendum (DPA)</b>, <b>data minimization (redaction)</b> và <b>data-subject-rights</b>. Việc sử dụng tài khoản cấp doanh nghiệp có ký kết DPA là điều kiện bắt buộc để hợp pháp hóa luồng xử lý dữ liệu dưới chính sách GDPR. Đồng thời, các kiểm soát kỹ thuật như ẩn thông tin nhạy cảm không cần thiết (data minimization/redaction) và quy trình xử lý quyền của chủ thể dữ liệu đảm bảo hệ thống thực thi đúng nghĩa vụ tuân thủ trong thực tiễn.</li></ul><p><i> </i>Loại trừ các phương án khác:* <b>A</b> vi phạm trực tiếp nguyên tắc tối thiểu hóa dữ liệu khi đẩy toàn bộ thông tin cá nhân vào prompt; <b>B</b> cố tình tắt các cấu hình kiểm soát an toàn gây rủi ro pháp lý cực cao; <b>C</b> sử dụng tài khoản cá nhân (personal tier) không được thừa hưởng bất kỳ cam kết pháp lý (DPA) hay bộ chứng chỉ bảo mật doanh nghiệp nào từ Anthropic.</p><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D5_Governance_Safety_Risk.md</code></li><ul><li><b>Mục:</b> <b>4. Regulatory Compliance (GDPR / HIPAA / FedRAMP)</b> (Mục 4.1, 4.2 và 4.7 phân tích về cơ chế tuân thủ GDPR qua DPA, các lựa chọn data residency và giới hạn của consumer/personal plan đối với các bộ tiêu chuẩn tuân thủ).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"pasting full EU personal data into every prompt to \"give Claude complete context\" without considering purpose limitation, data minimization, or the organization's Data Processing Addendum obligations"}},{"k":"B","t":{"en":"disabling all data-retention configuration, redaction controls, and data-subject-rights handling to simplify day-to-day operations, accepting the resulting GDPR compliance exposure"}},{"k":"C","t":{"en":"using a personal Claude account tier for processing EU personal data at scale, with no signed Data Processing Addendum and no documented data-subject-rights handling procedure"}},{"k":"D","t":{"en":"enterprise-tier deployment with a signed Data Processing Addendum, defined data-retention configuration, redaction of personal data not needed for the task, and documented data-subjectrights handling"}}],"answer":["D"],"multi":false},{"id":"t1q32","n":32,"topic":1,"type":"mcq","stem":{"en":"You are compiling a diagnostic toolkit for Claude Code operational issues. Which two diagnostic actions belong in the toolkit? (Select two.) Each correct answer presents a complete solution."},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Xác định các hành động chẩn đoán (diagnostic actions) phù hợp nhất để đưa vào bộ công cụ xử lý sự cố vận hành của Claude Code nhằm cô lập nguyên nhân gốc rễ hiệu quả.</p><p><b>Giải pháp:</b> <b>B và E</b></p><ul><li><b>MCP server status inspection (B):</b> Claude Code phụ thuộc hoàn toàn vào các Model Context Protocol (MCP) server được cấu hình trong dự án thông qua <code>.mcp.json</code> hoặc <code>~/.claude.json</code>. Việc kiểm tra danh sách và trạng thái kết nối của các máy chủ này là bước đầu tiên để phát hiện lỗi mất kết nối hoặc lỗi khởi tạo công cụ.</li><li><b>Minimal reproduction (E):</b> Việc cô lập lỗi (origin isolation) bằng cách tạo một kịch bản tái lập tối thiểu và kiểm soát từng biến số một (như input prompt, tool schema, hoặc môi trường thực thi) là phương pháp thực nghiệm cốt lõi để xác định lỗi thuộc về tầng tích hợp (integration layer) hay tầng đầu ra của mô hình (model output).</li></ul><p><i> </i>Loại trừ các phương án khác:*</p><ul><li><b>A</b> sai vì việc lập tức rollback phiên bản Claude Code mà không qua chẩn đoán sơ bộ là hành động nóng vội và thiếu mẫn cán.</li><ul><li><b>C</b> sai vì quy trình chuẩn yêu cầu kỹ sư phải tự tái lập lỗi và thu thập minh chứng (như <code>request_id</code>) trước khi gửi ticket hỗ trợ cho nhà cung cấp.</li><li><b>D</b> sai vì tăng <code>temperature</code> sẽ làm tăng độ ngẫu nhiên của mô hình, khiến các lỗi chập chờn (intermittent issues) càng khó kiểm soát và khó phân tích một cách nhất quán.</li></ul></ul><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D3_Integration.md</code></li><ul><li><b>Mục:</b> <b>2. Model Context Protocol (MCP)</b> (Mục 2.3 hướng dẫn xử lý các tình huống vận hành chập chờn của MCP server và lỗi không nhận diện được tool của Claude Code).</li></ul><li><b>Tên file:</b> <code>CCA-P_D4_Evaluation_Testing_Optimization.md</code></li><ul><li><b>Mục:</b> <b>2. Debugging LLM System Failures</b> (Mục 2.1 và 2.2 hướng dẫn phương pháp cô lập lỗi - origin isolation theo tầng để lựa chọn chiến lược khắc phục phù hợp).</li></ul><li><b>Tên file:</b> <code>CCA-P_D7_Developer_Productivity.md</code></li><ul><li><b>Mục:</b> <b>1. Developer Productivity Agent</b> (Mục 1.9 về checklist bảo mật, vận hành và phân tích các hành vi của MCP server).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Roll back to the previous Claude Code version immediately to confirm whether the issue is version specific."}},{"k":"B","t":{"en":"List the configured Model Context Protocol (MCP) servers and inspect server status to identify connection failures."}},{"k":"C","t":{"en":"File a support ticket with vendor support before any local reproduction or evidence collection."}},{"k":"D","t":{"en":"Increase the model sampling temperature so that intermittent issues surface more frequently for analysis."}},{"k":"E","t":{"en":"Reproduce the issue with a minimal reproduction case that isolates one variable at a time."}}],"answer":["B","E"],"multi":true},{"id":"t1q33","n":33,"topic":1,"type":"yesno","stem":{"en":"You are auditing a procurement-assistant agent whose defined responsibility is to draft purchase requests for review. For each tool currently configured on the agent, select yes if the tool should remain after a leastprivilege audit. Otherwise, select no if it should be removed."},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Đánh giá cấu hình công cụ (tool registration) của một Agent hỗ trợ mua sắm (procurement assistant) theo nguyên tắc Quyền tối thiểu (least privilege) nhằm loại bỏ nguy cơ dư thừa quyền hạn (tool overscoping).</p><p><b>Giải pháp:</b></p><ul><li><b>Giữ lại (Yes):</b> Các công cụ phục vụ trực tiếp cho việc tra cứu thông tin phục vụ lập dự thảo (catalog lookup, policy lookup) và công cụ ghi dự thảo vào hàng chờ duyệt (draft-write) khớp chính xác với chức năng được giao của Agent.</li><li><b>Loại bỏ (No):</b> Công cụ gửi thư trực tiếp cho nhà cung cấp (inbox-send) vi phạm ranh giới trách nhiệm (Agent chỉ có quyền tạo dự thảo chờ duyệt chứ không có quyền gửi đi) và phá vỡ chốt chặn phê duyệt của con người. Công cụ quản trị cơ sở dữ liệu (production-DB admin) không liên quan đến nghiệp vụ mua sắm là lỗi dư thừa quyền hạn nghiêm trọng, làm phình rộng bề mặt tấn công (blast radius).</li></ul><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D1_Solution_Design.md</code></li><ul><li><b>Mục:</b> <b>4. Subagents</b> (Mục 4.2 \"Tool scoping — least privilege\" phân tích về việc giới hạn danh mục công cụ ở mức tối thiểu cho vai trò hẹp của subagent để tránh lỗi thiết kế).</li></ul><li><b>Tên file:</b> <code>CCA-P_D3_Integration.md</code></li><ul><li><b>Mục:</b> <b>5. Authentication &amp; Access Control for Agent Systems</b> (Mục 5.1 và 5.5 hướng dẫn thiết kế quyền hạn của Agent dựa trên nguyên lý quyền tối thiểu và đánh giá rủi ro trên toàn bộ bề mặt tính năng khả dụng).</li></ul></ul>"},"rows":[{"t":{"en":"a read-only catalog lookup tool that returns vendor and SKU information"},"a":"Y"},{"t":{"en":"an inbox-send tool that emails purchase requests to vendors directly"},"a":"N"},{"t":{"en":"a draft-write tool that creates purchase-request drafts in the review queue"},"a":"Y"},{"t":{"en":"a production-database admin tool unrelated to procurement"},"a":"N"},{"t":{"en":"A read-only policy-document tool that returns the relevant procurement policies"},"a":"Y"}]},{"id":"t1q34","n":34,"topic":1,"type":"mcq","stem":{"en":"A loan pre-qualification assistant shows 94 percent approval recommendations that match the human underwriter decision. The fairness team has reviewed approval rate parity across protected groups and reported no significant difference. A board member has asked whether this evidence is sufficient to declare the assistant fair. Which two Discernment-competency findings should you report? (Select two.) Each correct answer presents part of the solution."},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Đánh giá tính đầy đủ của các bằng chứng về độ công bằng (fairness) đối với một mô hình AI hỗ trợ xét duyệt khoản vay khi hệ thống đạt tỷ lệ khớp quyết định cao với con người và đạt cân bằng tỷ lệ duyệt giữa các nhóm.</p><p><b>Giải pháp:</b> <b>B.</b></p><ul><li><b>Keyword quan trọng:</b></li><ul><li><b>Underwriter-introduced bias (E):</b> Việc đạt tỷ lệ khớp 94% với con người chỉ chứng minh mô hình sao chép tốt hành vi của các chuyên gia, chứ không thể đảm bảo hệ thống không bị trôi dạt hoặc hấp thụ các định kiến/thiên vị lịch sử (historical bias) vốn có trong các quyết định xét duyệt của con người trước đây.</li><li><b>Error rate parity vs Approval rate parity (B):</b> Sự cân bằng về tỷ lệ được duyệt (approval rate parity) ở lớp bề mặt không đồng nghĩa với việc các sai số (như tỷ lệ từ chối nhầm - false negatives, hay duyệt nhầm - false positives) được phân phối công bằng giữa các nhóm được bảo vệ.</li></ul></ul><p><i> </i>Loại trừ:*</p><ul><ul><li><b>A</b> và <b>C</b> tự đưa ra những phỏng đoán thiếu căn cứ thực nghiệm về quy mô mẫu và sai sót của đội ngũ kiểm tra.</li><li><b>D</b> là nhận định sai lầm phổ biến khi coi tỷ lệ khớp cao với con người là minh chứng tuyệt đối cho một hệ thống công bằng.</li></ul></ul><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D5_Governance_Safety_Risk.md</code></li><ul><li><b>Mục:</b> <b>5. Ethical AI (Bias, Fairness, Transparency)</b> (Mục 5.4 và 5.6 phân tích việc thiết lập các cơ chế giám sát kết quả thực nghiệm - outcome monitoring - qua các nhóm nhân khẩu học để đánh giá thực chất tính công bằng thay vì chỉ dựa vào tính nhất quán bề mặt).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"A larger sample is needed before any meaningful fairness claim can be made about the model."}},{"k":"B","t":{"en":"Approval rate parity does not by itself assess error rate parity across protected groups."}},{"k":"C","t":{"en":"The fairness team's review process likely missed at least some of the protected groups studied."}},{"k":"D","t":{"en":"The 94 percent match rate is sufficient evidence of fairness for the assistant's decisions."}},{"k":"E","t":{"en":"Match with human underwriters does not establish freedom from underwriter-introduced bias."}}],"answer":["B","E"],"multi":true},{"id":"t1q35","n":35,"topic":1,"type":"mcq","stem":{"en":"You are integrating Claude Code into a workflow that runs against a production database. Which guardrail design most directly preserves safety on data-modifying operations?"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Thiết lập thiết kế guardrail tối ưu và an toàn nhất để kiểm soát các tác vụ can thiệp dữ liệu (data-modifying operations) khi tích hợp Claude Code vào cơ sở dữ liệu production.</p><p><b>Giải pháp:</b> <b>C.</b></p><p><b>Keyword quan trọng:</b> <b>Read-only by default</b>, <b>subagent scoping</b>, và <b>human confirmation (Human-in-the-loop / Diligence)</b>. Theo nguyên lý an toàn hệ thống của Anthropic, mọi kết nối đến tài nguyên hệ thống nhạy cảm đều phải tuân thủ nguyên tắc quyền tối thiểu (least privilege). Việc cấu hình mặc định là chỉ đọc, giới hạn công cụ của subagent và đặt chốt chặn bắt buộc con người click phê duyệt (Diligence gate) là cách trực tiếp nhất để ngăn chặn rủi ro làm hỏng dữ liệu ngoài ý muốn.</p><p><i> </i>Loại trừ các phương án khác:* <b>A</b> (tắt log/audit) phá hủy hoàn toàn khả năng giám sát hệ thống; <b>B</b> và <b>D</b> cấp quyền ghi trực tiếp và bỏ qua cổng kiểm duyệt của con người, mở rộng tối đa blast radius và vi phạm nghiêm trọng triết lý thiết kế an toàn của Anthropic.</p><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D5_Governance_Safety_Risk.md</code></li></ul><p><i> <b>Mục:</b> <b>2. Guardrails &amp; Safe Deployment Practices</b> (Mục 2.1 và 2.6 phân tích mô hình bảo mật xếp chồng của Claude Code gồm cơ chế </i>read-only by default<i>, phân quyền </i>always_ask<i> cho MCP và bắt buộc </i>human approval* cho các lệnh thay đổi trạng thái).</p><ul><li><b>Tên file:</b> <code>CCA-P_D7_Developer_Productivity.md</code></li></ul><p><i> <b>Mục:</b> <b>1. Developer Productivity Agent</b> (Mục 1.5 định nghĩa cổng phê duyệt </i>4D Framework<i> với bước </i>Diligence* bắt buộc con người xác nhận trước mọi thao tác mang tính chất thay đổi hoặc phá hủy).</p>"},"options":[{"k":"A","t":{"en":"Disable all logging and auditing on database operations through the MCP server to reduce alert noise, removing the observability needed to detect unintended data modifications."}},{"k":"B","t":{"en":"Allow Claude Code to write directly to the production database without subagent scoping, readonly credential defaults, or human confirmation gates on data-modifying operations."}},{"k":"C","t":{"en":"Configure the database MCP server with a read-only credential by default, restrict the subagent's tool list to read-only operations, and require explicit human confirmation on any operation that would modify data."}},{"k":"D","t":{"en":"Configure the database MCP server with a fully privileged credential that can perform any read or write operation, and allow all operations to proceed without explicit human confirmation."}}],"answer":["C"],"multi":false},{"id":"t1q36","n":36,"topic":1,"type":"mcq","stem":{"en":"You are running a controlled experiment to compare two prompts and must complete the design steps before executing the experiment. Which two steps must be completed BEFORE running the experiment with random assignment? (Select two.) Each correct answer presents part of the solution."},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Xác định các bước thiết kế thử nghiệm đối chứng (controlled experiment) bắt buộc phải hoàn thành <i>trước khi</i> thực thi thử nghiệm gán ngẫu nhiên (random assignment) để so sánh hai prompt.</p><p><b>Giải pháp:</b> <b>A và E</b></p><ul><li><b>A. Define the hypothesis and the primary success metric for the comparison.</b></li><li><b>E. Determine the minimum detectable effect size and the sample size needed for power.</b></li><li><b>Keyword quan trọng:</b></li></ul><ul><li><b>Hypothesis and success metric (A):</b> Việc xác định rõ giả thuyết và chỉ số thành công chính trước khi thử nghiệm giúp tránh bẫy tự ý thay đổi thước đo sau khi có kết quả (data-dredging/p-hacking) và đảm bảo tính khách quan của phép đo.</li><ul><li><b>Effect size and sample size for power (E):</b> Phân tích lực thống kê (statistical power analysis) nhằm tính toán cỡ mẫu cần thiết và kích thước hiệu ứng tối thiểu có thể phát hiện là bước chuẩn bị kỹ thuật bắt buộc để đảm bảo thử nghiệm có đủ dữ liệu đại diện và đem lại kết quả có ý nghĩa thống kê.</li></ul></ul><p><i> </i>Loại trừ các phương án khác:<i> <b>C</b> (phân tích kết quả) và <b>D</b> (ra quyết định nâng cấp/lặp lại) chỉ thực hiện </i>sau khi* đã thu thập xong dữ liệu thử nghiệm. <b>B</b> (ghi chép ADR về các đánh đổi và khuyến nghị lựa chọn) thuộc giai đoạn bàn giao và tổng kết hậu thử nghiệm.</p><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D4_Evaluation_Testing_Optimization.md</code></li><ul><li><b>Mục:</b> <b>1.11 Bổ sung từ nguồn chính thống — lấp khoảng trống stub</b> (Phần phân tích phương pháp \"A/B testing\" để đo lường thực tế đòi hỏi sự chuẩn bị kỹ lưỡng về thời gian và lưu lượng traffic đủ lớn).</li></ul><li><b>Tên file:</b> <code>CCA-P_D6_Stakeholder_Lifecycle.md</code></li><ul><li><b>Mục:</b> <b>2. Structured Stakeholder Discovery</b> (Mục 2.4 và 2.5 nhấn mạnh việc định nghĩa rõ các tiêu chí đo lường thành công định lượng trước khi chạy bất kỳ thử nghiệm hay pilot thực tế nào).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Define the hypothesis and the primary success metric for the comparison."}},{"k":"B","t":{"en":"Document the recommendation, the trade-offs accepted, and the alternatives considered."}},{"k":"C","t":{"en":"Analyze the results against the predefined success metric and significance threshold."}},{"k":"D","t":{"en":"Decide whether to promote, reject, or iterate the candidate based on the analysis."}},{"k":"E","t":{"en":"Determine the minimum detectable effect size and the sample size needed for power."}}],"answer":["A","E"],"multi":true},{"id":"t1q37","n":37,"topic":1,"type":"mcq","stem":{"en":"A security team is evaluating two proposed controls. Control A adds an outbound tool allowlist with destination restrictions and per-call review. Control B scores responses against a stable adversarial evaluation set after each model-version change. Which two risk categories are correctly matched to these controls? (Select two.)"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Khớp đúng các biện pháp kiểm soát an toàn kỹ thuật (safety controls) với các danh mục rủi ro hệ thống tương ứng (như rò rỉ dữ liệu và trôi dạt chất lượng) trong kiến trúc giải pháp Claude.</p><p><b>Giải pháp:</b><b>B. Control A - data exfiltration via outbound tool calls</b> và <b>C. Control B - silent quality drift after a model-version upgrade</b></p><ul><li><b>Keyword quan trọng:</b></li><ul><li><b>Control A &amp; Data exfiltration (B):</b> Việc thiết lập danh sách cho phép (outbound tool allowlist) giới hạn miền đích kết nối kèm cơ chế duyệt từng cuộc gọi (per-call review) là biện pháp deterministic trực tiếp nhất để ngăn chặn việc Agent bị bẻ lái gửi dữ liệu nhạy cảm ra ngoài hệ thống (<b>data exfiltration via outbound tool calls</b>).</li><li><b>Control B &amp; Silent quality drift (C):</b> Đánh giá đầu ra của mô hình dựa trên một bộ kiểm thử đối kháng cố định (<b>stable adversarial evaluation set</b>) sau mỗi lần đổi phiên bản là cách tối ưu để phát hiện sự suy thoái hiệu năng âm thầm (<b>silent quality drift</b>).</li></ul></ul><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D5_Governance_Safety_Risk.md</code></li></ul><p><i> <b>Mục:</b> <b>1. LLM System Risks &amp; Failure Modes</b> (Mục 1.1 định nghĩa các rủi ro hệ thống bao gồm </i>prompt injection<i>, </i>data exfiltration<i>, và </i>agentic misalignment*). <i> <b>Mục:</b> <b>2. Guardrails &amp; Safe Deployment Practices</b> (Mục 2.1 và 2.4 về thiết lập hệ thống phòng thủ nhiều lớp bao gồm </i>PreToolUse hook / outbound tool allowlist* chống rò rỉ dữ liệu).</p><ul><li><b>Tên file:</b> <code>CCA-P_D4_Evaluation_Testing_Optimization.md</code></li><ul><li><b>Mục:</b> <b>1.11 Bổ sung từ nguồn chính thống — lấp khoảng trống stub</b> (Phần \"Capability eval vs Regression eval\" hướng dẫn dùng tập regression kiểm thử cố định để bắt hiện tượng trôi dạt chất lượng sau nâng cấp).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Control B - data exfiltration via outbound tool calls"}},{"k":"B","t":{"en":"Control A - data exfiltration via outbound tool calls"}},{"k":"C","t":{"en":"Control B - silent quality drift after a model-version upgrade"}},{"k":"D","t":{"en":"Control A - silent quality drift after a model-version upgrade"}},{"k":"E","t":{"en":"Control A - prompt injection from adversarial content in retrieved data"}}],"answer":["B","C"],"multi":true},{"id":"t1q38","n":38,"topic":1,"type":"mcq","stem":{"en":"You are transitioning a Claude-based deployment from design into implementation. Which handoff package most directly supports a clean transition?"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Xác định cấu phần tối ưu của gói bàn giao (handoff package) để đảm bảo quá trình chuyển giao mượt mà một giải pháp dựa trên Claude từ giai đoạn thiết kế (design) sang triển khai thực tế (implementation).</p><p><b>Giải pháp:A.</b></p><ul><li><b>Keyword quan trọng:</b></li><ul><li><b>General handoff artifacts:</b> Một gói bàn giao chuẩn mực bắt buộc phải tích hợp đầy đủ cả sơ đồ kiến trúc (Architecture diagram), hồ sơ quyết định kiến trúc (ADRs), hợp đồng giao tiếp, khung kiểm thử tự động (eval suite) để định nghĩa thế nào là hệ thống \"chạy đúng\", cùng các tài liệu ứng phó sự cố (runbooks/playbooks).</li><li><b>Continuous sync contract:</b> Việc bàn giao hệ thống AI không chỉ là snapshot một lần mà là một cam kết đồng bộ liên tục do đặc thù hành vi mô hình và prompt sẽ liên tục trôi dạt theo thời gian. Việc thiếu đi các tài liệu này sẽ khiến đội ngũ triển khai không thể bảo vệ hệ thống trước lỗi regression hoặc lặp lại các sai lầm thiết kế đã từng bị bác bỏ trước đây.</li></ul></ul><p><i> </i>Loại trừ các phương án khác:* Phương án <b>B</b> (chỉ giao slide trình chiếu), <b>C</b> (chỉ ném mã nguồn trần) và <b>D</b> (chỉ nói chuyện bằng miệng) đều thiếu đi các tài liệu load-bearing và khung đánh giá (evaluation framework), khiến đội ngũ tiếp quản hoàn toàn \"mù\" trước các lỗi suy giảm chất lượng và các giới hạn vận hành của mô hình.</p><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D6_Stakeholder_Lifecycle.md</code></li></ul><ul><li><b>Mục:</b> <b>5. Architecture Documentation &amp; Implementation Handoff</b> (Mục 5.1 và 5.2 định nghĩa chi tiết về 5 \"general artifacts\" bắt buộc trong gói bàn giao của mọi hệ thống Claude).</li></ul>"},"options":[{"k":"A","t":{"en":"Architecture overview, ADRs, component contracts, evaluation framework with reference set, runbooks, on-call playbook, and known limitations."}},{"k":"B","t":{"en":"The most recent set of design presentation slides without component-level diagrams, interface contracts, an evaluation framework with a reference set, runbooks, or a known-limitations register."}},{"k":"C","t":{"en":"Source code alone with no integrating architecture overview, ADRs, component contracts, evaluation framework, runbooks, on-call playbook, or known-limitations register to support the delivery team."}},{"k":"D","t":{"en":"A verbal walkthrough conducted on the day of handoff with no written architecture overview, ADRs, component contracts, evaluation framework, runbooks, playbook, or known limitations."}}],"answer":["A"],"multi":false},{"id":"t1q39","n":39,"topic":1,"type":"dropdown","stem":{"en":"You are classifying chunking strategies by the corpus type each is best suited to. For each chunking strategy, select the appropriate corpus type: \"Long Structured Documents,\" \"Heterogeneous Short Records,\" or \"Code or Hierarchical Specifications.\""},"explain":{},"blanks":[{"label":{"en":"function-level or section-level chunking for code modules"},"opts":[{"en":"Code or Hierarchical Specs"},{"en":"Heterogeneous Short Records"},{"en":"Long Structured Documents"}],"a":0},{"label":{"en":"tree-aware chunking that follows code or specification hierarchy"},"opts":[{"en":"Code or Hierarchical Specs"},{"en":"Heterogeneous Short Records"},{"en":"Long Structured Documents"}],"a":0},{"label":{"en":"per-record chunking where each record is one chunk"},"opts":[{"en":"Code or Hierarchical Specs"},{"en":"Heterogeneous Short Records"},{"en":"Long Structured Documents"}],"a":1},{"label":{"en":"semantic chunking along clause or paragraph boundaries"},"opts":[{"en":"Code or Hierarchical Specs"},{"en":"Heterogeneous Short Records"},{"en":"Long Structured Documents"}],"a":2},{"label":{"en":"fixed-size chunking with overlap for short records of similar length"},"opts":[{"en":"Code or Hierarchical Specs"},{"en":"Heterogeneous Short Records"},{"en":"Long Structured Documents"}],"a":1},{"label":{"en":"hierarchical chunking that mirrors document section structure"},"opts":[{"en":"Code or Hierarchical Specs"},{"en":"Heterogeneous Short Records"},{"en":"Long Structured Documents"}],"a":2}]},{"id":"t1q40","n":40,"topic":1,"type":"mcq","stem":{"en":"You are building an evaluation pipeline for a Claude-based deployment and must complete the specification steps before running the deployment against the dataset. Which two steps must be completed BEFORE running the deployment against the evaluation dataset? (Select two.) Each correct answer presents part of the solution."},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Xác định các bước thiết lập cấu hình kiểm thử (specification steps) bắt buộc phải hoàn thành trước khi thực thi chạy đánh giá (evaluation) hệ thống Claude trên bộ dữ liệu kiểm thử.</p><p><b>Giải pháp:</b> <b>B và D</b>.</p><ul><li><b>Keyword quan trọng:</b> <b>Curate and label dataset</b> và <b>Define metrics and slices</b>. Để thiết lập một hệ thống kiểm thử tự động, việc định nghĩa các phân lớp kiểm thử (slices) bao phủ đầy đủ các trường hợp thông thường, biên và đối kháng, cùng việc chuẩn bị bộ dữ liệu chuẩn có gán nhãn vàng (ground-truth reference labels) là những bước đặc tả cấu hình bắt buộc phải hoàn tất trước khi tiến hành thực thi.</li></ul><p><i> </i>Loại trừ các phương án khác:* <b>C</b> (chấm điểm) và <b>E</b> (xuất dashboard) là các bước thực thi và hậu kiểm diễn ra trong/sau khi chạy thực tế; <b>A</b> (đánh giá ca lỗi cùng chuyên gia) thuộc pha tối ưu hóa lặp (iteration) dựa trên kết quả lỗi đã thu thập được sau khi chạy.</p><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D4_Evaluation_Testing_Optimization.md</code></li><ul><li><b>Mục:</b> <b>1.11 Bổ sung từ nguồn chính thống — lấp khoảng trống stub</b> (Phần lộ trình 8 bước xây dựng eval nhấn mạnh việc gán nhãn dữ liệu tham chiếu ở Bước 2 và thiết kế tập task cân bằng ở Bước 3 trước khi đưa vào vận hành hệ thống).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Review failure cases with subject matter experts to refine the scoring rubric."}},{"k":"B","t":{"en":"Curate and label the evaluation dataset to match the defined slices."}},{"k":"C","t":{"en":"Score the deployment outputs against the reference labels and aggregate the metrics."}},{"k":"D","t":{"en":"Define the metrics and slices the framework will report across representative, edge, and adversarial cases."}},{"k":"E","t":{"en":"Publish the aggregated metrics to a dashboard and gate releases on threshold checks."}}],"answer":["B","D"],"multi":true},{"id":"t1q41","n":41,"topic":1,"type":"mcq","stem":{"en":"You are selecting a model for a new production workload and must complete the upstream steps before testing candidate models empirically. Which two steps must be completed BEFORE running a representative sample on a candidate model? (Select two.) Each correct answer presents part of the solution."},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Xác định hai bước thượng nguồn (upstream steps) bắt buộc phải hoàn thành trước khi tiến hành chạy model cho production workload mới.</p><p><b>Giải pháp:</b><b>A. Choose a candidate model based on the requirements profile and known capabilities.</b>và<b>B. Define the quality bar, latency tolerance, and expected volume for the workload.</b></p><ul><li><b>Keyword quan trọng:</b></li><ul><li><b>Requirements profile &amp; Constraints (B):</b> Trước khi thử nghiệm bất kỳ mô hình nào, bạn bắt buộc phải định nghĩa rõ ràng các yêu cầu phi chức năng (NFR) bao gồm: ngưỡng chất lượng (accuracy/quality bar), dung sai trễ (latency tolerance), và tải trọng dự kiến (expected volume/cost ceiling). Đây chính là bộ lọc ranh giới để thu hẹp danh sách ứng viên.</li><li><b>Candidate model selection (A):</b> Dựa trên hồ sơ yêu cầu và năng lực lý thuyết đã biết của các dòng model (như Haiku cho việc đơn giản/khối lượng lớn, Sonnet làm mặc định, Opus cho tác vụ phức tạp/agentic), bạn lựa chọn mô hình ứng viên phù hợp nhất để đưa vào diện thử nghiệm thực nghiệm.</li></ul></ul><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D1_Solution_Design.md</code></li><ul><li><b>Mục:</b> <b>1.3 Constraints</b> (Mục 1.3 và 1.4 quy định việc thiết lập ranh giới chi phí, latency SLA, metric đo lường và phạm vi trước khi chọn mẫu thiết kế/thử nghiệm mô hình).</li></ul><li><b>Tên file:</b> <code>CCA-P_D2_Models_Prompting_Context.md</code></li><ul><li><b>Mục:</b> <b>2. Claude Model Selection &amp; Tradeoffs</b> (Mục 2.1 và 2.3 hướng dẫn khớp năng lực lý thuyết của từng tier model với hồ sơ tác vụ, và chạy benchmark thực nghiệm để lựa chọn model tối ưu nhất).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Choose a candidate model based on the requirements profile and known capabilities."}},{"k":"B","t":{"en":"Define the quality bar, latency tolerance, and expected volume for the workload."}},{"k":"C","t":{"en":"Select the lightest model that consistently meets the quality bar across the sample."}},{"k":"D","t":{"en":"Sign off the production rollout plan with the platform and security teams."}},{"k":"E","t":{"en":"Retest the model choice when a new model version becomes available."}}],"answer":["A","B"],"multi":true},{"id":"t1q42","n":42,"topic":1,"type":"mcq","stem":{"en":"You are configuring tool permissions for a Claude-based assistant. The assistant's defined responsibilities require read access to a knowledge base and write access to a draft queue, and nothing else. Which scoping design best applies least privilege?"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> <b>Cấu hình phân quyền công cụ (tool permissions) cho trợ lý ảo dựa trên Claude nhằm đảm bảo tuân thủ nguyên lý Quyền tối thiểu (least privilege) để thực thi đúng nhiệm vụ mà không gây dư thừa quyền hạn</b>.</p><p><b>Giải pháp:C.</b></p><ul><li><b>Keyword quan trọng:</b></li><ul><li><b>Least privilege &amp; Deterministic enforcement:</b> Việc giới hạn danh sách cho phép (allow-list) chính xác hai công cụ cần thiết (<code>read-knowledge-base</code> và <code>write-draft-queue</code>) được thực thi định tính (deterministic) bằng code tại tầng điều phối (orchestration layer) giúp loại bỏ hoàn toàn rủi ro dư thừa quyền hạn ( <b>tool overscoping</b> <b>), thay vì phó mặc cho mô hình tự quyết định dựa trên ngôn ngữ tự nhiên (probabilistic)</b>.</li></ul></ul><p><i> </i>Loại trừ các phương án khác:<b>*A</b> sai vì hoàn toàn dựa dẫm vào tính xác suất trong việc tự từ chối của mô hình (probabilistic), dễ bị tấn công qua prompt injection hoặc bẻ lái hành vi<b>. </b><b>B</b> sai vì tắt toàn bộ công cụ sẽ phá vỡ yêu cầu chức năng (functional requirements) cơ bản của trợ lý<b>. </b><b>D</b> vi phạm nghiêm trọng nguyên tắc quyền tối thiểu khi cấp quyền đọc toàn cục (global read permissions) cho mọi công cụ không liên quan đến tác vụ<b>.</b></p><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b><code>CCA-P_D1_Solution_Design.md</code></li></ul><p><i> <b>Mục:</b><b>4.2 Tool scoping — least privilege</b> (<b> Định nghĩa về rủi ro quá hạn quyền hạn - </b></i>tool overscoping* và quy tắc thiết kế danh mục công cụ tối thiểu cho từng vai trò chuyên biệt của subagent).</p><ul><li><b>Tên file:</b><code>CCA-P_D3_Integration.md</code></li><ul><li><b>Mục:</b><b>5. Authentication &amp; Access Control for Agent Systems</b> (<b> Hướng dẫn chi tiết về việc xây dựng hệ thống kiểm soát truy cập nhiều tầng và thực thi chính sách ở tầng orchestration thay vì trông đợi vào cấu hình mặc định của công cụ).</b></li></ul></ul>"},"options":[{"k":"A","t":{"en":"Allow access to every tool in the catalog and rely on the model to decline tools it should not use."}},{"k":"B","t":{"en":"Disable all tools entirely to achieve a minimal permission surface, accepting that the assistant can no longer perform the read-knowledge-base or write-draft-queue tasks it was designed for."}},{"k":"C","t":{"en":"Per-role allow-list of exactly the read-knowledge-base and write-draft-queue tools, enforced at the orchestration layer."}},{"k":"D","t":{"en":"Allow access to all tools with read permissions globally and restrict write permissions to the draftqueue tool, without scoping to only the specific tools required for defined tasks."}}],"answer":["C"],"multi":false},{"id":"t1q43","n":43,"topic":1,"type":"mcq","stem":{"en":"You are defining transparency practices for a customer-facing assistant whose responses are materially shaped by AI. Which transparency practice most directly supports responsible deployment?"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Xác định thực hành minh bạch (transparency practices) trực tiếp nhất đối với trợ lý ảo tương tác với khách hàng nhằm hỗ trợ quá trình triển khai AI có trách nhiệm (responsible deployment).</p><p><b>Giải pháp:</b> <b>B.</b></p><ul><li><b>Keyword quan trọng:</b> <b>Transparency disclosure</b> và <b>human-in-the-loop escalation</b>. Việc thông báo rõ ràng sự tham gia của AI cho người dùng cuối (end users) giúp đảm bảo quyền đồng thuận dựa trên thông tin (informed consent), đồng thời cung cấp một kênh chuyển giao có tài liệu hướng dẫn đến con người (documented human path) khi cần thiết là các nguyên tắc cốt lõi của tính minh bạch và độ tin cậy của hệ thống.</li></ul><p><i> </i>Loại trừ các phương án khác:* <b>A</b> và <b>D</b> vi phạm nghiêm trọng nguyên tắc trung thực và minh bạch khi cố tình cung cấp thông tin sai lệch hoặc che giấu sự hiện diện của AI đối với người dùng cuối. <b>C</b> từ chối giải trình hoàn toàn về sự can thiệp của AI, trực tiếp gây ra lỗi mất lòng tin (trust failure) từ phía khách hàng.</p><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D5_Governance_Safety_Risk.md</code></li><ul><li><b>Mục:</b> <b>5. Ethical AI (Bias, Fairness, Transparency)</b> (Mục 5.4 về cách thiết lập tính minh bạch thực chất ở tầng ứng dụng và vai trò của disclosure).</li><li><b>Mục:</b> <b>3. Human-in-the-Loop Escalation</b> (Mục 3.2 và 3.3 về việc thiết lập các cổng bàn giao và trigger escalation cho con người một cách rõ ràng).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Misrepresent the AI's role in producing responses in order to make the assistant feel more trustworthy or more human, undermining informed user consent and organizational transparency."}},{"k":"B","t":{"en":"Disclose AI involvement to end users in line with the organization's transparency policy and provide a documented path to reach a human when needed."}},{"k":"C","t":{"en":"Refuse to answer any user question about how the responses were produced or whether AI was involved, treating the AI's role as confidential operational information."}},{"k":"D","t":{"en":"Disclose AI involvement only to internal staff and operators while withholding that information from the end users whose interactions are materially shaped by the AI system."}}],"answer":["B"],"multi":false},{"id":"t1q44","n":44,"topic":1,"type":"mcq","stem":{"en":"A Claude architect observes that after a recent model-version upgrade, grounded responses began including claims not supported by the retrieved source documents. Which mitigation is most directly targeted at this failure mode?"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Khắc phục lỗi hệ thống sinh câu trả lời chứa thông tin không được hỗ trợ bởi tài liệu nguồn truy xuất (hallucing/grounding failure) sau khi nâng cấp phiên bản mô hình.</p><p><b>Giải pháp:</b> <b>B.</b></p><ul><li><b>Keyword quan trọng:</b> <b>Constrain responses</b>, <b>citations constraint</b>(Yêu cầu trích dẫn) và <b>verification step</b>. Để ngăn chặn triệt để lỗi mô hình bịa đặt thông tin ngoài nguồn (hallucination) mà không kích hoạt bất kỳ cảnh báo lỗi hệ thống nào, kiến trúc sư cần thiết lập các ràng buộc ép mô hình chỉ trả lời dựa trên nội dung nguồn, cưỡng chế sinh trích dẫn (citation) ở cấp độ cấu trúc schema để đảm bảo tính kiểm chứng, và bổ sung một bước xác thực tự động (verification step) để đối chiếu thông tin trước khi xuất kết quả.</li></ul><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D3_Integration.md</code></li></ul><p><i> <b>Mục:</b> <b>4. Long Document Processing</b> (Mục 4.1 và 4.6 hướng dẫn thiết lập </i>Citation tracker* bằng cách cưỡng chế schema <code>minItems: 1</code> để ngăn mô hình bịa đặt số trang hoặc tự diễn dịch nội dung nằm ngoài nguồn dữ liệu).</p><ul><li><b>Tên file:</b> <code>CCA-P_D2_Models_Prompting_Context.md</code></li></ul><p><i> <b>Mục:</b> <b>4. Prompt Engineering Techniques</b> (Mục 4.3 và 4.4 phân tích cơ chế </i>Anti-fabrication<i> và </i>Output anchoring* ở mức schema để bắt buộc mô hình cung cấp lối thoát trung thực và cố định cấu hình đầu ra thay vì chỉ sử dụng câu lệnh hướng dẫn bằng ngôn ngữ tự nhiên).</p>"},"options":[{"k":"A","t":{"en":"Treat retrieved data as untrusted and apply input classifiers at ingestion time."}},{"k":"B","t":{"en":"Constrain responses to source-supported content, require citations, and add a verification step."}},{"k":"C","t":{"en":"Replace the shared API key with per-user OAuth tokens to restrict data access."}},{"k":"D","t":{"en":"Score each new model version against a stable adversarial evaluation set."}}],"answer":["B"],"multi":false},{"id":"t1q45","n":45,"topic":1,"type":"mcq","stem":{"en":"A revenue projection assistant has missed its monthly cost target by 38 percent. Profiling shows three contributors: a 6,000-token policy preamble repeated on every call (45 percent of cost), retrieval of historical sales chunks averaging 3,000 tokens per call (30 percent), and inference on a flagship-tier model (25 percent). Stakeholders require that projection accuracy remain unchanged. Which two optimizations should you sequence first to reduce cost without affecting accuracy? (Select two.) Each correct answer presents part of the solution."},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Tối ưu hóa chi phí vận hành cho Agent dự phóng doanh thu mà không làm ảnh hưởng đến độ chính xác (accuracy) của kết quả đầu ra.</p><p><b>Giải pháp:</b> <b>D và E</b></p><ul><li><b>Keyword quan trọng:</b> <b>Prompt Caching</b>, <b>static prefix</b>, <b>accuracy-preserving optimization</b>.</li><ul><li><b>E</b> là tối ưu hóa hàng đầu vì phần chính sách mở đầu (policy preamble) dài 6,000 token là tĩnh và lặp lại trên mọi cuộc gọi (chiếm tới 45% chi phí), vượt xa ngưỡng tối thiểu (~1024 token) để cấu hình Prompt Caching hiệu quả. Việc cache phần này giảm tới 90% chi phí đọc (read rate = 0.1x) mà không làm thay đổi nội dung chỉ thị.</li><li><b>D</b> là bước tiếp theo vì các phân đoạn dữ liệu doanh thu lịch sử chung (common chunks) được truy vấn lặp lại nhiều lần trong ngày (chiếm 30% chi phí) cũng là đối tượng tối ưu để đặt các cache breakpoint, giúp tiết kiệm chi phí mà vẫn giữ nguyên vẹn thông tin đầu vào.</li></ul></ul><p><i> </i>Loại trừ các phương án khác:*</p><ul><ul><li><b>A</b> sai vì việc hạ cấp mô hình (smaller model tier) có rủi ro cao gây ra suy giảm hiệu năng/chất lượng dự phóng (accuracy regression), vi phạm ràng buộc giữ nguyên độ chính xác của stakeholders.</li><li><b>B</b> (cắt bớt preamble) và <b>C</b> (giảm số lượng chunks lấy về) đều can thiệp trực tiếp vào nội dung chỉ thị và dữ liệu lịch sử đầu vào, dễ dẫn đến hiện tượng thiếu thông tin và làm giảm độ chính xác dự báo.</li></ul></ul><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D2_Models_Prompting_Context.md</code></li><ul><li><b>Mục:</b> <b>5. Prompt Caching</b> (Phân tích chi tiết cơ chế hoạt động, lợi ích kinh tế giảm 90% chi phí của Prompt Caching đối với phần prefix tĩnh lặp lại và cách cấu hình tối ưu).</li><li><b>Mục:</b> <b>1. Context Window Management</b> (Mục 1.3 và 1.4 về rủi ro mất dữ kiện - summary loss - khi cố tình tóm tắt/cắt giảm ngữ cảnh quan trọng).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Switch the workload to a smaller, faster Claude model tier across all queries."}},{"k":"B","t":{"en":"Truncate the policy preamble to remove non-essential clauses from the prompt."}},{"k":"C","t":{"en":"Reduce the number of historical sales chunks retrieved across each query run."}},{"k":"D","t":{"en":"Cache common retrieved sales chunks accessed across many of the daily queries."}},{"k":"E","t":{"en":"Enable prompt caching on the static policy preamble across the recurring calls."}}],"answer":["D","E"],"multi":true},{"id":"t1q46","n":46,"topic":1,"type":"mcq","stem":{"en":"You are comparing patterns for a batch document-classification job that follows fixed steps: extract metadata, classify, summarize, and persist. Which pattern is the best fit and why?"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Lựa chọn mô hình thiết kế kiến trúc tối ưu (<b>Workflow vs. Agent</b>) cho một tác vụ xử lý và phân loại tài liệu hàng loạt (batch job) có chuỗi các bước thực thi tuần tự và cố định.</p><p><b>Giải pháp:</b> <b>B.</b></p><ul><li><b>Keyword quan trọng:</b> <b>Predefined code path</b>, <b>predictability</b> và <b>cost efficiency</b>.</li><li><b>Lý do chọn B:</b> Do quy trình công việc đã được xác định rõ ràng và cố định qua các bước (trích xuất -&gt; phân loại -&gt; tóm tắt -&gt; lưu trữ), việc điều phối qua một luồng mã cố định (<b>Workflow pattern</b>) do lập trình viên thiết lập sẵn là tối ưu nhất. Thiết kế này giúp kiểm soát chi phí token trên mỗi request một cách chính xác, giảm thiểu độ trễ, và dễ dàng đánh giá kiểm thử hiệu năng hơn so với thiết kế Agentic tự chủ.</li></ul><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D1_Solution_Design.md</code></li><ul><li><b>Mục:</b> <b>2. Workflow vs Agent: Choosing the Right Architecture</b> (Bảng so sánh 3 tầng tự chủ, ranh giới lựa chọn dựa trên tính dự đoán của tác vụ, và các bẫy thiết kế thường gặp).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"An agentic pattern, because agents are categorically more accurate than workflows and therefore always preferable regardless of step predictability."}},{"k":"B","t":{"en":"A workflow pattern, because the steps are well-defined and predictable per-request token cost is preferred over flexibility."}},{"k":"C","t":{"en":"A workflow pattern, because agentic patterns do not support tool invocations and therefore cannot execute the persist step that writes results to the downstream store."}},{"k":"D","t":{"en":"An agentic pattern, because the open-ended planning capability of agents produces more consistent structured outputs than a fixed workflow graph on classification tasks."}}],"answer":["B"],"multi":false},{"id":"t1q47","n":47,"topic":1,"type":"mcq","stem":{"en":"You are compiling team-setup practices for a Claude Code rollout across an engineering organization. Which two practices belong on the list? (Select two.) Each correct answer presents a complete solution."},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Xác định các thực hành thiết lập nhóm (team-setup practices) và quản trị phạm vi cấu hình (configuration scopes) tối ưu khi triển khai Claude Code trên quy mô tổ chức kỹ thuật.</p><p><b>Giải pháp:</b> <b>B và C</b>. <b>B. Apply managed configuration centrally for security-critical settings that must not be overridden by individual engineers.</b> và <b>C. Use project scope for team-shared Model Context Protocol (MCP) servers and permission rules under version control.</b></p><ul><li><b>Keyword quan trọng:</b></li><ul><li><b>Project scope / version control (C):</b> File cấu hình <code>.mcp.json</code> ở cấp độ dự án (project scope) là nơi lý tưởng để định nghĩa các MCP server và quy tắc phân quyền dùng chung cho cả đội ngũ. Khi đưa file này vào hệ thống kiểm soát phiên bản (git), mọi kỹ sư khi clone dự án về đều tự động nhận được cấu hình nhất quán.</li><li><b>Centrally managed configuration (B):</b> Đối với các thiết lập an toàn tối quan trọng (security-critical), việc áp dụng cấu hình quản lý tập trung từ phía tổ chức giúp ngăn chặn việc các kỹ sư riêng lẻ tự ý vô hiệu hóa hoặc ghi đè (override) các chốt chặn bảo mật.</li></ul></ul><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D3_Integration.md</code></li><ul><li><b>Mục:</b> <b>2. Model Context Protocol (MCP)</b> (Mục 2.1 về các cấp độ cấu hình <code>.mcp.json (project)</code> và <code>~/.claude.json (user)</code>; mục 2.3 về việc đồng bộ file cấu hình của team qua Git).</li></ul><li><b>Tên file:</b> <code>CCA-P_D6_Stakeholder_Lifecycle.md</code></li><ul><li><b>Mục:</b> <b>5. Architecture Documentation &amp; Implementation Handoff</b> (Mục 5.1 và 5.4 phân tích về cấu trúc thư mục cấu hình <code>.claude</code> và tệp cấu hình <code>settings.json</code> để chia sẻ tài nguyên đồng bộ cho nhóm).</li></ul><li><b>Tên file:</b> <code>CCA-P_D5_Governance_Safety_Risk.md</code></li><ul><li><b>Mục:</b> <b>2. Guardrails &amp; Safe Deployment Practices</b> (Mục 2.1 và 2.6 về mô hình bảo mật xếp chồng kiểm soát môi trường thực thi của kỹ sư).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Use local scope for security-critical permission rules so each engineer can adapt them to ongoing work."}},{"k":"B","t":{"en":"Apply managed configuration centrally for security-critical settings that must not be overridden by individual engineers."}},{"k":"C","t":{"en":"Use project scope for team-shared Model Context Protocol (MCP) servers and permission rules under version control."}},{"k":"D","t":{"en":"Use project scope for personal editor preferences so the preferences apply consistently within the project."}},{"k":"E","t":{"en":"Use user scope for team-shared MCP servers so every engineer on the team has consistent access."}}],"answer":["B","C"],"multi":true},{"id":"t1q48","n":48,"topic":1,"type":"mcq","stem":{"en":"You are selecting a protocol for a single low-latency stateless tool call from a Claude-based assistant to an internal pricing service that already exposes a stable HTTP API. Which integration mechanism is the most appropriate?"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Lựa chọn cơ chế tích hợp tối ưu cho một cuộc gọi công cụ đơn lẻ, phi trạng thái (stateless) và yêu cầu độ trễ thấp (low-latency) từ trợ lý ảo đến một dịch vụ định giá nội bộ sẵn có.</p><p><b>Giải pháp:</b>   <b>D. A direct API call to the existing endpoint with the appropriate scoped credentials.</b></p><ul><li><b>Keyword quan trọng:</b> <b>\"Phức tạp không tự biện minh cho chính nó\"</b>. Khi dịch vụ đích đã cung cấp một API HTTP ổn định, việc gọi trực tiếp đến API đó (direct API call) kết hợp với chứng chỉ phân quyền phù hợp (scoped credentials) là thiết kế tối giản, ít trễ, và tiết kiệm chi phí nhất để giải quyết bài toán.</li></ul><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D1_Solution_Design.md</code></li><ul><li><b>Mục:</b> <b>Nguyên lý xuyên suốt cả D1</b> (Nguyên lý lựa chọn phương án đơn giản, rẻ nhất thực sự thỏa mãn yêu cầu thay vì chọn các phương án phức tạp dư thừa).</li></ul><li><b>Tên file:</b> <code>CCA-P_D3_Integration.md</code></li><ul><li><b>Mục:</b> <b>5. Authentication &amp; Access Control for Agent Systems</b> (Quy tắc thiết kế an toàn hệ thống thông qua việc giới hạn phạm vi truy cập dữ liệu và phân quyền cụ thể cho từng tích hợp).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"A bespoke streaming protocol layered over an unrelated asynchronous message bus."}},{"k":"B","t":{"en":"An agent-to-agent handoff that introduces another Claude-based agent in front of the pricing service."}},{"k":"C","t":{"en":"A long-lived stateful session protocol for a stateless single-call interaction."}},{"k":"D","t":{"en":"A direct API call to the existing endpoint with the appropriate scoped credentials."}}],"answer":["D"],"multi":false},{"id":"t1q49","n":49,"topic":1,"type":"yesno","stem":{"en":"You are evaluating prompting claims in a peer's design document. For each claim, select yes if the claim reflects sound practice. Otherwise, select no."},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Đánh giá tính đúng đắn của các nhận định thiết kế câu lệnh (prompting claims) trong hệ thống tài liệu Claude.</p><ul><li>Zero-shot là baseline hợp lý cho closed-set classifier khi đã cung cấp đầy đủ label và ý nghĩa — Có</li><li>Few-shot example với đúng tên field là thực hành tốt cho structured extraction — Có</li><li>Chain-of-thought nên được dùng mặc định cho mọi tác vụ classification và extraction — Không</li><li>So sánh cân bằng theo tiêu chí rõ ràng giúp giảm leading-question bias — Có</li><li>Prompt đã dùng tốt với model cũ không cần regression evaluation khi chuyển model version — Không</li></ul>"},"rows":[{"t":{"en":"Zero-shot is appropriate as a starting point for closed-set classification when categories and descriptions are provided in the prompt"},"a":"Y"},{"t":{"en":"Adding a few-shot example set with exact field names anchors output formatting on extraction tasks"},"a":"Y"},{"t":{"en":"Chain-of-thought should be the default on every task regardless of complexity"},"a":"N"},{"t":{"en":"Leading-question framing is best mitigated by asking for an even-handed comparison with stated criteria"},"a":"Y"},{"t":{"en":"Behavioral differences across model versions can be ignored once a prompt has been validated on one version"},"a":"N"}]},{"id":"t1q50","n":50,"topic":1,"type":"mcq","stem":{"en":"You are compiling continuity practices that span the deployment lifecycle. Which two practices belong on the list? (Select two.) Each correct answer presents a complete solution."},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Xác định các thực hành duy trì tính liên tục (continuity practices) xuyên suốt vòng đời triển khai hệ thống Claude nhằm đảm bảo khả năng tối ưu hóa liên tục và quản trị tri thức hiệu quả qua các giai đoạn.</p><p><b>Giải pháp:</b> <b>C.</b> và <b>D.</b></p><ul><li><b>Keyword quan trọng:</b></li><ul><li><b>Evaluation framework continuity (C):</b> Việc kế thừa bộ khung đánh giá (eval suite) và tập dữ liệu tham chiếu (reference set) qua các chu kỳ lặp là bắt buộc để duy trì thước đo nhất quán. Nó cho phép các bộ kiểm thử năng lực (capability evals) \"tốt nghiệp\" thành các bộ kiểm thử hồi quy (regression evals) để liên tục phát hiện sự suy giảm chất lượng hoặc trôi dạt hành vi (drift) khi thay đổi prompt hoặc nâng cấp mô hình.</li><li><b>Iterative feedback loop (D):</b> Do bản chất của các giải pháp AI là thử nghiệm và lặp (iterative), việc ghi nhận các bài học kinh nghiệm (lessons learned) ở cuối mỗi pha để làm đầu vào cho pha tiếp theo giúp cải tiến giải pháp một cách có hệ thống, phản ánh đúng mô hình vòng lặp khép kín của Anthropic và AWS GLOE.</li></ul></ul><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D6_Stakeholder_Lifecycle.md</code></li><ul><li><b>Mục:</b> <b>1. AI Solution Lifecycle Management</b> (Mục 1.1 và 1.2 mô tả vòng lặp 5 pha của đề thi và các mô hình lifecycle của Anthropic/AWS GLOE để chuyển tiếp tri thức liên tục giữa các pha).</li><li><b>Mục:</b> <b>5. Architecture Documentation &amp; Implementation Handoff</b> (Mục 5.1 và 5.2 quy định việc đóng gói eval suite và prompt history như các \"general artifacts\" bắt buộc để chuyển giao làm mốc tham chiếu cho các chu kỳ sau).</li></ul><li><b>Tên file:</b> <code>CCA-P_D4_Evaluation_Testing_Optimization.md</code></li><ul><li><b>Mục:</b> <b>1.11 Bổ sung từ nguồn chính thống — lấp khoảng trống stub</b> (Phần phân tích \"Capability eval vs Regression eval\" hướng dẫn quy trình chuyển dịch và kế thừa bộ kiểm thử qua các giai đoạn trưởng thành của dự án).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Lock decisions made in early phases to prevent revisiting them as later phases begin."}},{"k":"B","t":{"en":"Maintain a stakeholder register and notify the listed parties at every phase transition event."}},{"k":"C","t":{"en":"Carry the evaluation framework and reference set forward across iterations rather than rebuilding each time."}},{"k":"D","t":{"en":"Capture lessons learned at the end of each phase and surface them as inputs to the next phase."}},{"k":"E","t":{"en":"Archive every phase deliverable in long-term storage to preserve a record of what was produced."}}],"answer":["C","D"],"multi":true},{"id":"t1q51","n":51,"topic":1,"type":"mcq","stem":{"en":"You are integrating AI-assisted tooling into the team's documentation workflow. The team wants generated documentation that stays grounded in the actual code. Which integration approach best fits this requirement?"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Xác định phương thức tích hợp tối ưu để xây dựng một trợ lý tự động sinh tài liệu kỹ thuật đảm bảo luôn bám sát mã nguồn thực tế (grounded in actual code) và tuân thủ quy trình kiểm soát chất lượng của tổ chức.</p><p><b>Giải pháp:</b> <b>B. Configure subagents that read the relevant code files via filesystem and code-search tools, generate the documentation, and emit changes through the team's normal review workflow.</b></p><ul><li><b>Keyword quan trọng:</b></li><ul><li><b>Grounded via filesystem/code-search (B):</b> Để tài liệu luôn phản ánh chính xác trạng thái thực thi hiện tại của dự án, các subagent bắt buộc phải được cấp quyền truy cập cục bộ (qua các công cụ hệ thống tệp và tìm kiếm mã nguồn) để đọc trực tiếp mã nguồn thay vì dựa vào kiến thức huấn luyện tĩnh (training-data recall).</li><li><b>Normal review workflow / Human-in-the-loop (B):</b> Theo khung phê duyệt an toàn <b>4D Framework</b> (đặc biệt là bước <b>Diligence</b>), mọi thay đổi do AI đề xuất đều phải đi qua hàng rào kiểm duyệt thông thường của con người (như Pull Request hoặc hệ thống review nội bộ) để ngăn chặn rủi ro tự động công bố nội dung sai lệch hoặc lỗi cấu trúc.</li></ul></ul><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D7_Developer_Productivity.md</code></li><ul><li><b>Mục:</b> <b>1. Developer Productivity Agent</b> (Mục 1.1, 1.3 về thiết kế subagent tài liệu <code>Doc-generator</code> và mục 1.5 về quy trình phê duyệt an toàn qua cổng kiểm duyệt con người <b>4D Framework</b>).</li></ul><li><b>Tên file:</b> <code>CCA-P_D5_Governance_Safety_Risk.md</code></li><ul><li><b>Mục:</b> <b>3. Human-in-the-Loop Escalation</b> (Mục 3.1 và 3.3 về việc thiết lập các cổng kiểm duyệt an toàn và quy trình phê duyệt deterministic thay vì để AI tự quyết hoàn toàn).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Generate documentation from the model's training-data recall without reading any of the actual repository code, accepting that the output will not reflect the current implementation."}},{"k":"B","t":{"en":"Configure subagents that read the relevant code files via filesystem and code-search tools, generate the documentation, and emit changes through the team's normal review workflow."}},{"k":"C","t":{"en":"Disable all filesystem and code-search tools so the subagents cannot read any repository code, accepting that documentation generation will be entirely disconnected from the actual implementation."}},{"k":"D","t":{"en":"Have the subagents publish generated documentation directly to the public-facing site without passing through the team's normal review workflow or any human approval step."}}],"answer":["B"],"multi":false},{"id":"t1q52","n":52,"topic":1,"type":"mcq","stem":{"en":"A solutions architect is analyzing stakeholder feedback collected after the first quarter of a Claude-powered procurement automation deployment. The feedback includes four statements: (1) \"Our procurement team is processing 3x more purchase orders per analyst per day.\" (2) \"We have eliminated the manual data entry role entirely and redeployed those staff to vendor relationship management.\" (3) \"The API integration costs are running 40% over the projected per-transaction budget.\" (4) \"Response latency during end-of-month batch runs is averaging 11 seconds, against our committed 5-second SLA.\" Which of the following correctly identifies the primary business value pillar each stakeholder statement represents?"},"explain":{"text":"<p><b>Lưu ý:</b> Đáp án suy ra từ bảng ánh xạ Statement→Pillar trong phần giải thích (khớp chính xác với phương án C).</p><ul><li><b>Efficiency (Statement 1):</b> Đo lường việc tối ưu hóa thời gian hoặc chi phí trên mỗi đơn vị công việc đang có (ở đây là số lượng đơn hàng được xử lý trên mỗi phân tích viên mỗi ngày)<b>.</b></li><li><b>Transformation (Statement 2):</b> Kiến tạo một năng lực vận hành mới chưa từng tồn tại trước đây bằng cách loại bỏ hoàn toàn quy trình nhập liệu thủ công để chuyển đổi nhân sự sang vai trò quản trị quan hệ nhà cung cấp<b>.</b></li><li><b>Solution Cost (Statement 3):</b> Giám sát việc chi tiêu thực tế của giải pháp tích hợp API so với ngân sách cam kết ban đầu<b>.</b></li><li><b>Performance SLA (Statement 4):</b> Chỉ số đo lường hiệu năng kỹ thuật cụ thể (độ trễ phản hồi latency) mà doanh nghiệp cam kết và phụ thuộc vào<b>.</b></li></ul><p><b>Keyword quan trọng:</b></p><ul><li><b>Efficiency (Quan sát 1 &amp; 4):</b> Việc giảm thời gian tóm tắt tài liệu trung bình từ 47 phút xuống 6 phút là cải thiện hiệu suất trực tiếp trên một đơn vị công việc đang có ( <b>efficiency gain</b> <b>)</b>. Ngược lại, việc luật sư phải dành thêm trung bình 8 phút để sửa các bản tóm tắt bị lỗi là một hao tổn hiệu suất ( <b>efficiency loss</b> <b>) làm giảm đi một phần lợi ích thời gian đã đạt được</b>.</li><li><b>Productivity (Quan sát 2):</b> Dù các cộng sự tốn ít thời gian làm tóm tắt hơn, tổng sản lượng thanh toán (overall billable output) vẫn chưa thay đổi thực tế, chứng tỏ giá trị về sản lượng/năng suất tổng thể ( <b>productivity</b> <b>) vẫn chưa được hiện thực hóa ở mức hệ thống</b>.</li><li><b>Solution Cost (Quan sát 3):</b> Việc chi phí hạ tầng tăng 22% do logic retry dư thừa tạo ra các cuộc gọi API phát sinh ngoài kế hoạch thuộc về vấn đề quản lý ngân sách vận hành của giải pháp ( <b>solution-cost issue</b> <b>)</b>.</li></ul>"},"options":[{"k":"A","t":{"en":"Statement 1: Efficiency; Statement 2: Productivity; Statement 3: Performance SLA; Statement 4: Solution Cost"}},{"k":"B","t":{"en":"Statement 1: Transformation; Statement 2: Productivity; Statement 3: Solution Cost; Statement 4: Efficiency"}},{"k":"C","t":{"en":"Statement 1: Efficiency; Statement 2: Transformation; Statement 3: Solution Cost; Statement 4: Performance SLA"}},{"k":"D","t":{"en":"Statement 1: Productivity; Statement 2: Efficiency; Statement 3: Solution Cost; Statement 4: Performance SLA"}}],"answer":["C"],"multi":false},{"id":"t1q53","n":53,"topic":1,"type":"mcq","stem":{"en":"A technical team is cataloguing risks specific to Claude's use in a document-grounded Q &amp; A system. Which two items represent failure modes intrinsic to LLM-based systems rather than generic software defects? (Select two.)"},"explain":{"text":"<p><b>Lưu ý:</b> Đáp án A và B suy ra từ phần \"Các phương án còn lại sai\": C, D, E bị loại trừ tường minh trong nguồn.</p><p>Tóm tắt vấn đề: Hai mục nào là failure mode mang tính nội tại của LLM thay vì generic software defect?</p><p><b>Keyword quan trọng:</b></p><ul><li><b>Hallucination</b>: Hiện tượng mô hình tự sinh ra câu trả lời nghe có vẻ hợp lý nhưng không có thực và không được hỗ trợ bởi tài liệu nguồn truy xuất. Đây là rủi ro nội tại về mặt xác suất của LLM chứ không phải lỗi logic phần mềm thông thường.</li><li><b>Overly broad safety pattern / Refusal</b>: Việc mô hình từ chối xử lý một truy vấn hợp lệ do các đặc trưng bề mặt của câu hỏi vô tình kích hoạt bộ lọc an toàn (false refusal/over-refusal). Hành vi này xảy ra ở cấp độ mô hình (trả về stop_reason: \"refusal\" với HTTP 200) chứ không phải lỗi crash hệ thống.</li></ul><p><b>Các phương án còn lại sai/không phù hợp: Các phương án </b> <b>C</b> <b>, </b> <b>D</b> <b>, </b><b>E</b> đều là các sự cố kỹ thuật phần mềm, mạng hoặc hạ tầng truyền thống (generic software/infrastructure defects) như lỗi timeout kết nối database, cấu hình sai load balancer, hoặc hết hạn chứng chỉ bảo mật TLS<b>.</b></p><p><b>Gợi ý tài liệu tham khảo:</b></p><p><b>Tên file: CCA-P_D5_Governance_Safety_Risk.md</b></p><p><b>Mục: 1. LLM System Risks &amp; Failure Modes (</b> Định nghĩa các rủi ro đặc thù của hệ thống LLM bao gồm <i>hallucination</i> và rủi ro tự chủ hành vi).</p><p><b>Tên file: CCA-P_D4_Evaluation_Testing_Optimization.md</b></p><p><b>Mục: 2. Debugging LLM System Failures (</b> Phân biệt lỗi ở tầng tích hợp phần mềm với các hành vi phản hồi của mô hình như <i>refusal</i> dưới dạng HTTP 200).</p>"},"options":[{"k":"A","t":{"en":"The model refuses a legitimate query because surface features trigger an overly broad safety pattern."}},{"k":"B","t":{"en":"The model generates a plausible-sounding answer unsupported by any retrieved document."}},{"k":"C","t":{"en":"A database connection timeout causes retrieval to return an empty result set."}},{"k":"D","t":{"en":"A misconfigured load balancer routes requests to a deprecated API version."}},{"k":"E","t":{"en":"An expired TLS certificate blocks outbound API calls to Claude."}}],"answer":["A","B"],"multi":true},{"id":"t1q54","n":54,"topic":1,"type":"mcq","stem":{"en":"You are defining an SLA for a Claude-based assistant. Which SLA definition is most operationally meaningful?"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Định nghĩa một cam kết chất lượng dịch vụ (SLA) có ý nghĩa vận hành thực tế và chặt chẽ nhất cho hệ thống dựa trên Claude.</p><p><b>Giải pháp:</b> <b>A. A measurable target with a defined metric, threshold, evaluation window, and consequence for breach- for example, \"p95 per-request latency under 800 ms over a 28-day window.\"</b></p><p><b>Keyword quan trọng:</b></p><ul><li><b>Measurable SLA components:</b> Một cam kết SLA có ý nghĩa vận hành thực tế bắt buộc phải cấu thành từ đầy đủ 4 yếu tố kỹ thuật rõ ràng:</li><ul><li>chỉ số đo lường cụ thể (<b>metric</b> - ví dụ: p95 latency)</li><li>ngưỡng kỹ thuật (<b>threshold</b> - ví dụ: dưới 800 ms)</li><li>
