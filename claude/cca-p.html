<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCA-P · Claude Certified Architect - Professional</title>
<meta name="description" content="Bộ đề luyện thi CCA-P.">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<script>
/* đặt theme trước khi vẽ để không nháy màu */
(function(){
  var th="dark";
  try{
    var d=JSON.parse(localStorage.getItem('examtrainer.CCA-P')||"{}");
    if(d.theme) th=d.theme;
    else if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches) th="light";
  }catch(e){}
  document.documentElement.setAttribute("data-theme",th);
})();
</script>
<style>
/* ============================================================
   Exam Trainer — bảng điều khiển + tờ đề in (tông ấm)
   ============================================================ */

:root{                      /* TỐI — mỗi màu chữ đều đo trên nền sáng nhất mà nó nằm lên */
  --shell:#171310;          /* khung ngoài            */
  --shell-2:#201A15;        /* cột trái / cột phải    */
  --shell-3:#2E251C;        /* nền nổi khi rê chuột   */
  --sunken:#100D0A;         /* ô nhập liệu — chìm     */
  --paper:#1C1712;          /* vùng đọc               */
  --paper-2:#252019;
  --ink:#F1EFEA;            /* ≥13.1:1 mọi nền        */
  --ink-2:#C6BCAA;          /* ≥ 8.0:1 — nhãn, chú thích */
  --ink-3:#ABA08B;          /* ≥ 5.8:1 — số đếm, gợi ý ô nhập */
  --rule:#3D3428;           /* kẻ trang trí           */
  --rule-2:#786853;         /* viền điều khiển ≥3:1   */
  --on-accent:#171310;      /* chữ nằm trên mảng màu đặc */
  --ok:#8FD98C;
  --ok-bg:rgba(143,217,140,.15);
  --bad:#FF9781;
  --bad-bg:rgba(255,151,129,.15);
  --flag:#F7C25A;
  --flag-bg:rgba(247,194,90,.17);
  --pick:#8ECBF0;
  --pick-bg:rgba(142,203,240,.15);
  --stamp:#FF9781;
  --focus:#F7C25A;
  --thumb:#5A4E3D;
  color-scheme:dark;
}
[data-theme="light"]{       /* SÁNG — cùng nguyên tắc, giấy ngà để bớt chói */
  --shell:#E9E3D5;
  --shell-2:#F2EDE2;
  --shell-3:#E7E1D2;
  --sunken:#FFFFFF;
  --paper:#FDFBF5;
  --paper-2:#F5F1E6;
  --ink:#201C16;            /* ≥13.0:1 */
  --ink-2:#463E35;          /* ≥ 8.0:1 */
  --ink-3:#5B5347;          /* ≥ 5.8:1 */
  --rule:#DED6C4;
  --rule-2:#8F8269;
  --on-accent:#FFFFFF;
  --ok:#256B42;
  --ok-bg:rgba(37,107,66,.10);
  --bad:#B32E1F;
  --bad-bg:rgba(179,46,31,.09);
  --flag:#7F5405;
  --flag-bg:rgba(127,84,5,.13);
  --pick:#175D91;
  --pick-bg:rgba(23,93,145,.09);
  --stamp:#B32E1F;
  --focus:#7F5405;
  --thumb:#B0A48D;
  color-scheme:light;
}
:root{
  --sans:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --top:52px;
  --gut:clamp(16px,1.8vw,26px);
  --pad:clamp(24px,2.6vw,46px);
  --perf:26px;
  --recpad:clamp(12px,1.2vw,20px);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
*{scrollbar-width:thin;scrollbar-color:var(--thumb) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent;border-left:1px solid var(--rule)}
::-webkit-scrollbar-thumb{background:var(--thumb);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
body{
  margin:0;background:var(--shell);color:var(--ink);
  font-family:var(--serif);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
b,strong{font-weight:600}
h1,h2,h3,h4{margin:0}
img{max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hide{display:none!important}
.grow{flex:1}

.lbl{
  font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-2);
}

/* ============================ TOP ============================ */
.top{
  position:sticky;top:0;z-index:60;height:var(--top);
  background:var(--shell-2);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:var(--gut);padding:0 var(--gut);
}
.mark{display:flex;align-items:baseline;gap:9px;flex:none}
.mark .w{font-family:var(--sans);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.mark .w em{font-style:normal;color:var(--stamp)}
.mark .s{font-family:var(--sans);font-size:12px;letter-spacing:.02em;color:var(--ink-2);white-space:nowrap}

.seg{display:flex;border:1px solid var(--rule-2);flex:none}
.seg button{
  background:transparent;border:0;border-right:1px solid var(--rule-2);
  font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-2);padding:6px 13px;cursor:pointer;line-height:1.45;
}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink);background:var(--shell-3)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-accent)}
.seg.mini button{padding:5px 9px;font-size:10px;letter-spacing:.1em}
.top .right{display:flex;gap:8px;align-items:center;flex:none}
.icb{
  background:transparent;border:1px solid var(--rule-2);color:var(--ink-2);
  width:29px;height:29px;display:grid;place-items:center;cursor:pointer;
  font-family:var(--sans);font-weight:700;font-size:12px;flex:none;
}
.icb:hover{color:var(--ink);border-color:var(--ink-3)}

/* ============================ GRID ============================ */
.app{
  display:grid;
  grid-template-columns:266px minmax(0,1fr) 304px;
  grid-template-areas:"rail main aside";
  align-items:stretch;min-height:calc(100vh - var(--top));
}
.rail{grid-area:rail;border-right:1px solid var(--rule);background:var(--shell-2)}
.main{grid-area:main;min-width:0;background:var(--paper);position:relative;min-height:calc(100vh - var(--top))}
.aside{grid-area:aside;border-left:1px solid var(--rule);background:var(--shell-2)}
.rail-in,.aside-in{
  position:sticky;top:var(--top);height:calc(100vh - var(--top));
  overflow-y:auto;overflow-x:hidden;padding:16px var(--gut) 40px;
}
@media(max-width:1319px){
  .app{grid-template-columns:244px minmax(0,1fr);grid-template-areas:"rail aside" "rail main";align-content:start}
  .aside{border-left:0;border-bottom:1px solid var(--rule)}
  .aside-in{position:static;height:auto;max-height:none;padding:12px var(--gut)}
  .aside .stack{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 26px;align-items:start}
}
@media(max-width:899px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"rail" "main" "aside"}
  .aside{border-top:1px solid var(--rule);border-bottom:0}
  .only-lg{display:none}
  .rail{border-right:0;border-bottom:1px solid var(--rule)}
  .rail-in{position:static;height:auto;max-height:none;padding:12px var(--gut) 18px}
  body:not(.rail-open) .rail-in{display:none}
  .rail-in .stack{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px 26px;align-items:start}
}
@media(min-width:900px){ .railtoggle{display:none} }
@media(max-width:899px){
  .top{height:auto;min-height:var(--top);flex-wrap:wrap;gap:8px 10px;padding:8px var(--gut)}
  .mark .s{display:none}
  .top .right{margin-left:auto}
  .seg button{padding:6px 9px;font-size:10px;letter-spacing:.07em}
  .seg.mini button{padding:5px 7px}
}
@media(max-width:640px){
  :root{--perf:14px}
  .paper::before,.paper::after{background-size:100% 20px}
}

/* ============================ CONTROLS ============================ */
.blk{margin-bottom:22px}
.blk > .lbl{display:block;margin-bottom:8px}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}

.fld{
  width:100%;background:var(--sunken);border:1px solid var(--rule-2);color:var(--ink);
  font-family:var(--serif);font-size:14.5px;padding:8px 10px;
}
.fld::placeholder{color:var(--ink-3);opacity:1}
.fld:focus{outline:none;border-color:var(--stamp);box-shadow:inset 0 0 0 1px var(--stamp)}

/* select tự vẽ — không dùng mũi tên mặc định của hệ điều hành */
.sel{position:relative;display:block}
.sel select{
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
  width:100%;background:var(--sunken);color:var(--ink);
  border:1px solid var(--rule-2);border-radius:0;
  padding:9px 42px 9px 12px;font-family:var(--mono);font-size:13.5px;line-height:1.35;
  cursor:pointer;
}
.sel select:hover{border-color:var(--ink-3)}
.sel select:focus{outline:none;border-color:var(--stamp);box-shadow:inset 0 0 0 1px var(--stamp)}
.sel .cap{
  position:absolute;top:1px;right:1px;bottom:1px;width:30px;
  border-left:1px solid var(--rule-2);background:var(--shell-3);
  display:grid;place-items:center;pointer-events:none;
}
.sel .cap::after{
  content:"";width:0;height:0;
  border-left:4.5px solid transparent;border-right:4.5px solid transparent;
  border-top:5.5px solid var(--ink-2);
}
.sel select:hover + .cap::after{border-top-color:var(--ink)}
.sel select:focus + .cap{background:var(--stamp);border-left-color:var(--stamp)}
.sel select:focus + .cap::after{border-top-color:var(--on-accent)}
.sel.on select{border-color:var(--pick);box-shadow:inset 0 0 0 1px var(--pick)}
.sel.on .cap{border-left-color:var(--pick)}

.tlist{display:grid;gap:1px}
.slist{display:grid;border-top:1px solid var(--rule)}
.srow{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:0;border-bottom:1px solid var(--rule);
  border-left:2px solid transparent;padding:8px 10px;
}
.srow:hover{background:var(--shell-3)}
.srow[aria-pressed="true"]{border-left-color:var(--stamp);background:var(--shell-3)}
.srow[aria-pressed="true"] .nm{color:var(--ink)}
.srow .dot{width:10px;height:10px;flex:none;position:relative;color:var(--ink-3)}
.srow[aria-pressed="true"] .dot{color:var(--ink)}
.srow .dot::before{content:"";position:absolute;inset:1px;border:1px solid currentColor}
.srow .dot.g{color:var(--ok)}   .srow .dot.g::before{background:currentColor}
.srow .dot.r{color:var(--bad)}  .srow .dot.r::before{background:currentColor}
.srow .dot.f{color:var(--flag)} .srow .dot.f::before{background:currentColor}
/* dấu hiệu của từng dạng câu, vẽ lại đúng hình dáng điều khiển tương ứng */
.srow .dot.m-mcq::before{box-shadow:inset 0 0 0 2px currentColor}
.srow .dot.m-yesno::before{border:0;background:linear-gradient(currentColor 0 34%,transparent 34% 66%,currentColor 66% 100%)}
.srow .dot.m-drop::before{border:0;background:currentColor;clip-path:polygon(0 22%,100% 22%,50% 86%)}
.srow .nm{flex:1;font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.03em;
  text-transform:uppercase;color:var(--ink-2)}
.srow .ct{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* nhóm nút dữ liệu — hàng đầy chiều rộng, thống nhất với các danh sách khác */
.vlist{display:grid;border-top:1px solid var(--rule)}
.vrow{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:0;border-bottom:1px solid var(--rule);padding:10px;
  font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);
}
.vrow:hover{background:var(--shell-3);color:var(--ink)}
.vrow svg{flex:none;width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7}
.vrow.danger{color:var(--bad)}
.vrow.danger:hover{background:var(--bad-bg)}
.trow{
  display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:center;
  background:transparent;border:0;border-left:2px solid transparent;
  padding:6px 8px;cursor:pointer;text-align:left;width:100%;min-width:0;
}
.trow:hover{background:var(--shell-3)}
.trow[aria-pressed="true"]{border-left-color:var(--stamp);background:var(--shell-3)}
.trow .nm{font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.trow .ct{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.meter{grid-column:1/-1;height:4px;background:var(--rule);display:flex;overflow:hidden}
.meter i{display:block;height:100%}
.meter .g{background:var(--ok)}
.meter .r{background:var(--bad)}

.act{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;background:transparent;color:var(--ink);
  border:1px solid var(--rule-2);padding:7px 13px;cursor:pointer;line-height:1.4;
}
.btn:hover{border-color:var(--ink);background:var(--shell-3)}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{border-color:var(--rule-2);background:transparent;color:var(--ink)}
.btn.solid{background:var(--ink);border-color:var(--ink);color:var(--on-accent)}
.btn.solid:hover:not(:disabled){filter:brightness(1.12)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{padding:5px 10px;font-size:10px}

/* ============================ ASIDE ============================ */
.kv{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:3px 0}
.kv span{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.kv b{font-family:var(--mono);font-size:12.5px;font-weight:600}
.bigbar{height:8px;border:1px solid var(--rule-2);display:flex;margin:6px 0;overflow:hidden}
.bigbar i{display:block;height:100%}
.queue{display:grid;gap:2px;max-height:270px;overflow:auto}
.qbtn{
  display:flex;gap:8px;align-items:baseline;background:transparent;border:0;
  border-left:2px solid var(--rule-2);padding:5px 8px;text-align:left;cursor:pointer;width:100%;min-width:0;
}
.qbtn:hover{background:var(--shell-3)}
.qbtn.is-wrong{border-left-color:var(--bad)}
.qbtn.is-flag{border-left-color:var(--flag)}
.qbtn .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);flex:none}
.qbtn .t{min-width:0;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.keys{display:grid;gap:3px}
.keyrow{display:flex;gap:8px;align-items:center;font-family:var(--serif);font-size:12.5px;color:var(--ink-2)}
kbd{
  font-family:var(--mono);font-size:10px;background:var(--shell-3);border:1px solid var(--rule-2);
  border-bottom-width:2px;padding:1px 5px;color:var(--ink);min-width:18px;text-align:center;
}

/* ============================ PAPER ============================ */
.paper{position:relative;padding:0 var(--perf);min-height:100%}
.paper::before,.paper::after{
  content:"";position:absolute;top:0;bottom:0;width:var(--perf);
  background:var(--paper-2);pointer-events:none;
}
.paper::before{left:0;border-right:1px solid var(--rule);box-shadow:inset -4px 0 0 -3px var(--rule)}
.paper::after{right:0;border-left:1px solid var(--rule);box-shadow:inset 4px 0 0 -3px var(--rule)}
.sheet{padding:0 var(--pad) 64px}

.head{padding:30px 0 18px;border-bottom:2px solid var(--ink);display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.head h2{font-family:var(--sans);font-weight:700;font-size:clamp(22px,2.6vw,34px);letter-spacing:-.01em;text-transform:uppercase;line-height:1}
.head p{font-family:var(--serif);font-size:14.5px;color:var(--ink-2);margin:8px 0 0;max-width:62ch}
.head .r{margin-left:auto;text-align:right}

.rec{
  border-bottom:1px solid var(--rule);
  padding:22px var(--recpad) 24px;margin:0 calc(-1 * var(--recpad));
  scroll-margin-top:calc(var(--top) + 12px);
}
.rec.cur{background:var(--paper-2);box-shadow:inset 3px 0 0 var(--stamp)}
.rec.cur .idx{color:var(--stamp)}
.rechead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px;max-width:86ch}
.idx{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.05em}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.flagbtn{
  flex:none;width:26px;height:24px;display:grid;place-items:center;cursor:pointer;
  background:transparent;border:1px solid var(--rule-2);color:var(--ink-2);
}
.flagbtn svg{width:12px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9}
.flagbtn:hover{color:var(--flag);border-color:var(--flag)}
.flagbtn[aria-pressed="true"]{color:var(--flag);border-color:var(--flag);background:var(--flag-bg)}
.flagbtn[aria-pressed="true"] svg{fill:currentColor}
.tag{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid var(--rule-2);color:var(--ink-2);padding:2px 6px;white-space:nowrap;
}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.bad{color:var(--bad);border-color:var(--bad)}
.tag.flag{color:var(--flag);border-color:var(--flag)}
.tag.multi{color:var(--pick);border-color:var(--pick)}

.stem{font-family:var(--mono);font-size:14.5px;line-height:1.62;margin:0;max-width:78ch}
.gloss{
  display:block;font-family:var(--serif);font-size:14.5px;line-height:1.6;
  color:var(--ink-2);max-width:74ch;margin:4px 0 0;
}
.qbody{margin-top:16px}
.qimg{display:block;margin:14px 0 4px;border:1px solid var(--rule-2);max-width:min(100%,620px);cursor:zoom-in}

/* --- phương án nhiều lựa chọn --- */
.opts{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-width:86ch}
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:transparent;border:1px solid transparent;color:var(--ink);
  padding:8px 10px;cursor:pointer;
}
.opt:hover{border-color:var(--rule-2)}
.opt .k{
  flex:none;width:22px;height:22px;display:grid;place-items:center;margin-top:1px;
  border:1px solid var(--rule-2);font-family:var(--mono);font-weight:600;font-size:11.5px;
}
.opt .tx{flex:1;min-width:0;font-family:var(--mono);font-size:13.5px;line-height:1.55}
.opt .tx .gloss{font-size:13.5px;margin-top:3px}
.opt .mk{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;white-space:nowrap;padding-top:5px;display:none;
}
.opt[data-pick="1"]{border-color:var(--pick);background:var(--pick-bg)}
.opt[data-pick="1"] .k{background:var(--pick);border-color:var(--pick);color:var(--on-accent)}
.opt[data-pick="1"] .mk-you{display:block;color:var(--pick)}
.rec[data-done="1"] .opt{cursor:default}
.rec[data-done="1"] .opt:hover{border-color:transparent}
.rec[data-done="1"] .opt[data-right="1"]{border-color:var(--ok);background:var(--ok-bg)}
.rec[data-done="1"] .opt[data-right="1"] .k{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.rec[data-done="1"] .opt[data-right="1"] .mk-ok{display:block;color:var(--ok)}
.rec[data-done="1"] .opt[data-right="1"] .mk-you{display:none}
.rec[data-done="1"] .opt[data-pick="1"][data-right="0"]{border-color:var(--bad);background:var(--bad-bg)}
.rec[data-done="1"] .opt[data-pick="1"][data-right="0"] .k{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}
.rec[data-done="1"] .opt[data-pick="1"][data-right="0"] .mk-you{display:block;color:var(--bad)}

/* --- dạng Có / Không theo dòng --- */
.ynlist{list-style:none;margin:0;padding:0;max-width:92ch;border-top:1px solid var(--rule)}
.yn{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:center;
  padding:12px 10px;border-bottom:1px solid var(--rule);
}
.yn .ynt{font-family:var(--mono);font-size:13.5px;line-height:1.55;min-width:0}
.yn .ynt .gloss{font-size:13.5px;margin-top:3px}
.ynb{display:flex;flex:none;border:1px solid var(--rule-2)}
.ynb button{
  background:transparent;border:0;border-right:1px solid var(--rule-2);
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-2);padding:6px 14px;cursor:pointer;min-width:64px;
}
.ynb button:last-child{border-right:0}
.ynb button:hover{background:var(--shell-3);color:var(--ink)}
.ynb button[aria-pressed="true"]{background:var(--pick);color:var(--on-accent)}
.rec[data-done="1"] .ynb button{cursor:default}
.rec[data-done="1"] .ynb button:hover{background:transparent;color:var(--ink-2)}
.rec[data-done="1"] .ynb button[aria-pressed="true"]{background:var(--bad);color:var(--on-accent)}
.rec[data-done="1"] .yn[data-right="1"] .ynb button[aria-pressed="true"]{background:var(--ok);color:var(--on-accent)}
.rec[data-done="1"] .yn[data-right="0"] .ynb button[data-correct="1"]{box-shadow:inset 0 0 0 2px var(--ok);color:var(--ok)}

/* --- dạng chọn từ danh sách --- */
.blanks{display:grid;gap:18px;max-width:78ch}
.blank .blabel{display:block;font-family:var(--mono);font-size:13px;line-height:1.55;margin-bottom:8px;color:var(--ink)}
.blank .blabel .gloss{font-size:13px;margin-top:3px}
.blank .ansline{
  font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  margin-top:7px;display:none;
}
.rec[data-done="1"] .blank[data-right="0"] .ansline{display:block}
.blank .ansline.ok{color:var(--ok)}
.blank .ansline.bad{color:var(--bad)}
.rec[data-done="1"] .sel select{pointer-events:none}
.rec[data-done="1"] .blank[data-right="1"] select{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.rec[data-done="1"] .blank[data-right="0"] select{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}

.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px;max-width:86ch}
.note{font-family:var(--serif);font-size:13.5px;color:var(--ink-2)}

/* --- khối đáp án --- */
.rev{display:none;margin-top:20px;border-top:1px solid var(--ink);padding-top:18px}
.rec[data-done="1"] .rev{display:block}
.revtop{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.stamp{
  border:2.5px solid var(--stamp);color:var(--stamp);padding:5px 13px 6px;
  transform:rotate(-2.2deg);box-shadow:inset 0 0 0 1px var(--stamp);
  display:flex;align-items:baseline;gap:10px;flex:none;max-width:100%;
}
.stamp .t{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.stamp .v{font-family:var(--sans);font-weight:700;font-size:26px;line-height:1;letter-spacing:.06em}
.stamp.txt .v{font-size:15px;letter-spacing:.02em;font-family:var(--mono);font-weight:600;line-height:1.35}
.verdict{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--bad)}
.conf{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid currentColor;padding:3px 8px;
}
.conf.h{color:var(--ok)}
.conf.m{color:var(--flag)}
.conf.l{color:var(--bad)}

.revgrid{display:grid;gap:20px 36px}
@media(min-width:1500px){ .revgrid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }
.sech{
  font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-2);display:flex;align-items:center;gap:10px;margin-bottom:8px;
}
.sech::after{content:"";flex:1;height:0;border-top:1px dotted var(--rule-2)}
.prose{font-family:var(--serif);font-size:15.5px;line-height:1.7;max-width:72ch;margin:0}
.prose b{box-shadow:inset 0 -2px 0 var(--flag)}
ul.elim{list-style:none;margin:0;padding:0;max-width:72ch}
ul.elim li{font-family:var(--serif);font-size:15px;line-height:1.65;padding-left:20px;position:relative;margin-bottom:6px}
ul.elim li::before{content:"\00D7";position:absolute;left:2px;top:-1px;font-family:var(--sans);font-weight:700;color:var(--bad);font-size:16px}
.cite{
  font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-top:16px;
  padding-top:10px;border-top:1px dotted var(--rule-2);max-width:78ch;word-break:break-word;
}
.notewrap{margin-top:20px;padding-top:16px;border-top:1px dotted var(--rule-2)}
.notewrap .lbl{display:block;margin-bottom:6px}
.notewrap textarea{
  display:block;width:100%;max-width:72ch;min-height:64px;resize:vertical;background:var(--sunken);
  border:1px solid var(--rule-2);color:var(--ink);font-family:var(--serif);font-size:14.5px;padding:9px 11px;
}
.notewrap textarea:focus{outline:none;border-color:var(--stamp)}

/* ============================ EXAM ============================ */
.panel{border:1px solid var(--rule-2);background:var(--paper-2);padding:24px var(--pad);margin-top:24px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px 24px;align-items:end}
.grid2 .lbl{min-height:15px}
.fldw{display:grid;gap:6px}
.timer{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:.06em}
.timer.low{color:var(--bad)}
.pal{display:flex;flex-wrap:wrap;gap:4px}
.pd{
  width:30px;height:28px;border:1px solid var(--rule-2);background:transparent;color:var(--ink-2);
  font-family:var(--mono);font-size:11px;cursor:pointer;position:relative;
}
.pd:hover{border-color:var(--ink-3);color:var(--ink)}
.pd.is-ans{border-color:var(--pick);color:var(--pick)}
.pd.is-flag::after{content:"";position:absolute;top:2px;right:2px;width:4px;height:4px;background:var(--flag)}
.pd.is-cur{background:var(--ink);border-color:var(--ink);color:var(--on-accent)}

.score{display:flex;gap:36px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .n b{font-family:var(--sans);font-weight:700;font-size:34px;line-height:1}
.ring .n span{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);letter-spacing:.1em;text-transform:uppercase}
.result-h{font-family:var(--sans);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase}
.result-h.ok{color:var(--ok)}
.result-h.bad{color:var(--flag)}
.figs{display:flex;gap:28px;flex-wrap:wrap;margin-top:12px}
.fig b{display:block;font-family:var(--mono);font-size:23px;font-weight:600}

/* ============================ TABLE ============================ */
.tw{overflow-x:auto;margin-top:12px}
.tw table{min-width:440px}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule)}
th{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);border-bottom-color:var(--rule-2)}
td:first-child{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.02em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.sbar{height:5px;background:var(--rule);display:flex;min-width:70px}
.sbar i{display:block;height:100%}

.empty{padding:64px 10px;text-align:center;font-family:var(--serif);font-size:14.5px;color:var(--ink-2)}
.empty b{display:block;font-family:var(--sans);font-size:18px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-bottom:8px}

/* ============================ OVERLAY ============================ */
.ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px}
.ov .box{background:var(--shell-2);border:1px solid var(--rule-2);max-width:520px;width:100%;padding:22px 24px;max-height:86vh;overflow:auto}
.ov h3{font-family:var(--sans);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.ov p{font-family:var(--serif);font-size:14.5px;color:var(--ink-2);margin:0 0 16px}
.ov.zoom{cursor:zoom-out}
.ov.zoom img{max-width:96vw;max-height:92vh;border:1px solid var(--rule-2)}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;
  background:var(--ink);color:var(--on-accent);font-family:var(--mono);font-size:12.5px;
  padding:9px 16px;border:1px solid var(--ink);
}

/* ============ RESPONSIVE OVERRIDES (phải nằm sau mọi component) ============ */
@media(max-width:640px){
  .yn{grid-template-columns:minmax(0,1fr);gap:12px}
  .ynb{justify-self:start}
  .ynb button{min-width:84px;padding:7px 16px}
  .stem,.opt .tx,.yn .ynt{font-size:13.5px}
  .revtop{gap:12px}
  .stamp{transform:none}
}

/* ============================ PRINT ============================ */
@media print{
  body{background:#fff;color:#000}
  .top,.rail,.aside,.bar,.notewrap,.ov,.toast{display:none!important}
  .app{display:block}
  .main{background:#fff}
  .paper{padding:0}
  .paper::before,.paper::after{display:none}
  .rec{break-inside:avoid;background:#fff!important}
  .rev{display:block!important}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

<script>

const DATA = {"meta":{"code":"CCA-P","title":{"en":"Claude Certified Architect - Professional"},"org":"Anthropic","pass":70},"topics":[{"n":1,"title":{"en":"CCA-P Practice","vi":"Luyện tập CCA-P"},"questions":[{"id":"t1q1","n":1,"topic":1,"type":"mcq","stem":{"en":"An operations engineer reports that a Claude-based pipeline began returning malformed JSON responses after a scheduled maintenance window, causing downstream processing failures. Which two investigative steps most directly isolate the root cause? (Select two.)"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Hệ thống trả về JSON sai cấu trúc (malformed JSON) sau khi bảo trì, gây lỗi cho hệ thống xử lý phía sau (downstream parsing failure).</p><p><b>Giải pháp:</b> <b>D</b> (Kiểm tra raw output của model bằng request cũ để cô lập lỗi giữa model và bộ phân tích phía sau) và <b>E</b> (So sánh cấu hình prompt/schema hiện tại với phiên bản hoạt động tốt trước bảo trì để tìm sự thay đổi cấu trúc).</p><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D4_Evaluation_Testing_Optimization.md</code>.</li><ul><li><b>Mục:</b> <b>2. Debugging LLM System Failures</b> (Phần quy trình triage 3 bước, phân biệt lỗi tầng Integration và tầng Model Output).</li></ul><li><b>Tên file:</b> <code>CCA-P_D2_Models_Prompting_Context.md</code>.</li><ul><li><b>Mục:</b> <b>3. System Prompts &amp; Instructions</b> (Phần thay đổi cấu trúc hệ thống và rủi ro cấu hình).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Switch to a different Claude model tier to rule out provider-side changes as a contributing factor."}},{"k":"B","t":{"en":"Increase the max_tokens limit to determine whether output truncation is causing incomplete JSON structures."}},{"k":"C","t":{"en":"Clear the prompt cache and resubmit all pending requests to eliminate stale cached prefixes."}},{"k":"D","t":{"en":"Replay a set of premaintenance requests against the current configuration and inspect the raw model output before downstream parsing."}},{"k":"E","t":{"en":"Compare the current system prompt and output schema configuration against the last known good version from before the maintenance window."}}],"answer":["D","E"],"multi":true},{"id":"t1q2","n":2,"topic":1,"type":"mcq","stem":{"en":"You are distinguishing functional from non-functional requirements during discovery. Which item is a non-functional requirement?"},"explain":{"text":"<p>Đã kiểm tra</p><p><b>Tóm tắt vấn đề:</b> Phân biệt giữa yêu cầu chức năng (Functional Requirement) và yêu cầu phi chức năng (Non-Functional Requirement - NFR) trong giai đoạn khảo sát và thiết kế giải pháp AI.</p><p><b>Giải pháp:</b> <b>A. The system must respond at p95 latency under 800 milliseconds at the expected request volume.</b></p><ul><li><b>Keyword quan trọng:</b> <b>Latency</b> (độ trễ dưới 800ms) và <b>Request volume</b> (hiệu năng xử lý tải) là các yêu cầu phi chức năng/ràng buộc (NFRs/Constraints) điển hình.</li><li>Các phương án B, C, D đều mô tả trực tiếp hệ thống phải làm gì (phân loại, trích xuất dữ liệu, tạo bản nháp), tức là các yêu cầu chức năng (Functional Requirements).</li></ul><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b><code>CCA-P_D1_Solution_Design.md</code></li><ul><li><b>Mục:</b> <b>1. Translating Business Requirements into Claude Solutions</b> (mục 1.1 và 1.3 phân biệt rõ \"Functional requirements\" - việc hệ thống làm và \"Constraints\" - ràng buộc phi chức năng như Latency SLA).</li></ul><li><b>Tên file:</b><code>CCA-P_D6_Stakeholder_Lifecycle.md</code></li><ul><li><b>Mục:</b> <b>2. Structured Stakeholder Discovery</b> (mục 2.5 định nghĩa các NFR cần thu thập gồm Latency, Cost ceiling, Accuracy threshold) và <b>4. Stakeholder Feedback Loops &amp; SLA Alignment</b>.</li></ul></ul>"},"options":[{"k":"A","t":{"en":"The system must respond at p95 latency under 800 milliseconds at the expected request volume."}},{"k":"B","t":{"en":"The system must produce a draft response that a human reviewer can edit before sending."}},{"k":"C","t":{"en":"The system must classify inbound tickets into a defined set of categories."}},{"k":"D","t":{"en":"The system must extract a defined set of specific fields from invoice attachments and populate a downstream data record."}}],"answer":["A"],"multi":false},{"id":"t1q3","n":3,"topic":1,"type":"mcq","stem":{"en":"You are selecting a pattern for a compliance Q &amp; A assistant that must answer policy questions with citations to the authoritative internal source set. Latency, cost, and audit predictability are prioritized. Which pattern is the best fit?"},"explain":{"text":"<p><b>Lưu ý:</b> Đáp án suy ra từ văn bản giải pháp khớp với nội dung phương án A (không có ký hiệu chữ cái tường minh trong nguồn).</p><p><b>Tóm tắt vấn đề:</b> Lựa chọn mẫu thiết kế tối ưu cho trợ lý Q&amp;A tuân thủ chính sách nội bộ (yêu cầu trích dẫn nguồn), ưu tiên tối đa ba yếu tố: chi phí (cost), độ trễ (latency), và tính dự đoán được để kiểm toán (audit predictability).</p><p><b>Giải pháp:</b> Chọn <b>Augmented LLM (RAG)</b> kết hợp kết xuất trích dẫn trên tập dữ liệu nội bộ được lập chỉ mục.</p><ul><li><b>Keywords:</b> Phân tầng có tính dự đoán cao nhất (highest predictability), nhanh nhất, rẻ nhất và không có lớp điều phối (no orchestration layer). Cưỡng chế trích dẫn tất định bằng cấu trúc schema (<code>minItems: 1</code>) thay vì prompt ngôn ngữ tự nhiên.</li></ul><p><b>Gợi ý:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D1_Solution_Design.md</code></li><ul><li><b>Mục:</b> <b>2. Workflow vs Agent: Choosing the Right Architecture</b> (Bảng \"Ba tầng tự chủ\" và \"Decision tree\" bước 1).</li></ul><li><b>Tên file:</b> <code>CCA-P_D3_Integration.md</code></li><ul><li><b>Mục:</b> <b>4. Long Document Processing</b> (Mục 4.1 sơ đồ thành phần \"Citation tracker\" và mục 4.6 \"Citation — cưỡng chế bằng schema\").</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Augmented LLM with retrieval-augmented generation over the indexed authoritative corpus and citation rendering on each answer."}},{"k":"B","t":{"en":"A pure agent loop with open web-browsing tools to surface the most current policy information, without constraining retrieval to the authoritative internal corpus."}},{"k":"C","t":{"en":"A static prompt with the entire policy corpus concatenated into every request."}},{"k":"D","t":{"en":"Multi-agent orchestration with a planner, researcher, and writer agent for every query."}}],"answer":["A"],"multi":false},{"id":"t1q4","n":4,"topic":1,"type":"mcq","stem":{"en":"You are responding to a stakeholder request that adds significant scope to a deployment already in flight. Which response best aligns expectations while respecting the stakeholder's underlying need?"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Quản lý yêu cầu tăng thêm phạm vi dự án lớn (scope creep) từ stakeholder khi hệ thống đang trong quá trình triển khai.</p><p><b>Giải pháp:</b> Đáp án đúng là <b>D</b> <b>Keyword quan trọng:</b> <b>Transparent implications</b> (minh bạch hóa tác động thời gian/phạm vi) và <b>Propose options</b> (đề xuất các phương án đánh đổi: hoãn, giảm phạm vi khác, kéo dài timeline) để stakeholder tự lựa chọn.</p><p><i> </i>Loại trừ:* A, B, C đều sai vì che giấu thông tin, từ chối thẳng thừng thiếu giải pháp thay thế, hoặc âm thầm chấp nhận gây trễ hạn dự án.</p><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D6_Stakeholder_Lifecycle.md</code></li></ul><p><i> <b>Mục:</b> <b>3. Communicating AI Decisions &amp; Value to Stakeholders</b> (mục 3.2 và 3.7 về kỹ năng dịch chuyển thay đổi phạm vi sang ngôn ngữ đánh đổi về </i>Capabilities, Cost and Speed* để stakeholder lựa chọn).</p>"},"options":[{"k":"A","t":{"en":"Hide the scope-addition request from the broader delivery team to avoid a difficult conversation, allowing the change to proceed without team awareness of its timeline implications."}},{"k":"B","t":{"en":"Decline the request outright without acknowledging the stakeholder's underlying need or offering alternatives such as deferral, descoping, or timeline extension."}},{"k":"C","t":{"en":"Accept the additional scope into the current release without describing the timeline or descoping implications, allowing the delivery plan to absorb unacknowledged changes until they surface as delays."}},{"k":"D","t":{"en":"Acknowledge the request, describe the scope and timeline implications transparently, and propose options-defer it, descope something else, or extend the timeline-for the stakeholder to choose."}}],"answer":["D"],"multi":false},{"id":"t1q5","n":5,"topic":1,"type":"mcq","stem":{"en":"You are a platform architect designing an internal Claude-based assistant that serves both finance analysts and external auditors. Each population must access only documents permitted by its role. Where should role-based access control be enforced in the pipeline?"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Xác định vị trí tối ưu trong pipeline để áp đặt phân quyền dựa trên vai trò (Role-Based Access Control - RBAC) nhằm ngăn chặn rò rỉ dữ liệu nhạy cảm trong hệ thống RAG.</p><p><b>Giải pháp:C</b></p><ul><li><b>Keyword quan trọng:</b> <b>Retrieval layer</b> (Tầng truy xuất) và <b>Deterministic gate</b> (Cổng chặn tất định). Bắt buộc phải lọc bỏ dữ liệu không được phép truy cập ngay tại tầng cơ sở dữ liệu/công cụ tìm kiếm, trước khi nó kịp đi vào cửa sổ ngữ cảnh (context window) của mô hình.</li></ul><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D3_Integration.md</code></li><ul><li><b>Mục:</b> <b>5. Authentication &amp; Access Control for Agent Systems</b> (mục 5.1 và 5.2 về thiết kế stack bảo mật 3 tầng để cô lập tài nguyên nhạy cảm trước khi chạm tới LLM).</li></ul><li><b>Tên file:</b> <code>CCA-P_D5_Governance_Safety_Risk.md</code></li><ul><li><b>Mục:</b> <b>2. Guardrails &amp; Safe Deployment Practices</b> (mục 2.1 và 2.8 về hệ thống phòng thủ chiều sâu, nguyên tắc phân quyền tối thiểu và rủi ro của prompt-only constraints).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Nowhere in the pipeline; rely on the model's general refusal behavior to reject unauthorized document access without any enforced access control."}},{"k":"B","t":{"en":"Inside the system prompt as a natural-language instruction for Claude to ignore unauthorized documents."}},{"k":"C","t":{"en":"At the retrieval layer, before any role-restricted content reaches the prompt-construction step or the model."}},{"k":"D","t":{"en":"After the response is generated, by post-filtering content that should not have been retrieved."}}],"answer":["C"],"multi":false},{"id":"t1q6","n":6,"topic":1,"type":"mcq","stem":{"en":"You are responding to an adversarial input pattern in which users include text claiming admin authority and instructing the model to bypass safety restrictions. Which combination of controls most effectively mitigates this attack pattern?"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Ngăn chặn cuộc tấn công đối kháng (Prompt Injection/Jailbreak) giả mạo quyền quản trị viên (admin authority) để vượt qua các rào cản an toàn của hệ thống.</p><p><b>Giải pháp:B.</b></p><p><b>Keyword quan trọng:</b> <b>Defense in depth</b> (phòng thủ chiều sâu) và <b>untrusted data</b> (coi nội dung người dùng là dữ liệu không đáng tin). Việc kết hợp nhiều lớp độc lập—coi đầu vào là dữ liệu thô không đáng tin ở tầng prompt, lọc bằng bộ phân loại runtime (harmlessness screen), khóa cứng quyền hạn công cụ bằng code (least-privilege tool scope), và ghi nhật ký kiểm toán—sẽ triệt tiêu hoàn toàn khả năng mô hình bị thao túng hành vi.</p><p><i> </i>Loại trừ các phương án khác:* A và D phá hủy hoàn toàn tính an toàn của hệ thống; C vi phạm nguyên tắc phòng thủ nhiều lớp khi chỉ dựa vào khả năng tự từ chối nội tại của mô hình.</p><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D5_Governance_Safety_Risk.md</code></li><ul><li><b>Mục:</b> <b>1. LLM System Risks &amp; Failure Modes</b> (mục 1.1 về rủi ro Prompt Injection) và <b>2. Guardrails &amp; Safe Deployment Practices</b> (mục 2.1 về mô hình phòng thủ 5 tầng và mục 2.8 về hệ thống phòng thủ phối hợp).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Granting users any privilege level they assert in their message content, on the assumption that cooperative behavior requires honoring self-declared authority without independent verification."}},{"k":"B","t":{"en":"Prompt-level instructions that treat user content as untrusted data, runtime classifiers that detect override attempts, scoped tool permissions that cannot be elevated by user content, and audit logging of attempts."}},{"k":"C","t":{"en":"Trusting that the model will intrinsically recognize and reject all bypass attempts without promptlevel instructions, runtime classifiers, scoped permissions, or audit logging."}},{"k":"D","t":{"en":"Removing all safety restrictions and guardrails to eliminate the attack surface that bypass attempts target, accepting that this makes the assistant unrestricted for all inputs."}}],"answer":["B"],"multi":false},{"id":"t1q7","n":7,"topic":1,"type":"mcq","stem":{"en":"Engineering leadership wants to roll out Claude Skills to 280 developers across 14 teams. Skills will encode internal coding standards, code-review checklists, and incident-postmortem templates. Leadership has asked how to govern Skill authorship so that Skills remain trustworthy without bottlenecking on a single central team. Which governance model should you recommend?"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Thiết lập mô hình quản trị (governance model) cho việc biên soạn Claude Skills quy mô lớn (280 developers, 14 teams) đảm bảo cân bằng giữa độ tin cậy (trustworthiness) và hiệu suất, không gây nghẽn cổ chai (bottleneck).</p><p><b>Giải pháp:</b> <b>B.</b></p><p><b>Keyword quan trọng:</b> <b>Federated authorship</b> (phân quyền viết Skill cho các team để tránh bottleneck) kết hợp <b>central review and publication gate</b> (cổng duyệt trung tâm để giữ tính trustworthy).</p><p><i> </i>Loại trừ:* A gây nghẽn cổ chai nghiêm trọng (centralized bottleneck); C và D loại bỏ hoàn toàn lớp duyệt (no review gate), trực tiếp vi phạm nguyên tắc bảo mật và quản trị an toàn (trust).</p><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D5_Governance_Safety_Risk.md</code></li><ul><li><b>Mục:</b> <b>2. Guardrails &amp; Safe Deployment Practices</b> (mục 2.1 về thiết kế guardrail phân tầng và quản trị an toàn của hệ thống).</li></ul><li><b>Tên file:</b> <code>CCA-P_D6_Stakeholder_Lifecycle.md</code></li><ul><li><b>Mục:</b> <b>2. Structured Stakeholder Discovery</b> (mục 2.4 về thiết lập cơ chế AI foundation và AI steering committee trước khi triển khai rộng).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Centralized authorship by a single platform team responsible for every Skill produced."}},{"k":"B","t":{"en":"Federated authorship across the 14 teams with a central review and publication gate."}},{"k":"C","t":{"en":"Per-developer authorship across the 280 engineers with no team-level coordination required."}},{"k":"D","t":{"en":"Fully decentralized authorship across the 14 teams with no review before publication."}}],"answer":["B"],"multi":false},{"id":"t1q8","n":8,"topic":1,"type":"mcq","stem":{"en":"You are documenting an architectural decision to support future audit and onboarding. Which artifact is the strongest fit?"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Lựa chọn artifact phù hợp nhất để lưu vết quyết định kiến trúc phục vụ hoạt động kiểm toán (audit) và chuyển giao/onboarding nhân sự mới trong tương lai.</p><p><b>Giải pháp: D.</b></p><ul><li><b>Keyword quan trọng:</b> <b>Architecture Decision Record (ADR)</b> là tài liệu chuẩn mực giúp lưu lại ngữ cảnh, quyết định và các phương án thay thế đã bị bác bỏ. Điều này ngăn chặn việc nhân sự mới đề xuất lại hướng đi sai lầm cũ và bảo toàn tri thức hệ thống.</li></ul><p><b>Gợi ý:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D6_Stakeholder_Lifecycle.md</code></li><ul><li><b>Mục:</b> <b>5. Architecture Documentation &amp; Implementation Handoff</b> (Mục 5.1 và 5.2 định nghĩa ADR là artifact bắt buộc trong gói bàn giao chung).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"A slide deck in a presentation folder with no accompanying written rationale."}},{"k":"B","t":{"en":"A code comment in a single file that contains an opinion of one engineer."}},{"k":"C","t":{"en":"A short verbal note shared during a hallway conversation with no written record."}},{"k":"D","t":{"en":"An Architecture Decision Record that states the context, the decision, the alternatives considered, the consequences, and the date and authors."}}],"answer":["D"],"multi":false},{"id":"t1q9","n":9,"topic":1,"type":"mcq","stem":{"en":"A Claude architect is leading the discovery phase for a new AI-powered customer service solution. Which two activities are characteristic of structured discovery and requirement gathering for a Claude-based deployment? (Select two.)"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Xác định hai hoạt động đặc trưng của giai đoạn khảo sát cấu trúc (<b>structured discovery</b>) và thu thập yêu cầu đối với một giải pháp triển khai dựa trên Claude.</p><p><b>Giải pháp:A</b></p><ul><li><b>Keyword quan trọng:</b></li><ul><li><b>Success criteria &amp; failure thresholds</b> và <b>constraints (latency, accuracy, compliance)</b>: Giai đoạn <b>discovery</b> bắt buộc phải làm rõ định nghĩa \"thế nào là đủ tốt\" (eval criteria) và thu thập các yêu cầu phi chức năng (NFRs) làm cổng chặn an toàn trước khi bắt đầu thiết kế chi tiết hay lựa chọn mô hình.</li></ul></ul><p><i> </i>Loại trừ các phương án khác:* Phương án B tạo prototype mà bỏ qua yêu cầu bằng văn bản là một <b>anti-pattern</b> nguy hiểm dẫn đến việc thiết kế sai lệch. Phương án C hoãn ghi nhận ràng buộc (constraints) sẽ khiến kiến trúc sư phải đoán mò sau này. Phương án D tự ý chọn model tier trước khi có dữ liệu đầu vào từ stakeholder là đảo ngược quy trình thiết kế.</p><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D6_Stakeholder_Lifecycle.md</code></li><ul><li><b>Mục:</b> <b>2. Structured Stakeholder Discovery</b> (Mục 2.1, 2.3, 2.5 và bảng bẫy về việc xác định rõ ràng hệ số an toàn, tiêu chuẩn đánh giá và ràng buộc phi chức năng cùng stakeholder).</li></ul><li><b>Tên file:</b> <code>CCA-P_D1_Solution_Design.md</code></li><ul><li><b>Mục:</b> <b>1. Translating Business Requirements into Claude Solutions</b> (Mục 1.3 và 1.4 về việc tạo ra bản <b>requirements spec</b> hoàn chỉnh gồm các ràng buộc cứng và các metric đo lường được trước khi chọn pattern).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Documenting explicit success criteria and failure thresholds that will gate production deployment."}},{"k":"B","t":{"en":"Generating an initial prototype and iterating based on user reaction rather than written requirements."}},{"k":"C","t":{"en":"Deferring constraint documentation until the integration design phase to avoid scope creep."}},{"k":"D","t":{"en":"Selecting the Claude model tier based on the architect's prior project experience before stakeholder input is collected."}},{"k":"E","t":{"en":"Facilitating stakeholder workshops to surface latency, accuracy, and compliance constraints before scoping begins."}}],"answer":["A","E"],"multi":true},{"id":"t1q10","n":10,"topic":1,"type":"mcq","stem":{"en":"You are evaluating a Claude-based deployment for adherence to a specific regulation. Which two steps must be completed BEFORE mapping deployment data flows to specific regulatory clauses? (Select two.) Each correct answer presents part of the solution."},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Xác định hai bước bắt buộc phải hoàn thành TRƯỚC KHI thực hiện đối chiếu dòng dữ liệu (data flows) của hệ thống Claude với các điều khoản quy định pháp lý cụ thể.</p><p><b>Giải pháp:A.</b></p><ul><li><b>Keyword quan trọng:</b></li><ul><li><b>Identify applicability:</b> Xác định tính áp dụng của luật (GDPR, HIPAA, hay FedRAMP) dựa trên loại dữ liệu và quyền hạn pháp lý là bước tiên quyết để biết quy định nào cần tuân thủ.</li><li><b>Inventory compliance affordances:</b> Kiểm kê công cụ và cam kết tuân thủ sẵn có từ phía vendor (như BAA, DPA, hoặc môi trường AWS GovCloud) để biết hạ tầng hiện tại hỗ trợ những gì.</li></ul></ul><p><i> </i>Loại trừ (B, D, E):<i> So sánh các kiểm soát hiện tại để tìm gap (E), lập tài liệu khắc phục gap (B), và lên lịch sửa lỗi (D) là các bước chỉ có thể thực hiện </i>sau* khi đã hoàn tất việc ánh xạ dữ liệu vào điều khoản quy định cụ thể.</p><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D5_Governance_Safety_Risk.md</code></li><ul><li><b>Mục:</b> <b>4. Regulatory Compliance (GDPR / HIPAA / FedRAMP)</b> (mục 4.1 và 4.7 về việc phân loại dữ liệu/khu vực tài phán và kiểm kê môi trường/hạ tầng/BAA của vendor trước khi đối chiếu).</li></ul><li><b>Tên file:</b> <code>CCA-P_D6_Stakeholder_Lifecycle.md</code></li><ul><li><b>Mục:</b> <b>2. Structured Stakeholder Discovery</b> (mục 2.1 và 2.5 về việc thu thập ràng buộc tuân thủ pháp lý ở giai đoạn discovery đầu tiên).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Identify the applicability of the regulation based on data types, jurisdiction, and audience."}},{"k":"B","t":{"en":"Document the identified gaps along with recommended remediations and residual risk for signoff."}},{"k":"C","t":{"en":"Inventory the vendor-provided compliance tooling and confirm which compliance affordances are in place."}},{"k":"D","t":{"en":"Schedule the remediation work with the engineering team based on the prioritized gap findings."}},{"k":"E","t":{"en":"Compare the in-place controls against the regulatory requirements to identify any compliance gaps."}}],"answer":["A","C"],"multi":true},{"id":"t1q11","n":11,"topic":1,"type":"mcq","stem":{"en":"An architect is reviewing a set of architecture documentation packages before handing off a Claude-based pipeline to an implementation team. Which two characteristics indicate that a documentation package is sufficient to support implementation without ongoing architect involvement? (Select two.)"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Xác định hai đặc điểm chứng tỏ tài liệu bàn giao kiến trúc hệ thống đã đủ chi tiết để đội ngũ phát triển tự triển khai mà không cần sự can thiệp liên tục của kiến trúc sư.</p><p><b>Giải pháp:</b><b>A</b> và <b>E</b></p><ul><li><b>Keyword quan trọng:</b></li><ul><li><b>Integration contracts, configuration schemas, input/output shapes</b> (A): Thiết lập hợp đồng dữ liệu rõ ràng cho từng cấu phần, đảm bảo hai kỹ sư độc lập đọc tài liệu vẫn có thể xây dựng các module tương thích hoàn toàn với nhau.</li><li><b>Decision log / ADR with rejected alternatives</b> (E): Nhật ký quyết định kiến trúc (ADR) ghi lại lý do chọn giải pháp và các phương án bị loại bỏ để bảo toàn tri thức, ngăn kỹ sư sau này đề xuất lại hướng đi sai lầm cũ.</li></ul></ul><p><i> </i>Loại trừ:* B (chứng tỏ tài liệu chưa đủ độc lập); C (thiếu chi tiết kỹ thuật ở cấp cấu phần); D (thiếu quyết định lựa chọn cốt lõi).</p><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D6_Stakeholder_Lifecycle.md</code></li><ul><li><b>Mục:</b> <b>5. Architecture Documentation &amp; Implementation Handoff</b> (mục 5.1 và 5.2 về gói bàn giao chung gồm sơ đồ thành phần, tài liệu ADR và runbook).</li></ul><li><b>Tên file:</b> <code>CCA-P_D1_Solution_Design.md</code></li><ul><li><b>Mục:</b> <b>1. Translating Business Requirements into Claude Solutions</b> (mục 1.1 về tiêu chuẩn chi tiết của hợp đồng đầu vào/đầu ra để kỹ sư build độc lập).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"The document specifies integration contracts, configuration schemas, and expected input/output shapes for each component."}},{"k":"B","t":{"en":"The document includes the architect's contact information for questions arising during implementation."}},{"k":"C","t":{"en":"The document provides a high-level narrative description of the business problem without component- level detail."}},{"k":"D","t":{"en":"The document lists all Claude models that were evaluated but does not specify which was selected or why."}},{"k":"E","t":{"en":"The document includes a decision log that records the rationale for key architectural choices and the alternatives rejected."}}],"answer":["A","E"],"multi":true},{"id":"t1q12","n":12,"topic":1,"type":"mcq","stem":{"en":"A platform team operates a self-hosted multi-agent system on Kubernetes that orchestrates seven specialized agents for invoice processing. The team spends approximately 40 percent of engineering capacity on infrastructure maintenance, message bus reliability, and agent state recovery. The CFO has asked you to evaluate moving to managed agent infrastructure to reclaim engineering capacity. The security officer requires that all customer financial data remain within an approved network boundary. Which factor should most heavily influence your recommendation?"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Đánh giá việc chuyển dịch hệ thống đa agent từ tự vận hành (self-hosted) sang hạ tầng quản lý sẵn (managed) dưới áp lực tối ưu nhân lực (CFO) và ràng buộc biên mạng an toàn dữ liệu (Security).</p><p><b>Giải pháp:A.</b></p><ul><li><b>Keyword quan trọng:</b> <b>Trust is a precondition</b> (Sự tin cậy là điều kiện tiên quyết). Biên an toàn mạng (network boundary) của an ninh thông tin là cổng chặn bắt buộc (adoption gate). Nếu hạ tầng managed không đáp ứng được yêu cầu này, hệ thống sẽ bị từ chối đưa vào vận hành, khiến mọi lợi ích về giải phóng nhân lực hay chi phí đều trở về con số 0.</li></ul><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D1_Solution_Design.md</code></li><ul><li><b>Mục:</b> <b>6. Aligning Solutions to Business Value Pillars</b> (Mục \"Trust là điều kiện tiên quyết, KHÔNG phải pillar thứ 6\" và bảng bẫy \"Nhanh, rẻ, nhưng không được adopt\").</li></ul><li><b>Tên file:</b> <code>CCA-P_D5_Governance_Safety_Risk.md</code></li><ul><li><b>Mục:</b> <b>2. Guardrails &amp; Safe Deployment Practices</b> (Mục 2.1 về ranh giới an toàn, cô lập quy trình và phân tách môi trường).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Whether managed agent data handling satisfies the network boundary required by security."}},{"k":"B","t":{"en":"Whether managed agents support the current bus topology used by the platform team."}},{"k":"C","t":{"en":"Whether the current seven agents map cleanly to the patterns supported by managed agents."}},{"k":"D","t":{"en":"Whether managed agents reduce per-invoice token costs across the existing processing volume."}}],"answer":["A"],"multi":false},{"id":"t1q13","n":13,"topic":1,"type":"mcq","stem":{"en":"During an architectural review, the security team identifies a risk that adversarial content injected into retrieved documents could manipulate the model's behavior. Which mitigation most directly addresses this threat?"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Ngăn chặn rủi ro tấn công gián tiếp (<b>indirect prompt injection</b>) khi nội dung đối kháng bị cài cắm vào tài liệu truy xuất (retrieved documents) nhằm thao túng hành vi của mô hình.</p><p><b>Giải pháp:A.</b></p><ul><li><b>Keyword quan trọng:</b> <b>Indirect prompt injection</b>, <b>untrusted input</b>, <b>input classifiers</b>, <b>output validation</b>. Do dữ liệu truy xuất chứa mã độc từ bên thứ ba ngoài tầm kiểm soát của user, hệ thống bắt buộc phải coi mọi dữ liệu đầu vào này là không đáng tin (<b>untrusted</b>), đồng thời bọc qua bộ lọc phân loại đầu vào (<b>input classifier/harmlessness screen</b>) và kiểm tra tính hợp lệ của đầu ra.</li></ul><p><i> </i>Loại trừ:* B (chỉ chặn đường truyền ra ngoài), C (đo lường lúc offline/testing, không chặn được runtime), D (chỉ giúp chống bịa đặt/hallucination, không chặn được hành vi bị thao túng bởi lệnh độc hại).</p><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D5_Governance_Safety_Risk.md</code></li><ul><li><b>Mục:</b> <b>1. LLM System Risks &amp; Failure Modes</b> (mục 1.1 bảng rủi ro \"Prompt injection\") và <b>2. Guardrails &amp; Safe Deployment Practices</b> (mục 2.3 thiết kế Harmlessness screen và mục 2.4 phân biệt Direct/Indirect prompt injection).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Treat all retrieved content as untrusted input and apply input classifiers with output validation."}},{"k":"B","t":{"en":"Restrict outbound tool calls to an approved destination allow-list."}},{"k":"C","t":{"en":"Score outputs against a stable adversarial evaluation set on each model-version change."}},{"k":"D","t":{"en":"Require citations for each claim and constrain responses to source-supported content."}}],"answer":["A"],"multi":false},{"id":"t1q14","n":14,"topic":1,"type":"mcq","stem":{"en":"A Claude architect is designing a HIPAA-compliant pipeline that processes patient records. Which two design decisions directly support HIPAA compliance requirements? (Select two.)"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Lựa chọn các quyết định thiết kế trực tiếp hỗ trợ yêu cầu tuân thủ quy định <b>HIPAA</b> (bảo vệ thông tin sức khỏe cá nhân - <b>PHI</b>) khi xử lý hồ sơ bệnh nhân.</p><p><b>Giải pháp:A</b> (Enforcing role-based access controls so that PHI is retrievable only by authorized personnel) và <b>E</b> (Ensuring patient data is never included in training feedback loops sent to the model provider without a BAA in place).</p><ul><li><b>Keywords:</b> <b>Role-based access controls (RBAC)</b>, <b>Protected Health Information (PHI)</b>, và <b>Business Associate Agreement (BAA)</b>.</li></ul><p><i> </i>Lý do:* HIPAA bắt buộc phải kiểm soát quyền truy cập chặt chẽ (RBAC) để tránh rò rỉ PHI và yêu cầu ký thỏa thuận <b>BAA</b> với nhà cung cấp trước khi truyền hoặc lưu trữ bất kỳ dữ liệu bệnh nhân nào để tránh việc dữ liệu bị sử dụng ngoài tầm kiểm soát (như đưa vào feedback loop huấn luyện). <i> </i>Loại trừ:* B (chỉ là tối ưu UX/độ trễ); C (tối ưu hiệu năng/độ chính xác); D (tối ưu ngân sách token/chi phí).</p><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D5_Governance_Safety_Risk.md</code></li><ul><li><b>Mục:</b> <b>4. Regulatory Compliance (GDPR / HIPAA / FedRAMP)</b> (Mục 4.1, 4.3 và bảng bẫy về quy trình kích hoạt BAA bảo vệ PHI).</li></ul><li><b>Tên file:</b> <code>CCA-P_D3_Integration.md</code></li><ul><li><b>Mục:</b> <b>5. Authentication &amp; Access Control for Agent Systems</b> (Mục 5.1 về thiết kế stack phân quyền 3 tầng để cô lập tài nguyên nhạy cảm).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Enforcing role-based access controls so that PHI is retrievable only by authorized personnel."}},{"k":"B","t":{"en":"Using streaming responses to reduce perceived latency for clinical users."}},{"k":"C","t":{"en":"Selecting the highest-capability Claude model to maximize diagnostic accuracy."}},{"k":"D","t":{"en":"Setting max_tokens to a low value to minimize the volume of text generated per request."}},{"k":"E","t":{"en":"Ensuring patient data is never included in training feedback loops sent to the model provider without a BAA in place."}}],"answer":["A","E"],"multi":true},{"id":"t1q15","n":15,"topic":1,"type":"mcq","stem":{"en":"You must present an architectural recommendation to deploy a Claude-based contract review assistant to a steering committee that includes the CFO, the general counsel, and the CIO. Each stakeholder cares about different aspects of the decision. How should you structure the recommendation document?"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Cách cấu trúc tài liệu đề xuất kiến trúc (architectural recommendation) gửi Ban điều phối (steering committee) gồm nhiều bên liên quan có vai trò và mối quan tâm khác nhau (CFO, General Counsel, CIO).</p><p><b>Giải pháp:B.</b></p><ul><li><b>Keyword quan trọng:</b> <b>Bottom-line up front</b> (nêu khuyến nghị/quyết định kiến trúc ngay đầu mục), <b>stakeholder's concerns</b> (giải quyết trực tiếp mối quan tâm riêng biệt của từng bên bằng cách dịch kỹ thuật sang 3 trục giá trị: Capabilities, Cost &amp; Speed, Safety &amp; Security).</li></ul><p><i> </i>Loại trừ:* A, D sa đà quá sớm vào chi phí chi tiết hoặc sơ đồ kỹ thuật phức tạp khiến các bên liên quan khác bị ngợp thông tin; C viết dàn trải không phân hóa nhóm độc giả.</p><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D6_Stakeholder_Lifecycle.md</code></li><ul><li><b>Mục:</b> <b>3. Communicating AI Decisions &amp; Value to Stakeholders</b> (mục 3.1 và 3.2 về phương pháp chuyển dịch ngôn ngữ kỹ thuật sang các nhóm giá trị kinh doanh mà từng stakeholder phụ trách).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Lead with detailed cost projections across the full multi-year horizon before the rationale section."}},{"k":"B","t":{"en":"Lead with the architectural decision, then address each stakeholder's primary concerns directly."}},{"k":"C","t":{"en":"Present the same dense narrative throughout with no stakeholder differentiation in any section."}},{"k":"D","t":{"en":"Lead with the technical architecture diagram and the full component list before any other section."}}],"answer":["B"],"multi":false},{"id":"t1q16","n":16,"topic":1,"type":"mcq","stem":{"en":"A healthcare organization is evaluating two Claude-powered AI architectures for a clinical documentation assistant. Architecture X produces higher output quality scores but costs $0.18 per documentation session and averages 4.2 seconds per response. Architecture Y scores slightly lower on quality metrics but costs $0.09 per session and averages 2.1 seconds per response. The stated SLA requires responses under 3 seconds, and the annual volume is projected at 2 million documentation sessions. Which evaluation approach correctly applies business value pillar analysis to this decision?"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Áp dụng phân tích các <b>Trụ cột giá trị doanh nghiệp (Value Pillars)</b> để đưa ra quyết định kiến trúc Claude tối ưu khi có sự đánh đổi giữa Chất lượng (Quality) vs Độ trễ SLA (Latency) và Chi phí (Cost).</p><p><b>Giải pháp:D.</b></p><ul><li><b>Keyword quan trọng:</b></li><ul><li><b>Eliminate on SLA grounds:</b> Kiến trúc X bị loại ngay lập tức vì trung bình 4.2 giây vượt quá cam kết bắt buộc <b>Performance SLA (&lt; 3 giây)</b>.</li><li><b>Calculate annual cost &amp; assess productivity impact:</b> Tính toán chi phí thực tế tiết kiệm được của Y (\\$0.09 × 2 triệu sessions = \\$180,000/năm) (Nếu chỉ dừng ở \"X đắt hơn Y\" mà không quy đổi ra con số annual, thì không thể trả lời câu hỏi cốt lõi: chênh lệch cost đó có material hay không so với lợi ích quality mang lại.)và đối chiếu xem độ lệch nhỏ về chất lượng của Y có thực sự ảnh hưởng tiêu cực đến năng suất xử lý lâm sàng (<b>Productivity pillar</b>) hay không.</li></ul></ul><p><b>Gợi ý:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D1_Solution_Design.md</code></li><ul><li><b>Mục:</b> <b>6. Aligning Solutions to Business Value Pillars</b> (mục 6.1 định nghĩa chi tiết 5 Pillar: Efficiency, Productivity, Cost, Performance SLA, Transformation và bảng bẫy loại trừ phương án vi phạm constraint).</li></ul><li><b>Tên file:</b> <code>CCA-P_D6_Stakeholder_Lifecycle.md</code></li><ul><li><b>Mục:</b> <b>4. Stakeholder Feedback Loops &amp; SLA Alignment</b> (mục 4.1 và 4.3 về việc phân tích hai chiều hỏng độc lập: hạ tầng/latency SLA và chất lượng đầu ra).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Select Architecture X because the higher quality scores justify the cost premium, and any SLA gap can be addressed through infrastructure optimization after deployment."}},{"k":"B","t":{"en":"Select Architecture Y based solely on the 50% cost reduction, since solution cost is the most important value pillar in healthcare budget-constrained environments."}},{"k":"C","t":{"en":"Recommend a hybrid approach using Architecture X for complex cases and Architecture Y for routine cases, without additional analysis, since this preserves quality where it matters most."}},{"k":"D","t":{"en":"Eliminate Architecture X on SLA grounds, then evaluate Architecture Y against the efficiency and solution cost pillars by calculating annual cost difference and assessing whether the quality delta materially impacts clinical workflow productivity."}}],"answer":["D"],"multi":false},{"id":"t1q17","n":17,"topic":1,"type":"mcq","stem":{"en":"You are integrating Claude Code into the team's pull-request workflow. The team wants AIassisted review without removing human approval. Which integration design best fits this requirement?"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Thiết kế tích hợp Claude Code vào quy trình Pull Request (PR) để hỗ trợ review code nhưng vẫn bảo toàn quyền phê duyệt của con người (human approval) và luật bảo vệ nhánh (branch-protection rules).</p><p><b>Giải pháp:D.</b></p><ul><li><b>Keyword quan trọng:</b> <b>Human approval</b> và <b>4D Framework (Diligence)</b>. Con người bắt buộc phải giữ vai trò kiểm soát cuối cùng (human-in-the-loop) đối với các hành động có tính chất thay đổi hoặc phá hủy mã nguồn.</li></ul><p><i> </i>Loại trừ (A, B, C):* Vi phạm lỗi <b>AP-26 (Auto-merge without human approval)</b>. Việc tự động merge, xóa PR hoặc vô hiệu hóa luật bảo vệ nhánh sẽ triệt tiêu chốt chặn an toàn cuối cùng, dễ dẫn đến lỗi hệ thống nghiêm trọng.</p><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D7_Developer_Productivity.md</code></li><ul><li><b>Mục:</b> <b>1. Developer Productivity Agent</b> (mục 1.1 bảng quyết định \"Auto-merge\", mục 1.5 định nghĩa \"4D Framework — Diligence\", và mục 1.7 định nghĩa lỗi \"AP-26\").</li></ul><li><b>Tên file:</b> <code>CCA-P_D5_Governance_Safety_Risk.md</code></li><ul><li><b>Mục:</b> <b>2. Guardrails &amp; Safe Deployment Practices</b> (mục 2.1 bảng xếp chồng 5 tầng guardrail — tầng \"Human-in-the-loop\" và mục 2.6 về cơ chế bảo mật của Claude Code).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Claude Code merges every pull request automatically after completing its analysis, bypassing human approval and the existing branch-protection rules."}},{"k":"B","t":{"en":"Claude Code silently deletes pull requests it assesses as low quality without posting a comment or notifying the author."}},{"k":"C","t":{"en":"Claude Code disables all existing branch-protection rules to streamline the merge process, removing human approval as a required gate."}},{"k":"D","t":{"en":"Claude Code reviews the pull request and posts a structured analysis as a comment, while a human reviewer retains the approval decision under the existing branch-protection rules."}}],"answer":["D"],"multi":false},{"id":"t1q18","n":18,"topic":1,"type":"mcq","stem":{"en":"An architect is reviewing a Claude-based candidate-screening tool prior to deployment. A stakeholder asserts that because the model was not trained on company data, no bias evaluation is necessary. Which two responses most accurately challenge this assertion? (Select two.)"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Lập luận sai là: không cần đánh giá định kiến (bias evaluation) đối với công cụ lọc ứng viên sử dụng Claude do không dùng dữ liệu công ty để huấn luyện.</p><p><b>Giải pháp:</b><b>B</b> và <b>C</b></p><ul><li><b>Keywords:</b></li><ul><li>Có 2 loại Bias: 1 là bias từ fine-tuning (dữ liệu lịch sử của cty) và 1 bias từ  pretraining (<b>Demographic biases from pretraining</b>) nằm sẵn trong model nền của Claude từ dữ liệu huấn luyện của Anthropic</li><li><b>Outcome-disparity metrics / disparate impact</b> (cần đo lường sự chênh lệch kết quả thực tế giữa các nhóm nhân khẩu học trước khi triển khai) bất kể model có fine-tune hay không.</li></ul></ul><p><b>Gợi ý:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D5_Governance_Safety_Risk.md</code></li><ul><li><b>Mục:</b> <b>5. Ethical AI (Bias, Fairness, Transparency)</b> (Mục 5.4, 5.5 và Phụ lục A về đo lường disparate impact thực nghiệm và định kiến nội tại của mô hình nền).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Transparency obligations are satisfied by disclosing that an AI system is in use, without further evaluation."}},{"k":"B","t":{"en":"The system should be evaluated on outcome-disparity metrics across protected groups before deployment."}},{"k":"C","t":{"en":"The model may carry demographic biases from pretraining that manifest in screening outcomes regardless of fine-tuning."}},{"k":"D","t":{"en":"Bias evaluation is unnecessary when the model provider has published a responsible-use policy."}},{"k":"E","t":{"en":"Fairness testing is required only when the training dataset is known to contain protected-class labels."}}],"answer":["B","C"],"multi":true},{"id":"t1q19","n":19,"topic":1,"type":"mcq","stem":{"en":"A document analysis service processes legal filings averaging 80,000 tokens each. Each filing is queried by attorneys an average of 14 times during a case. The current architecture sends the full filing on every query. The CFO has asked you to reduce per-query costs while preserving response quality. The security officer requires that filing contents not be stored outside Fabrikam's tenancy. Which optimization approach should you recommend?"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Giảm chi phí truy vấn tài liệu lớn (80k tokens) được sử dụng lặp lại nhiều lần (14 lần) trong một case mà không làm giảm chất lượng phản hồi (phải giữ nguyên vẹn tài liệu trong ngữ cảnh) và đảm bảo an toàn dữ liệu (không lưu trữ ngoài hệ thống).</p><p><b>Giải pháp:D.</b></p><ul><li><b>Keyword quan trọng:</b> <b>Prompt Caching</b> và <b>Stable prefix</b>.</li><li><b>Lý do đúng:</b> Tài liệu pháp lý là phần dữ liệu bất biến (stable prefix). Việc đặt tài liệu ở đầu prompt và gắn thẻ cache giúp <b>giảm ~90% chi phí</b> token đầu vào cho 13 lượt truy vấn tiếp theo (vượt xa điểm hòa vốn 2–3 lần), <b>giữ nguyên 100% chất lượng</b> phân tích tài liệu đầy đủ và đảm bảo bảo mật do dữ liệu cache được cô lập trong cùng workspace.</li></ul><p><i> </i>Loại trừ:* <b>A</b> (Tóm tắt) và <b>B</b> (RAG/Vector store) làm suy giảm chất lượng câu trả lời do mất mát thông tin chi tiết; <b>C</b> (Hạ model) làm giảm khả năng suy luận logic.</p><p><b>Gợi ý:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D2_Models_Prompting_Context.md</code></li><ul><li><b>Mục:</b> <b>5. Prompt Caching</b> (Phần cơ chế giảm 90% chi phí, cấu trúc prefix ổn định đứng trước, và tính cô lập bảo mật của cache).</li></ul><li><b>Tên file:</b> <code>CCA-P_D3_Integration.md</code></li><ul><li><b>Mục:</b> <b>6. Accuracy-Latency-Cost Tradeoff Analysis</b> (Mục 6.1 và 6.2 về đòn bẩy \"Prompt caching\" cải thiện đồng thời cả chi phí lẫn độ trễ mà không phải đánh đổi chất lượng).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Summarize each filing once at intake and run all subsequent queries against the summary."}},{"k":"B","t":{"en":"Index filings in a vector store and retrieve only the relevant passages per query."}},{"k":"C","t":{"en":"Move the workload to a smaller Claude model to reduce the per-token cost paid."}},{"k":"D","t":{"en":"Cache the filing as the prompt prefix for reuse across the 14 queries per case."}}],"answer":["D"],"multi":false},{"id":"t1q20","n":20,"topic":1,"type":"mcq","stem":{"en":"An engineering organization is adopting Claude Code across 200 developers. A team lead proposes that AI- generated pull requests bypass standard code review for changes under 50 lines because small changes are considered low risk and review capacity is constrained. Which two Diligence-competency objections should you raise? (Select two.) Each correct answer presents part of the solution."},"explain":{"text":"<p><b>Lưu ý:</b> Nguồn không có đáp án tường minh cho câu này; đáp án A và C được suy luận theo nguyên tắc Diligence-competency (giữ cơ chế kiểm chứng, line count là proxy kém cho rủi ro).</p>"},"options":[{"k":"A","t":{"en":"Removing review eliminates the verification mechanism required for AI-generated output across the workflow."}},{"k":"B","t":{"en":"Code-review capacity should be expanded to handle every code change submitted across the team."}},{"k":"C","t":{"en":"Line count is a poor proxy for the actual risk introduced by a code change."}},{"k":"D","t":{"en":"AI-generated pull requests should be rejected by default across the organization."}},{"k":"E","t":{"en":"The threshold should be increased to 200 lines to capture more changes."}}],"answer":["A","C"],"multi":true},{"id":"t1q21","n":21,"topic":1,"type":"mcq","stem":{"en":"A Claude architect at a health services organization is defining evaluation metrics for a clinical-summary pipeline. The pipeline must remain within a per-query cost ceiling and must never surface patient data to unauthorized roles. Which two metrics directly address these requirements? (Select two.)"},"explain":{"text":"<p><b>Lưu ý:</b> Nguồn không có đáp án tường minh cho câu này; đáp án B và E được suy luận trực tiếp từ hai ràng buộc nêu trong đề bài (chi phí mỗi truy vấn và kiểm soát truy cập dữ liệu bệnh nhân).</p><p>Đã kiểm tra</p>"},"options":[{"k":"A","t":{"en":"Response latency at the 95th percentile across a one-week sample window"}},{"k":"B","t":{"en":"Role-based access-control enforcement rate measured on a red-team dataset"}},{"k":"C","t":{"en":"Throughput measured as successful requests processed per minute"}},{"k":"D","t":{"en":"BLEU score computed against a human-annotated reference summary set"}},{"k":"E","t":{"en":"Per-query token cost measured against the defined cost ceiling"}}],"answer":["B","E"],"multi":true},{"id":"t1q22","n":22,"topic":1,"type":"mcq","stem":{"en":"A senior architect is managing stakeholder expectations for a Claude-based reporting assistant midway through development. Stakeholders have escalating concerns about response latency. Which two actions most directly address stakeholder expectation alignment in this situation? (Select two.)"},"explain":{"text":"<p><b>Tóm tắt vấn đề:</b> Quản lý và đồng bộ kỳ vọng của các bên liên quan (stakeholders) khi họ có những lo ngại ngày càng tăng về độ trễ phản hồi (response latency) của ứng dụng Claude giữa quá trình phát triển.</p><p><b>Giải pháp:</b> <b>C.</b> và <b>E.</b></p><ul><li><b>Keyword quan trọng:</b></li><ul><li><b>p50 and p95 latency baselines:</b> Việc thu thập và trình bày các dữ liệu thực tế đo được (percentile p50, p95) đối chiếu trực tiếp với ngưỡng SLA đã thống nhất giúp loại bỏ các lo ngại cảm tính, mang lại dữ liệu chính xác và khách quan cho stakeholders.</li><li><b>Collaborative SLA revision:</b> Khi các ràng buộc hạ tầng hoặc đặc thù của mô hình trong môi trường thực tế không cho phép đạt được mục tiêu ban đầu, kiến trúc sư cần chủ động thảo luận và điều chỉnh lại định nghĩa SLA một cách đồng thuận với stakeholders.</li></ul></ul><p><i> </i>Loại trừ:* <b>A</b> là thái độ phòng thủ, đẩy trách nhiệm ra ngoài và thiếu mẫn cán. <b>B</b> vi phạm nguyên lý cốt lõi khi tự ý thay thế mô hình mà không qua đánh giá thực nghiệm (without evaluation). <b>D</b> là phản ứng cực đoan quá mức, gây gián đoạn tiến độ chung của toàn bộ dự án một cách không cần thiết.</p><p><b>Gợi ý tài liệu tham khảo:</b></p><ul><li><b>Tên file:</b> <code>CCA-P_D6_Stakeholder_Lifecycle.md</code></li><ul><li><b>Mục:</b> <b>4. Stakeholder Feedback Loops &amp; SLA Alignment</b> (Mục 4.1 và bảng bẫy về việc phân tích hai chiều hỏng độc lập và thiết lập các chỉ số SLA thực tế thay vì suy đoán).</li><li><b>Mục:</b> <b>3. Communicating AI Decisions &amp; Value to Stakeholders</b> (Mục 3.4 về việc truyền đạt minh bạch các giới hạn (limitations) của hệ thống cho stakeholders để bảo vệ độ tin cậy).</li></ul></ul>"},"options":[{"k":"A","t":{"en":"Communicate that latency concerns are a known LLM limitation and outside the architecture team's control."}},{"k":"B","t":{"en":"Replace the current Claude model with a third-party model that may offer lower latency without evaluation."}},{"k":"C","t":{"en":"Present measured p50 and p95 latency baselines against the agreed SLA thresholds so stakeholders have accurate data."}},{"k":"D","t":{"en":"Pause all development and reallocate engineering resources entirely to latency optimization."}},{"k":"E","t":{"en":"Revise the SLA definition collaboratively with stakeholders if current targets are not achievable given production constraints."}}],"answer":["C","E"],"multi":true},{"id":"t1q23","n":23,"topic":1,"type":"dropdown","stem":{"en":"You are sequencing decomposed components in an invoice-processing pipeline. For each of the decomposed components, select the execution layer it belongs to: \"Pre-Processing,\" \"Model Stage,\" or \"Post-Processing.\""},"explain":{"text":"<p><b>Nguyên tắc phân biệt chốt lại:</b></p><ul><li><b>Pre-Processing</b>: xảy ra <b>trước</b> khi input chạm vào model, mục đích chuẩn bị/bảo vệ dữ liệu đầu vào.</li><li><b>Model Stage</b>: bất kỳ bước nào <b>thực sự gọi Claude</b> để reasoning/generate output (classification, extraction, summarization...).</li><li><b>Post-Processing</b>: xảy ra <b>sau</b> khi model trả kết quả, mục đích validate/transform/lưu trữ — không còn tương tác với model nữa.</li></ul>"},"blanks":[{"label":{"en":"Claude-based classification of invoice type"},"opts":[{"en":"Model Stage"},{"en":"Post-Processing"},{"en":"Pre-Processing"}],"a":0},{"label":{"en":"persistence of validated records to the system of record"},"opts":[{"en":"Model Stage"},{"en":"Post-Processing"},{"en":"Pre-Processing"}],"a":1},{"label":{"en":"schema validation of the extracted fields"},"opts":[{"en":"Model Stage"},{"en":"Post-Processing"},{"en":"Pre-Processing"}],"a":1},{"label":{"en":"Claude-based extraction of structured invoice fields"},"opts":[{"en":"Model Stage"},{"en":"Post-Processing"},{"en":"Pre-Processing"}],"a":0},{"label":{"en":"PII redaction on extracted text prior to model invocation"},"opts":[{"en":"Model Stage"},{"en":"Post-Processing"},{"en":"Pre-Processing"}],"a":2},{"label":{"en":"optical character recognition on scanned invoice images"},"opts":[{"en":"Model Stage"},{"en":"Post-Processing"},{"en":"Pre-Processing"}],"a":2}]},{"id":"t1q24","n":24,"topic":1,"type":"mcq","stem":{"en":"You are reviewing a customer-suppo
