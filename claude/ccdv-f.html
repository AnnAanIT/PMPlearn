<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCDV-F · Quiz</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#eef2f9; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --brand:#1d4ed8; --brand-soft:#eff6ff;
    --ok:#15803d; --ok-bg:#f0fdf4; --ok-line:#86efac;
    --no:#b91c1c; --no-bg:#fef2f2; --no-line:#fca5a5;
    --r:14px;
  }
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.6 "Segoe UI",system-ui,-apple-system,sans-serif}
  a{color:inherit}

  /* ---------- top bar ---------- */
  .top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .top-in{max-width:1240px;margin:0 auto;padding:12px 20px;
    display:flex;align-items:center;gap:16px}
  .logo{font-weight:800;font-size:18px;letter-spacing:-.4px;white-space:nowrap}
  .logo span{color:var(--brand)}
  .sub{font-size:12px;color:var(--muted);font-weight:500}
  .bar{flex:1;height:9px;background:var(--line);border-radius:99px;overflow:hidden;min-width:70px}
  .bar>i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#2563eb,#0ea5e9);transition:width .35s ease}
  .count{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

  /* ---------- layout ---------- */
  .wrap{max-width:1240px;margin:0 auto;padding:22px 20px 60px;
    display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px;align-items:start}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:26px 28px;box-shadow:0 1px 3px rgba(15,23,42,.05)}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .chip{font-size:12px;font-weight:600;padding:5px 11px;border-radius:99px;
    background:#f1f5f9;color:#475569}
  .chip.good{background:var(--ok-bg);color:var(--ok)}
  .chip.bad{background:var(--no-bg);color:var(--no)}

  .stem{font-size:18px;line-height:1.62;margin:0 0 18px;font-weight:500}

  /* ---------- options ---------- */
  .opts{display:flex;flex-direction:column;gap:11px}
  .opt{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;
    background:#f4f7fb;border:2px solid transparent;border-radius:12px;
    padding:14px 16px;font:inherit;color:inherit;cursor:pointer;transition:.15s}
  .opt:hover:not(:disabled){background:#e9eff8}
  .opt:disabled{cursor:default}
  .opt .k{flex:none;width:26px;height:26px;border-radius:99px;background:#fff;
    border:1px solid var(--line);display:grid;place-items:center;
    font-size:12.5px;font-weight:700;color:#64748b}
  .opt .t{flex:1;min-width:0}
  .opt.sel{border-color:var(--brand);background:var(--brand-soft)}
  .opt.sel .k{background:var(--brand);border-color:var(--brand);color:#fff}
  .opt.right{border-color:var(--ok-line);background:var(--ok-bg)}
  .opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--no-line);background:var(--no-bg)}
  .opt.wrong .k{background:var(--no);border-color:var(--no);color:#fff}
  .opt.dim{opacity:.55}
  .tag{flex:none;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;align-self:center}
  .tag.r{background:var(--ok);color:#fff}
  .tag.w{background:var(--no);color:#fff}

  /* ---------- verdict + explanation ---------- */
  .verdict{margin-top:18px;border-radius:12px;padding:13px 16px;font-weight:700;font-size:15px}
  .verdict.r{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
  .verdict.w{background:var(--no-bg);color:var(--no);border:1px solid var(--no-line)}

  .expl{margin-top:18px;border-top:1px solid var(--line);padding-top:18px}
  .expl h3{margin:0 0 12px;font-size:17px}
  .block{margin-bottom:14px}
  .block .lbl{font-size:12px;font-weight:700;text-transform:uppercase;
    letter-spacing:.5px;color:var(--muted);margin-bottom:5px}
  .block .val{font-size:15px;color:#1e293b}
  .ansline{font-weight:700;color:var(--ok)}
  .expl ul{margin:6px 0 0;padding-left:20px}
  .expl li{margin-bottom:7px}

  /* ---------- footer nav ---------- */
  .nav{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;flex-wrap:wrap}
  .btn{font:inherit;font-weight:700;padding:11px 26px;border-radius:10px;
    border:1.5px solid var(--brand);background:#fff;color:var(--brand);cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){background:var(--brand-soft)}
  .btn.fill{background:var(--brand);color:#fff}
  .btn.fill:hover:not(:disabled){background:#1e40af}
  .btn:disabled{opacity:.42;cursor:not-allowed}
  .btn.ghost{border-color:var(--line);color:var(--muted)}
  .btn.ghost:hover:not(:disabled){background:#f1f5f9}

  /* ---------- sidebar ---------- */
  .side{position:sticky;top:78px;display:flex;flex-direction:column;gap:14px;
    max-height:calc(100vh - 96px)}
  .score{background:var(--brand-soft);border:1px solid #dbeafe;border-radius:16px;
    padding:18px;text-align:center}
  .score .pc{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1.1}
  .score .lb{font-size:12.5px;color:var(--muted);margin-top:3px}
  .grid{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:12px;overflow-y:auto;min-height:0}
  .grid .hd{font-size:12px;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.5px;padding:2px 4px 9px}
  .cells{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
  .cell{aspect-ratio:1;border-radius:9px;border:1.5px solid var(--line);background:#f8fafc;
    font:inherit;font-size:12.5px;font-weight:700;color:#475569;cursor:pointer;
    display:grid;place-items:center;transition:.12s;padding:0}
  .cell:hover{border-color:#94a3b8}
  .cell.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
  .cell.no{background:var(--no-bg);border-color:var(--no-line);color:var(--no)}
  .cell.now{border-color:var(--brand);border-width:2.5px;color:var(--brand);background:#fff}

  @media(max-width:980px){
    .wrap{grid-template-columns:1fr}
    .side{position:static;max-height:none;order:-1;flex-direction:row;flex-wrap:wrap}
    .score{flex:1;min-width:150px}
    .grid{flex:2;min-width:260px;max-height:210px}
    .card{padding:20px 17px}
    .stem{font-size:16.5px}
  }
  @media(max-width:520px){
    .top-in{flex-wrap:wrap;gap:9px}
    .bar{order:3;width:100%;flex-basis:100%}
    .nav .btn{flex:1}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div>
      <div class="logo">CCDV<span>-F</span></div>
      <div class="sub" id="sub">Ôn tập</div>
    </div>
    <div class="bar"><i id="pbar"></i></div>
    <div class="count"><b id="done">0</b> / <span id="total">0</span> đã làm</div>
  </div>
</header>

<main class="wrap">
  <section class="card" id="card"></section>

  <aside class="side">
    <div class="score">
      <div class="pc" id="pc">—</div>
      <div class="lb" id="sc">Chưa trả lời câu nào</div>
      <button class="btn ghost" id="resetProgress" style="margin-top:12px;width:100%">Xoá tiến độ</button>
    </div>
    <div class="grid">
      <div class="hd">Danh sách câu</div>
      <div class="cells" id="cells"></div>
    </div>
  </aside>
</main>

<script>
const QUESTIONS = [{"num":1,"stem":"Your Claude agent has access to a tool that retrieves customer records. A teammate has noticed that the agent occasionally calls the tool with arguments the schema does not declare, and the tool's downstream service returns an error each time. The teammate proposes loosening the schema so the tool accepts whatever arguments the model produces. How would you respond?","options":["Add a system prompt instruction telling the model to produce schema-conforming arguments, treating the prompt instruction as the primary mechanism for keeping the agent's tool calls valid.","Loosen the schema as the teammate proposed so the downstream service receives every call the agent makes during normal operation.","Keep the schema strict, validate arguments before dispatching, and return a structured error so the agent can retry.","Remove the schema entirely and rely on the downstream service to reject invalid calls, treating the downstream service as the team's primary enforcement layer."],"answer":2,"de":"Agent gọi tool với argument sai schema, teammate đề xuất nới lỏng schema để tool nhận mọi argument — nên phản hồi thế nào?","explain":["Giữ schema strict, validate argument trước khi dispatch, trả structured error để agent tự retry"]},{"num":2,"stem":"A new agent your team built handles customer support tickets, but it routinely gets confused when a single ticket spans billing, shipping, and product issues. The agent often loses track of which sub-issue it has already addressed and revisits the same one. The team is considering architectural changes. What architectural change would you recommend?","options":["Introduce an orchestrator agent that delegates billing, shipping, and product sub-issues to dedicated subagents.","Switch to a deterministic workflow that handles billing, shipping, and product issues in a fixed sequence.","Increase the size of the agent's context window so it can hold the full ticket history at once.","Add detailed prompting that instructs the agent to track which sub-issues have been resolved and which remain."],"answer":0,"de":"Agent xử lý ticket đa vấn đề (billing/shipping/product) bị mất track, lặp lại sub-issue đã giải quyết — nên đổi architecture nào?","explain":["Orchestrator-subagent pattern tách mỗi sub-issue cho một subagent riêng với context/state độc lập, giúp tránh mất track giữa các sub-issue."]},{"num":3,"stem":"Your Claude application is hitting context window limits when processing long customer service transcripts. A junior developer suggests increasing the temperature parameter to fix the issue. How would you respond?","options":["Increase the temperature parameter as the junior developer suggested and observe whether the context window issue resolves over the next several runs of the application in production.","Adjust the temperature parameter together with the max_tokens parameter, treating the combined adjustment as the team's mechanism for managing context window pressure during long-transcript processing.","Remove the system prompt entirely to make room for longer transcripts in each request, freeing up context window space the system prompt would otherwise consume.","Explain that temperature controls sampling randomness and is unrelated to context capacity, then address the context issue through summarization or chunking."],"answer":3,"de":"Junior dev đề xuất tăng temperature để fix lỗi context window limit — nên phản hồi thế nào?","explain":["Temperature chỉ điều khiển sampling randomness, không liên quan đến context capacity; cần xử lý đúng root cause bằng summarization/chunking."]},{"num":4,"stem":"You are running Claude Code as part of an automated continuous integration pipeline. The pipeline needs Claude Code to execute a set of well-defined tasks without prompting for confirmation, and the output needs to be captured for downstream processing. How would you configure the pipeline?","options":["Replace Claude Code with a different tool that does not require any configuration to operate without confirmation prompts in the pipeline.","Run Claude Code in headless mode with the required permissions configured in settings.json and capture its output for downstream processing.","Disable Claude Code's confirmation prompts globally across all environments so the pipeline runs without interruption from any prompt.","Run Claude Code in interactive mode and have a developer manually approve every confirmation prompt while the pipeline executes its tasks."],"answer":1,"de":"Chạy Claude Code trong CI pipeline tự động, cần thực thi task không cần confirm và capture output — nên config thế nào?","explain":["Headless mode kết hợp permissions khai báo cụ thể trong settings.json là cách chuẩn để chạy non-interactive trong CI, vừa an toàn (scoped permission) vừa capture được output cho downstream processing."]},{"num":5,"stem":"Your application uses the Messages API to handle multi-turn conversations. Each new turn resends the entire conversation history, and your token costs are growing as conversations get longer. You suspect there is a more efficient approach. How would you address this?","options":["Use prompt caching to reuse the static portions of the conversation context across turns instead of paying for them at the normal input-token rate on every request the application sends.","Switch to the Batch API for every turn so the per-call cost is reduced, treating the batch as the team's primary cost-control mechanism for multi-turn work.","Truncate every conversation to the last two messages so that token usage stays low and costs remain predictable across the application's normal operation.","Summarize each conversation after every turn and replace the full history with the summary on the next request, reducing token count at the cost of fidelity."],"answer":0,"de":"Multi-turn conversation gửi lại toàn bộ history mỗi turn khiến token cost tăng dần — nên xử lý thế nào cho hiệu quả?","explain":["Prompt caching tái sử dụng phần static của context qua các turn, tránh trả input-token rate bình thường cho phần lặp lại mỗi request."]},{"num":6,"stem":"You are designing a Claude application that will require structured JSON output for downstream processing. The output schema is well-defined, and downstream systems will reject malformed JSON.","options":["Structure the prompt to request output in a schema that is described in plain English, with downstream systems parsing whatever shape Claude produces.","Define a clear schema and structure the prompt to request output in that schema, with downstream systems handling any validation needed.","Define a clear schema, structure the prompt to request output in that schema, and validate Claude's output against the schema before passing it downstream.","Avoid structured output and use free-form text everywhere instead, on the grounds that free-form text is more flexible and handles edge cases better than structured schemas."],"answer":2,"de":"Cần structured JSON output cho downstream, schema đã well-defined và downstream reject malformed JSON — nên thiết kế thế nào?","explain":["Định nghĩa schema rõ ràng, prompt yêu cầu output theo schema đó, và validate output trước khi pass downstream — đảm bảo đúng format ngay từ phía application thay vì phó mặc cho downstream."]},{"num":7,"stem":"The Claude application your team built has grown over six months, and the prompt-handling code has accumulated duplication and tangled control flow. The functionality is working, but new features are getting harder to add. How would you address this?","options":["Plan a refactoring pass to consolidate duplicated logic, separate concerns, and simplify control flow before adding new features.","Refactor the prompt-handling code in small increments as part of each new feature ticket, treating the cleanup as a side effect of feature work.","Continue adding features and plan a refactoring pass after the next two release cycles when the team has more bandwidth for internal work.","Move all the prompt-handling code into a single large function to reduce the number of files developers have to navigate when reading the code."],"answer":0,"de":"Prompt-handling code sau 6 tháng bị duplication và tangled control flow, khó thêm feature mới — nên xử lý thế nào?","explain":["Lên kế hoạch refactor để gom logic trùng lặp, tách concerns và đơn giản hóa control flow trước khi thêm feature mới, giải quyết root cause thay vì trì hoãn hoặc vá tạm."]},{"num":8,"stem":"You are designing a multi-step Claude workflow where some steps must reason without seeing the full prior conversation history. The team wants to keep specific context isolated to specific steps. The context engineering technique you would use is...","options":["Augmenting the context with all available content at every step so each step has access to the entire prior history of the workflow during its reasoning.","Using a single global prompt that applies to every step in the workflow no matter what each step is reasoning about during its run.","Context isolation through subagents or multi-step agentic workflows that scope each step's context to only what the step needs.","Embedding the full prior history in each step regardless of whether the step needs the prior history for its reasoning."],"answer":2,"de":"Multi-step workflow cần một số step reasoning mà không thấy toàn bộ history trước đó, muốn isolate context theo từng step — nên dùng technique nào?","explain":["Context isolation qua subagents/multi-step agentic workflow giới hạn context của mỗi step chỉ còn phần cần thiết, đúng với yêu cầu tách biệt context theo step."]},{"num":9,"stem":"You are building an MCP server that exposes several internal data sources as MCP resources. The server needs to be deployed so multiple Claude applications can integrate with it. How would you approach the build and deployment?","options":["Author the server with clearly defined resources, tools, and prompts, choose a communication pattern, and deploy to an accessible hosting environment.","Build the MCP server with resource and tool definitions scoped to the first Claude application that needs it, and extend the definitions to additional applications as each integration is requested.","Deploy the MCP server only on individual developer machines, with the Claude applications unable to reach the server outside each developer's machine.","Bypass the MCP server and embed each data source directly in every Claude application that needs the data, with each application maintaining its own integration."],"answer":0,"de":"Xây MCP server expose internal data sources, cần deploy để nhiều Claude application tích hợp được — nên tiếp cận build/deploy thế nào?","explain":["Thiết kế server với resources, tools, prompts được định nghĩa rõ ràng ngay từ đầu, chọn communication pattern phù hợp và deploy lên hosting environment mà nhiều application đều truy cập được, thay vì scope hẹp theo từng application riêng lẻ."]},{"num":10,"stem":"Your Claude agent's hooks are currently triggered for every action, which slows down the agent significantly even when actions pose no risk. The team wants to scope hooks more carefully. How would you scope the hooks?","options":["Scope hooks to only the high-risk actions, such as destructive operations or sensitive data access, and remove hooks from low-risk actions to balance safety with performance.","Disable all hooks while the team re-scopes them, treating the period of no hook enforcement as a temporary state during the re-scoping work.","Disable the agent during peak hours so the hook overhead does not slow the application down during the busiest periods of the day across the application's operation.","Replace hooks with system prompt instructions on the grounds that prompt instructions can produce the same enforcement effect that hooks produce on the agent's actions."],"answer":0,"de":"Hooks bị trigger cho mọi action kể cả action không rủi ro, làm agent chậm — nên scope hooks lại thế nào?","explain":["Chỉ scope hooks vào các high-risk action (destructive operations, sensitive data access), bỏ hooks khỏi low-risk action để cân bằng giữa safety và performance."]},{"num":11,"stem":"A teammate has submitted a pull request that adds a Claude-powered feature to your service. The code works, but the prompt and model selection are hard-coded inline, error handling is missing, and there are no tests for the integration. What would you request during code review?","options":["Approve the pull request and add the missing pieces yourself in a follow-up commit so the teammate can move on to other work immediately.","Approve the pull request as-is, on the grounds that the feature works in the happy path and the missing pieces can be added in follow-up commits.","Request changes that move prompt and model configuration to a configurable location and add tests, treating the missing error handling as a follow-up release item.","Request changes that move prompt and model configuration to a configurable location, add error handling for Claude API failures, and add tests for the integration."],"answer":3,"de":"PR thêm Claude-powered feature nhưng prompt/model hard-code inline, thiếu error handling và thiếu test — nên request gì khi review?","explain":["Yêu cầu đưa prompt/model config ra vị trí configurable, bổ sung error handling cho Claude API failures, và thêm test cho integration — giải quyết đầy đủ cả ba gap cùng lúc thay vì trì hoãn phần nào."]},{"num":12,"stem":"Your Claude application receives untrusted input from external sources. The team is establishing how the application should treat this untrusted input. Untrusted input would be...","options":["Validated and sanitized before being incorporated into prompts, and treated as data the model should not interpret as instructions.","Treated identically to trusted input from internal sources, on the grounds that all input the application receives can be handled the same way.","Routed through a separate Claude application with more lax security controls so the original application does not handle the untrusted input directly.","Blocked entirely so the application accepts only trusted input, with no path for legitimate external input the application might process."],"answer":0,"de":"Application nhận untrusted input từ external sources — nên xử lý thế nào?","explain":["Validate và sanitize untrusted input trước khi đưa vào prompt, và luôn coi đó là data chứ không phải instruction mà model được phép tuân theo."]},{"num":13,"stem":"A teammate has asked you to explain when a Skill would be the right choice over an MCP server. The teammate is unsure how the two differ in practice when both can be reused across teams. How would you explain the distinction?","options":["A Skill and an MCP server are equivalent extension mechanisms that the team can use interchangeably for any reusable capability that needs to be accessible across teams.","A Skill is the older mechanism and an MCP server is the newer one, so the team should prefer an MCP server for any reusable capability that the team builds going forward.","A Skill is preferable for cross-team reuse because it loads more efficiently than an MCP server during normal operation in the team's typical multi-team workloads.","A Skill bundles prompts, scripts, and data into a package the model loads as a unit while an MCP server exposes resources, tools, and prompts through a standard client interface."],"answer":3,"de":"Phân biệt khi nào chọn Skill thay vì MCP server khi cả hai đều reuse được across teams?","explain":["Skill là package gộp prompts/scripts/data mà model load như một unit, còn MCP server expose resources/tools/prompts qua standard client interface — khác nhau về cơ chế, không phải về hiệu năng hay thứ tự ra đời."]},{"num":14,"stem":"Your Claude application runs long agentic workflows where the agent makes many tool calls, and the conversation history grows quickly. After about 20 tool calls, you notice the agent's responses become less focused and sometimes ignore earlier task constraints. How would you address this?","options":["Remove tool calling from the workflow entirely so the agent operates as a single text-generation step with no tool outputs accumulating in the context window.","Apply context engineering techniques such as tool output pruning or compaction to keep the active task state visible while reducing the volume of older content.","Increase the model's context window so the agent can hold every tool output at full detail across the entire workflow no matter how many tool calls it accumulates.","Restart the agent every five tool calls to prevent any drift, with the agent losing all task state at each restart point during the workflow."],"answer":1,"de":"Agentic workflow với nhiều tool call khiến response mất focus và bỏ quên constraint sau ~20 lần gọi tool — nên xử lý thế nào?","explain":["Áp dụng context engineering (tool output pruning, compaction) để giữ active task state rõ ràng trong khi giảm volume content cũ, giải quyết đúng nguyên nhân context bị pha loãng theo thời gian."]},{"num":15,"stem":"Your team is preparing to roll out a configuration change that updates several prompt versions across a Claude application used by multiple downstream systems. The change has already been tested in staging, but the team has not assessed how the prompt change will affect each downstream system that depends on the application's output. What would you do before rolling out the change?","options":["Assess the configuration impact on each downstream system before rolling out, and coordinate with downstream system owners as needed.","Document the prompt version changes in the application changelog and proceed with the rollout, treating the staging test results as sufficient evidence of impact across all downstream systems.","Notify downstream system owners that a change is coming and schedule the rollout for the following week, without conducting a formal impact assessment.","Limit the rollout to systems that were explicitly included in staging testing, and defer all other downstream systems until a later release cycle."],"answer":0,"de":"Chuẩn bị rollout config change (cập nhật prompt version) ảnh hưởng nhiều downstream system, đã test staging nhưng chưa assess impact từng downstream — nên làm gì trước khi rollout?","explain":["Đánh giá impact của config change lên từng downstream system trước khi rollout, và phối hợp với owner của các hệ thống đó khi cần, thay vì chỉ dựa vào kết quả staging test."]},{"num":16,"stem":"You are designing a Claude application that maintains user sessions across multi-turn conversations. The product team has asked how the application will handle session lifecycle: when sessions should expire, how state is reset, and how the application avoids carrying stale context into new conversations. How would you design session lifecycle?","options":["Define explicit session expiration rules, state reset triggers, and rules for starting fresh sessions so stale context does not leak into new conversations.","Define a single short session timeout that applies across all conversations and treat the timeout as the application's complete session lifecycle mechanism.","Define explicit session expiration rules but rely on users to start new conversations when they want fresh context, with no automatic reset triggers in the application.","Define state reset triggers tied to specific application events but apply them across all sessions globally, with no per-session expiration rules."],"answer":0,"de":"Thiết kế session lifecycle cho ứng dụng multi-turn: expiration, state reset, tránh stale context leak sang session mới — nên thiết kế thế nào?","explain":["Định nghĩa đầy đủ cả ba: session expiration rules, state reset triggers, và rules cho việc bắt đầu session mới, đảm bảo stale context không leak sang conversation mới thay vì chỉ dùng một cơ chế đơn lẻ."]},{"num":17,"stem":"Your Claude application's error handling currently logs every API error with the same severity level. The team wants to differentiate between errors that should page an on-call engineer and errors that should be logged for later review. How would you structure the error handling?","options":["Page on every error, on the grounds that paging guarantees that no error is missed by the team during normal operation across the application's lifecycle.","Disable logging for any error that does not page, treating non-paging errors as not worth recording for later review either.","Categorize errors by severity based on impact and recoverability, then route each category to the appropriate channel for paging or logging.","Log every error with the same severity, on the grounds that differentiating severity adds complexity that does not pay off in most application setups over time."],"answer":2,"de":"Error handling hiện log mọi API error cùng mức severity, cần phân biệt lỗi nào page on-call vs lỗi nào chỉ log để review sau — nên cấu trúc thế nào?","explain":["Phân loại error theo severity dựa trên impact và recoverability, rồi route từng category đến đúng channel (page hoặc log), đảm bảo differentiation thực chất thay vì xử lý đồng nhất hoặc bỏ sót error không page."]},{"num":18,"stem":"Your team's Claude application has been in production for a year, and the team has decided to formalize its testing strategy. Currently, the team writes ad-hoc tests for individual features but has no overall testing approach. What testing approach would you formalize?","options":["Adopt a test-driven development practice where unit tests are written before each feature is implemented and must pass before code is merged.","Define unit tests for individual functions, integration tests for the Claude integration, and end-to-end tests for critical user flows, applied consistently across the codebase.","Continue writing ad-hoc tests as features ship and introduce a peer review step to ensure each test adequately covers the feature being released.","Define a single testing approach that uses end-to-end tests and apply it consistently across all new features as they are added to the codebase."],"answer":1,"de":"Application đã production 1 năm, hiện chỉ có ad-hoc test không có overall strategy — nên formalize testing approach nào?","explain":["Kết hợp đầy đủ ba tầng: unit test cho từng function, integration test cho Claude integration, và end-to-end test cho critical user flow, áp dụng nhất quán toàn codebase thay vì chỉ dùng một loại test đơn lẻ."]},{"num":19,"stem":"Your Claude application uses structured output that is consumed by downstream code. The team wants to handle malformed or unexpected output gracefully so it does not crash downstream systems. The best choice for handling this issue would be to...","options":["Crash on any unexpected output and require manual recovery on affected requests the application handles during normal operation.","Silently drop any output that does not match expectations so downstream systems do not see the malformed output the application receives from the model.","Use the output the model produces and leave schema enforcement to a later phase of production after the application is more complete.","Apply defensive parsing to handle unexpected fields, missing values, and type mismatches that the downstream code might otherwise crash on."],"answer":3,"de":"Structured output bị downstream code consume, cần xử lý malformed/unexpected output tránh crash downstream — nên chọn cách nào?","explain":["Áp dụng defensive parsing để xử lý unexpected fields, missing values, type mismatches, chủ động ngăn downstream crash thay vì bỏ qua schema enforcement hoặc im lặng drop output."]},{"num":21,"stem":"Your Claude application validates structured output but has been treating validation failures as terminal errors. Each validation failure causes the entire user request to fail. The team wants to handle validation failures more gracefully. How would you handle the validation failures?","options":["Pass validation failures directly to downstream systems and let each downstream system decide how to handle the malformed output.","Disable output validation until the underlying cause of validation failures has been identified and addressed in a future release.","Treat validation failures as a recognized error path that triggers retry, repair, or fallback logic before failing the user request.","Tell users that validation failures are unavoidable and instruct them to perform manual accuracy checks before relying on outputs."],"answer":2,"de":"Validation failures hiện đang là terminal error làm fail toàn bộ user request — nên xử lý graceful hơn thế nào?","explain":["Coi validation failure là một error path được nhận diện rõ, kích hoạt retry/repair/fallback logic trước khi thực sự fail request, thay vì fail ngay lập tức hoặc đẩy trách nhiệm cho downstream/user."]},{"num":22,"stem":"You are choosing a Claude model for a high-volume classification task. Each classification is straightforward, latency requirements are tight, and per-request cost matters at scale. Which model would you choose?","options":["A mid-tier Claude model selected by default, because mid-tier models balance quality and cost in a way the team can apply across most tasks.","Multiple Claude models in series, where each request runs through more than one model and the application combines the outputs into a final classification.","A smaller, faster Claude model, because the task is straightforward and the workload prioritizes latency and per-request cost at scale.","The largest, highest-capability Claude model, to maximize quality on every classification the application produces during normal operation across all requests."],"answer":2,"de":"Chọn model cho high-volume classification task đơn giản, yêu cầu latency chặt và cost/request quan trọng ở scale — nên chọn model nào?","explain":["Chọn model nhỏ, nhanh hơn vì task đơn giản và workload ưu tiên latency cùng cost/request ở quy mô lớn, không cần \"over-provision\" bằng model lớn nhất."]},{"num":23,"stem":"Your Claude agent performs database operations. A recent incident occurred where the agent ran a destructive query that affected production data. The team wants to add deterministic controls to prevent similar incidents. How would you prevent similar incidents?","options":["Run the agent only during business hours when humans are available to monitor its activity, treating the schedule as the primary control mechanism for destructive operations.","Add Claude hooks that intercept database operations and apply deterministic checks, such as blocking destructive queries or requiring approval, before the queries execute.","Switch to a higher-capability Claude model on the grounds that a more capable model is less likely to run destructive queries during normal operation across all requests.","Add a system prompt instruction telling the agent to be careful with database operations on every request the application handles during normal operation across all incoming traffic."],"answer":1,"de":"Agent chạy destructive query ảnh hưởng production data, cần deterministic control để tránh lặp lại — nên làm gì?","explain":["Thêm hooks intercept database operations, áp dụng deterministic check (block destructive query hoặc yêu cầu approval) trước khi query thực thi — đây là control mang tính deterministic thực sự, khác với việc chỉ dựa vào model tốt hơn hay prompt instruction (vốn không đảm bảo)."]},{"num":24,"stem":"You are designing a Claude application that helps medical researchers analyze multi-step clinical case studies. The application must work through differential diagnoses by considering symptom patterns, weighing evidence across competing hypotheses, and showing intermediate reasoning steps before producing a final recommendation. The team is choosing among Claude's available model options. The model option best suited to this use case is...","options":["Zero-shot prompting alone with no model option adjustments, which keeps the application's configuration as simple as possible.","Extended thinking, which lets the model reason through the differential diagnosis steps before producing the final recommendation.","Fast mode, which prioritizes the lowest possible latency at the expense of reasoning depth on complex tasks.","A smaller model with a tighter context window, which encourages the model to focus its limited capacity on the task."],"answer":1,"de":"Application phân tích multi-step clinical case study cần differential diagnosis, weigh evidence, show intermediate reasoning — nên chọn model option nào?","explain":["Extended thinking cho phép model reason qua từng bước differential diagnosis trước khi đưa ra recommendation cuối, phù hợp với yêu cầu weigh evidence và show intermediate reasoning steps."]},{"num":25,"stem":"You are setting up Claude Code for a new project repository. Your team has shared coding standards, preferred libraries, and project-specific context that every developer working on the repository should have available when they use Claude Code. How would you set this up?","options":["Document the standards in a separate wiki page maintained outside the repository so the documentation stays decoupled from the source code.","Configure Claude Code through environment variables that each developer sets on their own machine when they begin working in the repository.","Initialize Claude Code in the repository and document the standards and project-specific context in a CLAUDE.md file at the repository root.","Add the coding standards and project context to the repository's existing README file and direct developers to reference it when starting Claude Code sessions."],"answer":2,"de":"Setup Claude Code cho repo mới, cần chia sẻ coding standards/thư viện ưu tiên/project context cho mọi developer — nên setup thế nào?","explain":["Khởi tạo Claude Code trong repo và ghi standards/project context vào file CLAUDE.md ở root, đúng cơ chế Claude Code dùng để tự động load context cho mọi developer làm việc trên repo."]},{"num":26,"stem":"Your Claude application processes 50-page legal contracts and produces summaries with citation references back to the source. The team is debating whether to send each contract whole or split it into smaller pieces. The contracts fit within Claude's context window. Initial testing shows that whole-document processing produces summaries with stronger cross-section reasoning but occasionally drifts on citation accuracy in later sections. Chunked processing produces stronger citation accuracy per chunk but loses cross-section reasoning. The team has not decided which property matters more. How would you guide the team's decision?","options":["Review the citation accuracy results from chunked processing and determine whether the loss of cross-section reasoning produces summaries that still meet the application's quality bar.","Identify which property matters more for the application's actual use case and let that decision drive the chunking approach, then validate the choice against representative contracts.","Examine the use cases where cross-section reasoning failures occur and assess whether whole-document processing meets the application's accuracy requirements across a representative sample of contracts.","Assess the cost and latency implications of both approaches against the application's performance requirements before recommending which processing strategy to adopt."],"answer":1,"de":"Chọn whole-document vs chunked processing cho legal contract summary — trade-off cross-section reasoning vs citation accuracy, chưa rõ ưu tiên nào quan trọng hơn.","explain":["Xác định property nào quan trọng hơn với use case thực tế trước, rồi validate lựa chọn đó trên contract mẫu — đi từ yêu cầu nghiệp vụ thay vì chỉ soi kết quả kỹ thuật của một phương án."]},{"num":27,"stem":"Your Claude application makes high-volume API calls during business hours and very few calls overnight. The team is concerned about staying within rate limits during peak hours and wants to understand how the Claude API enforces those limits. How would you proceed?","options":["Review the API documentation for streaming endpoints and evaluate whether migrating peak-hour calls to streaming reduces exposure to rate limit enforcement.","Assess the average payload size of current API calls and consolidate requests where possible to reduce the total number of calls made during peak hours.","Identify the rate limits, design the application to stay within them during peak hours, and use exponential backoff when limits are reached.","Examine the peak-hour request patterns in your application logs and smooth traffic by distributing requests more evenly across the business-hours window."],"answer":2,"de":"Ứng dụng gọi API cao điểm giờ hành chính, lo ngại vượt rate limit — nên tiếp cận thế nào để tuân thủ rate limit của Claude API?","explain":["Xác định rõ rate limit, thiết kế application vận hành trong giới hạn đó ở peak hours, và dùng exponential backoff khi chạm limit — vừa phòng ngừa vừa có cơ chế retry đúng chuẩn khi vượt ngưỡng."]},{"num":28,"stem":"You are building a Claude application that processes 10,000 customer emails overnight to extract structured data. The work is non-interactive, runs once daily, and has a flexible completion window of several hours. Which Claude API would you use?","options":["The Batch API, which is designed for non-interactive workloads with flexible completion windows.","The streaming responses API to process each email and return partial results to a database as the model generates them.","The real-time Messages API, processing the emails one at a time sequentially to ensure consistent ordering of results.","The real-time Messages API with concurrent requests to process the emails as fast as possible during the overnight window."],"answer":0,"de":"Xử lý 10,000 email non-interactive, chạy 1 lần/đêm, có flexible completion window vài giờ — nên dùng API nào?","explain":["Batch API được thiết kế đúng cho workload non-interactive với completion window linh hoạt, phù hợp bản chất bài toán hơn so với các phương án dùng real-time Messages API hay streaming."]},{"num":29,"stem":"Your enterprise has a contract with AWS that requires Claude API calls to flow through Amazon Bedrock rather than the direct Anthropic API. Your team is building a new Claude application and is unfamiliar with this constraint. How would you build the application?","options":["Build two parallel implementations of every call, one for the direct Anthropic API and one for Bedrock, and pick the faster one at runtime.","Build the application against the direct Anthropic API now and migrate to Bedrock in a follow-up release once the team has more experience with the Bedrock API.","Configure the application to invoke Claude through the Bedrock-compatible API path while keeping the application's logic provider-agnostic.","Build the application against the direct Anthropic API and ignore the contractual requirement to route Claude calls through Amazon Bedrock."],"answer":2,"de":"Enterprise có hợp đồng AWS bắt buộc gọi Claude API qua Amazon Bedrock thay vì direct Anthropic API — nên xây application thế nào?","explain":["Cấu hình application gọi Claude qua Bedrock-compatible API path ngay từ đầu, đồng thời giữ logic ứng dụng provider-agnostic để tuân thủ ràng buộc hợp đồng mà không tạo nợ kỹ thuật hay vi phạm constraint."]},{"num":30,"stem":"You are designing an agent that handles a complex claim-processing workflow. Each claim moves through fact extraction, eligibility evaluation, and a decision step. The three subtasks have distinct success criteria, and some claims require iteration between fact extraction and eligibility evaluation before a decision can be reached. Which agent pattern would you apply?","options":["A graph-based pattern that lets the agent move between subtasks based on the state of each claim, with each subtask evaluated against its own criteria.","A streaming pattern that emits partial decisions as the agent processes each claim, refining the output until a final decision emerges from the stream.","A single tool-use loop pattern that gives one agent access to all the tools needed for fact extraction, eligibility evaluation, and decision-making.","A linear chain pattern that processes every claim through fact extraction, then eligibility evaluation, then decision, with no return paths between subtasks."],"answer":0,"de":"Workflow xử lý claim gồm 3 subtask (fact extraction, eligibility evaluation, decision) với success criteria riêng và cần iterate qua lại giữa fact extraction và eligibility evaluation — nên chọn agent pattern nào?","explain":["Graph-based pattern cho phép agent di chuyển linh hoạt giữa các subtask dựa trên state của claim, đánh giá từng subtask theo tiêu chí riêng — đáp ứng đúng yêu cầu iteration qua lại, khác với linear chain (không có return path)."]},{"num":31,"stem":"You are explaining to a stakeholder why running the same Claude prompt twice can produce slightly different results. The stakeholder is concerned this means the application is broken. How would you address the stakeholder's concern?","options":["Tell the stakeholder the variation is a bug that the team will fix in the next release of the application, then create a work ticket to fix the bug.","Tell the stakeholder the variation comes from network latency and that switching to a faster network connection will produce more consistent results across runs.","Explain that LLMs are non-deterministic by default due to sampling, and describe how the application handles this through validation, retries, or temperature adjustment.","Tell the stakeholder the variation is caused by Claude being updated continuously by Anthropic, and that switching to a fixed model snapshot will eliminate the variation entirely."],"answer":2,"de":"Stakeholder lo ngại vì cùng một prompt chạy 2 lần ra kết quả khác nhau, tưởng application bị lỗi — nên giải thích thế nào?","explain":["Giải thích LLM vốn non-deterministic do sampling (không phải bug), và mô tả application đã xử lý qua validation, retry, hoặc điều chỉnh temperature — đúng bản chất kỹ thuật thay vì đổ lỗi cho network hay model update."]},{"num":32,"stem":"You are implementing a custom tool for your Claude agent. The tool needs to interact with an external pricing service that returns product data. Which of the following best practices would you apply as you develop this tool?","options":["Omit the tool description and let the model infer when to use the tool based on the tool's name and the rest of the prompt context.","Define the tool with a loose schema and let the model interpret the inputs flexibly on each call the agent makes.","Implement the tool with no error handling and let the agent loop catch failures whenever the pricing service returns an error during operation.","Define the tool with a clear schema, write a precise description for when to call it, and handle pricing service errors explicitly."],"answer":3,"de":"Implement custom tool cho agent tương tác với external pricing service — nên áp dụng best practice nào?","explain":["Định nghĩa tool với schema rõ ràng, mô tả chính xác khi nào nên gọi tool, và xử lý lỗi từ pricing service một cách tường minh — bao quát đủ ba yếu tố quan trọng của một tool implementation tốt."]},{"num":33,"stem":"Your Claude application has multi-step workflows where each step's output is needed only briefly before the agent moves on. The cumulative tool output is filling the context window with content that is no longer relevant. How would you handle the accumulating tool output?","options":["Apply tool output pruning to remove tool outputs that are no longer needed by later steps in the workflow.","Apply prompt caching to the accumulated tool outputs so the application does not re-pay for the older content on each subsequent step.","Switch to a smaller Claude model that processes context more efficiently and treat any quality loss as a tradeoff for the cost reduction.","Keep every tool output in the context indefinitely so the agent has the full record of every step it has executed during the workflow."],"answer":0,"de":"Multi-step workflow, mỗi step output chỉ cần dùng ngắn hạn nhưng tool output tích lũy làm đầy context window với nội dung không còn liên quan — nên xử lý thế nào?","explain":["Áp dụng tool output pruning để loại bỏ output không còn cần thiết cho các step sau, giải quyết đúng nguyên nhân context bị chiếm dụng bởi nội dung đã hết giá trị — khác với prompt caching (chỉ tối ưu cost, không giảm volume context)."]},{"num":34,"stem":"You are setting up the configuration management approach for a new Claude Code project. Your team will use CLAUDE.md files and settings.json files to control behavior, and you want to make sure changes are tracked and reviewable. The configuration management approach would...","options":["Duplicate CLAUDE.md and settings.json files in multiple repositories to provide redundancy, on the grounds that a single source of truth is risky for project configuration.","Version-control CLAUDE.md and settings.json files in a separate repository from the project's source code, so configuration evolves independently from the application code over time.","Version-control CLAUDE.md alongside the project's source code and settings.json files in a separate repository from the project's source code.","Version-control CLAUDE.md and settings.json files alongside the project's source code, with changes reviewed through standard pull request workflows the team applies."],"answer":3,"de":"Thiết lập configuration management cho CLAUDE.md và settings.json trong project Claude Code mới, cần đảm bảo changes được track và reviewable — nên tiếp cận thế nào?","explain":["Version-control cả CLAUDE.md và settings.json cùng với source code, review qua standard PR workflow — giữ configuration đồng bộ với codebase và tận dụng quy trình review sẵn có, thay vì tách rời ra repo riêng."]},{"num":35,"stem":"You are designing a Claude application that processes user-submitted text. Some of that text could include sensitive information such as account numbers or passwords that the application should not send to Claude. How would you design the application?","options":["Define the application boundary explicitly, identify what content can leave the boundary for Claude, and add filtering or redaction at the boundary.","Add a prompt instruction in the system prompt specifying the categories of sensitive information Claude should disregard when processing user-submitted text.","Log all user-submitted text before it is sent to Claude and review the logs periodically to identify whether sensitive information is reaching the model.","Apply filtering at the boundary for the most commonly observed sensitive data patterns and expand coverage to additional patterns based on findings from production monitoring."],"answer":0,"de":"Xử lý user-submitted text có thể chứa sensitive info (account number, password) không nên gửi tới Claude — nên thiết kế application thế nào?","explain":["Định nghĩa rõ application boundary, xác định nội dung nào được phép rời boundary để đến Claude, và thêm filtering/redaction ngay tại boundary — chặn sensitive data trước khi model thấy, thay vì dựa vào prompt instruction (Claude vẫn nhận được data) hay chỉ log để review sau."]},{"num":36,"stem":"Your Claude agent has too many tools, and many of them have overlapping functionality. The agent often picks an inappropriate tool when several could plausibly handle a request. How would you address the tool selection problem?","options":["Add more tools to cover every variation of the requests the agent handles, on the grounds that more tools give the agent more accurate options to choose from.","Remove all tools and rely on the agent's general capability instead, with the application losing the workflows that previously relied on tools.","Add detailed examples to each tool's description so the agent can match incoming requests to the right tool by example, treating the examples as the team's selection mechanism.","Restructure the tool set by consolidating overlapping tools, removing unused tools, and clarifying tool descriptions so each tool has a distinct purpose."],"answer":3,"de":"Agent có quá nhiều tool overlapping chức năng, hay chọn sai tool — nên xử lý vấn đề tool selection thế nào?","explain":["Tái cấu trúc tool set: gộp các tool trùng chức năng, loại bỏ tool không dùng, làm rõ description để mỗi tool có mục đích riêng biệt — giải quyết root cause (overlap) thay vì thêm tool hay chỉ vá bằng example."]},{"num":37,"stem":"Your Claude application requests structured JSON output from the model. Most of the time the JSON is well-formed, but occasionally Claude returns malformed JSON that breaks downstream processing. How would you handle the malformed output?","options":["Manually inspect every response before downstream processing so a human reviewer catches any malformed JSON before the application passes the response to downstream systems.","Add output validation that parses Claude's response against the expected schema and treats malformed output as a recognized error path with retry or fallback handling.","Switch to free-form text output so the application no longer depends on JSON parsing for any of the responses it sends to downstream systems during normal operation.","Retry the same request repeatedly until valid JSON appears in the model's response, with the retry loop adding delay to the application's response time on affected requests."],"answer":1,"de":"Structured JSON output đôi khi malformed làm break downstream processing — nên xử lý thế nào?","explain":["Thêm output validation parse response theo schema kỳ vọng, coi malformed output là error path được nhận diện với retry/fallback handling — xử lý có kiểm soát thay vì retry mù quáng hoặc từ bỏ structured output."]},{"num":38,"stem":"A Claude application is producing outputs that drift away from the expected JSON format after several conversation turns. The first few turns produce correctly formatted output, but later turns gradually lose structure. How would you address the drift?","options":["Identify the failure mode as format drift, examine how the conversation context evolves over turns, and address the drift through context management or output validation.","Truncate every response to the first few characters, validate that the truncated output matches the expected JSON structure, and log any mismatches for review.","Restart the application after every turn and monitor whether the format remains consistent across subsequent interactions.","Switch to a smaller Claude model and re-test the application to determine whether the drift persists across conversation turns."],"answer":0,"de":"Output JSON đúng format ở vài turn đầu nhưng dần drift mất structure sau nhiều turn — nên xử lý thế nào?","explain":["Xác định đây là failure mode \"format drift\", xem xét context tiến hóa thế nào qua các turn, rồi xử lý bằng context management hoặc output validation — đi đúng vào nguyên nhân (context tích lũy) thay vì các biện pháp không liên quan như truncate hay đổi model."]},{"num":39,"stem":"Your Claude application's token costs have grown faster than expected. The team has not been tracking token usage by feature, so the team cannot identify which features are driving cost. The team is debating how to respond. How would you respond?","options":["Tell the team that cost growth is unavoidable as the application scales and that no investigation will change the trajectory of the application's cost over the next several quarters.","Switch every feature to the smallest model to cut cost broadly across the application during normal operation.","Reduce token usage uniformly across all features by half, applying the cut evenly across the application during normal operation.","Add token usage tracking by feature to the application's logging so the team can identify which features drive cost before recommending changes."],"answer":3,"de":"Token cost tăng nhanh hơn dự kiến nhưng chưa track usage theo feature nên không biết feature nào driving cost — nên phản hồi thế nào?","explain":["Thêm token usage tracking theo feature vào logging trước, để xác định đúng nguồn gây cost trước khi đề xuất thay đổi — tránh cắt giảm mù quáng hoặc đồng đều khi chưa có dữ liệu."]},{"num":40,"stem":"You maintain a Claude application that uses Claude Sonnet 4.5 across several production workflows. Anthropic released Claude Sonnet 4.7, which your evaluation suite shows performing 8% better on your highest-volume task. However, this version produces different output formatting on two of your structured-extraction prompts that downstream consumers parse with regex-based code. To roll out the upgrade, you would...","options":["Adjust the prompts to constrain output format, re-run evaluations against the expected parsing-layer schema, then roll the model out with a feature flag and the option to revert per workflow.","Switch the model identifier in the application's configuration to the new model, then monitor production for parsing failures to be fixed as failures surface.","Rewrite the downstream parsing code to accept a wider range of output formats to ensure the application is resilient to future model upgrades without requiring prompt changes.","Keep the older model in production to preserve the fragile parsing layer that may risk breaking with any model change."],"answer":0,"de":"Nâng cấp model mới cho hiệu năng tốt hơn nhưng làm thay đổi output format ở 2 prompt structured-extraction mà downstream đang parse bằng regex — nên rollout thế nào?","explain":["Điều chỉnh prompt để ràng buộc output format, re-run evaluation đối chiếu với schema mà parsing layer kỳ vọng, rồi rollout qua feature flag kèm khả năng revert theo từng workflow — chủ động kiểm soát rủi ro thay vì switch trực tiếp và chờ lỗi phát sinh trong production."]},{"num":41,"stem":"You are reviewing an architectural diagram for a Claude-powered travel-booking system. The diagram shows a top-level component that interprets user requests and three subordinate components that handle flights, hotels, and ground transportation. The top-level component is responsible for routing each request, sequencing the subordinate components, and reconciling their outputs into a final itinerary. The diagram also shows that each subordinate component has its own tool list and own short conversation history that is not shared with the others. Which architectural pattern does this diagram most closely describe?","options":["A manager and supervisor pattern with isolated context per subagent, where the top-level agent coordinates specialized subagents that each maintain their own conversation history and tool list.","A manager and supervisor pattern with shared context, where the top-level agent and the subagents all share a single conversation history that grows as the request flows through the system.","A pipeline pattern, where each component processes the user request in sequence and passes the full conversation history along with the request to the next component in the pipeline.","A retrieval-augmented pattern, where the top-level component retrieves relevant context from the subordinate components' indexed data stores before generating each response."],"answer":0,"de":"Diagram cho thấy top-level component route/sequence/reconcile 3 subordinate component (flights, hotels, ground transport), mỗi subordinate có tool list và conversation history riêng biệt không share — pattern nào phù hợp nhất?","explain":["Manager-supervisor pattern với context isolation per subagent: top-level agent điều phối các subagent chuyên biệt, mỗi subagent giữ tool list và conversation history riêng, đúng khớp với diagram mô tả."]},{"num":42,"stem":"You are integrating Claude into an application written in Python. The Claude SDK provides a Python client that wraps the underlying REST API. How would you integrate the SDK?","options":["Call the REST API directly with raw HTTP requests so the application avoids the SDK's abstraction between the application code and the API.","Use the Claude Python SDK and let it handle authentication, retries, and response parsing through its standard documented patterns for Python integrations.","Use a different LLM provider's SDK and translate the responses into Claude's API shape so the application can switch providers in the future.","Skip the SDK and embed Claude calls in shell commands invoked from Python, so that the application runs the calls outside the main Python process."],"answer":1,"de":"Tích hợp Claude vào ứng dụng Python đã có sẵn Python SDK — nên tích hợp thế nào?","explain":["Dùng trực tiếp Claude Python SDK, tận dụng cơ chế authentication, retries, response parsing chuẩn có sẵn thay vì tự implement raw HTTP hay đi vòng qua shell command."]},{"num":43,"stem":"A new Claude model release includes performance improvements for several reasoning tasks but has changed the format of its responses to system prompts that use multi-section instructions. Your application uses multi-section system prompts heavily. Initial evaluation on the application's actual workload shows the new model performs 8 percent better on reasoning tasks but produces malformed output on roughly 3 percent of requests because of the format change. The team is debating whether to upgrade. How would you decide?","options":["Upgrade immediately, because the 8 percent reasoning improvement outweighs the 3 percent malformed output rate across the application's typical request distribution.","Adapt the application's system prompt to the new model's format expectations and reevaluate, then upgrade only if the adapted prompt eliminates the malformed output while preserving the reasoning improvements.","Upgrade and add a downstream validation step that catches the 3 percent malformed output before it reaches users, treating the validation step as the team's mitigation for the format change.","Stay on the previous model permanently to avoid the malformed output rate and any future format changes that subsequent model releases might introduce in the application."],"answer":1,"de":"Model mới cải thiện reasoning 8% nhưng gây malformed output 3% do đổi format với multi-section system prompt — nên quyết định upgrade thế nào?","explain":["Điều chỉnh system prompt theo format model mới rồi re-evaluate, chỉ upgrade nếu adapted prompt loại bỏ được malformed output mà vẫn giữ được reasoning improvement — xử lý tận gốc nguyên nhân format thay vì chấp nhận lỗi hoặc vá downstream."]},{"num":44,"stem":"You are starting a new Claude application and have a small set of well-labeled examples that demonstrate the desired output format. You want to use these examples to guide Claude's behavior. How would you guide the application's behavior?","options":["Use multi-shot prompting by including the labeled examples in the prompt so Claude can match the desired output format on each request.","Use zero-shot prompting and rely on the model's general capability to produce the desired output format consistently across all incoming requests.","Embed the examples in a database and retrieve them at runtime as reference material for the team.","Train a custom model on the labeled examples before deployment so that the application does not need to include the examples in any prompt during operation."],"answer":0,"de":"Có sẵn bộ example được label tốt minh họa output format mong muốn — nên dùng để guide behavior thế nào?","explain":["Dùng multi-shot prompting, đưa trực tiếp các example vào prompt để Claude match đúng output format mong muốn trên mỗi request — tận dụng đúng những gì đã có sẵn thay vì train custom model hay bỏ qua ví dụ."]},{"num":45,"stem":"Your Claude application is producing inconsistent outputs for similar inputs, even when using the same model and prompt. You want to debug the issue systematically. Your debugging approach would...","options":["Lower the model's temperature and re-run the inconsistent inputs to determine whether the parameter change reduces output variability across runs.","Retry every request that produces an unexpected output and log the results to identify whether repeated calls converge on a consistent response pattern.","Assume inconsistent outputs reflect normal LLM non-determinism and document the variability as an accepted characteristic of the application's behavior.","Capture full traces of input, system prompt, user messages, model output, and parameters, then analyze the differences between consistent and inconsistent runs."],"answer":3,"de":"Application cho output inconsistent với input tương tự dù cùng model/prompt — nên debug hệ thống thế nào?","explain":["Capture full trace (input, system prompt, user message, output, parameters) rồi phân tích khác biệt giữa run consistent và inconsistent — cách tiếp cận có hệ thống để tìm root cause thay vì chỉnh tham số mò hoặc mặc định coi là non-determinism bình thường."]},{"num":46,"stem":"Your team uses Claude Code across multiple repositories. You want the team's rules and general coding standards to apply to all repositories, and other rules to apply only to specific repositories. The team is currently duplicating instructions across every repository's CLAUDE.md file. How would you address this?","options":["Move all instructions to a separate documentation site that developers consult during Claude Code sessions across all repositories.","Use a CLAUDE.md hierarchy that scopes general standards broadly and project-specific context within each repository's local CLAUDE.md.","Stop using CLAUDE.md altogether and ask each developer to configure Claude Code manually for each project they work on.","Use a single repository's CLAUDE.md as the central source of truth and link to it from every other repository's CLAUDE.md file."],"answer":1,"de":"Nhiều repo đang duplicate instructions trong CLAUDE.md, muốn general standard áp dụng toàn team còn rule riêng chỉ áp dụng từng repo — nên xử lý thế nào?","explain":["Dùng CLAUDE.md hierarchy: scope general standard ở tầng rộng, còn context riêng của từng project nằm trong CLAUDE.md local của repo đó — tránh duplicate mà vẫn giữ được phân tầng rõ ràng."]},{"num":47,"stem":"A new agent your team built handles customer support tickets, but it routinely gets confused when a single ticket spans billing, shipping, and product issues. The agent often loses track of which sub-issue it has already addressed and revisits the same one. The team is considering architectural changes. What architectural change would you recommend?","options":["Switch to a deterministic workflow that handles billing, shipping, and product issues in a fixed sequence.","Add detailed prompting that instructs the agent to track which sub-issues have been resolved and which remain.","Introduce an orchestrator agent that delegates billing, shipping, and product sub-issues to dedicated subagents.","Increase the size of the agent's context window so it can hold the full ticket history at once."],"answer":2,"de":"Agent xử lý ticket đa vấn đề (billing/shipping/product) bị mất track, lặp lại sub-issue đã giải quyết — nên đổi architecture nào?","explain":["Orchestrator-subagent pattern tách mỗi sub-issue cho một subagent riêng với context/state độc lập, giúp tránh mất track giữa các sub-issue."]},{"num":48,"stem":"The team is debating whether to integrate with the Claude API directly or through a third-party abstraction layer that supports multiple LLM providers. The team has identified that all current and projected use cases run on Claude, no internal customer has requested LLM portability, and the team's product roadmap does not mention multi-provider support over the next two years. The third-party abstraction would add roughly 15 percent overhead in code complexity and introduce one additional dependency. Which integration approach would you recommend?","options":["The third-party abstraction layer, on the grounds that multi-provider support is valuable for any application as a matter of long-term flexibility across vendors.","Both integration paths in parallel, where the application uses each path on different runs to compare which performs better in production over time.","A custom multi-provider abstraction layer the team builds in-house so that the team controls every part of the abstraction the application uses for its API calls.","Direct integration with Claude through its SDK, because no multi-provider need exists and abstraction would add complexity that does not pay off."],"answer":3,"de":"Không có nhu cầu multi-provider hiện tại/dự kiến, abstraction layer sẽ tốn thêm 15% code complexity và một dependency — nên chọn integration approach nào?","explain":["Tích hợp trực tiếp với Claude SDK vì không có nhu cầu multi-provider thực tế, tránh trả giá phức tạp cho một khả năng linh hoạt không cần dùng đến (YAGNI)."]},{"num":49,"stem":"Your Claude application has been running for several conversation turns, and you notice the model occasionally references information that was discussed many turns ago but is no longer relevant. You suspect context drift is causing the model to weight stale content too heavily. How would you address the drift?","options":["Increase the context window size so all turns of the conversation remain visible to the model in full detail.","Reset the conversation after every turn so the model loses all prior turns when generating a response.","Apply compaction to summarize older portions of the conversation so the gist remains while the specifics carry less weight.","Truncate the conversation so the model sees only the most recent turn during each subsequent response."],"answer":2,"de":"Model đôi khi tham chiếu thông tin từ nhiều turn trước không còn relevant do context drift — nên xử lý thế nào?","explain":["Áp dụng compaction để summarize phần conversation cũ, giữ lại gist nhưng giảm trọng số của chi tiết cụ thể — cân bằng giữa giữ thông tin và giảm stale content, khác với truncate (mất hoàn toàn) hay tăng context window (không giải quyết root cause)."]},{"num":50,"stem":"Your Claude application uses tool calling to fetch patient data and generate summary reports. The flow occasionally fails because the model returns a tool_use block that references arguments not present in the schema, and your application code does not handle this case gracefully. How would you address this?","options":["Validate the tool_use block's arguments against the tool schema before dispatching the tool and handle invalid arguments as a recognized error path.","Log invalid tool_use blocks when they occur and allow the tool dispatch to proceed, relying on the tool's own error handling to surface failures back to the application.","Retry the same request repeatedly until the model returns a valid tool_use block that matches the schema as expected.","Stop using tool calling entirely and replace tools with prompted text generation that asks the model to describe what it would do."],"answer":0,"de":"Tool_use block đôi khi trả về argument không có trong schema, application chưa xử lý case này gracefully — nên xử lý thế nào?","explain":["Validate argument của tool_use block đối chiếu với tool schema trước khi dispatch tool, xử lý invalid argument như một error path được nhận diện — chặn lỗi trước khi dispatch thay vì để tool tự xử lý hoặc retry mù quáng."]},{"num":51,"stem":"You are deciding between deploying a Claude-powered agent on Anthropic's hosted infrastructure or self-hosting under a \"bring your own cloud\" model in your own AWS account. The agent processes customer data subject to your enterprise's data residency policies, but the team wants to ship quickly and avoid managing infrastructure. Which deployment model would you recommend?","options":["Self-hosting under BYOC for an initial pilot, then evaluating whether to migrate to Anthropic-hosted infrastructure once the agent's data-handling patterns are better understood.","Deploying on Anthropic-hosted infrastructure while the team drafts a request to update the enterprise data residency policy to accommodate hosted AI deployments.","Self-hosting under BYOC to satisfy the data residency requirement, while working with the infrastructure team to reduce the operational overhead of managing the deployment.","Deploying on Anthropic-hosted infrastructure to meet the team's shipping timeline, and flagging the data residency requirement for a follow-up compliance review after launch."],"answer":2,"de":"Cần deploy agent xử lý customer data chịu ràng buộc data residency policy, team muốn ship nhanh và tránh quản lý infra — nên chọn deployment model nào?","explain":["Self-hosting dưới BYOC để đáp ứng đúng yêu cầu data residency ngay từ đầu (không thỏa hiệp compliance), đồng thời phối hợp với infrastructure team để giảm operational overhead — cân bằng giữa tuân thủ và tốc độ triển khai, thay vì bỏ qua data residency để ship nhanh."]},{"num":52,"stem":"A teammate has asked why your Claude application sometimes produces a response that includes the prompt text repeated back, and other times produces a response with the prompt text rephrased. They suspect a bug in the application's request construction. How would you respond?","options":["Tell the teammate that the variation depends on which Claude model serves the request, and recommend pinning the application to a single model version to make the output behavior consistent.","Explain that LLMs generate output token by token, and variation in how prompt content appears in output is a property of generation, not a bug in request construction.","Confirm that the variation is a bug in the application's request construction and start investigating which part of the application is producing the inconsistent prompt text.","Tell the teammate that the variation is caused by the application sending two different prompts on different runs and propose a code change that pins the system prompt to a single version."],"answer":1,"de":"Đồng nghiệp nghi ngờ bug vì output đôi khi lặp lại prompt text, đôi khi rephrase — nên giải thích thế nào?","explain":["Giải thích LLM generate output theo từng token, sự khác biệt trong cách prompt content xuất hiện ở output là đặc tính của generation process chứ không phải bug ở request construction."]},{"num":53,"stem":"You are building a Claude application that needs to deliver model output to end users as it is generated, instead of waiting for the full response to complete. The Claude API mechanism you would use is...","options":["Structured JSON output, which delivers responses only after the model has finalized the JSON shape across the entire response.","Streaming responses, which deliver tokens incrementally as the model generates them so users see output progressively.","The Batch API, which delivers full responses after a delay suitable for non-interactive workloads.","Prompt caching, which speeds up the cost profile of future requests and does not affect the delivery timing of the first response."],"answer":1,"de":"Cần deliver model output cho user ngay khi generate, không đợi response hoàn tất — nên dùng mechanism nào?","explain":["Streaming responses deliver token incrementally ngay khi model generate, đúng yêu cầu hiển thị output tiến độ (progressive) cho user thay vì chờ toàn bộ response hoàn thành."]},{"num":54,"stem":"You are designing an agent that processes vendor invoices. The work involves a small number of well-understood steps, but occasionally an invoice arrives in an unexpected format that requires the system to decide between rerouting, requesting clarification, or flagging for human review. The most appropriate architecture for this system is...","options":["A fully autonomous agent that handles every invoice from start to finish across all formats.","A manager agent that delegates each step of standard invoice processing to a dedicated subagent, with a separate subagent handling each unexpected format.","A single large prompt that processes every incoming invoice, both standard and unexpected, in one model call.","A workflow for the standard path with an agent invoked at the decision point for unexpected formats."],"answer":3,"de":"Xử lý invoice với đa số bước well-understood, thỉnh thoảng gặp format bất thường cần quyết định linh hoạt (reroute/clarify/human review) — kiến trúc nào phù hợp nhất?","explain":["Dùng deterministic workflow cho standard path (đơn giản, dự đoán được), chỉ invoke agent tại decision point khi gặp unexpected format cần judgment — kết hợp đúng mức độ phức tạp cần thiết cho từng phần, tránh over-engineer bằng full agent hay multi-subagent cho một tác vụ phần lớn well-understood."]},{"num":55,"stem":"Your agent is processing tasks that take 30 to 60 minutes to complete. Each task has well-defined intermediate checkpoints, and the team wants the agent to be able to resume from the most recent checkpoint if a process is interrupted. How would you implement this resumability?","options":["Increase the agent's timeout to several hours so that interruptions become rare enough to ignore in practice.","Apply a checkpointing pattern that persists the agent's intermediate state and reloads that state when resuming an interrupted task.","Run two copies of the agent in parallel for every task and use whichever one finishes first as the source of truth.","Restart the task from the beginning whenever a process is interrupted."],"answer":1,"de":"Task chạy 30-60 phút có checkpoint rõ ràng, muốn agent resume từ checkpoint gần nhất khi bị interrupt — nên implement resumability thế nào?","explain":["Áp dụng checkpointing pattern để persist intermediate state và reload lại khi resume, đúng cơ chế tận dụng checkpoint sẵn có thay vì restart từ đầu hay chạy song song lãng phí."]},{"num":56,"stem":"The team is debating whether to build a new capability as a custom tool or to use an existing built-in tool that nearly covers the use case but lacks one specific feature. How would you decide?","options":["Evaluate whether the missing feature can be addressed by extending the built-in tool or warrants a custom tool, then choose accordingly.","Identify whether the team has previously built similar custom tools and use those precedents to determine which approach is more consistent with the existing codebase.","Examine the custom tool option by scoping the implementation effort and determining whether the additional flexibility justifies the development and maintenance cost.","Review the built-in tool's documentation and assess whether its existing capabilities are sufficient to cover the use case without any modification or extension."],"answer":0,"de":"Phân vân giữa build custom tool hay dùng built-in tool đã gần đủ nhưng thiếu 1 feature — nên quyết định thế nào?","explain":["Đánh giá xem tính năng còn thiếu có thể bổ sung bằng cách extend built-in tool hay thực sự cần một custom tool riêng, rồi chọn theo kết quả đánh giá đó — cân nhắc đầy đủ cả hai hướng thay vì chỉ soi một phía (built-in docs hoặc custom effort) hay dựa vào tiền lệ."]},{"num":57,"stem":"Your Claude application's API keys are stored in a secrets manager. The team is debating whether the same key should be used in development, staging, and production environments. How would you handle the keys across environments?","options":["Use distinct keys for each environment so a compromise in one environment does not affect the others during normal operation across the application's lifecycle.","Rotate the same key across environments at random intervals on the grounds that random rotation provides isolation between environments without requiring distinct keys.","Use the same key across all environments for simplicity and treat the propagation of any compromise as a known operational tradeoff for the team's key management approach.","Use a single development key everywhere on the grounds that production keys are too risky to deploy across the appli
