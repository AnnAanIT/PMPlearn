cation's three environments during normal operation."],"answer":0,"de":"API key lưu trong secrets manager, phân vân có nên dùng chung key cho dev/staging/production hay không — nên xử lý thế nào?","explain":["Dùng key riêng biệt cho từng environment để giới hạn phạm vi ảnh hưởng khi một environment bị compromise, không lây lan sang các environment khác — nguyên tắc isolation cơ bản trong quản lý secrets."]},{"num":58,"stem":"The Anthropic API deprecated a request parameter that your Claude application uses in approximately 40 places across the codebase. The deprecation notice gives a six-month window before the parameter is removed and recommends a replacement parameter with slightly different semantics. You would respond to the deprecation by...","options":["Migrating all 40 call sites in a single change near the removal date to ensure the deprecated parameter continues to work as long as possible.","Keeping the deprecated parameter in place while writing a wrapper function around it to insulate the rest of the codebase from the eventual change.","Adding regression tests to cover the parameter's behavior, then migrating call sites in batches that you validate against regression tests.","Swapping all 40 call sites in a single change right away to prevent drawn-out migration work that will delay ongoing functioning."],"answer":2,"de":"Parameter bị deprecate ở ~40 nơi trong codebase, có 6 tháng và semantics thay thế hơi khác — nên xử lý migration thế nào?","explain":["Thêm regression test bao phủ behavior của parameter trước, sau đó migrate call site theo từng batch và validate bằng regression test — giảm rủi ro vì semantics khác biệt, tận dụng đủ 6 tháng thay vì dồn hết vào một lần thay đổi lớn hoặc trì hoãn đến sát hạn."]},{"num":60,"stem":"You are building a Claude application that needs to maintain a persistent connection to a service that streams real-time updates. The team is unsure what communication pattern to use. Which communication pattern would you use?","options":["Repeated short-lived HTTP polling requests, where the application opens a new HTTP connection each time it checks for updates.","A WebSocket, because WebSockets are designed for bidirectional, persistent, real-time communication between the client and the streaming service.","A single long HTTP request the server holds open indefinitely, with no standard WebSocket framing on the connection.","File-based communication where the service writes new updates to disk and the application polls the file system for changes."],"answer":1,"de":"Cần duy trì persistent connection tới service stream real-time update — nên chọn communication pattern nào?","explain":["WebSocket được thiết kế đúng cho giao tiếp bidirectional, persistent, real-time giữa client và service, phù hợp trực tiếp với yêu cầu thay vì polling lặp lại hay giữ HTTP request mở không theo chuẩn."]},{"num":61,"stem":"You are building an agent that needs to call several internal APIs and a database in a structured, repeatable way. Your team has decided to use the Claude Agent SDK rather than build a custom loop. You are setting up the agent's tool definitions and execution loop. How would you set up the tools and execution loop?","options":["Use the SDK's tool interface and let the SDK handle the loop, dispatch, and history.","Call the Messages API directly and let the model format its tool calls in plain text.","Use the SDK's tool interface and loop, with conversation history stored in a separate team database.","Use the SDK's tool interface and write the loop and history layer in the team's own code."],"answer":0,"de":"Team đã quyết định dùng Claude Agent SDK thay vì tự xây custom loop cho agent gọi internal API/database — nên setup tool và execution loop thế nào?","explain":["Dùng tool interface của SDK và để SDK tự quản lý loop, dispatch, và history — đúng tinh thần \"dùng SDK thay vì tự build loop\" mà team đã quyết định, tránh tự viết lại phần mà SDK đã cung cấp sẵn."]},{"num":62,"stem":"Your agent makes 10 to 15 tool calls per task, and you have noticed it sometimes loses track of earlier results by the time it reaches later steps. The agent's context window is large enough to hold all the messages, but the relevant information appears to get buried as the conversation grows. How would you address this?","options":["Switch to a different agentic framework that advertises automatic context-window management as a built-in feature.","Reduce the number of tool calls per task by combining several existing tools into larger, multi-purpose tools.","Increase the context window further so all tool outputs from every prior step remain in full detail throughout the task.","Apply a context-management pattern that summarizes or prunes older tool outputs while preserving the active task state."],"answer":3,"de":"Agent thực hiện 10-15 tool call/task, dù context window đủ lớn nhưng thông tin quan trọng bị \"chôn vùi\" khi conversation dài ra — nên xử lý thế nào?","explain":["Áp dụng context-management pattern (summarize/prune tool output cũ) trong khi giữ lại active task state, giải quyết đúng vấn đề \"buried\" do volume lớn chứ không phải do thiếu context window."]},{"num":63,"stem":"A teammate has asked how the Claude SDK handles transient API errors, such as a temporary network issue or a brief rate-limit response. They want to know whether the application code needs to handle every transient error or whether the SDK provides any default behavior. How would you describe the SDK's default behavior?","options":["The SDK provides default retry behavior for transient errors up to a fixed number of attempts, and this behavior is not configurable.","The SDK provides default retry behavior for network errors but surfaces rate-limit responses directly to the application code, which must implement its own retry logic for those cases.","The SDK logs transient errors to a default error stream and continues execution without retrying, leaving the application code responsible for detecting and responding to failed calls.","The SDK provides default retry behavior for many transient errors, and the application code can configure or extend that behavior as needed."],"answer":3,"de":"SDK xử lý transient API error (network issue, rate-limit) mặc định thế nào, application code có cần tự handle mọi trường hợp không?","explain":["SDK cung cấp sẵn retry behavior mặc định cho nhiều loại transient error, đồng thời application code vẫn có thể configure hoặc extend behavior đó khi cần — vừa có default hợp lý vừa giữ được tính linh hoạt, không cứng nhắc (A) hay bỏ mặc application tự xử lý toàn bộ (B, C)."]},{"num":64,"stem":"Your Claude application's outputs are inconsistent in format. The team's instructions are scattered across the system prompt and user messages, with some instructions stated only once and others repeated. How would you fix the inconsistency?","options":["Move all instructions into the user message so the application's behavior is controlled at the input point.","Consolidate behavioral and format instructions in the system prompt and keep user messages focused on the user's input.","Place each instruction wherever the developer who first wrote it found most natural, retaining the original intent.","Repeat all instructions in both the system prompt and the user message so the model sees each instruction more than once."],"answer":1,"de":"Output format inconsistent do instruction bị rải rác giữa system prompt và user message, có chỗ lặp có chỗ chỉ nói một lần — nên fix thế nào?","explain":["Gom behavioral/format instruction tập trung vào system prompt, giữ user message chỉ chứa input của user — tạo một nguồn instruction rõ ràng, nhất quán thay vì rải rác hoặc lặp lại không kiểm soát."]},{"num":65,"stem":"You are setting up a Claude application that will run a mix of multi-turn conversations and one-off requests. You want to use caching techniques to reduce token costs where they apply. A teammate suggests caching the model's output as well, so the application does not have to make duplicate Claude calls when similar queries arrive. You would apply prompt caching to...","options":["Nothing, because prompt caching does not affect cost in any application that mixes multi-turn conversations and one-off requests in a single deployment.","The model's output, treating the response from each request as cacheable content the application can return on similar future queries.","Only the user's input portion of each request because user input is the part of the prompt that varies the most across the application's normal operation.","The static portions of prompts that are repeated across requests, such as system prompts, instructions, or shared context."],"answer":3,"de":"Cần áp dụng prompt caching để giảm token cost, đồng nghiệp đề xuất cache luôn output — nên áp dụng caching vào đâu?","explain":["Prompt caching nhắm vào phần static lặp lại giữa các request (system prompt, instructions, shared context), đây mới đúng cơ chế mà prompt caching được thiết kế để tối ưu — khác với việc cache output (một kỹ thuật khác, không phải prompt caching) hay cache phần input hay biến đổi nhất."]},{"num":66,"stem":"You are writing a system prompt for a Claude application that needs to produce output in a specific JSON shape. The downstream system will reject any output that does not match the schema. Your prompt would need to...","options":["Instruct Claude to use whichever output format it considers most appropriate for each request the application handles.","Instruct Claude to return JSON sometimes and free text other times so the application's output captures both formats.","Omit any reference to the format and rely on a post-processing step in the application to reshape Claude's output.","Include explicit constraints describing the required JSON schema and an instruction to produce only output matching that schema."],"answer":3,"de":"Cần system prompt đảm bảo output đúng JSON schema, downstream sẽ reject nếu sai schema — prompt cần làm gì?","explain":["Nêu rõ constraint mô tả JSON schema yêu cầu kèm chỉ dẫn chỉ output đúng schema đó, đưa yêu cầu format vào ngay prompt thay vì để model tự quyết hoặc phó mặc cho post-processing xử lý sau."]},{"num":67,"stem":"Your Claude application is hitting context window limits when processing long customer service transcripts. A junior developer suggests increasing the temperature parameter to fix the issue. How would you respond?","options":["Explain that temperature controls sampling randomness and is unrelated to context capacity, then address the context issue through summarization or chunking.","Adjust the temperature parameter together with the max_tokens parameter, treating the combined adjustment as the team's mechanism for managing context window pressure during long-transcript processing.","Remove the system prompt entirely to make room for longer transcripts in each request, freeing up context window space the system prompt would otherwise consume.","Increase the temperature parameter as the junior developer suggested and observe whether the context window issue resolves over the next several runs of the application in production."],"answer":0,"de":"Junior dev đề xuất tăng temperature để fix lỗi context window limit — nên phản hồi thế nào?","explain":["Temperature chỉ điều khiển sampling randomness, không liên quan đến context capacity; cần xử lý đúng root cause bằng summarization/chunking."]},{"num":68,"stem":"A teammate is reviewing the team's threat model for a Claude application and has asked you to identify the categories of AI-specific threats that the model should cover. The teammate has already listed traditional web application threats and wants to know what additional categories apply to a Claude application. Which AI-specific threat categories would you add?","options":["Cross-site scripting and SQL injection, because these traditional web application threats apply with equal weight to any application that uses Claude in any way.","Network-level denial of service and physical infrastructure attacks, because these categories cover the threats most likely to affect any Claude application in production.","Prompt injection, data leakage from prompts or context, jailbreak attempts, and unsafe model output that bypasses application controls.","Supply chain attacks on the Claude SDK because the SDK itself is the only point of vulnerability that a Claude application introduces beyond traditional web application threats."],"answer":2,"de":"Threat model cho Claude application ngoài traditional web threat cần thêm category AI-specific nào?","explain":["Bổ sung prompt injection, data leakage từ prompt/context, jailbreak attempt, và unsafe model output vượt qua application control — đây mới là các threat category đặc thù của ứng dụng dùng LLM, không trùng với traditional web threat."]},{"num":69,"stem":"Your Claude application returns confident-sounding answers, but occasionally those answers contain factual errors that downstream systems treat as ground truth. The team is concerned about the application's confidence-versus-accuracy gap. How would you address the gap?","options":["Lower the model's temperature so the model's responses sound less confident and downstream systems are less likely to treat the responses as ground truth in normal operation.","Apply skepticism toward confident output by adding validation steps, sourcing requirements, or confidence calibration before treating outputs as ground truth.","Reject every response the application produces until a manual accuracy review is conducted on each response by a human reviewer before any downstream system uses it.","Add a disclaimer to every output telling users to verify the accuracy of the output and treat the disclaimer as the primary mechanism for managing the confidence-versus-accuracy gap."],"answer":1,"de":"Output nghe tự tin nhưng đôi khi sai fact, downstream lại coi là ground truth — nên xử lý confidence-vs-accuracy gap thế nào?","explain":["Chủ động nghi ngờ output tự tin bằng validation step, yêu cầu sourcing, hoặc confidence calibration trước khi coi là ground truth — xử lý có hệ thống thay vì chỉ giảm temperature (không đổi accuracy) hay dựa vào disclaimer/manual review toàn bộ."]},{"num":70,"stem":"You are setting up a CI/CD pipeline for a new Claude application. The pipeline needs to run automated checks on every pull request before code can be merged. The CI/CD checks would include...","options":["Automated tests of the Claude integration, linting, and any other standard quality gates the team applies to its other services.","A full end-to-end production deployment on every pull request to catch all possible issues before any code is merged into the main branch.","Automated tests of the Claude integration only, with linting handled separately during local development on each developer's machine.","Automated linting and security scanning, with Claude integration testing handled manually during pre-release verification by a designated reviewer."],"answer":0,"de":"Thiết lập CI/CD pipeline cho Claude application mới, cần automated check trên mỗi PR trước khi merge — pipeline nên bao gồm gì?","explain":["Bao gồm automated test cho Claude integration, linting, và các quality gate chuẩn khác mà team đã áp dụng cho service khác — đối xử Claude integration như một phần bình thường của quy trình CI/CD sẵn có, không tách riêng hay bỏ qua tự động hóa."]},{"num":71,"stem":"Your team is choosing how to add a capability to a Claude application. You want to apply the appropriate option, whether built-in tool, custom tool, Skill, or MCP server, based on the use case. You would choose the option that...","options":["Is the most familiar to the team based on prior experience with similar capabilities.","Is the newest available option among built-in tools, custom tools, Skills, and MCP servers.","Is the easiest to build given the team's current development tools and workflows.","Matches the use case's scope, reuse needs, and integration context."],"answer":3,"de":"Chọn giữa built-in tool, custom tool, Skill, hay MCP server để thêm capability cho Claude application — nên chọn theo tiêu chí nào?","explain":["Chọn option phù hợp với scope của use case, nhu cầu reuse, và integration context — quyết định dựa trên đặc điểm thực tế của nhu cầu, không phải vì quen thuộc, mới nhất, hay dễ build nhất."]},{"num":72,"stem":"A teammate has asked you to explain why the team's Claude application is billed for output tokens at a different rate than input tokens. They had assumed the rate was the same for both. How would you explain the difference?","options":["Output tokens are typically billed at the same rate as input tokens, and the apparent rate difference is a billing error to report to Anthropic.","Output tokens are typically billed at a lower rate than input tokens, because output tokens are cheaper to produce than input tokens are to process.","Output tokens are not billed at all, because cost is determined entirely by the input tokens sent to the model on each request.","Output tokens are typically billed at a higher rate than input tokens, and cost models for the application should reflect both rates separately."],"answer":3,"de":"Đồng nghiệp thắc mắc vì sao output token bị bill với rate khác input token — nên giải thích thế nào?","explain":["Output token thường được bill ở rate cao hơn input token, và cost model của application cần phản ánh riêng biệt cả hai rate này thay vì giả định chúng bằng nhau."]},{"num":73,"stem":"Your Claude application's prompt was written months ago and has not been updated. The team has discovered through evals that the prompt produces good results on common cases but underperforms on a specific category of inputs that has grown in volume. How would you respond?","options":["Iterate on the prompt to address the underperforming category, validate the change with evals, and continue refining as needed.","Tell users to avoid the underperforming category by adding warnings in the application's user interface about handled inputs.","Replace the prompt with a new one aligned to the underperforming category, treating any common-case performance change as a known tradeoff.","Add the underperforming category to a separate Claude application with its own prompt so the original prompt does not change."],"answer":0,"de":"Prompt viết từ lâu, eval cho thấy tốt ở common case nhưng kém ở một category input đang tăng volume — nên phản hồi thế nào?","explain":["Iterate trên prompt hiện có để xử lý category yếu kém, validate lại bằng eval, và tiếp tục refine khi cần — cải thiện có kiểm chứng thay vì thay thế toàn bộ prompt (đánh đổi common case) hay né tránh vấn đề bằng warning/tách app riêng."]},{"num":74,"stem":"Your Claude application produces good responses for typical inputs but struggles with edge cases. You have several labeled examples of edge-case inputs and the desired response for each. You want to use these examples to improve the model's handling of edge cases. What is the best way to use these examples?","options":["Embed the examples in a database for the model to find during inference.","Add the labeled edge-case examples to the prompt as few-shot examples so the model can learn the pattern.","Train a custom model on the edge-case examples and deploy that custom model in place of the team's current Claude integration.","Tell users to avoid submitting the edge-case inputs to the application by adding warnings."],"answer":1,"de":"Có sẵn example labeled cho edge-case input và response mong muốn, muốn cải thiện xử lý edge case — nên dùng thế nào?","explain":["Đưa các edge-case example vào prompt dưới dạng few-shot example để model học pattern trực tiếp — cách tận dụng nhanh và trực tiếp nhất, không cần train custom model hay né tránh input."]},{"num":75,"stem":"A teammate has asked you to explain the difference between context engineering and prompt engineering. They have heard the terms used interchangeably and are unsure how each applies to a Claude application that processes long-running multi-step tasks. How would you describe the distinction?","options":["Prompt engineering focuses on the model's response, while context engineering focuses on the user's input across many sessions in a long-running multi-step Claude application.","Prompt engineering is the older term for prompt design, while context engineering is the newer term that has replaced it in modern Claude applications across the industry.","Prompt engineering shapes individual prompts for specific outputs, while context engineering manages how content flows across turns and steps and takes steps to keep relevant state visible.","Prompt engineering and context engineering each address content the team gives Claude, but the team can group them under a single workflow because the practices use overlapping techniques."],"answer":2,"de":"Phân biệt context engineering và prompt engineering trong ứng dụng xử lý task multi-step dài hạn?","explain":["Prompt engineering tập trung shaping từng prompt riêng lẻ để đạt output cụ thể, còn context engineering quản lý cách content flow qua các turn/step và giữ relevant state luôn visible — hai khái niệm khác nhau về scope và mục tiêu, không phải cùng một khái niệm hay chỉ khác về thời điểm ra đời."]},{"num":76,"stem":"The product team has described a new Claude feature in business terms: \"agents should help our analysts produce client memos faster.\" You need to convert this into actionable technical requirements for the engineering team. Your first step would be to...","options":["Ask the analysts about the current memo production process to see where they think Claude could be introduced as a prompt-driven drafting step.","Assess what similar agent-based features have been built internally or in the industry and use those precedents to scope the technical approach.","Examine what model capabilities and tier options are available and determine which best supports the memo drafting workflow described by the product team.","Interpret the functional and infrastructure requirements implied by the business goal."],"answer":3,"de":"Chuyển yêu cầu business-level (\"agent giúp analyst viết memo nhanh hơn\") thành technical requirement cho engineering team — bước đầu tiên nên làm gì?","explain":["Diễn giải yêu cầu business thành functional và infrastructure requirement cụ thể trước, đây là bước nền tảng để scope kỹ thuật đúng hướng, trước khi đi vào chi tiết như hỏi analyst, soi precedent, hay chọn model tier."]},{"num":77,"stem":"Your Claude application is deployed to development, staging, and production environments. Each environment uses a different model version, different prompt versions, and different plugin dependencies, but the configuration is currently scattered across environment variables, hardcoded values, and undocumented setup scripts. How would you manage the configuration?","options":["Use the latest available model version everywhere and stop pinning model versions, on the grounds that pinning adds maintenance overhead the team should aim to reduce.","Move all configuration into hardcoded application code to reduce reliance on external configuration sources that are difficult to track over time.","Consolidate the configuration into a version-controlled system documenting model version pinning, prompt versioning, and plugin dependencies for each environment.","Standardize all environments to use the same configuration values to eliminate the differences between development, staging, and production."],"answer":2,"de":"Configuration (model version, prompt version, plugin dependency) khác nhau theo environment nhưng đang rải rác trong env var, hardcode, script không tài liệu hóa — nên quản lý thế nào?","explain":["Gom configuration vào hệ thống version-controlled, tài liệu hóa rõ model version pinning, prompt versioning, và plugin dependency cho từng environment — giải quyết đúng vấn đề rải rác/thiếu tài liệu, giữ được sự khác biệt hợp lý giữa các environment thay vì ép đồng nhất hoặc hardcode."]},{"num":78,"stem":"Your team uses several plugins across multiple Claude applications, and a recent plugin update introduced a regression. The team had not been tracking plugin versions, so the team cannot easily identify which version was previously working. How would you address this?","options":["Stop using all plugins until the team can rebuild equivalent functionality directly into the application code, treating plugin avoidance as a way to remove version-related risk.","Add explicit plugin version tracking to the project's configuration so the team can identify, pin, and upgrade plugin versions deliberately.","Treat plugins as untrackable third-party code and rely on plugin authors to communicate breaking changes when they happen, with no internal version tracking.","Upgrade every plugin to the latest version on a regular cadence to keep version drift small, on the grounds that drift contributes to regression risk."],"answer":1,"de":"Plugin update gây regression nhưng team chưa track version, không xác định được version nào đang hoạt động tốt trước đó — nên xử lý thế nào?","explain":["Thêm explicit plugin version tracking vào configuration để có thể identify, pin, và upgrade version một cách chủ động — giải quyết đúng root cause (thiếu tracking) thay vì né tránh plugin hoàn toàn hay phó mặc cho plugin author."]},{"num":79,"stem":"A teammate is debugging a Claude application whose system prompt has grown to several hundred lines and now contains overlapping, contradictory, and obsolete instructions. How would you advise the teammate?","options":["Add more explicit instructions so the most recent rules dominate the model's interpretation of the prompt during each request.","Audit the prompt for overlap, contradiction, and obsolete content, then refactor so each instruction is clear, current, and non-redundant.","Tighten only the contradictory rules first, treating the overlap and obsolete content as lower-priority work the team can address later.","Split the prompt across multiple system prompts so the model sees a smaller portion at any given time."],"answer":1,"de":"System prompt đã dài hàng trăm dòng, chứa overlap/contradiction/obsolete instruction — nên tư vấn xử lý thế nào?","explain":["Audit toàn bộ prompt để tìm overlap, contradiction, và nội dung lỗi thời, rồi refactor để mỗi instruction rõ ràng, cập nhật, không trùng lặp — giải quyết toàn diện root cause thay vì chỉ vá phần contradiction hay chia nhỏ prompt cơ học."]},{"num":80,"stem":"You are designing a Claude application that will process customer support tickets in two stages: a triage stage that classifies tickets and a response stage that drafts replies. The team is debating whether to use a single Claude call that handles both stages or separate Claude calls for each stage. How would you structure the application?","options":["Use a single Claude call for triage and then use a non-Claude rule-based system for response generation, on the grounds that rule-based systems are more reliable for drafting replies.","Use multiple Claude calls in parallel that each draft a complete ticket reply, then have a fourth Claude call select the best one to send to the customer.","Use separate Claude calls for triage and response, because each stage has distinct inputs, outputs, and success criteria that benefit from focused prompts.","Use a single Claude call for both stages, on the grounds that a single call is cheaper than multiple calls in any production Claude application setup."],"answer":2,"de":"Xử lý ticket qua 2 giai đoạn triage (classify) và response (draft reply) — nên dùng một Claude call chung hay tách riêng?","explain":["Tách riêng Claude call cho triage và response vì mỗi stage có input, output, và success criteria khác biệt, tách riêng giúp prompt tập trung và hiệu quả hơn so với gộp chung một call hay dùng rule-based cho response."]},{"num":81,"stem":"You are configuring Claude Code for a new project. The team needs to set permissions, default model selections, and environment-specific behavior at the project level so the configuration is consistent across all developers working on the repository. The Claude Code mechanism you would use is...","options":["A shared spreadsheet that lists configuration values for team members to reference and update by hand as the project evolves.","Environment variables that each developer sets on their own machine when working with Claude Code on the project.","A system prompt embedded in every Claude Code conversation by each developer at the start of every session in the project.","The settings.json file, scoped at the project level so the configuration applies consistently across developers and persists with the repository."],"answer":3,"de":"Cần cấu hình permissions, default model selection, environment-specific behavior ở cấp project cho Claude Code, đồng nhất giữa các developer — nên dùng mechanism nào?","explain":["settings.json scoped ở project level, persist cùng repository, đảm bảo configuration nhất quán giữa mọi developer — đúng cơ chế Claude Code dùng để lưu trữ project-level config thay vì phụ thuộc vào thiết lập thủ công từng máy hay lặp lại mỗi session."]},{"num":82,"stem":"A Claude application is occasionally refusing to answer questions that should be in scope, including questions the application has answered correctly in the past. You want to investigate. What is the first step of your investigation?","options":["Test whether removing or adjusting those instructions resolves the behavior.","Examine traces of the refused requests to identify what triggers the refusal, whether input patterns, system prompt content, or other context.","Assess whether the refusals cluster around specific input patterns, question types, or time periods by analyzing the distribution of refused requests in the logs.","Identify which questions have been refused and compare them against previously answered questions to determine what changed between the successful and refused interactions."],"answer":1,"de":"Application đôi khi refuse câu hỏi lẽ ra in-scope, kể cả câu đã trả lời đúng trước đây — bước đầu tiên nên điều tra gì?","explain":["Xem xét trace của các request bị refuse để xác định nguyên nhân kích hoạt (input pattern, system prompt content, hay context khác) — bước điều tra nền tảng, thu thập bằng chứng cụ thể trước khi phân tích phân bố hay so sánh diện rộng."]},{"num":83,"stem":"You are extending a Claude agent with a capability that needs to be reusable across multiple teams in the organization, with each team able to invoke and use it independently. How would you build the capability?","options":["As a custom tool embedded in this team's agent only, with other teams able to copy the implementation into their own agents when they need the capability.","As a shared library that each team imports into its own Claude application code, with each team responsible for keeping the library up to date in its integration.","As a Skill or MCP server because both are purpose-built for cross-team reuse independently by each consuming team.","As a wrapper around an existing built-in tool that adds the missing functionality, on the grounds that built-in tools cover the reuse pattern when extended carefully."],"answer":2,"de":"Cần capability reuse được across nhiều team, mỗi team invoke độc lập — nên build theo cách nào?","explain":["Xây dựng dưới dạng Skill hoặc MCP server vì cả hai đều được thiết kế đúng mục đích cross-team reuse, cho phép từng team consume độc lập — khác với custom tool riêng của một team hay shared library đòi hỏi mỗi team tự maintain integration."]},{"num":84,"stem":"A teammate has asked you to explain why your Claude agent's tools include detailed descriptions in the tool definition, even when the tool name is already descriptive. The teammate suggests removing the descriptions to simplify the tool definitions. How would you respond?","options":["Suggest replacing the descriptions with example calls embedded in the tool definition, treating example calls as a complete substitute for the prose description.","Agree with the teammate because tool names are sufficient for the model to choose the right tool on every request the agent handles.","Explain that the model uses the tool description to decide when to call the tool, and descriptions disambiguate cases where the tool name is not enough.","Suggest moving the descriptions out of the tool definition and into a separate documentation file the team maintains so the tool definitions stay short and the descriptions remain available."],"answer":2,"de":"Đồng nghiệp đề xuất bỏ description trong tool definition vì tool name đã đủ mô tả — nên phản hồi thế nào?","explain":["Giải thích model dựa vào description để quyết định khi nào gọi tool, và description giúp phân biệt các trường hợp mà chỉ tool name không đủ rõ — description nằm ngay trong tool definition mới phát huy tác dụng, tách ra tài liệu riêng (D) hay bỏ hẳn (B) đều làm giảm hiệu quả tool selection của model."]},{"num":85,"stem":"You are designing an agent that handles a multi-step research task. You want the agent to break the task into smaller pieces, hand each piece to a focused subagent, and consolidate the results. The agent pattern you would apply is...","options":["An orchestrator and subagent pattern with specialized subagents assigned to each subtask.","A memory pattern that stores the entire research history in advance, before any subtask begins execution.","A context-window pruning pattern that drops each subtask's content after the agent moves on.","A single tool-use loop that includes every tool the agent might need across all subtasks."],"answer":0,"de":"Cần chia research task đa bước thành phần nhỏ, giao mỗi phần cho subagent chuyên biệt, rồi tổng hợp kết quả — nên áp dụng pattern nào?","explain":["Orchestrator-subagent pattern với subagent chuyên biệt cho từng subtask, đúng mô tả yêu cầu phân rã task, giao việc, và consolidate kết quả cuối cùng."]},{"num":86,"stem":"You are establishing the guardrail strategy for a Claude application. The team wants to ensure guardrail failure does not expose the application to unsafe behavior. The guardrail strategy would...","options":["Layer multiple guardrails so a single guardrail failure does not expose the application to unsafe behavior.","Apply guardrails at the application output level only and route flagged responses to a human reviewer before they are delivered to the user.","Implement a single comprehensive system prompt guardrail and validate its coverage against the application's full range of expected inputs.","Apply guardrails at the model level only and rely on the model's built-in safety behaviors to handle any cases the guardrail does not explicitly cover."],"answer":0,"de":"Cần thiết lập guardrail strategy đảm bảo một guardrail fail không làm lộ unsafe behavior — nên thiết kế thế nào?","explain":["Layer nhiều guardrail (defense in depth) để một điểm fail không làm sụp toàn bộ hệ thống bảo vệ, khác với việc chỉ dựa vào một lớp guardrail duy nhất (dù ở output level, system prompt, hay model level)."]},{"num":87,"stem":"You have just shipped a new Claude-powered application to production. The development phase is complete, and the system is now in active use by internal teams. The next phase of work for this system is...","options":["Retiring the system, since shipping is the final lifecycle stage for any application that reaches production.","Running a formal post-deployment review that assesses the development phase before the team does any further work on the system.","Operating and maintaining the system, including monitoring, responding to issues, and planning evolution.","Handing the system over to a separate operations team that will manage it independently of the development team going forward."],"answer":2,"de":"Application vừa ship production và đang được internal team sử dụng — giai đoạn tiếp theo trong lifecycle là gì?","explain":["Bước tiếp theo là operate và maintain hệ thống: monitoring, xử lý issue, và lên kế hoạch evolution — đúng vòng đời sau khi shipping, không phải retire ngay hay tách rời hoàn toàn khỏi dev team."]},{"num":88,"stem":"A Claude application that worked well in testing is now occasionally returning outputs that mention information not present in the input. The development team initially assumed the model was hallucinating, so they asked you to troubleshoot. What would you do first?","options":["Examine production traces to identify whether the issue is hallucination by the model, context loss, prompt injection, or another failure mode before recommending a fix.","Replace the current model with a larger one to reduce the chance of hallucination, on the grounds that larger models tend to hallucinate less in typical applications.","Apply a retrieval-augmented generation pattern to ground the responses in source content before any further investigation of the production traces.","Add a system prompt instruction telling the model not to invent information, on the grounds that prompt-level instructions are the fastest fix for hallucination concerns."],"answer":0,"de":"Application từng chạy tốt ở testing nhưng production đôi khi trả output chứa thông tin không có trong input, team giả định là hallucination — bước đầu tiên nên làm gì?","explain":["Xem xét production trace để xác định đúng failure mode (hallucination, context loss, prompt injection, hay nguyên nhân khác) trước khi đề xuất fix — tránh vội kết luận hallucination và áp dụng giải pháp sai (đổi model, RAG, hay prompt instruction) khi chưa xác định đúng root cause."]},{"num":89,"stem":"A team has deployed a multi-agent system in which a primary agent decomposes user requests and delegates subtasks to three specialized subagents: one for data retrieval, one for analysis, and one for report generation. In production, the team observes that subagents are making redundant tool calls, occasionally exceeding token budgets, and sometimes producing outputs that contradict each other - all of which the primary agent passes along without catching. What is the most appropriate way to address these failures?","options":["Add retry logic to each subagent so that when a tool call fails, the subagent retries automatically before escalating - and configure each subagent to log its tool calls and outputs to a shared trace so the team can audit redundancy and contradictions after the fact.","Give each subagent read access to the other subagents' outputs so they can identify and resolve contradictions without routing back through the primary agent.","Strengthen the primary agent's management layer to enforce per-subagent tool budgets, validate outputs against a defined schema before passing them forward, and establish explicit handoff contracts between stages.","Collapse the three subagents into a single large-context model call that handles retrieval, analysis, and generation in one pass."],"answer":2,"de":"Multi-agent system với 3 subagent (retrieval/analysis/report) gặp redundant tool call, vượt token budget, và output mâu thuẫn nhau mà primary agent không bắt được — nên xử lý thế nào?","explain":["Tăng cường management layer của primary agent: enforce tool budget riêng cho từng subagent, validate output theo schema trước khi truyền tiếp, và thiết lập handoff contract rõ ràng giữa các stage — đúng vai trò orchestrator phải kiểm soát chủ động, thay vì chỉ retry/log để audit sau (A), cho subagent tự resolve chéo (B, phá vỡ context isolation), hay gộp lại thành một call lớn (D, mất đi lợi ích phân tách)."]},{"num":90,"stem":"Your team is integrating Claude into an existing REST API service. The service handles concurrent requests, and you are deciding how to structure the Claude API calls within the existing async codebase. How would you structure the Claude calls?","options":["Run Claude API calls in a separate thread pool isolated from the rest of the service so the main event loop is not affected.","Replace the existing async REST service with a synchronous service to match the call style of synchronous Claude SDK clients.","Use the Claude SDK's async client and structure Claude calls as awaitable operations alongside the rest of the service's async code.","Make synchronous Claude API calls and block the async event loop until each call completes before processing the next request."],"answer":2,"de":"Tích hợp Claude vào REST API service async đang xử lý concurrent request — nên cấu trúc Claude call thế nào?","explain":["Dùng async client của Claude SDK, cấu trúc call như awaitable operation hòa hợp với phần async code còn lại — giữ tính nhất quán async trong toàn service, tránh block event loop hay đổi kiến trúc service không cần thiết."]},{"num":91,"stem":"You are deciding between Claude models for a task. The team has identified three relevant tradeoff dimensions: quality, latency, and cost. The right model is the one that...","options":["Satisfies the task's latency requirement first, then is evaluated against quality and cost thresholds to confirm the selection is acceptable across all three dimensions.","Meets the task's cost target within a defined latency budget, with quality validated against a representative sample of inputs after the model is selected.","Fits the task's quality, latency, and cost requirements together, recognizing that improving one dimension typően affects the others.","Meets the task's quality requirements at an acceptable latency, with cost reviewed separately once the quality and latency bar has been established."],"answer":2,"de":"Chọn model dựa trên 3 chiều tradeoff quality/latency/cost — model đúng là model như thế nào?","explain":["Model phù hợp là model đáp ứng đồng thời cả ba yêu cầu quality, latency, cost, với nhận thức rằng cải thiện một chiều thường ảnh hưởng đến các chiều còn lại — đánh giá tổng hòa thay vì ưu tiên tuần tự từng chiều riêng lẻ."]},{"num":92,"stem":"The product team has asked you to choose a Claude model for a new feature. The team has provided functional requirements but has not specified performance, cost, or quality targets. The team's product manager says, \"Use whatever model gives us the best results.\" How would you respond?","options":["Ask the product team to specify quality, latency, and cost targets, then select the model whose tradeoffs best fit those targets.","Run every Claude model on a representative sample and pick whichever scores best on a generic benchmark.","Choose a mid-tier model and ship the feature, because mid-tier models work for most use cases without specified targets.","Choose the largest, highest-capability Claude model, on the grounds that \"best results\" is most likely to mean highest quality."],"answer":0,"de":"Product team yêu cầu chọn model \"cho kết quả tốt nhất\" nhưng chưa specify performance/cost/quality target — nên phản hồi thế nào?","explain":["Yêu cầu product team làm rõ target cụ thể về quality, latency, cost trước, rồi mới chọn model có tradeoff phù hợp nhất với target đó — tránh quyết định mù quáng khi \"best results\" là khái niệm mơ hồ, thay vì tự suy đoán (mid-tier, largest) hay chạy benchmark generic không gắn với nhu cầu thực tế."]},{"num":93,"stem":"A teammate has asked how to extend Claude Code with a custom Skill that the team can invoke during sessions. The Skill consists of a set of instructions and a few support scripts the team wants Claude to be able to call when the Skill is loaded. Where is the right place to define the Skill?","options":["Define the Skill as a long inline instruction at the top of every CLAUDE.md file in the team's repositories so Claude has access to it on every session.","Define the Skill inside the application's source code as a regular library module and call it from the application code instead of from Claude Code.","Define the Skill in a Skills directory recognized by Claude Code, where Claude can discover and load it during sessions for the team's repositories.","Define the Skill in a personal scratch directory on each developer's machine and load it manually before each Claude Code session that needs it."],"answer":2,"de":"Cần extend Claude Code bằng custom Skill (instructions + support script) để team invoke được trong session — nên đặt Skill ở đâu?","explain":["Định nghĩa Skill trong Skills directory mà Claude Code nhận diện được, để Claude tự discover và load trong session — đúng cơ chế chuẩn của Claude Code, thay vì nhồi vào CLAUDE.md, giấu trong app code, hay để rải rác local từng máy."]},{"num":94,"stem":"Your team is debating how to manage the prompts used in your Claude application. Some prompts are checked into the code repository, some live in a separate configuration file, and some are constructed inline at runtime. The result is inconsistent, and a recent prompt change went out without code review. What steps would you take?","options":["Move all prompts out of version control to a separate spreadsheet that team members can edit freely as the application evolves over time.","Move all prompts to inline runtime construction so the team can update them quickly through a streamlined process outside the standard code review workflow.","Establish a single source of truth for prompts but keep change review optional, allowing developers to update prompts directly when changes are urgent.","Establish a single source of truth for prompts, version-control them alongside code, and require code review for prompt changes."],"answer":3,"de":"Prompt quản lý rải rác (repo, config file, inline runtime) không nhất quán, có lần thay đổi prompt đi ra production không qua code review — nên xử lý thế nào?","explain":["Thiết lập một nguồn duy nhất cho prompt, version-control cùng code, và bắt buộc code review cho mọi thay đổi prompt — giải quyết cả tính nhất quán lẫn lỗ hổng review đã xảy ra, thay vì làm review optional hay tách rời khỏi version control."]},{"num":95,"stem":"You are choosing between using STDIO-based communication and HTTP-based communication for an MCP server. The server will be invoked by a Claude Code session running locally. Which communication pattern would you use?","options":["STDIO and HTTP simultaneously for redundancy, with the team running two communication patterns at the same time across Claude Code sessions.","HTTP on the grounds that HTTP is preferable to STDIO in any context the application might encounter during normal operation.","HTTP polling against the MCP server, treating HTTP as a substitute for the standard MCP communication patterns.","STDIO because STDIO is well-suited to local process communication and avoids unnecessary network setup."],"answer":3,"de":"Chọn STDIO hay HTTP cho MCP server được invoke bởi Claude Code session chạy local — nên chọn pattern nào?","explain":["STDIO phù hợp cho local process communication, tránh thiết lập network không cần thiết khi server và client cùng chạy trên máy local — đúng ngữ cảnh sử dụng so với HTTP (dành cho giao tiếp qua network/remote)."]},{"num":96,"stem":"Your team's Claude agent has accumulated several customizations that bypass the SDK's defaults, including custom history management, retry logic, and error handling. A new team member has proposed reverting all the customizations to maintain the codebase more easily. The tech lead disagrees and says each customization was added for a reason. How would you advise the team?","options":["Migrate the agent off the SDK and rebuild it with a custom loop.","Revert all customizations to the SDK's defaults to standardize the codebase.","Keep all customizations, trusting that the tech lead's original reasoning is still valid.","Decide on each customization individually based on its original reason and the SDK's current capabilities."],"answer":3,"de":"Agent có nhiều customization vượt qua SDK default, một bên muốn revert hết để dễ maintain, bên kia muốn giữ vì \"có lý do khi thêm\" — nên tư vấn thế nào?","explain":["Đánh giá từng customization riêng lẻ dựa trên lý do ban đầu và khả năng hiện tại của SDK, quyết định giữ hay bỏ theo từng trường hợp — tránh cả hai thái cực (revert toàn bộ hoặc giữ nguyên toàn bộ dựa trên niềm tin cũ) khi bối cảnh SDK có thể đã thay đổi."]},{"num":97,"stem":"Your Claude application's content policy specifies categories of content it should not produce under any circumstance. The application currently has no mechanism to enforce this policy, and content matching these categories is appearing in the application's output. How would you enforce the content policy?","options":["Enhance the system prompt to contain explicit instructions for the categories to avoid, complete with examples of each category. Treat the strengthened prompt as the primary enforcement mechanism for the application's content policy across all responses.","Remove the content policy entirely and let any output reach users during normal operation, accepting whatever content the application produces in response to incoming traffic.","Move enforcement to users by asking them to report content policy violations after the violating content has already reached them in the application's responses.","Add deterministic output filtering that checks responses against the content policy before they reach users."],"answer":3,"de":"Content policy quy định category \"không được produce dưới bất kỳ hoàn cảnh nào\" nhưng chưa có cơ chế enforce, vi phạm vẫn xuất hiện — nên enforce thế nào?","explain":["Thêm deterministic output filtering kiểm tra response đối chiếu content policy trước khi tới user — cơ chế enforcement chắc chắn (deterministic), phù hợp với yêu cầu \"không dưới bất kỳ hoàn cảnh nào\", khác với prompt instruction (không đảm bảo tuyệt đối) hay để user tự báo cáo sau khi đã bị lộ."]}];
const KEYS = ["A","B","C","D"];

/* ---------- lưu trữ ---------- */
const store = (() => {
  let ok = false, mem = {};
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); ok = true; } catch(e){}
  return {
    get(k){ try{ return ok ? localStorage.getItem(k) : (mem[k] ?? null); }catch(e){ return mem[k] ?? null; } },
    set(k,v){ try{ ok ? localStorage.setItem(k,v) : (mem[k]=v); }catch(e){ mem[k]=v; } },
    del(k){ try{ ok ? localStorage.removeItem(k) : delete mem[k]; }catch(e){ delete mem[k]; } }
  };
})();
const KEY = "examtrainer.CCDV-F";

// state[i] = null (chưa làm) | {picked:int}
let state = QUESTIONS.map(() => null);
let idx = 0;

function saveProgress(){
  store.set(KEY, JSON.stringify({state, idx}));
}

function loadProgress(){
  try {
    const raw = store.get(KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (Array.isArray(saved.state) && saved.state.length === QUESTIONS.length) state = saved.state;
    if (Number.isInteger(saved.idx) && saved.idx >= 0 && saved.idx < QUESTIONS.length) idx = saved.idx;
  } catch(e){}
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  const q = QUESTIONS[idx], st = state[idx], shown = st !== null;

  let chips = `<span class="chip">Câu ${q.num}</span>`;
  if (shown) chips += st.picked === q.answer
      ? '<span class="chip good">Trả lời đúng</span>'
      : '<span class="chip bad">Trả lời sai</span>';

  const opts = q.options.map((t,i) => {
    let cls = "opt", tag = "";
    if (!shown) { if (st) cls += " sel"; }
    else {
      if (i === q.answer){ cls += " right"; tag = '<span class="tag r">Đáp án đúng</span>'; }
      else if (i === st.picked){ cls += " wrong"; tag = '<span class="tag w">Bạn chọn</span>'; }
      else cls += " dim";
    }
    if (!shown && sel === i) cls += " sel";
    return `<button class="${cls}" data-i="${i}" ${shown?"disabled":""}>
        <span class="k">${KEYS[i]}</span><span class="t">${esc(t)}</span>${tag}</button>`;
  }).join("");

  let tail = "";
  if (shown){
    const ok = st.picked === q.answer;
    tail = `<div class="verdict ${ok?"r":"w"}">${ok ? "Đúng." : "Sai."}</div>
      <div class="expl">
        <h3>Giải thích đáp án</h3>
        <div class="block">
          <div class="lbl">Đề</div>
          <div class="val">${esc(q.de)}</div>
        </div>
        <div class="block">
          <div class="lbl">Đáp án</div>
          <div class="val ansline">${KEYS[q.answer]}</div>
        </div>
        <div class="block">
          <div class="lbl">Vì sao</div>
          <div class="val"><ul>${q.explain.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></div>
        </div>
      </div>`;
  }

  $("card").innerHTML = `
    <div class="chips">${chips}</div>
    <p class="stem">${esc(q.stem)}</p>
    <div class="opts">${opts}</div>
    ${tail}
    <div class="nav">
      <button class="btn ghost" id="prev" ${idx===0?"disabled":""}>Câu trước</button>
      ${shown
        ? `<button class="btn ghost" id="redo">Làm lại</button>`
        : `<button class="btn fill" id="check" ${sel===null?"disabled":""}>Kiểm tra đáp án</button>`}
      <button class="btn ${shown?"fill":""}" id="next" ${idx===QUESTIONS.length-1?"disabled":""}>Câu sau</button>
    </div>`;

  // wire up
  $("card").querySelectorAll(".opt").forEach(b =>
    b.onclick = () => { sel = +b.dataset.i; render(); });
  $("prev").onclick = () => go(idx-1);
  $("next").onclick = () => go(idx+1);
  if ($("check")) $("check").onclick = () => {
    if (sel === null) return;
    state[idx] = {picked: sel};
    saveProgress();
    render(); paintSide();
  };
  if ($("redo")) $("redo").onclick = () => {
    state[idx] = null; sel = null; saveProgress(); render(); paintSide();
  };

  paintSide();
}

let sel = null;

function go(i){
  if (i < 0 || i >= QUESTIONS.length) return;
  idx = i;
  sel = state[idx] ? state[idx].picked : null;
  saveProgress();
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintSide(){
  const done = state.filter(Boolean).length;
  const right = state.filter((s,i) => s && s.picked === QUESTIONS[i].answer).length;
  $("done").textContent = done;
  $("pbar").style.width = (done / QUESTIONS.length * 100) + "%";
  $("pc").textContent = done ? (right/done*100).toFixed(1) + "%" : "—";
  $("sc").textContent = done ? `Đúng ${right}/${done} câu đã làm` : "Chưa trả lời câu nào";

  $("cells").innerHTML = QUESTIONS.map((q,i) => {
    let c = "cell";
    if (state[i]) c += state[i].picked === q.answer ? " ok" : " no";
    if (i === idx) c += " now";
    return `<button class="${c}" data-i="${i}" title="Câu ${q.num}">${q.num}</button>`;
  }).join("");
  $("cells").querySelectorAll(".cell").forEach(b =>
    b.onclick = () => go(+b.dataset.i));
}

document.addEventListener("keydown", e => {
  const k = e.key.toUpperCase();
  if (KEYS.includes(k) && state[idx] === null){ sel = KEYS.indexOf(k); render(); }
  else if (e.key === "Enter"){ const b = $("check") || $("next"); if (b && !b.disabled) b.click(); }
  else if (e.key === "ArrowLeft") go(idx-1);
  else if (e.key === "ArrowRight") go(idx+1);
});

$("total").textContent = QUESTIONS.length;
$("sub").textContent = `Ôn tập · ${QUESTIONS.length} câu`;
loadProgress();
sel = state[idx] ? state[idx].picked : null;
$("resetProgress").onclick = () => {
  if (!confirm("Xoá toàn bộ tiến độ đã làm?")) return;
  state = QUESTIONS.map(() => null);
  idx = 0; sel = null;
  store.del(KEY);
  render();
  window.scrollTo({top:0, behavior:"smooth"});
};
render();
</script>
</body>
</html>
