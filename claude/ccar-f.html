n":{"key":"<b>“You notice during testing that with your current frequently omits required”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Split into three separate tools (each defining only the parameters required”</b> <i>(trong đáp án B)</i>: Chia thành ba công cụ riêng biệt (mỗi công cụ chỉ xác định các tham số cần thiết…","elim":["<b>A. Keep one unified tool with a nested operation object parameter whose internal structure varies by operation type, documented in the tool description.</b>: Một tool có nhiều mode và bộ tham số điều kiện làm schema khó hiểu…","<b>C. Keep one unified tool but add JSON Schema if-then-else conditionals to enforce that parameters like amount are required only when the operation type is &quot;refund&quot;.</b>: Một tool có nhiều mode và bộ tham số điều kiện làm schema khó hiểu…","<b>D. Keep one unified tool with all parameters marked optional, but add few-shot examples in the system prompt showing correct parameter combinations for each operation.</b>: Một tool có nhiều mode và bộ tham số điều kiện làm schema khó hiểu…"]}},{"id":"t1q142","n":142,"topic":1,"type":"mcq","stem":{"en":"Your fitness coaching assistant uses a system prompt with detailed conditional logic: &quot;If the user mentions being a beginner, provide step-by-step form instructions. If they use term &#x27;progressive overload&#x27; or &#x27;superset&#x27;, respond concisely. If they ask about injury history, always recommend consulting a physician.&quot; During evaluation, you find the assistant correct explicit expertise declarations but struggles when users don&#x27;t clearly state their level-often defaulting to overly detailed responses regardless of contextual cues like technical terms. Which change to the system prompt would most directly address this failure to pick up on implicit expertise signals?"},"options":[{"k":"A","t":{"en":"Implement a pre-conversation intake that asks users to rate their experience level, then inject that rating into the system prompt as context for all subsequent responses."}},{"k":"B","t":{"en":"Add more conditional branches to cover additional expertise signals, such as &quot;If user mentions specific rep ranges or asks about periodization, treat as advanced.&quot;"}},{"k":"C","t":{"en":"Replace most conditionals with a general principle: &quot;Adapt explanation depth to match user expertise, mirroring their terminology.&quot; Keep only the safety-critical conditional abou consultations."}},{"k":"D","t":{"en":"Add an explicit instruction for the model to ask a clarifying question about experience level whenever the user&#x27;s expertise isn&#x27;t immediately clear from their first message."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“If they ask about injury history, always recommend consulting a physician.&quot;”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Replace most conditionals with a general principle: &quot;Adapt explanation depth to”</b> <i>(trong đáp án C)</i>: Thay thế hầu hết các điều kiện bằng một nguyên tắc chung: &quot;Điều chỉnh độ sâu giải thích…","elim":["<b>A. Implement a pre-conversation intake that asks users to rate their experience level, then inject that rating into the system prompt as context for all subsequent responses.</b>: Bỏ qua yêu cầu chính “If they ask about injury history, always recommend”.","<b>B. Add more conditional branches to cover additional expertise signals, such as &quot;If user mentions specific rep ranges or asks about periodization, treat as advanced.&quot;</b>: Bỏ qua yêu cầu chính “If they ask about injury history, always recommend”.","<b>D. Add an explicit instruction for the model to ask a clarifying question about experience level whenever the user&#x27;s expertise isn&#x27;t immediately clear from their first message.</b>: Bỏ qua yêu cầu chính “If they ask about injury history, always recommend”."]}},{"id":"t1q143","n":143,"topic":1,"type":"mcq","stem":{"en":"You&#x27;re building a security scanning workflow. When engineers need to locate all occurrences of a dangerous function like eval() across a large codebase, which tool should your agent use for content search?"},"options":[{"k":"A","t":{"en":"Use Bash to run ls -R | grep eval to recursively list files containing eval."}},{"k":"B","t":{"en":"Use Glob with a pattern like /<i>eval</i> to find files, then Read each matching file."}},{"k":"C","t":{"en":"Read the project&#x27;s main entry file and follow import statements to trace where eval might be used."}},{"k":"D","t":{"en":"Use Grep to search for the pattern &quot;eval(&quot; across all files in the codebase."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“You&#x27;re building a security scanning workflow.”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Use Grep to search for the pattern &quot;eval(&quot; across all files”</b> <i>(trong đáp án D)</i>: Grep là công cụ tìm kiếm nội dung được xây dựng có mục đích (dựa trên ripgrep) để…","elim":["<b>A. Use Bash to run ls -R | grep eval to recursively list files containing eval.</b>: Bash có thể thực hiện thao tác nhưng dễ vỡ và bỏ qua contract hoặc…","<b>B. Use Glob with a pattern like /<i>eval</i> to find files, then Read each matching file.</b>: Glob chủ yếu khớp tên hoặc đường dẫn tệp; nó không phải công cụ phù…","<b>C. Read the project&#x27;s main entry file and follow import statements to trace where eval might be used.</b>: Bash có thể thực hiện thao tác nhưng dễ vỡ và bỏ qua contract hoặc…"]}},{"id":"t1q144","n":144,"topic":1,"type":"mcq","stem":{"en":"Your test generation produces unit tests for new code, but reviews show 55% are low-value: trivial assertions that only verify functions don&#x27;t throw exceptions, tests duplicating existing coverage, or tests ignoring your team&#x27;s fixture conventions. How do you reduce the rate of low-value tests being generated in the first place?"},"options":[{"k":"A","t":{"en":"Document testing standards in CLAUDE.md including valuable test criteria, available fixtures with intended use cases, and examples distinguishing meaningful behavioral tests from trivial assertions."}},{"k":"B","t":{"en":"Add post-generation coverage analysis that automatically filters out any generated test that doesn&#x27;t increase line coverage beyond what existing tests provide."}},{"k":"C","t":{"en":"Implement a two-phase generation where a second Claude call scores each test against quality criteria, filtering out low-scoring tests before presenting results to developers."}},{"k":"D","t":{"en":"Restrict test generation to directories where historical quality metrics show higher acceptance rates, disabling it for areas where generated tests consistently require heavy editing."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“Your test generation produces unit tests for new code, but reviews”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Document testing standards in CLAUDE.md including valuable test criteria, available fixtures”</b> <i>(trong đáp án A)</i>: Câu hỏi hỏi rõ ràng cách giảm bớt các bài kiểm tra giá trị thấp &quot;được tạo ra…","elim":["<b>B. Add post-generation coverage analysis that automatically filters out any generated test that doesn&#x27;t increase line coverage beyond what existing tests provide.</b>: Bỏ qua yêu cầu chính “Your test generation produces unit tests for new”.","<b>C. Implement a two-phase generation where a second Claude call scores each test against quality criteria, filtering out low-scoring tests before presenting results to developers.</b>: Bỏ qua yêu cầu chính “Your test generation produces unit tests for new”.","<b>D. Restrict test generation to directories where historical quality metrics show higher acceptance rates, disabling it for areas where generated tests consistently require heavy editing.</b>: Bỏ qua yêu cầu chính “Your test generation produces unit tests for new”."]}},{"id":"t1q145","n":145,"topic":1,"type":"mcq","stem":{"en":"Your expense reimbursement agent processes employee requests using a process reimbursement tool. Company policy requires that reimbursements above $500 must be approved before funds are disbursed. The agent handles hundreds of requests daily, and you need the threshold enforcement to be tamper-proof regardless of how the agent is prompted ensures the $500 approval threshold cannot be bypassed?"},"options":[{"k":"A","t":{"en":"The process reimbursement tool accepts an approved by manager parameter. The system prompt instructs the agent to only set this to true after confirming that a manager approved the request. A nightly audit script reviews all reimbursements where approved by manager was set to true."}},{"k":"B","t":{"en":"Implement the threshold check in a PreToolUse hook that inspects the amount parameter before process reimbursement executes. If the amount exceeds $500, the hook modifies the context to add a requires approval: true flag, which the tool checks before disbursing."}},{"k":"C","t":{"en":"The process reimbursement tool accepts amount and details, and internally enforces the threshold; amounts &lt;$500 are auto-disbursed and the tool returns a success confirmation. Amounts &gt;$500 cause the tool to create a pending approval request and return a status indicating manager review is pending."}},{"k":"D","t":{"en":"Provide two tools: auto reimburse (hard-coded limit of $500) and manager approval. Include detailed system prompt instructions telling the agent to check the amount and use the appropriate tool. Add a Post ToolUse hook that logs which tool was called for auditing."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“Company policy requires that reimbursements above $500 must be approved before”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“The process reimbursement tool accepts amount and details, and internally enforces”</b> <i>(trong đáp án C)</i>: Công cụ hoàn trả theo quy trình chấp nhận số tiền và thông tin chi tiết, đồng thời…","elim":["<b>A. The process reimbursement tool accepts an approved by manager parameter. The system prompt instructs the agent to only set this to true after confirming that a manager approved the request. A nightly audit script reviews all reimbursements where approved by manager was set to true.</b>: Prompt và ví dụ chỉ định hướng hành vi xác suất; chúng không thể bảo…","<b>B. Implement the threshold check in a PreToolUse hook that inspects the amount parameter before process reimbursement executes. If the amount exceeds $500, the hook modifies the context to add a requires approval: true flag, which the tool checks before disbursing.</b>: Bỏ qua yêu cầu chính “Company policy requires that reimbursements above $500 must”.","<b>D. Provide two tools: auto reimburse (hard-coded limit of $500) and manager approval. Include detailed system prompt instructions telling the agent to check the amount and use the appropriate tool. Add a Post ToolUse hook that logs which tool was called for auditing.</b>: Prompt và ví dụ chỉ định hướng hành vi xác suất; chúng không thể bảo…"]}},{"id":"t1q146","n":146,"topic":1,"type":"mcq","stem":{"en":"Your portfolio value tool returns the total value of a user&#x27;s investment portfolio. You&#x27;re deciding between returning a structured JSON object with explicit fields versus returning information as a formatted text string. What is the primary advantage of using structured output with defined fields?"},"options":[{"k":"A","t":{"en":"JSON schemas automatically validate that the underlying API returned correct data before the agent processes it."}},{"k":"B","t":{"en":"Structured JSON is processed deterministically by the model, significantly improving accuracy when extracting values."}},{"k":"C","t":{"en":"The agent can reliably extract specific values without parsing free form text, reducing errors in subsequent operations."}},{"k":"D","t":{"en":"Structured JSON consumes significantly fewer tokens than natural language, substantially reducing API costs."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“You&#x27;re deciding between returning a structured JSON object with explicit fields”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“The agent can reliably extract specific values without parsing free form”</b> <i>(trong đáp án C)</i>: Tác nhân có thể trích xuất các giá trị cụ thể một cách đáng tin cậy mà không…","elim":["<b>A. JSON schemas automatically validate that the underlying API returned correct data before the agent processes it.</b>: Bỏ qua yêu cầu chính “You&#x27;re deciding between returning a structured JSON object”.","<b>B. Structured JSON is processed deterministically by the model, significantly improving accuracy when extracting values.</b>: Bash có thể thực hiện thao tác nhưng dễ vỡ và bỏ qua contract hoặc…","<b>D. Structured JSON consumes significantly fewer tokens than natural language, substantially reducing API costs.</b>: Bỏ qua yêu cầu chính “You&#x27;re deciding between returning a structured JSON object”."]}},{"id":"t1q147","n":147,"topic":1,"type":"mcq","stem":{"en":"Performance analysis reveals your context is composed of accumulated RAG results from all previous queries, which is crowding out conversation history and causing coherence degradation after 15+ turns. Which approach best addresses this issue?"},"options":[{"k":"A","t":{"en":"Compress all RAG results into a consolidated summary document that updates incrementally after each retrieval"}},{"k":"B","t":{"en":"Implement a sliding window for RAG results from the last 2-3 queries while preserving conversation history"}},{"k":"C","t":{"en":"Implement semantic deduplication to identify and remove redundant information across the accumulated RAG results and conversation turns"}},{"k":"D","t":{"en":"Shift context budget to favor RAG results while reducing conversation history allocation"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“Performance analysis t/SKILL.md at the project root, committed to version control”</b> <i>(trong đáp án B)</i>: Trong .claude/skills/migrate-comComponent/SKILL.md ở gốc dự án, cam kết kiểm soát phiên bản.","elim":["<b>A. In the project&#x27;s .claude/settings.json using a skillOverrides entry to register and define the workflow</b>: Bỏ qua yêu cầu chính “Your team frequently migrates React components to Vue”.","<b>C. In ~/.claude/skills/migrate-component/SKILL.md on each developer&#x27;s machine</b>: Bỏ qua yêu cầu chính “Your team frequently migrates React components to Vue”.","<b>D. As a detailed instruction block in the project&#x27;s root CLAUDE.md file</b>: Bỏ qua yêu cầu chính “Your team frequently migrates React components to Vue”."]}},{"id":"t1q149","n":149,"topic":1,"type":"mcq","stem":{"en":"The system processes product reviews using tool use with a defined schema: rating (integer 1-5), pros (string array), cons (string array), and overall_sentiment (enum: positive, negative, mixed). Testing reveals two issues with brief or ambiguous reviews (~20% of the dataset): (1) for reviews like &quot;Great product!&quot;, Claude fabricates specific pros and cons rather than indicating this information isn&#x27;t explicitly stated, and (2) for sarcastic reviews like &quot;Well that was... interesting&quot;, Claude picks sentiment arbitrarily since there&#x27;s no option for ambiguous cases. What schema modification best addresses both issues?"},"options":[{"k":"A","t":{"en":"Allow null values for pros/cons, and add &quot;unclear&quot; to the sentiment enum."}},{"k":"B","t":{"en":"Make pros and cons optional fields, and add &quot;neutral&quot; and &quot;unclear&quot; to the sentiment enum."}},{"k":"C","t":{"en":"Add an extraction_confidence field (0.0-1.0) for each value, and filter outputs where any confidence falls below a threshold."}},{"k":"D","t":{"en":"Allow empty arrays for pros/cons as valid output, and add &quot;unclear&quot; to the sentiment enum."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“Testing reveals two issues with brief or ambiguous reviews (~20% of”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Allow empty arrays for pros/cons as valid output, and add &quot;unclear&quot;”</b> <i>(trong đáp án D)</i>: Cho phép các mảng trống cho ưu/nhược điểm làm đầu ra hợp lệ và thêm &quot;không rõ ràng&quot;…","elim":["<b>A. Allow null values for pros/cons, and add &quot;unclear&quot; to the sentiment enum.</b>: Bỏ qua yêu cầu chính “Testing reveals two issues with brief or ambiguous”.","<b>B. Make pros and cons optional fields, and add &quot;neutral&quot; and &quot;unclear&quot; to the sentiment enum.</b>: Bỏ qua yêu cầu chính “Testing reveals two issues with brief or ambiguous”.","<b>C. Add an extraction_confidence field (0.0-1.0) for each value, and filter outputs where any confidence falls below a threshold.</b>: Bỏ qua yêu cầu chính “Testing reveals two issues with brief or ambiguous”."]}},{"id":"t1q150","n":150,"topic":1,"type":"mcq","stem":{"en":"Production logs show that when the agent handles complex billing disputes requiring 6+ tool calls, it sometimes exhausts its max_turns limit after gathering data and before completing resolution or escalating. The team&#x27;s goal is to guarantee that every customer interaction ends with either a completed resolution or a human escalation, regardless of how the agent loop terminates. Which approach achieves this guarantee?"},"options":[{"k":"A","t":{"en":"Add orchestration-layer code that checks the agent&#x27;s outcome after each loop termination - if the loop ended without a completed resolution or escalation, programmatically call escalate_to_human with the accumulated conversation context and tool results."}},{"k":"B","t":{"en":"Add system prompt instructions telling the agent to call escalate_to_human with a summary of its findings whenever it determines it cannot resolve the dispute."}},{"k":"C","t":{"en":"Split the workflow into two sequential agent invocations — a first agent gathers information via get_customer and lookup_order, then the second agent uses that data and handles process_refund or escalate_to_human, each with separate turn budgets."}},{"k":"D","t":{"en":"Implement a pre-tool-use hook that counts tool invocations and terminates the loop with an automatic escalation once the agent reaches 80% of its remaining actions."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“The team&#x27;s goal is to guarantee that every customer interaction ends”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Add orchestration-layer code that checks the agent&#x27;s outcome after each loop”</b> <i>(trong đáp án A)</i>: Thêm mã lớp điều phối để kiểm tra kết quả của agent sau mỗi lần kết thúc vòng…","elim":["<b>B. Add system prompt instructions telling the agent to call escalate_to_human with a summary of its findings whenever it determines it cannot resolve the dispute.</b>: Prompt và ví dụ chỉ định hướng hành vi xác suất; chúng không thể bảo…","<b>C. Split the workflow into two sequential agent invocations — a first agent gathers information via get_customer and lookup_order, then the second agent uses that data and handles process_refund or escalate_to_human, each with separate turn budgets.</b>: Bỏ qua yêu cầu chính “The team&#x27;s goal is to guarantee that every”.","<b>D. Implement a pre-tool-use hook that counts tool invocations and terminates the loop with an automatic escalation once the agent reaches 80% of its remaining actions.</b>: Bỏ qua yêu cầu chính “The team&#x27;s goal is to guarantee that every”."]}},{"id":"t1q151","n":151,"topic":1,"type":"mcq","stem":{"en":"A developer uses Claude Code to refactor a function during their development session. Before committing, they ask the same Claude session to review the code for issues. Later, a separate automated CI review catches several bugs that the same-session review missed. What best explains this discrepancy?"},"options":[{"k":"A","t":{"en":"The CI environment has access to the full codebase context while the local session only sees the current file"}},{"k":"B","t":{"en":"Claude retains context about its prior reasoning in the session, making it less likely to question its own decisions"}},{"k":"C","t":{"en":"The extended session length caused the context window to fill with conversation history, leaving less room for thorough analysis"}},{"k":"D","t":{"en":"The CI review uses a more specific prompt tailored for catching bugs, while the developer&#x27;s request was too general"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“Later, a separate automated CI review catches several bugs that the”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Claude retains context about its prior reasoning in the session, making”</b> <i>(trong đáp án B)</i>: để Claude giữ lại bối cảnh về lý do trước đó của anh ấy trong phiên họp, khiến…","elim":["<b>A. The CI environment has access to the full codebase context while the local session only sees the current file</b>: Bỏ qua yêu cầu chính “Later, a separate automated CI review catches several”.","<b>C. The extended session length caused the context window to fill with conversation history, leaving less room for thorough analysis</b>: Bash có thể thực hiện thao tác nhưng dễ vỡ và bỏ qua contract hoặc…","<b>D. The CI review uses a more specific prompt tailored for catching bugs, while the developer&#x27;s request was too general</b>: Bỏ qua yêu cầu chính “Later, a separate automated CI review catches several”."]}},{"id":"t1q152","n":152,"topic":1,"type":"mcq","stem":{"en":"You&#x27;ve configured your Claude agent with three MCP servers: one for git operations, one for Jira ticket management, and one for documentation search. When a user asks the agent to &quot;create a branch for JIRA- 123 and add documentation links to the ticket,&quot; how does the agent access tools across these servers?"},"options":[{"k":"A","t":{"en":"The agent automatically selects the most relevant server based on the request and loads only that server&#x27;s tools."}},{"k":"B","t":{"en":"You must specify which MCP server to use for each turn, and the agent can only access one server&#x27;s tools at a time."}},{"k":"C","t":{"en":"Tools from all configured MCP servers are discovered at connection time and available simultaneously to the agent."}},{"k":"D","t":{"en":"The agent queries each server sequentially to determine which handles each tool, routing calls based on tool name prefixes."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“You&#x27;ve configured your Claude agent with three MCP servers: one for”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Tools from all configured MCP servers are discovered at connection time”</b> <i>(trong đáp án C)</i>: để Công cụ từ tất cả các MCP server được định cấu hình được phát hiện tại thời…","elim":["<b>A. The agent automatically selects the most relevant server based on the request and loads only that server&#x27;s tools.</b>: Bash có thể thực hiện thao tác nhưng dễ vỡ và bỏ qua contract hoặc…","<b>B. You must specify which MCP server to use for each turn, and the agent can only access one server&#x27;s tools at a time.</b>: Bỏ qua yêu cầu chính “You&#x27;ve configured your Claude agent with three MCP”.","<b>D. The agent queries each server sequentially to determine which handles each tool, routing calls based on tool name prefixes.</b>: Bash có thể thực hiện thao tác nhưng dễ vỡ và bỏ qua contract hoặc…"]}},{"id":"t1q153","n":153,"topic":1,"type":"mcq","stem":{"en":"An engineer submits two requests: • Request A: &quot;Rename the getUserData function to fetchUserProfile everywhere it&#x27;s used.&quot; • Request B: &quot;Improve error handling throughout the data processing module—add try/catch blocks, meaningful error messages, and ensure failures don&#x27;t silently corrupt data.&quot; For which request does specifying an explicit multi-phase workflow (such as analyze propose implement with review) most improve outcome quality?"},"options":[{"k":"A","t":{"en":"Neither request benefits significantly"}},{"k":"B","t":{"en":"Request A, the function rename task"}},{"k":"C","t":{"en":"Both requests benefit equally"}},{"k":"D","t":{"en":"Request B, the error handling task"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“An engineer submits two requests: • Request A: &quot;Rename the getUserData”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Request B, the error handling task”</b> <i>(trong đáp án D)</i>: Yêu cầu B có kết thúc mở và mang nặng tính phán xét — &quot;cải thiện việc xử…","elim":["<b>A. Neither request benefits significantly</b>: Bỏ qua yêu cầu chính “An engineer submits two requests: • Request A:”.","<b>B. Request A, the function rename task</b>: Bỏ qua yêu cầu chính “An engineer submits two requests: • Request A:”.","<b>C. Both requests benefit equally</b>: Bỏ qua yêu cầu chính “An engineer submits two requests: • Request A:”."]}},{"id":"t1q154","n":154,"topic":1,"type":"mcq","stem":{"en":"During initial testing of the automated review pipeline, you notice that reviews on large PRs (50+ changed files) sometimes take over 20 minutes and cost $8-12 per run due to extensive agentic loops — Claude reads files, runs analysis tools, and iterates many times. Your team needs each invocation to abort once it reaches a fixed iteration count and a fixed dollar amount, enforced by Claude Code itself rather than the surrounding job runner. Which configuration change directly enforces both of those per-invocation caps?"},"options":[{"k":"A","t":{"en":"Add --max-turns 10 --max-budget-usd 2.00 to the claude -p invocation to cap iterations and spend."}},{"k":"B","t":{"en":"Set --permission-mode dontAsk to auto-deny any tool permission requests not in the explicitly allowed set."}},{"k":"C","t":{"en":"Switch the --model flag to a smaller, cheaper model so each iteration uses fewer tokens and lower per- call cost."}},{"k":"D","t":{"en":"Set timeout-minutes: 5 on the GitHub Actions job step and monitor per-run costs via the Anthropic Console usage dashboard."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“Your team needs each invocation to abort once it reaches a”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Add --max-turns 10 --max-budget-usd 2.00 to the claude -p invocation to”</b> <i>(trong đáp án A)</i>: Các điều khiển bắt buộc là các giới hạn riêng cho mỗi lần gọi bên trong chính Claude…","elim":["<b>B. Set --permission-mode dontAsk to auto-deny any tool permission requests not in the explicitly allowed set.</b>: Bỏ qua yêu cầu chính “Your team needs each invocation to abort once”.","<b>C. Switch the --model flag to a smaller, cheaper model so each iteration uses fewer tokens and lower per- call cost.</b>: Bỏ qua yêu cầu chính “Your team needs each invocation to abort once”.","<b>D. Set timeout-minutes: 5 on the GitHub Actions job step and monitor per-run costs via the Anthropic Console usage dashboard.</b>: Bỏ qua yêu cầu chính “Your team needs each invocation to abort once”."]}},{"id":"t1q155","n":155,"topic":1,"type":"mcq","stem":{"en":"Your update_user_profile tool accepts a user_id (required) and an optional fields_to_update object. In testing, Claude frequently omits user_id or passes incorrectly structured data. What is most critical for helping Claude understand what parameter values to provide?"},"options":[{"k":"A","t":{"en":"Verbose parameter names encoding format hints, such as user_id_string_uuid_format"}},{"k":"B","t":{"en":"Clear parameter descriptions explaining expected format, such as &quot;user_id : UUID of the user to update (required)&quot;"}},{"k":"C","t":{"en":"Detailed error responses explaining why invalid parameter values were rejected"}},{"k":"D","t":{"en":"Strict JSON Schema type constraints marking user_id as required and defining fields_to_update as an object type"}}],"answer":["B"],"multi": every 20 turns, replacing the full history to free up tokens."}},{"k":"D","t":{"en":"Store all history in a vector database and retrieve semantically similar passages for each new message, replacing conversation history with retrieved chunks."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“After 40+ turns, you&#x27;re hitting context limits and users report the”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Separate persistent story elements into a retained &quot;story bible&quot; section at”</b> <i>(trong đáp án A)</i>: Tách các yếu tố câu chuyện dai dẳng thành một phần &quot;kinh thánh câu chuyện&quot; được giữ lại…","elim":["<b>B. Apply a sliding-window approach keeping only the most recent 25 turns, relying on the model to infer earlier context from recent discussion flow.</b>: Bỏ qua yêu cầu chính “After 40+ turns, you&#x27;re hitting context limits and”.","<b>C. Summarize the entire conversation history into a condensed synopsis every 20 turns, replacing the full history to free up tokens.</b>: Bash có thể thực hiện thao tác nhưng dễ vỡ và bỏ qua contract hoặc…","<b>D. Store all history in a vector database and retrieve semantically similar passages for each new message, replacing conversation history with retrieved chunks.</b>: Retrieval có thể hữu ích ở quy mô lớn nhưng bổ sung hạ tầng và…"]}},{"id":"t1q157","n":157,"topic":1,"type":"mcq","stem":{"en":"Users frequently refine their search criteria mid-conversation. You notice a pattern: when users say things like &quot;Actually, let&#x27;s raise the budget to $650K&quot; or &quot;I&#x27;d prefer a condo now instead of a house,&quot; the assistant sometimes continues referencing the original preferences in later responses—even though the updates are clearly present in the conversation history. Context usage is only at 35% capacity. Which solution most reliably ensures the model uses the current preferences?"},"options":[{"k":"A","t":{"en":"Implement conversation pruning to remove turns containing outdated preferences, ensuring only current ones remain in context."}},{"k":"B","t":{"en":"Add system prompt instructions emphasizing that the model should always prioritize the most recently stated preferences over earlier ones."}},{"k":"C","t":{"en":"Include few-shot examples showing the assistant correctly acknowledging and applying preference changes in responses."}},{"k":"D","t":{"en":"Maintain a structured state object with current preferences, update it on changes, and include it in each request."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“Context usage is only at 35% capacity.”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Maintain a structured state object with current preferences, update it on”</b> <i>(trong đáp án D)</i>: Duy trì một đối tượng trạng thái có cấu trúc với các tùy chọn hiện tại, cập nhật…","elim":["<b>A. Implement conversation pruning to remove turns containing outdated preferences, ensuring only current ones remain in context.</b>: Bỏ qua yêu cầu chính “Context usage is only at 35% capacity”.","<b>B. Add system prompt instructions emphasizing that the model should always prioritize the most recently stated preferences over earlier ones.</b>: Bỏ qua yêu cầu chính “Context usage is only at 35% capacity”.","<b>C. Include few-shot examples showing the assistant correctly acknowledging and applying preference changes in responses.</b>: Bỏ qua yêu cầu chính “Context usage is only at 35% capacity”."]}},{"id":"t1q158","n":158,"topic":1,"type":"mcq","stem":{"en":"After deploying automated code review, developers report that approximately 35% of flagged findings are false positives falling into consistent patterns: style suggestion contradicting team conventions, security warnings for patterns safe in your deployment context, and performance suggestions that would degrade your specific use case. You want to reduce false positives while maintaining the ability to catch genuine issues. Which approach best enables the model to generalize its judgment to novel code patterns it hasn&#x27;t seen before?"},"options":[{"k":"A","t":{"en":"Create a comprehensive written specification of all patterns that should not be flagged, then include this full documentation in the system prompt."}},{"k":"B","t":{"en":"Implement post-processing that uses keyword matching to filter out findings containing terms like &quot;convention,&quot; &quot;context-dependent,&quot; or &quot;trade-off.&quot;"}},{"k":"C","t":{"en":"Add instructions to your system prompt to &quot;be conservative,&quot; &quot;only flag definite issues,&quot; and &quot;consider that some patterns may be intentional.&quot;"}},{"k":"D","t":{"en":"Include few-shot examples in your prompt showing annotated code snippets that distinguish acceptable patterns from genuine issues in each category."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“After deploying automated code review, developers report that approximately 35% of”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Include few-shot examples in your prompt showing annotated code snippets that”</b> <i>(trong đáp án D)</i>: Bao gồm một vài ví dụ ngắn gọn trong lời nhắc của bạn hiển thị các đoạn mã…","elim":["<b>A. Create a comprehensive written specification of all patterns that should not be flagged, then include this full documentation in the system prompt.</b>: Bỏ qua yêu cầu chính “After deploying automated code review, developers report that”.","<b>B. Implement post-processing that uses keyword matching to filter out findings containing terms like &quot;convention,&quot; &quot;context-dependent,&quot; or &quot;trade-off.&quot;</b>: Bỏ qua yêu cầu chính “After deploying automated code review, developers report that”.","<b>C. Add instructions to your system prompt to &quot;be conservative,&quot; &quot;only flag definite issues,&quot; and &quot;consider that some patterns may be intentional.&quot;</b>: Bỏ qua yêu cầu chính “After deploying automated code review, developers report that”."]}},{"id":"t1q159","n":159,"topic":1,"type":"mcq","stem":{"en":"You are setting up a non-interactive automated code review pipeline using Claude Code. You want Claude to analyze a pulled Git diff (git diff) against the main branch and apply a custom set of code review instructions. However, you notice that when you run the pipeline, Claude only looks at the raw diff text itself and completely stops using its file-reading or code navigation tools. As a result, it fails to inspect the broader codebase repository context, which is critical because the diff modifies a core function called by many other external modules. Which change to the CLI invocation will cause Claude to read related files in the repository while still successfully applying your custom review instructions?"},"options":[{"k":"A","t":{"en":"Replace --system-prompt with --append-system-prompt so your review instructions are added to Claude Code&#x27;s default prompt instead of overwriting the built-in guidance for using file-reading and code navigation tools."}},{"k":"B","t":{"en":"Remove --system-prompt entirely and place the review instructions in a CLAUDE.md file at the repo root, since --system-prompt is incompatible with tool use under -p."}},{"k":"C","t":{"en":"Stop piping the diff via stdin and instead embed the diff contents inside the prompt string, so Claude Code treats the invocation as an agentic session rather than a stream-processing one."}},{"k":"D","t":{"en":"Keep --system-prompt and add --allowedTools &quot;Read, Glob, Grep&quot; so that the non-interactive mode permits file system tools that it otherwise disables."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“As a result, it fails to inspect the broader codebase repository”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Replace --system-prompt with --append-system-prompt so your review instructions are added to”</b> <i>(trong đáp án A)</i>: Thay thế --system-prompt bằng --append-system-prompt để hướng dẫn xem xét của bạn được thêm vào lời nhắc mặc…","elim":["<b>B. Remove --system-prompt entirely and place the review instructions in a CLAUDE.md file at the repo root, since --system-prompt is incompatible with tool use under -p.</b>: Bỏ qua yêu cầu chính “As a result, it fails to inspect the”.","<b>C. Stop piping the diff via stdin and instead embed the diff contents inside the prompt string, so Claude Code treats the invocation as an agentic session rather than a stream-processing one.</b>: Bỏ qua yêu cầu chính “As a result, it fails to inspect the”.","<b>D. Keep --system-prompt and add --allowedTools &quot;Read, Glob, Grep&quot; so that the non-interactive mode permits file system tools that it otherwise disables.</b>: Bỏ qua yêu cầu chính “As a result, it fails to inspect the”."]}},{"id":"t1q160","n":160,"topic":1,"type":"mcq","stem":{"en":"Your development team is using Claude Code to automate test generation across a large codebase. However, developers are frequently rejecting the generated test suites because Claude creates a high volume of trivial assertions or tests that merely maximize line coverage without validating meaningful behavioral logic or edge cases. You want to guide Claude to generate high-quality, production-ready tests directly without introducing high latency or modifying the core pipeline script. Which strategy best ensures that high-quality, meaningful tests are generated in the first place?"},"options":[{"k":"A","t":{"en":"Document testing standards in CLAUDE.md including valuable test criteria, available fixtures with intended use cases, and examples distinguishing meaningful behavioral tests from trivial assertions."}},{"k":"B","t":{"en":"Implement a two-phase generation where a second Claude call scores each test against quality criteria, filtering out low-scoring tests before presenting results to developers."}},{"k":"C","t":{"en":"Add post-generation coverage analysis that automatically filters out any generated test that doesn&#x27;t increase line coverage beyond what existing tests provide."}},{"k":"D","t":{"en":"Restrict test generation to directories where historical quality metrics show higher acceptance rates, disabling it for areas where generated tests consistently require heavy editing."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“You want to guide Claude to generate high-quality, production-ready tests directly”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Document testing standards in CLAUDE.md including valuable test criteria, available fixtures”</b> <i>(trong đáp án A)</i>: Ghi lại các tiêu chuẩn kiểm tra trong CLAUDE.md, bao gồm các tiêu chí kiểm tra có giá…","elim":["<b>B. Implement a two-phase generation where a second Claude call scores each test against quality criteria, filtering out low-scoring tests before presenting results to developers.</b>: Bỏ qua yêu cầu chính “You want to guide Claude to generate high-quality,”.","<b>C. Add post-generation coverage analysis that automatically filters out any generated test that doesn&#x27;t increase line coverage beyond what existing tests provide.</b>: Bỏ qua yêu cầu chính “You want to guide Claude to generate high-quality,”.","<b>D. Restrict test generation to directories where historical quality metrics show higher acceptance rates, disabling it for areas where generated tests consistently require heavy editing.</b>: Bỏ qua yêu cầu chính “You want to guide Claude to generate high-quality,”."]}},{"id":"t1q161","n":161,"topic":1,"type":"mcq","stem":{"en":"Your music discovery assistant should consistently maintain an enthusiastic tone, explain its reasoning for each recommendation, and ask clarifying questions to better understand user preferences. You want this behavior to persist reliably across all user interactions. Where should you define these behavioral guidelines?"},"options":[{"k":"A","t":{"en":"In the first assistant message, instructing Claude to follow these guidelines going forward"}},{"k":"B","t":{"en":"In environmental variables that your application passes to the API client"}},{"k":"C","t":{"en":"Prepended to each user message before sending to the API"}},{"k":"D","t":{"en":"In the system prompt"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“You want this behavior to persist reliably across all user interactions.”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“In the system prompt”</b> <i>(trong đáp án D)</i>: Trong lời nhắc hệ thống.","elim":["<b>A. In the first assistant message, instructing Claude to follow these guidelines going forward</b>: Bỏ qua yêu cầu chính “You want this behavior to persist reliably across”.","<b>B. In environmental variables that your application passes to the API client</b>: Bỏ qua yêu cầu chính “You want this behavior to persist reliably across”.","<b>C. Prepended to each user message before sending to the API</b>: Bỏ qua yêu cầu chính “You want this behavior to persist reliably across”."]}},{"id":"t1q162","n":162,"topic":1,"type":"mcq","stem":{"en":"Your team is configuring MCP servers in Claude Code. You want to add a shared venue lookup server that all team members should have access to, and you personally want to add an experimental music playlist server that only you are testing. Which configuration approach correctly applies MCP server scopes?"},"options":[{"k":"A","t":{"en":"Add venue server to ~/.claude.json and playlist server to .mcp.json"}},{"k":"B","t":{"en":"Add venue server to .mcp.json and playlist server to ~/.claude.json"}},{"k":"C","t":{"en":"Add both servers to the project-level .mcp.json file"}},{"k":"D","t":{"en":"Add both servers to your local ~/.claude.json"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“You want to add a shared venue lookup server that all”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Add venue server to .mcp.json and playlist server to ~/.claude.json”</b const store = (() => {
  let ok = false, mem = {};
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); ok = true; } catch(e){}
  return { ok,
    get(k){ try{ return ok ? localStorage.getItem(k) : (mem[k] ?? null); }catch(e){ return mem[k] ?? null; } },
    set(k,v){ try{ ok ? localStorage.setItem(k,v) : (mem[k]=v); }catch(e){ mem[k]=v; } },
    del(k){ try{ ok ? localStorage.removeItem(k) : delete mem[k]; }catch(e){ delete mem[k]; } } };
})();

/* ---------- dữ liệu phẳng ---------- */
const ALL = [], BY_ID = {};
DATA.topics.forEach(tp => tp.questions.forEach(q => {
  q.idx = ALL.length + 1;
  q.hay = fold(strip([q.stem.en, q.stem.vi,
    (q.options||[]).map(o => o.t.en + " " + (o.t.vi||"")).join(" "),
    (q.rows||[]).map(r => r.t.en + " " + (r.t.vi||"")).join(" "),
    (q.blanks||[]).map(b => (b.opts||[]).map(o => o.en).join(" ")).join(" "),
    q.explain && (q.explain.key || q.explain.text), (q.explain && q.explain.elim || []).join(" ")
  ].filter(Boolean).join(" ")));
  ALL.push(q); BY_ID[q.id] = q;
}));
const TOPICS = DATA.topics.map(d => d.n);
const TYPES = [...new Set(ALL.map(q => q.type))];
const PASS = DATA.meta.pass || 70;

/* ============================================================
   LOGIC THEO DẠNG CÂU
   ============================================================ */
function blankAnswer(q){
  if(q.type === "mcq")   return [];
  if(q.type === "yesno") return q.rows.map(() => null);
  return q.blanks.map(() => null);
}
function answeredCount(q, a){
  if(q.type === "mcq") return (a||[]).length;
  return (a||[]).filter(v => v !== null && v !== undefined).length;
}
function totalParts(q){
  if(q.type === "mcq") return q.answer.length;
  if(q.type === "yesno") return q.rows.length;
  return q.blanks.length;
}
function isComplete(q, a){ return answeredCount(q,a) >= totalParts(q); }
function isCorrect(q, a){
  if(!a) return false;
  if(q.type === "mcq")
    return a.length === q.answer.length && [...a].sort().join("") === [...q.answer].sort().join("");
  if(q.type === "yesno") return q.rows.every((r,i) => a[i] === r.a);
  return q.blanks.every((b,i) => a[i] === b.a);
}
function stampHTML(q){
  if(q.type === "mcq")
    return `<div class="stamp"><span class="t">${t("ansTitle")}</span><span class="v">${q.answer.join(" ")}</span></div>`;
  if(q.type === "yesno")
    return `<div class="stamp"><span class="t">${t("ansTitle")}</span><span class="v">${
      q.rows.map(r => r.a === "Y" ? "Y" : "N").join(" ")}</span></div>`;
  return `<div class="stamp txt"><span class="t">${t("ansTitle")}</span><span class="v">${
    q.blanks.map(b => strip(b.opts[b.a].en)).join(" · ")}</span></div>`;
}

/* ---------- thân câu hỏi (dùng chung cho ôn tập / thi / xem lại) ---------- */
function bodyHTML(q, a, done, act){
  const P = act ? `data-act="${act}"` : "";
  if(q.type === "mcq"){
    return `<ul class="opts">` + q.options.map(o => {
      const right = q.answer.includes(o.k), pick = (a||[]).includes(o.k);
      return `<li><button class="opt" ${P} data-k="${o.k}" data-right="${right?1:0}" data-pick="${pick?1:0}"
          ${done?'aria-disabled="true"':""}>
        <span class="k">${o.k}</span><span class="tx">${tx(o.t)}</span>
        <span class="mk mk-you">${t("markYou")}</span><span class="mk mk-ok">${t("markOk")}</span>
      </button></li>`; }).join("") + `</ul>`;
  }
  if(q.type === "yesno"){
    return `<ul class="ynlist">` + q.rows.map((r,i) => {
      const v = a ? a[i] : null;
      const right = v !== null && v === r.a;
      return `<li class="yn" data-right="${right?1:0}">
        <div class="ynt">${tx(r.t)}</div>
        <div class="ynb" role="group">
          <button ${P} data-i="${i}" data-v="Y" data-correct="${r.a==="Y"?1:0}" aria-pressed="${v==="Y"}">${t("yes")}</button>
          <button ${P} data-i="${i}" data-v="N" data-correct="${r.a==="N"?1:0}" aria-pressed="${v==="N"}">${t("no")}</button>
        </div></li>`; }).join("") + `</ul>`;
  }
  return `<div class="blanks">` + q.blanks.map((b,i) => {
    const v = a ? a[i] : null;
    const right = v !== null && v === b.a;
    return `<div class="blank" data-right="${right?1:0}">
      ${b.label ? `<span class="blabel">${tx(b.label)}</span>` : ""}
      <label class="sel ${v!==null?"on":""}">
        <select ${P} data-i="${i}">
          <option value="">— —</option>
          ${b.opts.map((o,j) => {
            const en = strip(o.en), vi = o.vi ? strip(o.vi) : "";
            return `<option value="${j}" ${v===j?"selected":""}${vi?` title="${esc(vi)}"`:""}>${esc(en)}</option>`;
          }).join("")}
        </select><span class="cap"></span>
      </label>
      <span class="ansline ${right?"ok":"bad"}">${t("ansTitle")}: ${esc(strip(b.opts[b.a].en))}${
        L === "vi" && b.opts[b.a].vi ? ` — ${esc(strip(b.opts[b.a].vi))}` : ""}</span>
    </div>`; }).join("") + `</div>`;
}

/* ---------- khối giải thích ---------- */
function noteHTML(r){
  return `<div class="notewrap"><span class="lbl">${t("secNote")}</span>
    <textarea data-act="note" rows="2" placeholder="${esc(t("notePh"))}">${esc(r.note||"")}</textarea></div>`;
}
function revealHTML(q, verdict, extra){
  const e = q.explain || {};
  const two = !!(e.key && e.elim && e.elim.length);
  let secs = "";
  if(e.key)  secs += `<div><h4 class="sech">${t("secKey")}</h4><p class="prose">${e.key}</p></div>`;
  if(e.elim && e.elim.length)
    secs += `<div><h4 class="sech">${t("secElim")}</h4><ul class="elim">${e.elim.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  if(e.text) secs += `<div><h4 class="sech">${t("secExp")}</h4><p class="prose">${e.text}</p></div>`;
  const conf = q.conf ? `<span class="conf ${q.conf.toLowerCase()}">${t("conf"+q.conf.toUpperCase())}</span>` : "";
  return `<div class="rev">
    <div class="revtop">${stampHTML(q)}${verdict}${conf}</div>
    <div class="revgrid ${two?"two":""}">${secs}</div>
    ${q.cite ? `<p class="cite">${t("source")}: ${q.cite}</p>` : ""}
    ${extra || ""}
  </div>`;
}

/* ============================================================
   TRẠNG THÁI
   ============================================================ */
const S = { mode:"study", f:{topic:"all",status:"all",type:"all",q:""},
            p:{}, history:[], cur:null, exam:null, reviewWrongOnly:false };
const rec = id => (S.p[id] ||= { a:null, done:0, ok:null, flag:0, note:"", n:0 });
const ansOf = q => { const r = rec(q.id); if(!r.a) r.a = blankAnswer(q); return r.a; };

function save(){
  const e = S.exam;
  const exam = (e && e.phase === "run") ? {
    ids:e.list.map(x=>x.id), order:e.order, answers:e.answers, flags:e.flags,
    pos:e.pos, started:e.started, duration:e.duration, cfg:e.cfg } : null;
  store.set(KEY, JSON.stringify({ v:2, lang:L, theme:document.documentElement.dataset.theme,
                                  p:S.p, history:S.history, exam }));
}
function load(){
  try{
    const d = JSON.parse(store.get(KEY) || "{}");
    if(d.p) S.p = d.p;
    if(Array.isArray(d.history)) S.history = d.history;
    if(d.lang) L = d.lang;
    if(d.exam && d.exam.ids){
      const list = d.exam.ids.map(id => {
        const q = BY_ID[id]; if(!q) return null;
        const ord = d.exam.order && d.exam.order[id];
        if(ord && q.options) return Object.assign({}, q, { options: ord.map(k => q.options.find(o=>o.k===k)).filter(Boolean) });
        return q;
      }).filter(Boolean);
      if(list.length === d.exam.ids.length)
        S.exam = { phase:"run", list, order:d.exam.order, answers:d.exam.answers||{}, flags:d.exam.flags||{},
                   pos:d.exam.pos||0, started:d.exam.started, duration:d.exam.duration, cfg:d.exam.cfg, timer:null };
    }
  }catch(e){}
}

/* ---------- lọc ---------- */
function filtered(){
  const term = fold(S.f.q.trim());
  return ALL.filter(q => {
    if(S.f.topic !== "all" && q.topic !== +S.f.topic) return false;
    if(S.f.type !== "all" && q.type !== S.f.type) return false;
    const r = S.p[q.id];
    if(S.f.status === "todo"  && r && r.done) return false;
    if(S.f.status === "right" && !(r && r.ok === true)) return false;
    if(S.f.status === "wrong" && !(r && r.ok === false)) return false;
    if(S.f.status === "flag"  && !(r && r.flag)) return false;
    if(term && !q.hay.includes(term)) return false;
    return true;
  });
}
function statsOf(list){
  let done=0, right=0, flag=0;
  list.forEach(q => { const r=S.p[q.id]; if(!r) return;
    if(r.ok === true || r.ok === false){ done++; if(r.ok) right++; }
    if(r.flag) flag++; });
  return { done, right, flag, total:list.length };
}

function renderAll(){ renderRail(); renderMain(); renderAside(); applyI18n(); }

function applyI18n(){
  document.documentElement.lang = L;
  $$("[data-t]").forEach(el => { const v = T[L][el.dataset.t]; if(typeof v === "string") el.textContent = v; });
  $$("[data-t-ph]").forEach(el => { const v = T[L][el.dataset.tPh]; if(typeof v === "string") el.placeholder = v; });
  $("#storeNote").textContent = store.ok ? t("okStore") : t("noStore");
  $$("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === L));
  $$("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === S.mode));
}

function renderRail(){
  // một hàm dựng hàng dùng chung cho MỌI danh sách lọc — thêm bộ lọc mới thì
  // gọi lại nó, đừng đẻ ra kiểu hiển thị thứ hai.
  const listRow = (key, cur, v, lab, count, mark) =>
    `<button class="srow" data-f-key="${key}" data-v="${v}" aria-pressed="${String(v)===String(cur)}">
      <span class="dot ${mark||""}"></span><span class="nm">${esc(lab)}</span><span class="ct">${count}</span>
    </button>`;

  // ----- trạng thái -----
  const counts = (() => {
    let todo=0, right=0, wrong=0, flag=0;
    ALL.forEach(q => { const r = S.p[q.id];
      if(!r || !r.done) todo++;
      if(r && r.ok === true) right++;
      if(r && r.ok === false) wrong++;
      if(r && r.flag) flag++; });
    return {all:ALL.length, todo, right, wrong, flag};
  })();
  $("#fStatus").innerHTML = [
    ["all", t("sAll"), ""], ["todo", t("sTodo"), ""], ["right", t("sRight"), "g"],
    ["wrong", t("sWrong"), "r"], ["flag", t("sFlag"), "f"]
  ].map(([v,lab,mk]) => listRow("status", S.f.status, v, lab, counts[v], mk)).join("");

  // ----- dạng câu: chỉ hiện khi đề có từ hai dạng trở lên -----
  const typeInfo = {mcq:[t("kMcq"),"m-mcq"], yesno:[t("kYesno"),"m-yesno"], dropdown:[t("kDrop"),"m-drop"]};
  const typeBlock = $("#fTypeBlk");
  if(TYPES.length < 2) typeBlock.classList.add("hide");
  else {
    typeBlock.classList.remove("hide");
    const tc = Object.fromEntries(TYPES.map(x => [x, ALL.filter(q => q.type === x).length]));
    $("#fType").innerHTML = listRow("type", S.f.type, "all", t("kAll"), ALL.length, "")
      + TYPES.map(x => listRow("type", S.f.type, x, typeInfo[x][0], tc[x], typeInfo[x][1])).join("");
  }

  const row = (v, name, list) => {
    const s = statsOf(list);
    return `<button class="trow" data-f-key="topic" data-v="${v}" aria-pressed="${String(v)===String(S.f.topic)}">
      <span class="nm">${esc(name)}</span><span class="ct">${s.done}/${s.total}</span>
      <span class="meter"><i class="g" style="width:${pct(s.right,s.total)}%"></i><i class="r" style="width:${pct(s.done-s.right,s.total)}%"></i></span>
    </button>`;
  };
  $("#fTopics").innerHTML = row("all", t("sAll"), ALL) +
    TOPICS.map(n => row(n, t("topicN", n), ALL.filter(q => q.topic === n))).join("");
}

function renderAside(){
  const box = $("#asideBody");
  if(S.mode === "exam" && S.exam && S.exam.phase === "run"){ box.innerHTML = asideExam(); return; }
  if(S.mode === "stats"){ box.innerHTML = asideKeys(); return; }
  box.innerHTML = asideStudy() + asideKeys();
}
function asideStudy(){
  const s = statsOf(ALL);
  const queue = ALL.filter(q => { const r = S.p[q.id]; return r && (r.ok === false || r.flag); }).slice(0,40);
  return `<div class="blk">
    <span class="lbl">${t("progress")}</span>
    <div class="bigbar"><i style="width:${pct(s.right,s.total)}%;background:var(--ok)"></i><i style="width:${pct(s.done-s.right,s.total)}%;background:var(--bad)"></i></div>
    <div class="kv"><span>${t("attempted")}</span><b>${s.done}/${s.total}</b></div>
    <div class="kv"><span>${t("accuracy")}</span><b>${s.done?pct(s.right,s.done)+"%":"—"}</b></div>
    <div class="kv"><span>${t("flagged")}</span><b>${s.flag}</b></div>
  </div>
  <div class="blk only-lg">
    <span class="lbl">${t("queue")} · ${queue.length}</span>
    ${queue.length ? `<div class="queue">` + queue.map(q => {
        const r = S.p[q.id];
        return `<button class="qbtn ${r.ok===false?"is-wrong":"is-flag"}" data-jump="${q.id}">
          <span class="n">${pad2(q.idx)}</span><span class="t">${esc(strip(q.stem.en).slice(0,64))}</span></button>`;
      }).join("") + `</div>` : `<p class="note">${t("queueEmpty")}</p>`}
  </div>`;
}
function asideKeys(){
  const r = (k,d) => `<div class="keyrow"><kbd>${k}</kbd><span>${d}</span></div>`;
  return `<div class="blk only-lg"><span class="lbl">${t("keysTitle")}</span><div class="keys">
    ${r("A–D",t("kPick"))}${r("↵",t("kCheck"))}${r("F",t("kFlag"))}${r("← →",t("kNav"))}${r("/",t("kSearch"))}
  </div></div>`;
}
function asideExam(){
  const e = S.exam;
  const left = e.duration ? Math.max(0, e.duration - Math.floor((Date.now()-e.started)/1000)) : null;
  const ans = e.list.filter((q,i) => isComplete(q, e.answers[i])).length;
  return `<div class="blk">
    <span class="lbl">${t("timeLeft")}</span>
    <div class="timer ${left!==null&&left<60?"low":""}" id="timerOut">${left===null?"∞":clock(left)}</div>
  </div>
  <div class="blk">
    <span class="lbl">${t("answeredN")}</span>
    <div class="bigbar"><i style="width:${pct(ans,e.list.length)}%;background:var(--pick)"></i></div>
    <div class="kv"><span>${t("answeredN")}</span><b>${ans}/${e.list.length}</b></div>
  </div>
  <div class="blk"><span class="lbl">${t("palette")}</span>
    <div class="pal">${e.list.map((q,i)=>`<button class="pd ${isComplete(q,e.answers[i])?"is-ans":""} ${e.flags[i]?"is-flag":""} ${i===e.pos?"is-cur":""}" data-go="${i}">${i+1}</button>`).join("")}</div>
  </div>`;
}

function viewStudy(){
  const list = filtered();
  const head = `<header class="head">
      <div><h2>${t("studyTitle")}</h2><p>${t("studyLead", list.length)}</p></div>
      <div class="r"><span class="lbl">${esc(DATA.meta.code)}</span></div></header>`;
  if(!list.length) return head + `<div class="empty"><b>${t("emptyT")}</b>${t("emptyD")}</div>`;
  return head + list.map(recordHTML).join("");
}

function typeTag(q){
  if(q.type === "yesno") return `<span class="tag multi">${t("tYesno")}</span>`;
  if(q.type === "dropdown") return `<span class="tag multi">${t("tDrop")}</span>`;
  if(q.multi) return `<span class="tag multi">${t("multi", q.answer.length)}</span>`;
  return "";
}

function recordHTML(q){
  const r = rec(q.id), a = ansOf(q);
  const tags = [`<span class="tag">${esc(t("topicN", q.topic))}</span>`,
                `<span class="tag">${esc(t("qN", q.n))}</span>`, typeTag(q)];
  if(r.done && r.ok === true)  tags.push(`<span class="tag ok">${t("verdictOk")}</span>`);
  if(r.done && r.ok === false) tags.push(`<span class="tag bad">${t("verdictBad")}</span>`);
  tags.push(`<button class="flagbtn" data-act="flag" aria-pressed="${!!r.flag}"
      title="${esc(r.flag?t("unflag"):t("flag"))}" aria-label="${esc(r.flag?t("unflag"):t("flag"))}">${ICON.flag}</button>`);

  const n = answeredCount(q,a), total = totalParts(q);
  const bar = r.done
    ? `<button class="btn" data-act="again">${t("again")}</button>`
    : `<button class="btn solid" data-act="check" ${isComplete(q,a)?"":"disabled"}>${t("check")}</button>
       <button class="btn" data-act="reveal">${t("reveal")}</button>
       <span class="note">${n===0 ? t("pickFirst") : n>=total ? t("answered") : t("partial", n, total)}</span>`;

  const verdict = r.ok === true  ? `<span class="verdict ok">${t("verdictOk")}</span>`
                : r.ok === false ? `<span class="verdict bad">${t("verdictBad")}</span>`
                : `<span class="note">${t("verdictNone")}</span>`;

  return `<article class="rec ${S.cur===q.id?"cur":""}" id="rec-${q.id}" data-id="${q.id}" data-done="${r.done?1:0}">
    <div class="rechead"><span class="idx">${pad2(q.idx)}</span><div class="tags">${tags.join("")}</div></div>
    <p class="stem">${tx(q.stem)}</p>
    ${q.img ? `<img class="qimg" src="${q.img}" alt="" data-zoom>` : ""}
    <div class="qbody">${bodyHTML(q, a, r.done, "ans")}</div>
    <div class="bar">${bar}</div>
    ${revealHTML(q, verdict, noteHTML(r))}
  </article>`;
}

function refreshRecord(id, focusSel){
  const q = BY_ID[id];
  let node = document.getElementById("rec-"+id);
  if(!q || !node) return;
  node.outerHTML = recordHTML(q);
  node = document.getElementById("rec-"+id);
  if(node && focusSel){ const n = node.querySelector(focusSel); if(n) n.focus(); }
}

/* ---------- ghi nhận câu trả lời ---------- */
function applyAnswer(q, a, el){
  if(q.type === "mcq"){
    const k = el.dataset.k;
    if(q.answer.length > 1){
      const i = a.indexOf(k);
      if(i >= 0) a.splice(i,1);
      else { if(a.length >= q.answer.length) a.shift(); a.push(k); }
    } else { a.length = 0; if(!el.dataset.was) a.push(k); }
  } else if(q.type === "yesno"){
    const i = +el.dataset.i;
    a[i] = a[i] === el.dataset.v ? null : el.dataset.v;
  } else {
    const i = +el.dataset.i;
    a[i] = el.value === "" ? null : +el.value;
  }
}

function examPool(cfg){
  let p = ALL;
  if(cfg.topic !== "all") p = p.filter(q => q.topic === +cfg.topic);
  if(cfg.source === "wrong") p = p.filter(q => { const r=S.p[q.id]; return r && r.ok === false; });
  if(cfg.source === "flag")  p = p.filter(q => { const r=S.p[q.id]; return r && r.flag; });
  return p;
}
function viewExam(){
  const e = S.exam;
  if(!e || e.phase === "setup") return examSetup();
  if(e.phase === "run") return examRun();
  return examResult();
}

/* ============================================================
   HÀNH ĐỘNG
   ============================================================ */
function checkRecord(id, revealOnly){
  const q = BY_ID[id], r = rec(id), a = ansOf(q);
  r.done = 1;
  r.ok = (revealOnly && answeredCount(q,a) === 0) ? null : isCorrect(q, a);
  r.n = (r.n||0) + 1;
  save(); refreshRecord(id); renderRail(); renderAside();
}
function setMode(m){
  S.mode = m;
  if(m === "exam" && !S.exam) S.exam = { phase:"setup", cfg:{count:30,mins:45,topic:"all",shuffle:"yes",source:"all"} };
  if(m === "exam" && S.exam.phase === "run" && !S.exam.timer && S.exam.duration){
    tickTimer(); S.exam.timer = setInterval(tickTimer, 1000);
  }
  renderAll(); window.scrollTo({top:0});
}
function startExam(){
  const cfg = S.exam.cfg, pool = examPool(cfg);
  if(!pool.length) return;
  const count = Math.max(1, Math.min(+cfg.count || 1, pool.length));
  const picked = shuffle(pool).slice(0, count);
  const order = {};
  const list = picked.map(q => {
    if(cfg.shuffle === "yes" && q.options){
      const opts = shuffle(q.options);
      order[q.id] = opts.map(o => o.k);
      return Object.assign({}, q, { options: opts });
    }
    return q;
  });
  clearInterval(S.exam.timer);
  S.exam = { phase:"run", list, order, answers:{}, flags:{}, pos:0, started:Date.now(),
             duration:(+cfg.mins||0)*60, cfg, timer:null };
  if(S.exam.duration){ tickTimer(); S.exam.timer = setInterval(tickTimer, 1000); }
  save(); renderAll(); window.scrollTo({top:0});
}
function tickTimer(){
  const e = S.exam;
  if(!e || e.phase !== "run" || !e.duration) return;
  const left = e.duration - Math.floor((Date.now()-e.started)/1000);
  const txt = clock(Math.max(0,left));
  ["timerOut","timerHead"].forEach(id => {
    const n = document.getElementById(id);
    if(n){ n.textContent = txt; n.classList.toggle("low", left < 60); }
  });
  if(left <= 0){ gradeExam(); toast(t("timeUp")); }
}
function gradeExam(){
  const e = S.exam;
  if(!e || e.phase !== "run") return;
  clearInterval(e.timer); e.timer = null;
  let correct = 0, blank = 0;
  const detail = e.list.map((q,i) => {
    const given = e.answers[i] || blankAnswer(q);
    const filled = answeredCount(q, given) > 0;
    if(!filled) blank++;
    const ok = filled && isCorrect(q, given);
    if(ok) correct++;
    const r = rec(q.id);
    if(filled){ r.a = JSON.parse(JSON.stringify(given)); r.done = 1; r.ok = ok; r.n = (r.n||0)+1; }
    if(e.flags[i]) r.flag = 1;
    return { q, given, ok };
  });
  const secs = Math.floor((Date.now()-e.started)/1000);
  const scope = e.cfg.topic === "all" ? t("allTopics") : t("topicN", e.cfg.topic);
  e.result = { detail, correct, wrong:e.list.length-correct, blank, pct:pct(correct,e.list.length), secs };
  e.phase = "result"; S.mode = "exam"; S.reviewWrongOnly = false;
  S.history.push({ at:new Date().toISOString(), pct:e.result.pct, c:correct, t:e.list.length, secs, scope });
  save(); renderAll(); window.scrollTo({top:0});
}

function dialog(title, body, confirmLabel, onYes, danger){
  const ov = document.createElement("div");
  ov.className = "ov";

}

  $$(".toast").forEach(n => n.remove());

/* ---------- xuất / nhập ---------- */
function exportData(){
  const blob = new Blob([JSON.stringify({v:2, code:DATA.meta.code, exportedAt:new Date().toISOString(),
                                         p:S.p, history:S.history}, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${DATA.meta.code.toLowerCase()}-progress-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href); toast(t("exported"));
}
function importData(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const d = JSON.parse(fr.result);
      if(!d || typeof d.p !== "object") throw 0;
      S.p = d.p; S.history = Array.isArray(d.history) ? d.history : [];
      save(); renderAll(); toast(t("imported"));
    }catch(e){ toast(t("badFile")); }
  };
  fr.onerror = () => toast(t("badFile"));
  fr.readAsText(file);
}

/* ============================================================
   SỰ KIỆN
   ============================================================ */
document.addEventListener("click", ev => {
  if(ev.target.matches("[data-zoom]")){ zoom(ev.target.src); return; }
  // <select> do bộ lắng nghe "change" lo. Nếu để lọt vào đây, việc vẽ lại bản
  // ghi sẽ thay thế chính phần tử đang mở, làm danh sách đóng sập ngay khi bấm.
  if(ev.target.tagName === "SELECT") return;
  const el = ev.target.closest("[data-mode],[data-lang],[data-f-key],[data-act],[data-jump],[data-go]");
  if(!el) return;

  if(el.dataset.mode){ setMode(el.dataset.mode); return; }
  if(el.dataset.lang){ L = el.dataset.lang; save(); renderAll(); return; }
  if(el.dataset.fKey){
    S.f[el.dataset.fKey] = el.dataset.v;
    renderRail(); renderMain();
    if(window.innerWidth < 900) document.body.classList.remove("rail-open");
    return;
  }
  if(el.dataset.jump){
    const id = el.dataset.jump;
    if(S.mode !== "study") S.mode = "study";
    S.f = {topic:"all",status:"all",type:"all",q:""}; $("#search").value = "";
    renderAll();
    const n = document.getElementById("rec-"+id);
    if(n) n.scrollIntoView({behavior:"smooth",block:"start"});
    return;
  }
  if(el.dataset.go !== undefined && S.exam && S.exam.phase === "run"){
    S.exam.pos = +el.dataset.go; save(); renderMain(); renderAside(); window.scrollTo({top:0}); return;
  }

  const recEl = el.closest(".rec"), id = recEl && recEl.dataset.id, act = el.dataset.act;
  switch(act){
    case "ans": {
      if(!id) break;
      const q = BY_ID[id], r = rec(id);
      if(r.done) break;
      const a = ansOf(q);
      if(q.type === "mcq" && q.answer.length === 1 && a[0] === el.dataset.k) el.dataset.was = "1";
      applyAnswer(q, a, el);
      save();
      refreshRecord(id, q.type === "mcq" ? `[data-act="ans"][data-k="${el.dataset.k}"]`
                                         : `[data-act="ans"][data-i="${el.dataset.i}"]`);
      break;
    }
    case "check":  if(id) checkRecord(id, false); break;
    case "reveal": if(id) checkRecord(id, true);  break;
    case "again": {
      if(!id) break;
      const r = rec(id); r.a = blankAnswer(BY_ID[id]); r.done = 0; r.ok = null;
      save(); refreshRecord(id, '[data-act="check"]'); renderRail(); renderAside(); break;
    }
    case "flag": {
      if(!id) break;
      const r = rec(id); r.flag = r.flag ? 0 : 1;
      save(); refreshRecord(id, '.flagbtn'); renderRail(); renderAside(); break;
    }
    case "start":  startExam(); break;
    case "resume": S.exam.phase = "run"; renderAll(); break;
    case "discard": clearInterval(S.exam.timer);
                    S.exam = {phase:"setup", cfg:S.exam.cfg}; save(); renderAll(); break;
    case "eans": {
      const e = S.exam, q = e.list[e.pos];
      const a = e.answers[e.pos] || (e.answers[e.pos] = blankAnswer(q));
      if(q.type === "mcq" && q.answer.length === 1 && a[0] === el.dataset.k) el.dataset.was = "1";
      applyAnswer(q, a, el);
      save(); renderMain(); renderAside(); break;
    }
    case "eprev": S.exam.pos = Math.max(0, S.exam.pos-1); save(); renderMain(); renderAside(); window.scrollTo({top:0}); break;
    case "enext": S.exam.pos = Math.min(S.exam.list.length-1, S.exam.pos+1); save(); renderMain(); renderAside(); window.scrollTo({top:0}); break;
    case "eflag": S.exam.flags[S.exam.pos] = !S.exam.flags[S.exam.pos]; save(); renderMain(); renderAside(); break;
    case "esubmit": {
      const e = S.exam;
      const blank = e.list.filter((q,i) => answeredCount(q, e.answers[i]) === 0).length;
      dialog(t("confirmSubmitT"), blank ? t("confirmSubmitD", blank) : t("confirmSubmitD0"), t("confirm"), gradeExam);
      break;
    }
    case "newexam": clearInterval(S.exam.timer);
                    S.exam = {phase:"setup", cfg:S.exam.cfg}; save(); renderAll(); window.scrollTo({top:0}); break;
    case "togglewrong": S.reviewWrongOnly = !S.reviewWrongOnly; renderMain(); break;
  }
});

document.addEventListener("input", ev => {
  const el = ev.target;
  if(el.id === "search"){ S.f.q = el.value; renderMain(); return; }
  if(el.dataset.act === "note"){
    const r = el.closest(".rec");
    if(r){ rec(r.dataset.id).note = el.value; clearTimeout(el._tm); el._tm = setTimeout(save, 400); }
    return;
  }
  if(el.dataset.cfg && S.exam){ S.exam.cfg[el.dataset.cfg] = el.value; renderMain(); }
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if(el.dataset.cfg && S.exam){ S.exam.cfg[el.dataset.cfg] = el.value; renderMain(); return; }
  if(el.dataset.act === "ans"){
    const r = el.closest(".rec"), q = BY_ID[r.dataset.id];
    if(rec(q.id).done) return;
    applyAnswer(q, ansOf(q), el);
    save(); refreshRecord(q.id, `[data-act="ans"][data-i="${el.dataset.i}"]`); return;
  }
  if(el.dataset.act === "eans"){
    const e = S.exam, q = e.list[e.pos];
    const a = e.answers[e.pos] || (e.answers[e.pos] = blankAnswer(q));
    applyAnswer(q, a, el); save(); renderMain(); renderAside(); return;
  }
  if(el.id === "fileIn" && el.files && el.files[0]){ importData(el.files[0]); el.value = ""; }
});

document.addEventListener("focusin", ev => {
  const r = ev.target.closest && ev.target.closest(".rec");
  if(r && r.dataset.id && r.dataset.id !== S.cur){
    const prev = S.cur ? document.getElementById("rec-"+S.cur) : null;
    if(prev) prev.classList.remove("cur");
    S.cur = r.dataset.id; r.classList.add("cur");
  }
});

$("#themeBtn").addEventListener("click", () => {
  document.documentElement.dataset.theme = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  save();
});
$("#helpBtn").addEventListener("click", helpDialog);
$("#railToggle").addEventListener("click", e => {
  e.currentTarget.setAttribute("aria-expanded", document.body.classList.toggle("rail-open"));
});
$("#btnExport").addEventListener("click", exportData);
$("#btnImport").addEventListener("click", () => $("#fileIn").click());
$("#btnReset").addEventListener("click", () =>
  dialog(t("resetT"), t("resetD"), t("del"), () => {
    S.p = {}; S.history = []; S.cur = null;
    if(S.exam) clearInterval(S.exam.timer);
    S.exam = null;
    store.del(KEY); save(); renderAll(); toast(t("del"));
  }, true));

document.addEventListener("keydown", ev => {
  const tag = (ev.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea" || tag === "select";
  if(ev.key === "Escape"){ $$(".ov").forEach(n => n.remove()); if(typing) ev.target.blur(); return; }
  if(typing) return;
  if(ev.key === "/"){ ev.preventDefault(); $("#search").focus(); return; }
  if(ev.key === "?"){ ev.preventDefault(); helpDialog(); return; }
  if(document.querySelector(".ov")) return;

  const e = S.exam, inExam = S.mode === "exam" && e && e.phase === "run";
  if(inExam){
    if(ev.key === "ArrowLeft"  && e.pos > 0){ e.pos--; save(); renderMain(); renderAside(); return; }
    if(ev.key === "ArrowRight" && e.pos < e.list.length-1){ e.pos++; save(); renderMain(); renderAside(); return; }
    if(/^[a-fA-F]$/.test(ev.key) && ev.key.toLowerCase() !== "f"){
      const b = document.querySelector(`[data-act="eans"][data-k="${ev.key.toUpperCase()}"]`);
      if(b) b.click(); return;
    }
    if(ev.key.toLowerCase() === "f"){ e.flags[e.pos] = !e.flags[e.pos]; save(); renderMain(); renderAside(); return; }
    return;
  }
  if(S.mode === "study" && S.cur){
    const node = document.getElementById("rec-"+S.cur);
    if(!node) return;
    if(/^[a-fA-F]$/.test(ev.key) && ev.key.toLowerCase() !== "f"){
      const b = node.querySelector(`[data-act="ans"][data-k="${ev.key.toUpperCase()}"]`);
      if(b) b.click(); return;
    }
    if(ev.key === "Enter"){
      const b = node.querySelector('[data-act="check"]:not([disabled])') || node.querySelector('[data-act="reveal"]');
      if(b) b.click(); return;
    }
    if(ev.key.toLowerCase() === "f"){ const b = node.querySelector('[data-act="flag"]'); if(b) b.click(); return; }
    if(ev.key === "ArrowDown" || ev.key === "ArrowRight"){ ev.preventDefault(); stepRecord(1); return; }
    if(ev.key === "ArrowUp"   || ev.key === "ArrowLeft"){  ev.preventDefault(); stepRecord(-1); return; }
  }
});
function stepRecord(d){
  const list = $$(".rec");
  const i = list.findIndex(n => n.dataset.id === S.cur);
  const next = list[Math.max(0, Math.min(list.length-1, i+d))];
  if(next){ const b = next.querySelector(".opt, .ynb button, select"); if(b) b.focus(); next.scrollIntoView({block:"nearest"}); }
}

/* ---------- khởi động ---------- */
$("#markCode").textContent = DATA.meta.code;
$$("[data-icon]").forEach(el => el.outerHTML = ICON[el.dataset.icon]);
load();
if(S.exam && S.exam.phase === "run"){ S.mode = "exam"; if(S.exam.duration){ tickTimer(); S.exam.timer = setInterval(tickTimer,1000); } }
renderAll();

</script>
</body>
