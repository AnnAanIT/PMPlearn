lag — race conditions, null dereferences, error handling gaps — while keeping the high-confidence filtering instruction to maintain current precision levels."}},{"k":"C","t":{"en":"Remove the conservative filtering instructions and prompt Claude to report all potential issues, then apply a programmatic filter to deduplicate and suppress categories that historically generate false positives."}},{"k":"D","t":{"en":"Expand the context window by including related test files, recent git history, and the module&#x27;s dependency graph alongside the diff, giving Claude richer signals to assess issue severity."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“You need to substantially improve bug detection while keeping false positive”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Split the review into a finding stage where Claude&#x27;s goal is”</b> <i>(trong đáp án A)</i>: tách phạm vi đưa tin ra khỏi quá trình lọc.","elim":["<b>B. Add detailed few-shot examples demonstrating bug categories Claude should flag — race conditions, null dereferences, error handling gaps — while keeping the high-confidence filtering instruction to maintain current precision levels.</b>: Bỏ qua yêu cầu chính “You need to substantially improve bug detection while”.","<b>C. Remove the conservative filtering instructions and prompt Claude to report all potential issues, then apply a programmatic filter to deduplicate and suppress categories that historically generate false positives.</b>: Bỏ qua yêu cầu chính “You need to substantially improve bug detection while”.","<b>D. Expand the context window by including related test files, recent git history, and the module&#x27;s dependency graph alongside the diff, giving Claude richer signals to assess issue severity.</b>: Bỏ qua yêu cầu chính “You need to substantially improve bug detection while”."]}},{"id":"t1q70","n":70,"topic":1,"type":"mcq","stem":{"en":"Your remove_team_member tool uses a dry_run: boolean parameter for previewing impacts before execution. Production monitoring shows the agent bypasses the preview step in 15% of calls by calling with dry_run=false directly. You need to ensure every removal is preceded by a preview that the user explicitly confirms. What is the most reliable approach?"},"options":[{"k":"A","t":{"en":"Add detailed instructions and few-shot examples to the tool description requiring the agent to always call with dry_run=true first and wait for user confirmation before calling with dry_run=false."}},{"k":"B","t":{"en":"Annotate the tool as requiring confirmation and configure the orchestration layer to prompt the user for approval before forwarding any calls to annotated tools."}},{"k":"C","t":{"en":"Replace with two tools: preview_remove_member returns impact details and a single-use confirmation token; execute_remove_member requires that token, binding execution to the specific previewed action."}},{"k":"D","t":{"en":"Add server-side validation that permits dry_run=false only when a dry_run=true call with identical parameters occurred within the past 60 seconds."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“You need to ensure every removal is preceded by a preview”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Replace with two tools: preview_remove_member returns impact details and a single-use”</b> <i>(trong đáp án C)</i>: Thay thế bằng hai công cụ: Preview_remove_member trả về thông tin chi tiết về tác động và token…","elim":["<b>A. Add detailed instructions and few-shot examples to the tool description requiring the agent to always call with dry_run=true first and wait for user confirmation before calling with dry_run=false.</b>: Prompt và ví dụ chỉ định hướng hành vi xác suất; chúng không thể bảo…","<b>B. Annotate the tool as requiring confirmation and configure the orchestration layer to prompt the user for approval before forwarding any calls to annotated tools.</b>: Bỏ qua yêu cầu chính “You need to ensure every removal is preceded”.","<b>D. Add server-side validation that permits dry_run=false only when a dry_run=true call with identical parameters occurred within the past 60 seconds.</b>: Bỏ qua yêu cầu chính “You need to ensure every removal is preceded”."]}},{"id":"t1q71","n":71,"topic":1,"type":"mcq","stem":{"en":"Your invoice extraction uses tool use with strict JSON schemas. JSON syntax errors never occur, but 12% of extractions fail semantic validation--for example, line Item amounts don&#x27;t extracted total, or vendor IDs don&#x27;t match valid formats. These failures currently route to manual review. What&#x27;s the most effective approach to reduce manual review volume while maintaining accuracy?"},"options":[{"k":"A","t":{"en":"Add stricter schema constraints with detailed field descriptions to prevent the model from generating invalid values initially."}},{"k":"B","t":{"en":"Retry the extraction up to 3 times when validation fallis, accepting the first result that passes validation."}},{"k":"C","t":{"en":"Implement post-processing logic that automatically corrects common amors, such as recalculating totais from line items when sums don&#x27;t match."}},{"k":"D","t":{"en":"When validation falls, make a follow-up request with the document, extraction, and validation errors for model correction."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“These failures currently route to manual review.”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“When validation falls, make a follow-up request with the document, extraction,”</b> <i>(trong đáp án D)</i>: Khi xác thực giảm, hãy đưa ra yêu cầu tiếp theo về các lỗi tài liệu, trích xuất…","elim":["<b>A. Add stricter schema constraints with detailed field descriptions to prevent the model from generating invalid values initially.</b>: Bỏ qua yêu cầu chính “These failures currently route to manual review”.","<b>B. Retry the extraction up to 3 times when validation fallis, accepting the first result that passes validation.</b>: Retry không thể tạo ra dữ liệu còn thiếu hoặc sửa lỗi validation, permission hay…","<b>C. Implement post-processing logic that automatically corrects common amors, such as recalculating totais from line items when sums don&#x27;t match.</b>: Bỏ qua yêu cầu chính “These failures currently route to manual review”."]}},{"id":"t1q72","n":72,"topic":1,"type":"mcq","stem":{"en":"Your system must extract event details from calendar invitations and output JSON that strictly conforms to a schema with fields for title, date, time, location, and attendees. Downstream reject any malformed or non- conformant JSON. What approach provides the most reliable schema compliance?"},"options":[{"k":"A","t":{"en":"Include detailed JSON formatting instructions and the target schema in your prompt, then parse Claude&#x27;s text response as JSON."}},{"k":"B","t":{"en":"Pre-fill Claude&#x27;s response with an opening brace to force JSON output, then complete and parse the response."}},{"k":"C","t":{"en":"Define a tool with your target schema as input parameters and have Claude call it with the extracted data."}},{"k":"D","t":{"en":"Append instructions like &quot;Output only valid JSON matching the schema exactly&quot; and implement retry logic to re-prompt when JSON parsing fails."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“Your system must extract event details from calendar invitations and output”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Define a tool with your target schema as input parameters and”</b> <i>(trong đáp án C)</i>: Xác định một công cụ có lược đồ mục tiêu của bạn làm tham số đầu vào và…","elim":["<b>A. Include detailed JSON formatting instructions and the target schema in your prompt, then parse Claude&#x27;s text response as JSON.</b>: Đầu ra text tự do buộc downstream hoặc model phải parse lại, làm tăng lỗi…","<b>B. Pre-fill Claude&#x27;s response with an opening brace to force JSON output, then complete and parse the response.</b>: Assistant prefill không còn được hỗ trợ trên các model Claude hiện hành và cũng…","<b>D. Append instructions like &quot;Output only valid JSON matching the schema exactly&quot; and implement retry logic to re-prompt when JSON parsing fails.</b>: Retry không thể tạo ra dữ liệu còn thiếu hoặc sửa lỗi validation, permission hay…"]}},{"id":"t1q73","n":73,"topic":1,"type":"mcq","stem":{"en":"Your extraction system uses tool_use with a JSON schema containing 12 fields and detailed descriptions, totaling approximately 2,500 tokens for the complete tool definition. Processing documents under 150K tokens yields 98% accuracy. For documents between 175-190K tokens, accuracy drops to 71%, with information from the final third consistently missed. The model&#x27;s context window is 200K tokens. What is the most likely cause?"},"options":[{"k":"A","t":{"en":"Schemas exceeding 8-10 fields increase decision complexity during parameter generation, reducing extraction accuracy independent of document length."}},{"k":"B","t":{"en":"The model distributes attention proportionally across input length, causing fields mentioned only once near the document&#x27;s end to receive insufficient processing focus."}},{"k":"C","t":{"en":"Very long documents exceed the model&#x27;s effective attention span regardless of context limits, causing accuracy degradation for content farther from the prompt instructions."}},{"k":"D","t":{"en":"Tool definitions consume input context tokens. Combined with system prompts and document content, the total approaches the context limit, degrading end-of-document processing."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“The model&#x27;s context window is 200K tokens.”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Tool definitions consume input context tokens. Combined with system prompts and”</b> <i>(trong đáp án D)</i>: định nghĩa Công cụ sử dụng token ngữ cảnh đầu vào.","elim":["<b>A. Schemas exceeding 8-10 fields increase decision complexity during parameter generation, reducing extraction accuracy independent of document length.</b>: Bỏ qua yêu cầu chính “The model&#x27;s context window is 200K tokens”.","<b>B. The model distributes attention proportionally across input length, causing fields mentioned only once near the document&#x27;s end to receive insufficient processing focus.</b>: Tự sửa số liệu để làm chúng khớp nhau có thể che giấu OCR hoặc…","<b>C. Very long documents exceed the model&#x27;s effective attention span regardless of context limits, causing accuracy degradation for content farther from the prompt instructions.</b>: Bỏ qua yêu cầu chính “The model&#x27;s context window is 200K tokens”."]}},{"id":"t1q74","n":74,"topic":1,"type":"mcq","stem":{"en":"The extraction pipeline receives documents of varying types—some are invoices, others are contracts, and some are receipts. You&#x27;ve defined separate extraction tools, each with its own schema tailored to the document type. During testing, you observe that with tool_choice: &quot;auto&quot;, Claude sometimes returns conversational text instead of calling an extraction tool, causing downstream parsing failures. You need guaranteed structured output without knowing the document type in advance. What&#x27;s the most effective approach?"},"options":[{"k":"A","t":{"en":"Add a preliminary classification call, then make a second call with tool_choice forced to the identified extraction tool."}},{"k":"B","t":{"en":"Set tool_choice: &quot;any&quot; with all extraction tools defined."}},{"k":"C","t":{"en":"Consolidate all document types into a single unified-schema extraction tool and force that tool."}},{"k":"D","t":{"en":"Keep tool_choice: &quot;auto&quot; with system prompt instructions requiring tool use."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“separate extraction tools, each with its own schema”</b> <i>(trong câu hỏi)</i>: Mỗi document type cần một schema khác nhau, nên phải biết loại tài liệu trước khi ép tool…<br><b>“guaranteed structured output”</b> <i>(trong câu hỏi)</i>: <code>tool_choice: &quot;auto&quot;</code> không phù hợp vì model vẫn có thể trả text thông thường.","elim":["<b>B. Set tool_choice: &quot;any&quot;...</b>: <code>any</code> bắt buộc gọi một tool nhưng không bảo đảm model chọn đúng extractor cho…","<b>C. ...single unified-schema extraction tool...</b>: Một schema hợp nhất phải chứa nhiều trường không liên quan, làm giảm độ rõ…","<b>D. Keep tool_choice: &quot;auto&quot;...</b>: Prompt chỉ khuyến khích; <code>auto</code> vẫn cho phép trả conversational text nên không đạt yêu…"]}},{"id":"t1q75","n":75,"topic":1,"type":"mcq","stem":{"en":"Monitoring shows 12% of extractions fall Pydantic validation with specific errors like &quot;expected float for quantity, got &#x27;2 to 3&quot;. Retrying these requests without modification produces failures. What&#x27;s the most effective approach to recover from these validation failures?"},"options":[{"k":"A","t":{"en":"Set temperature to 0 to eliminate output variability and ensure consistent formatting"}},{"k":"B","t":{"en":"Send a follow-up request including the validation error, asking the model to correct its output"}},{"k":"C","t":{"en":"Implement a secondary pipeline using a larger model tier to reprocess documents that fail validation"}},{"k":"D","t":{"en":"Pre-process source documents to standardize problematic formats before sending them for extraction"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“Retrying these requests without modification produces failures.”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Send a follow-up request including the validation error, asking the model”</b> <i>(trong đáp án B)</i>: Gửi yêu cầu tiếp theo bao gồm lỗi xác thực, yêu cầu mô hình sửa đầu ra của…","elim":["<b>A. Set temperature to 0 to eliminate output variability and ensure consistent formatting</b>: Temperature chỉ điều chỉnh độ biến thiên khi sinh; nó không sửa schema, thiếu context…","<b>C. Implement a secondary pipeline using a larger model tier to reprocess documents that fail validation</b>: Đổi model có thể cải thiện chất lượng chung nhưng không xử lý nguyên nhân…","<b>D. Pre-process source documents to standardize problematic formats before sending them for extraction</b>: Bỏ qua yêu cầu chính “Retrying these requests without modification produces failures”."]}},{"id":"t1q76","n":76,"topic":1,"type":"mcq","stem":{"en":"After three months of weekly sessions, your conversation history has grown to 85,000 tokens. When users ask &quot;What did we conclude about the theme of isolation?&quot;, the assistant provides generic literary analysis rather than referencing the group&#x27;s specific insights from earlier sessions. Discussions often build on previous meetings&#x27; conclusions, so maintaining narrative context is important. What&#x27;s the most effective approach?"},"options":[{"k":"A","t":{"en":"Add structured XML tags to mark significant discussion conclusions throughout the conversation history."}},{"k":"B","t":{"en":"Implement rolling window truncation to keep only the most recent 25,000 tokens."}},{"k":"C","t":{"en":"Use semantic embedding to index the full conversation history and retrieve only relevant past exchanges for each user query, replacing the linear conversation format with retrieved segments."}},{"k":"D","t":{"en":"Implement progressive summarization where older conversation blocks are replaced with concise summaries that explicitly extract key conclusions, decisions, and recurring themes, keeping recent exchanges verbatim."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“Discussions often build on previous meetings&#x27; conclusions, so maintaining narrative context”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Implement progressive summarization where older conversation blocks are replaced with concise”</b> <i>(trong đáp án D)</i>: Khi cuộc trò chuyện kéo dài nhưng vẫn phụ thuộc vào những kết luận trước đó, tóm tắt…","elim":["<b>A. Add structured XML tags to mark significant discussion conclusions throughout the conversation history.</b>: Bỏ qua yêu cầu chính “Discussions often build on previous meetings&#x27; conclusions, so”.","<b>B. Implement rolling window truncation to keep only the most recent 25,000 tokens.</b>: Bỏ qua yêu cầu chính “Discussions often build on previous meetings&#x27; conclusions, so”.","<b>C. Use semantic embedding to index the full conversation history and retrieve only relevant past exchanges for each user query, replacing the linear conversation format with retrieved segments.</b>: Bỏ qua yêu cầu chính “Discussions often build on previous meetings&#x27; conclusions, so”."]}},{"id":"t1q77","n":77,"topic":1,"type":"mcq","stem":{"en":"You&#x27;re Implementing a feature where users refine their playlist preferences through multiple conversation turns. After deploying, you notice Claude&#x27;s responses don&#x27;t reflect what us earlier in the same conversation— for example, a user says they love jazz, but two messages later Claude asks what genres they enjoy. What is the most likely cause?"},"options":[{"k":"A","t":{"en":"Your application isn&#x27;t including prior messages in the messages array"}},{"k":"B","t":{"en":"The model&#x27;s context window has been exceeded by the conversation length"}},{"k":"C","t":{"en":"Claude requires a vector database connection to maintain conversation memory"}},{"k":"D","t":{"en":"The Claude API requires a session_id parameter that you haven&#x27;t configured"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“After deploying, you notice Claude&#x27;s responses don&#x27;t reflect what us earlier”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Your application isn&#x27;t including prior messages in the messages array”</b> <i>(trong đáp án A)</i>: Nếu Claude ngay lập tức quên những gì đã nói cách đây vài lượt trong cùng một cuộc…","elim":["<b>B. The model&#x27;s context window has been exceeded by the conversation length</b>: Bỏ qua yêu cầu chính “After deploying, you notice Claude&#x27;s responses don&#x27;t reflect”.","<b>C. Claude requires a vector database connection to maintain conversation memory</b>: Retrieval có thể hữu ích ở quy mô lớn nhưng bổ sung hạ tầng và…","<b>D. The Claude API requires a session_id parameter that you haven&#x27;t configured</b>: Bỏ qua yêu cầu chính “After deploying, you notice Claude&#x27;s responses don&#x27;t reflect”."]}},{"id":"t1q78","n":78,"topic":1,"type":"mcq","stem":{"en":"Your home renovation planning assistant uses a system prompt defining an expert contractor persona with specific guidelines: always ask about budget, suggest alternatives at multiple price points, and confirm timeline requirements. During testing, responses follow these guidelines for turns 1-4, but by turn 7, the assistant gives generic advice without asking about budget or timeline. The conversation is only 2,000 tokens—well within the context window. What is the most likely cause?"},"options":[{"k":"A","t":{"en":"The model&#x27;s attention on system prompt instructions naturally weakens as turns accumulate."}},{"k":"B","t":{"en":"System prompts only establish initial behavior and don&#x27;t persist across all turns."}},{"k":"C","t":{"en":"The system prompt is only sent with the first API request."}},{"k":"D","t":{"en":"The assistant&#x27;s accumulated responses are diluting the system prompt&#x27;s influence."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“only 2,000 tokens—well within the context window”</b> <i>(trong câu hỏi)</i>: Đề chủ động loại trừ nguyên nhân do context quá dài hoặc thông tin đầu phiên bị đẩy…<br><b>“follow these guidelines for turns 1-4, but by turn 7”</b> <i>(trong câu hỏi)</i>: Hành vi ban đầu có thể được bắt chước từ các assistant message trước, rồi dần mất đi…","elim":["<b>A. ...naturally weakens as turns accumulate.</b>: Không phải cơ chế đáng tin cậy để giải thích sự mất instruction trong một…","<b>B. System prompts only establish initial behavior...</b>: System prompt được thiết kế để chi phối request hiện tại, không chỉ khởi tạo…","<b>D. ...accumulated responses are diluting...</b>: Đây là mô tả mơ hồ; dấu hiệu cụ thể hơn là ứng dụng không…"]}},{"id":"t1q79","n":79,"topic":1,"type":"mcq","stem":{"en":"Users report that during extended conversations, the AI loses track of specific topics, examples, and preferences they mentioned earlier in the session. Your current implementation uses a sliding window that keeps only the most recent 25 message pairs to stay within context limits. What&#x27;s the most effective approach to maintain awareness of earlier conversation content while managing context size?"},"options":[{"k":"A","t":{"en":"Increase the window size to 50 message pairs to retain more conversation history before truncation."}},{"k":"B","t":{"en":"Add a separate API call each turn to summarize messages being dropped, prepending this running summary to the conversation."}},{"k":"C","t":{"en":"Implement vector similarity search over the full conversation history, retrieving relevant past messages for each user query."}},{"k":"D","t":{"en":"Replace the sliding window with a hybrid approach: summarize older messages while keeping recent messages verbatim."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“Your current implementation uses a sliding window that keeps only the”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Replace the sliding window with a hybrid approach: summarize older messages”</b> <i>(trong đáp án D)</i>: Thay thế cửa sổ trượt bằng phương pháp kết hợp: tóm tắt các tin nhắn cũ hơn trong…","elim":["<b>A. Increase the window size to 50 message pairs to retain more conversation history before truncation.</b>: Bỏ qua yêu cầu chính “Your current implementation uses a sliding window that”.","<b>B. Add a separate API call each turn to summarize messages being dropped, prepending this running summary to the conversation.</b>: Bỏ qua yêu cầu chính “Your current implementation uses a sliding window that”.","<b>C. Implement vector similarity search over the full conversation history, retrieving relevant past messages for each user query.</b>: Retrieval có thể hữu ích ở quy mô lớn nhưng bổ sung hạ tầng và…"]}},{"id":"t1q80","n":80,"topic":1,"type":"mcq","stem":{"en":"During QA testing, you notice that Claude follows your system prompt guidelines consistently in the first 10- 15 turns, but by turn 25-30, responses begin deviating—using informal tone when formality was specified, occasionally skipping required formatting, or providing information types the guidelines restrict. Conversation length is well within context limits (typically 30,000 tokens out of 200,000 available). What&#x27;s the most effective approach to maintain consistent behavior throughout extended conversations?"},"options":[{"k":"A","t":{"en":"Automatically start a new conversation after 20 turns, passing a summary of the prior context to maintain continuity."}},{"k":"B","t":{"en":"Insert user-role messages that reinforce critical guidelines at natural conversation breakpoints, especially before complex requests."}},{"k":"C","t":{"en":"Move behavioral guidelines from the system prompt into the first user message."}},{"k":"D","t":{"en":"Implement post-response validation that regenerates each response until it conforms to the specified guidelines."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“Conversation length is well within context limits (typically 30,000 tokens out”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Insert user-role messages that reinforce critical guidelines at natural conversation breakpoints,”</b> <i>(trong đáp án B)</i>: Chèn thông báo vai trò của người dùng nhằm củng cố các nguyên tắc quan trọng tại các…","elim":["<b>A. Automatically start a new conversation after 20 turns, passing a summary of the prior context to maintain continuity.</b>: Bỏ qua yêu cầu chính “Conversation length is well within context limits (typically”.","<b>C. Move behavioral guidelines from the system prompt into the first user message.</b>: Bỏ qua yêu cầu chính “Conversation length is well within context limits (typically”.","<b>D. Implement post-response validation that regenerates each response until it conforms to the specified guidelines.</b>: Bỏ qua yêu cầu chính “Conversation length is well within context limits (typically”."]}},{"id":"t1q81","n":81,"topic":1,"type":"mcq","stem":{"en":"During a conversation about order tracking, your external system receives a webhook indicating the user&#x27;s package has shipped. The user is actively chatting and will likely send a follow-up message soon. You want the assistant to naturally incorporate this status change in its next response. What&#x27;s the most effective approach?"},"options":[{"k":"A","t":{"en":"Immediately send an API request with the update as a synthetic user message, generating an unsolicited assistant response."}},{"k":"B","t":{"en":"Append the status update as a prefix to the next user message before calling the API."}},{"k":"C","t":{"en":"Configure the assistant to call a get_order_status tool at the start of every response."}},{"k":"D","t":{"en":"Add the current shipping status to the system prompt before the next API call."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“You want the assistant to naturally incorporate this status change in”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Add the current shipping status to the system prompt before the”</b> <i>(trong đáp án D)</i>: Thêm trạng thái vận chuyển hiện tại vào lời nhắc hệ thống trước lệnh gọi API tiếp theo.","elim":["<b>A. Immediately send an API request with the update as a synthetic user message, generating an unsolicited assistant response.</b>: Bỏ qua yêu cầu chính “You want the assistant to naturally incorporate this”.","<b>B. Append the status update as a prefix to the next user message before calling the API.</b>: Bỏ qua yêu cầu chính “You want the assistant to naturally incorporate this”.","<b>C. Configure the assistant to call a get_order_status tool at the start of every response.</b>: Bỏ qua yêu cầu chính “You want the assistant to naturally incorporate this”."]}},{"id":"t1q82","n":82,"topic":1,"type":"mcq","stem":{"en":"Users report that responses feel repetitive across turns—each message begins with phrases like &quot;Certainly!&quot; or &quot;I&#x27;d be happy to help!&quot; even deep into conversations. You want responses to feel more natural, without these repetitive openers. What&#x27;s the most effective approach?"},"options":[{"k":"A","t":{"en":"Add system prompt instructions specifying phrases to avoid, such as &quot;Never begin responses with &#x27;Certainly&#x27; or similar affirmations&quot;"}},{"k":"B","t":{"en":"Implement post-processing to detect and strip common greeting phrases from response beginnings"}},{"k":"C","t":{"en":"Append a partial assistant message with a direct response opening that the model will continue from"}},{"k":"D","t":{"en":"Lower the temperature parameter to make response openings more deterministic and less variable"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“repetitive across turns”</b> <i>(trong câu hỏi)</i>: Vấn đề là một thói quen phong cách lặp lại trong toàn bộ conversation, không chỉ một response…<br><b>“specifying phrases to avoid”</b> <i>(trong đáp án A)</i>: Chỉ dẫn rõ ràng ở system prompt tác động nhất quán đến cách mở đầu ở các lượt…","elim":["<b>B. Implement post-processing...</b>: Cắt chuỗi sau khi sinh có thể tạo câu mở đầu cụt hoặc sai ngữ…","<b>C. Append a partial assistant message...</b>: Prefill chỉ điều khiển một response cụ thể, phải lặp lại mỗi lượt và không…","<b>D. Lower the temperature...</b>: Temperature thấp làm output ổn định hơn và thậm chí có thể khiến cùng một…"]}},{"id":"t1q83","n":83,"topic":1,"type":"mcq","stem":{"en":"Users frequently send ambiguous requests like &quot;book a venue for the party&quot; without specifying date, guest count, or budget. Your evaluation shows the assistant asks an average of 4.2 clarifying questions before taking any action, causing 35% of users to abandon mid-conversation. However, when you reduce questions, users sometimes receive recommendations that don&#x27;t match their preferences. What&#x27;s the most effective approach to improve this trade-off?"},"options":[{"k":"A","t":{"en":"Instruct the assistant to state explicit assumptions based on conversation history, proceed with recommendations while inviting corrections, and reserve clarifying questions only for irreversible actions like confirming bookings."}},{"k":"B","t":{"en":"Configure the assistant to consolidate all clarifying questions into a single compound question (e.g., &quot;What date, guest count, and budget are you considering?&quot;) to reduce the total number of conversational turns."}},{"k":"C","t":{"en":"Implement a structured intake form that collects all required parameters (date, guest count, budget, venue type) upfront before the assistant begins providing any recommendations."}},{"k":"D","t":{"en":"Configure the assistant to proceed with reasonable defaults (medium-sized venue, next weekend, moderate budget) without explicitly stating these assumptions, allowing users to provide corrections if results don&#x27;t match expectations."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“Your evaluation shows the assistant asks an average of 4.2 clarifying”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Instruct the assistant to state explicit assumptions based on conversation history,”</b> <i>(trong đáp án A)</i>: Hướng dẫn trợ lý nêu các giả định rõ ràng dựa trên lịch sử cuộc trò chuyện, tiếp…","elim":["<b>B. Configure the assistant to consolidate all clarifying questions into a single compound question (e.g., &quot;What date, guest count, and budget are you considering?&quot;) to reduce the total number of conversational turns.</b>: Bỏ qua yêu cầu chính “Your evaluation shows the assistant asks an average”.","<b>C. Implement a structured intake form that collects all required parameters (date, guest count, budget, venue type) upfront before the assistant begins providing any recommendations.</b>: Bỏ qua yêu cầu chính “Your evaluation shows the assistant asks an average”.","<b>D. Configure the assistant to proceed with reasonable defaults (medium-sized venue, next weekend, moderate budget) without explicitly stating these assumptions, allowing users to provide corrections if results don&#x27;t match expectations.</b>: Bỏ qua yêu cầu chính “Your evaluation shows the assistant asks an average”."]}},{"id":"t1q84","n":84,"topic":1,"type":"mcq","stem":{"en":"Your conversational AI tutor has a 2,800-token system prompt containing teaching methodology, persona guidelines, and detailed written instructions for adapting explanations to different proficiency levels. User testing reveals that in conversations exceeding 12 turns (approximately 4,000 tokens of conversation history), the assistant increasingly ignores the proficiency-adaptation guidelines, defaulting to intermediate-level explanations regardless of the learner&#x27;s stated level. What&#x27;s the most effective approach to ensure consistent adherence to these guidelines throughout extended conversations?"},"options":[{"k":"A","t":{"en":"Inject a condensed reminder of the proficiency requirements into the conversation as a system message every 4-5 turns."}},{"k":"B","t":{"en":"Replace the verbose proficiency guidelines with few-shot examples demonstrating appropriate responses at each proficiency level, showing concrete differences in vocabulary, complexity, and explanation depth."}},{"k":"C","t":{"en":"After each assistant response, make a separate API call to evaluate whether the difficulty level matched the learner&#x27;s profile, regenerating responses that don&#x27;t align."}},{"k":"D","t":{"en":"Restructure the system prompt to place the proficiency-adaptation rules in a clearly-marked final section immediately before the conversation history begins."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“User testing reveals that in conversations exceeding 12 turns (approximately 4,000”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Replace the verbose proficiency guidelines with few-shot examples demonstrating appropriate responses”</b> <i>(trong đáp án B)</i>: Thay thế các hướng dẫn chi tiết về trình độ thành thạo bằng một vài ví dụ ngắn…","elim":["<b>A. Inject a condensed reminder of the proficiency requirements into the conversation as a system message every 4-5 turns.</b>: Bash có thể thực hiện thao tác nhưng dễ vỡ và bỏ qua contract hoặc…","<b>C. After each assistant response, make a separate API call to evaluate whether the difficulty level matched the learner&#x27;s profile, regenerating responses that don&#x27;t align.</b>: Bỏ qua yêu cầu chính “User testing reveals that in conversations exceeding 12”.","<b>D. Restructure the system prompt to place the proficiency-adaptation rules in a clearly-marked final section immediately before the conversation history begins.</b>: Bỏ qua yêu cầu chính “User testing reveals that in conversations exceeding 12”."]}},{"id":"t1q85","n":85,"topic":1,"type":"mcq","stem":{"en":"The system routes documents with extraction confidence below 85% to human review. A quarterly audit reveals that 12% of high-confidence extractions (&gt;85%) also contain errors—cases where the model finds plausible-but-incorrect values. Error sources vary: comparison tables showing competitor specs, appendices referencing different product variants, and ambiguous phrasing the model misinterprets. You need a sustainable strategy to catch these high-confidence errors and measure whether improvements reduce the error rate over time. What approach is most effective?"},"options":[{"k":"A","t":{"en":"Add a verification pass that re-extracts from each high-confidence document, flagging cases where the two extraction attempts produce different results."}},{"k":"B","t":{"en":"Lower the confidence threshold from 85% to 70%, routing a larger volume of extractions to human review."}},{"k":"C","t":{"en":"Implement heuristic rules that flag documents containing comparison tables or appendices for review regardless of confidence score."}},{"k":"D","t":{"en":"Implement stratified random sampling reviewing a fixed percentage of high-confidence extractions weekly, enabling error rate measurement and novel pattern detection."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“You need a sustainable strategy to catch these high-confidence errors and”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Implement stratified random sampling reviewing a fixed percentage of high-confidence extractions”</b> <i>(trong đáp án D)</i>: Triển khai lấy mẫu ngẫu nhiên phân tầng, xem xét tỷ lệ phần trăm cố định của các…","elim":["<b>A. Add a verification pass that re-extracts from each high-confidence document, flagging cases where the two extraction attempts produce different results.</b>: Bỏ qua yêu cầu chính “You need a sustainable strategy to catch these”.","<b>B. Lower the confidence threshold from 85% to 70%, routing a larger volume of extractions to human review.</b>: Bỏ qua yêu cầu chính “You need a sustainable strategy to catch these”.","<b>C. Implement heuristic rules that flag documents containing comparison tables or appendices for review regardless of confidence score.</b>: Bỏ qua yêu cầu chính “You need a sustainable strategy to catch these”."]}},{"id":"t1q86","n":86,"topic":1,"type":"mcq","stem":{"en":"Your research assistant helps users analyze academic papers over extended conversations. User testing reveals a recurring issue: after conversations exceed 60K tokens, users ask follow-up questions requiring precise numerical details from papers discussed earlier—sample sizes, exact p-values, specific inclusion criteria. Your current approach summarizes paper discussions after 8 turns to stay within context limits. Users report that responses to these precision-dependent questions are often hedged or inaccurate. What&#x27;s the most effective architectural change?"},"options":[{"k":"A","t":{"en":"Keep source text from methodology and results sections in context permanently, while summarizing only the conversational discussion and interpretation portions."}},{"k":"B","t":{"en":"Use a separate Claude call with explicit instructions to generate higher-fidelity summaries that preserve all numerical details and statistical values."}},{"k":"C","t":{"en":"Implement retrieval that re-injects relevant paper sections when the user&#x27;s question suggests they need specific numerical details."}},{"k":"D","t":{"en":"Maintain a structured database of key facts extracted from each paper (sample sizes, statistics, methods) and retrieve relevant entries into context when precision-dependent questions are detected."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“Your current approach summarizes paper discussions after 8 turns to stay”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Maintain a structured database of key facts extracted from each paper”</b> <i>(trong đáp án D)</i>: Duy trì cơ sở dữ liệu có cấu trúc về các sự kiện chính được trích xuất từ…","elim":["<b>A. Keep source text from methodology and results sections in context permanently, while summarizing only the conversational discussion and interpretation portions.</b>: Bỏ qua yêu cầu chính “Your current approach summarizes paper discussions after 8”.","<b>B. Use a separate Claude call with explicit instructions to generate higher-fidelity summaries that preserve all numerical details and statistical values.</b>: Bỏ qua yêu cầu chính “Your current approach summarizes paper discussions after 8”.","<b>C. Implement retrieval that re-injects relevant paper sections when the user&#x27;s question suggests they need specific numerical details.</b>: Bỏ qua yêu cầu chính “Your current approach summarizes paper discussions after 8”."]}},{"id":"t1q87","n":87,"topic":1,"type":"mcq","stem":{"en":"A security audit requires updating your authentication library from v2 to v3. The migration guide documents breaking changes: authenticate() now returns a Promise instead of accepting a callback, the User type has restructured fields, and three deprecated methods were removed. Grep shows the library is imported in 45 files across several modules. What&#x27;s the most effective approach?"},"options":[{"k":"A","t":{"en":"Create a custom slash command encapsulating the migration transformations, then execute it against each file without prior codebase exploration."}},{"k":"B","t":{"en":"Update the dependency version, run the test suite, and use Claude Code to fix each failure as it appears."}},{"k":"C","t":{"en":"Enter plan mode to explore library usage across modules, map affected code paths, then create a migration strategy before implementing."}},{"k":"D","t":{"en":"Paste the migration guide&#x27;s breaking changes into your prompt and use direct execution to update all usages across the 45 files."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“Grep shows the library is imported in 45 files across several”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Enter plan mode to explore library usage across modules, map affected”</b> <i>(trong đáp án C)</i>: Vào chế độ kế hoạch để khám phá việc sử dụng thư viện trên các mô-đun, ánh xạ…","elim":["<b>A. Create a custom slash command encapsulating the migration transformations, then execute it against each file without prior codebase exploration.</b>: Bỏ qua yêu cầu chính “Grep shows the library is imported in 45”.","<b>B. Update the dependency version, run the test suite, and use Claude Code to fix each failure as it appears.</b>: Bỏ qua yêu cầu chính “Grep shows the library is imported in 45”.","<b>D. Paste the migration guide&#x27;s breaking changes into your prompt and use direct execution to update all usages across the 45 files.</b>: Bỏ qua yêu cầu chính “Grep shows the library is imported in 45”."]}},{"id":"t1q88","n":88,"topic":1,"type":"mcq","stem":{"en":"You&#x27;ve asked Claude Code to build a PDF report generation feature. The initial implementation queries the database correctly, but the output has formatting issues: table columns are too narrow causing content truncation, dates display without proper formatting, and page break handling is incorrect. You&#x27;ve noticed these issues interact— changing column widths affects how dates render, and page breaks depend on content height. What&#x27;s the most effective approach for iterating toward a working solution?"},"options":[{"k":"A","t":{"en":"Address the column width issue first with specific measurements, verify it works, then fix date formatting within the corrected columns, then adjust page breaks— testing after each change."}},{"k":"B","t":{"en":"Show Claude an example of a correctly formatted report and ask it to match that output, rather than listing the specific technical issues."}},{"k":"C","t":{"en":"Start fresh with a detailed prompt specifying all formatting requirements upfront."}},{"k":"D","t":{"en":"Provide all three issues in a single detailed message with exact specifications for each, allowing Claude to address them together in one update."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“You&#x27;ve noticed these issues interact— changing column widths affects how dates”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Address the column width issue first with specific measurements, verify it”</b> <i>(trong đáp án A)</i>: Giải quyết vấn đề về độ rộng cột trước tiên bằng các phép đo cụ thể, xác minh…","elim":["<b>B. Show Claude an example of a correctly formatted report and ask it to match that output, rather than listing the specific technical issues.</b>: Bỏ qua yêu cầu chính “You&#x27;ve noticed these issues interact— changing column widths”.","<b>C. Start fresh with a detailed prompt specifying all formatting requirements upfront.</b>: Bắt đầu lại làm mất phần context đã tích lũy và buộc hệ thống lặp…","<b>D. Provide all three issues in a single detailed message with exact specifications for each, allowing Claude to address them together in one update.</b>: Bỏ qua yêu cầu chính “You&#x27;ve noticed these issues interact— changing column widths”."]}},{"id":"t1q89","n":89,"topic":1,"type":"mcq","stem":{"en":"You&#x27;re implementing a new payment processing module that must follow your project&#x27;s established patterns for database transactions, error handling, and audit logging. You&#x27;ve identified three existing modules that exemplify these patterns: db_utils.py, error_handlers.py, and audit_logger.py. This is a one-off integration task—these patterns are well-documented in your team wiki and don&#x27;t need additional project-level documentation. What&#x27;s the most effective approach?"},"options":[{"k":"A","t":{"en":"Ask Claude to explore your codebase to find and understand the transaction, error handling, and logging patterns before generating the new module."}},{"k":"B","t":{"en":"Use @references to include the three modules directly in your prompt, giving Claude concrete code examples of the patterns to follow."}},{"k":"C","t":{"en":"Add documentation of each pattern to your CLAUDE.md file, establishing them as project conventions that Claude will apply automatically."}},{"k":"D","t":{"en":"Describe the patterns from the three modules in natural language in your prompt, explaining the transaction handling approach, error format, and logging conventions Claude should follow."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“This is a one-off integration task—these patterns are well-documented in your”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Use @references to include the three modules directly in your prompt,”</b> <i>(trong đáp án B)</i>: Sử dụng @references để đưa trực tiếp ba mô-đun vào lời nhắc của bạn, đưa ra các ví…","elim":["<b>A. Ask Claude to explore your codebase to find and understand the transaction, error handling, and logging patterns before generating the new module.</b>: Bỏ qua yêu cầu chính “This is a one-off integration task—these patterns are”.","<b>C. Add documentation of each pattern to your CLAUDE.md file, establishing them as project conventions that Claude will apply automatically.</b>: Bỏ qua yêu cầu chính “This is a one-off integration task—these patterns are”.","<b>D. Describe the patterns from the three modules in natural language in your prompt, explaining the transaction handling approach, error format, and logging conventions Claude should follow.</b>: Bỏ qua yêu cầu chính “This is a one-off integration task—these patterns are”."]}},{"id":"t1q90","n":90,"topic":1,"type":"mcq","stem":{"en":"Your monorepo contains shared coding standards in /docs/standards/security-rules.md (for services handling user data), testing-patterns.md (for all packages), and api-conventions.md (for API-facing services). Your 15 packages are organized by feature domain (/packages/auth/, /packages/billing/, /packages/notifications/, etc.) without naming conventions indicating which handle user data or expose APIs. Package maintainers are expected to configure their own local development settings, as they understand their package&#x27;s domain requirements. Currently, all package CLAUDE.md files duplicate all three standards, applying irrelevant guidance. What&#x27;s the most effective approach?"},"options":[{"k":"A","t":{"en":"Use @imports in each package&#x27;s CLAUDE.md to reference only the specific standard files relevant to that package, based on the maintainer&#x27;s domain knowledge."}},{"k":"B","t":{"en":"Create claude/rules/ files for each standard with YAML frontmatter paths listing every package directory where that standard should apply."}},{"k":"C","t":{"en":"Create a shared-standards.nd that uses @imports to combine all three standards, then have each package&#x27;s CLAUDE.md import that combined file."}},{"k":"D","t":{"en":"Put all standards in the root CLAUDE.md with override instructions like &quot;ignore security-rules.md when working in packages that don&#x27;t handle user data.&quot;"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“Currently, all package CLAUDE.md files duplicate all three standards, applying irrelevant”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Use @imports in each package&#x27;s CLAUDE.md to reference only the specific”</b> <i>(trong đáp án A)</i>: Sử dụng @imports trong CLAUDE.md của mỗi gói để chỉ tham chiếu các tệp tiêu chuẩn cụ thể…","elim":["<b>B. Create claude/rules/ files for each standard with YAML frontmatter paths listing every package directory where that standard should apply.</b>: Bỏ qua yêu cầu chính “Currently, all package CLAUDE.md files duplicate all three”.","<b>C. Create a shared-standards.nd that uses @imports to combine all three standards, then have each package&#x27;s CLAUDE.md import that combined file.</b>: Bỏ qua yêu cầu chính “Currently, all package CLAUDE.md files duplicate all three”.","<b>D. Put all standards in the root CLAUDE.md with override instructions like &quot;ignore security-rules.md when working in packages that don&#x27;t handle user data.&quot;</b>: Bỏ qua yêu cầu chính “Currently, all package CLAUDE.md files duplicate all three”."]}},{"id":"t1q91","n":91,"topic":1,"type":"mcq","stem":{"en":"The system needs to extract candidate information (name, contact details, skills, work experience, education) from uploaded resumes. The extracted data must strictly conform to a predefined JSON schema, as missing required fields or incorrect data types will cause downstream validation failures. What is the most reliable approach to ensure Claude&#x27;s output consistently matches the schema?"},"options":[{"k":"A","t":{"en":"Define a tool with an input schema matching your required JSON structure and extract the data from Claude&#x27;s tool_use response."}},{"k":"B","t":{"en":"Make two separate API calls—first extracting information as text, then asking Claude to format that text as JSON."}},{"k":"C","t":{"en":"Include detailed JSON formatting instructions and a template example in the system prompt, asking Claude to output only valid JSON."}},{"k":"D","t":{"en":"Parse Claude&#x27;s text response with regex patterns to extract JSON objects, using retry logic for malformed responses."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“The extracted data must strictly conform to a predefined JSON schema,”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Define a tool with an input schema matching your required JSON”</b> <i>(trong đáp án A)</i>: Xác định một công cụ có lược đồ đầu vào khớp với cấu trúc JSON được yêu cầu…","elim":["<b>B. Make two separate API calls—first extracting information as text, then asking Claude to format that text as JSON.</b>: Bỏ qua yêu cầu chính “The extracted data must strictly conform to a”.","<b>C. Include detailed JSON formatting instructions and a template example in the system prompt, asking Claude to output only valid JSON.</b>: Bỏ qua yêu cầu chính “The extracted data must strictly conform to a”.","<b>D. Parse Claude&#x27;s text response with regex patterns to extract JSON objects, using retry logic for malformed responses.</b>: Retry không thể tạo ra dữ liệu còn thiếu hoặc sửa lỗi validation, permission hay…"]}},{"id":"t1q92","n":92,"topic":1,"type":"mcq","stem":{"en":"Anthropic&#x27;s tool use documentation states: &quot;Write instructive error messages. Instead of generic errors like &#x27;failed&#x27;, include what went wrong and what Claude should try next.&quot; A billing dispute agent uses lookup_order, which catches all exceptions and returns a tool_result with is_error: true and the message &quot;execution failed&quot;. Monitoring shows two failure modes: the agent retries the identical call until hitting the turn limit, or it immediately calls escalate_to_human without trying alternative tools. Which change follows the documented recommendation and gives Claude the information it needs to select the correct recovery action for each error type?"},"options":[{"k":"A","t":{"en":"Return error-type-specific messages with is_error: true, e.g., &quot;order not found-try get_customer to search by phone&quot; for data errors and &quot;Database timeout (transient)-retry should succeed&quot; for infrastructure errors."}},{"k":"B","t":{"en":"Implement retry logic with exponential backoff inside each tool implementation so transient errors are resolved transparently within the tool before any failure result is surfaced to Claude in the agentic loop."}},{"k":"C","t":{"en":"Remove is_error: true and return the error details as normal tool content, so Claude reasons about the response as data rather than treating it as a flagged failure condition that biases retry behavior."}},{"k":"D","t":{"en":"Add an error classification step in the agentic loop that intercepts tool errors before Claude sees them, tags each as &quot;retry&quot; &quot;try_alternative,&quot; or &quot;escalate,&quot; and adds that recommendation to the tool result."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“Monitoring shows two failure modes: the agent retries the identical call”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Return error-type-specific messages with is_error: true, e.g., &quot;order not found-try get_customer”</b> <i>(trong đáp án A)</i>: Trả về các thông báo dành riêng cho loại lỗi với is_error: true, ví dụ: &quot;không tìm thấy…","elim":["<b>B. Implement retry logic with exponential backoff inside each tool implementation so transient errors are resolved transparently within the tool before any failure result is surfaced to Claude in the agentic loop.</b>: Retry có thể che bớt lỗi tạm thời nhưng không cung cấp cho agent loại…","<b>C. Remove is_error: true and return the error details as normal tool content, so Claude reasons about the response as data rather than treating it as a flagged failure condition that biases retry behavior.</b>: Retry có thể che bớt lỗi tạm thời nhưng không cung cấp cho agent loại…","<b>D. Add an error classification step in the agentic loop that intercepts tool errors before Claude sees them, tags each as &quot;retry&quot; &quot;try_alternative,&quot; or &quot;escalate,&quot; and adds that recommendation to the tool result.</b>: Retry có thể che bớt lỗi tạm thời nhưng không cung cấp cho agent loại…"]}},{"id":"t1q93","n":93,"topic":1,"type":"mcq","stem":{"en":"Production logs reveal inconsistent error handling: when tool_code fails, the agent sometimes retries 5 times (even if the tool_id doesn&#x27;t exist), sometimes escalates immediately (premature for temporary network issues), and sometimes adds user-friendly explanation (inappropriate when the issue is a backend permission error). Investigation shows four MCP tool returns uniform error responses: {&quot;status&quot;: &quot;error&quot;, &quot;content&quot;: &quot;{&quot;type&quot;: &quot;Error&quot;, &quot;message&quot;: &quot;Operation failed.&quot;}&quot;}. The agent learns different types. What&#x27;s the most effective improvement?"},"options":[{"k":"A","t":{"en":"Add a few-shot examples to the system prompt demonstrating how to interpret error message patterns and select appropriate responses for each."}},{"k":"B","t":{"en":"Enhance error responses with structured metadata. Include error_category (transient/retriable/permission), reason, and a description of what caused the failure."}},{"k":"C","t":{"en":"Implement retry logic with exponential backoff in your MCP server for all errors, returning to the agent only after retries are exhausted."}},{"k":"D","t":{"en":"Create an analyze_error MCP tool the agent calls after any failure to determine the error category and recommended action."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“Investigation shows four MCP tool returns uniform error responses: {&quot;status&quot;: &quot;error&quot;,”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Enhance error responses with structured metadata. Include error_category (transient/retriable/permission), reason, and”</b> <i>(trong đáp án B)</i>: Tăng cường phản hồi lỗi bằng siêu dữ liệu có cấu trúc.","elim":["<b>A. Add a few-shot examples to the system prompt demonstrating how to interpret error message patterns and select appropriate responses for each.</b>: Bổ sung hướng dẫn chung có thể cải thiện phần nào nhưng không làm rõ…","<b>C. Implement retry logic with exponential backoff in your MCP server for all errors, returning to the agent only after retries are exhausted.</b>: Retry không thể tạo ra dữ liệu còn thiếu hoặc sửa lỗi validation, permission hay…","<b>D. Create an analyze_error MCP tool the agent calls after any failure to determine the error category and recommended action.</b>: Bỏ qua yêu cầu chính “Investigation shows four MCP tool returns uniform error”."]}},{"id":"t1q94","n":94,"topic":1,"type":"mcq","stem":{"en":"Your code review prompts include both implementation changes and the corresponding test file, but the LLM&#x27;s review comments fail to point out untested code paths. Analysis reveals the model correctly flags functions that have no tests at all, but fails to identify when conditional branches or error-handling paths within tested functions that have no tests at all, but fails to identify when conditional branches or error-handling paths within tested functio lack coverage. What&#x27;s the most effective way to improve detection of branch-level coverage gaps without overcomplicating the pipeline?"},"options":[{"k":"A","t":{"en":"Implement a multi-pass pipeline where separate LLM calls first extract all conditional branches, then cross-reference each against test assertions in a second pass."}},{"k":"B","t":{"en":"Add explicit instructions directing the model to enumerate each conditional branch and exception path, then verify each has a corresponding test assertion."}},{"k":"C","t":{"en":"Restructure the prompt to interleave implementation and tests, presenting each function followed immediately by its test cases"}},{"k":"D","t":{"en":"Include few-shot examples showing code with an uncovered branch paired with the review comment identifying the specific missing test case."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“Analysis reveals the model correctly flags functions that have no tests”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Include few-shot examples showing code with an uncovered branch paired with”</b> <i>(trong đáp án D)</i>: Bao gồm một vài ví dụ hiển thị mã có nhánh chưa được phát hiện được ghép nối…","elim":["<b>A. Implement a multi-pass pipeline where separate LLM calls first extract all conditional branches, then cross-reference each against test assertions in a second pass.</b>: Bỏ qua yêu cầu chính “Analysis reveals the model correctly flags functions that”.","<b>B. Add explicit instructions directing the model to enumerate each conditional branch and exception path, then verify each has a corresponding test assertion.</b>: Bỏ qua yêu cầu chính “Analysis reveals the model correctly flags functions that”.","<b>C. Restructure the prompt to interleave implementation and tests, presenting each function followed immediately by its test cases</b>: Bỏ qua yêu cầu chính “Analysis reveals the model correctly flags functions that”."]}},{"id":"t1q95","n":95,"topic":1,"type":"mcq","stem":{"en":"Your pipeline uses a tool called extract_metadata with a JSON schema for paper details. You&#x27;ve also defined lookup_citations and verify_doi tools for enrichment. During testing, you notice that when users include requests like &quot;extract the metadata and tell me how cited it is,&quot; Claude sometimes calls lookup_citations first, which fails because it needs the DOI that extract_metadata would provide. What&#x27;s the most effective way to ensure structured metadata extraction happens first?"},"options":[{"k":"A","t":{"en":"Set tool_choice to {&quot;type&quot;: &quot;tool&quot;, &quot;name&quot;: &quot;extract_metadata&quot;} and process the enrichment requests in subsequent turns after receiving the extracted metadata."}},{"k":"B","t":{"en":"Set tool_choice to &quot;any&quot; so Claude must use a tool, combined with system prompt instructions prioritizing extract_metadata."}},{"k":"C","t":{"en":"Set tool_choice to &quot;auto&quot; and reorder the tool definitions so extract_metadata appears first in the tools array, since Claude prioritizes earlier-listed tools."}},{"k":"D","t":{"en":"Set tool_choice to {&quot;type&quot;: &quot;tool&quot;, &quot;name&quot;: &quot;extract_metadata&quot;} for every API call in the pipeline, ensuring Claude always extracts metadata before any enrichment can occur."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“During testing, you notice that when users include requests like &quot;extract”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Set tool_choice to {&quot;type&quot;: &quot;tool&quot;, &quot;name&quot;: &quot;extract_metadata&quot;} and process the enrichment”</b> <i>(trong đáp án A)</i>: Ép <code>tool_choice</code> vào <code>extract_metadata</code> ở lượt đầu bảo đảm DOI được trích xuất trước.","elim":["<b>B. Set tool_choice to &quot;any&quot; so Claude must use a tool, combined with system prompt instructions prioritizing extract_metadata.</b>: tool_choice: &quot;any&quot; chỉ ép dùng một tool bất kỳ, không bảo đảm đúng tool hoặc…","<b>C. Set tool_choice to &quot;auto&quot; and reorder the tool definitions so extract_metadata appears first in the tools array, since Claude prioritizes earlier-listed tools.</b>: tool_choice: &quot;auto&quot; vẫn cho phép Claude trả lời bằng text hoặc chọn tool khác; nó…","<b>D. Set tool_choice to {&quot;type&quot;: &quot;tool&quot;, &quot;name&quot;: &quot;extract_metadata&quot;} for every API call in the pipeline, ensuring Claude always extracts metadata before any enrichment can occur.</b>: tool_choice: &quot;any&quot; chỉ ép dùng một tool bất kỳ, không bảo đảm đúng tool hoặc…"]}},{"id":"t1q96","n":96,"topic":1,"type":"mcq","stem":{"en":"Your pipeline reviews every PR using a single API call with a static prompt containing the diff and full text of each changed file — unchanged files are not included. Reviews are posted asynchronously and don&#x27;t block PR creation. Developers report that reviews consistently miss bugs involving cross-file interactions — for example, a PR renames a function&#x27;s parameters but the review doesn&#x27;t flag callers in unchanged files that still use the old argument order. Evaluation shows cross-file bugs account for 35% of production incidents from reviewed PRs. What is the most effective change to your review design?"},"options":[{"k":"A","t":{"en":"Redesign the review as a turn-limited agentic task where the model can read files and search the codebase via tools, following references to verify cross-file findings."}},{"k":"B","t":{"en":"Run parallel review passes per changed file with direct dependents included in each pass, then aggregate and deduplicate findings using a final summarization call."}},{"k":"C","t":{"en":"Use static analysis to build a dependency graph of changed code, then expand the prompt to include all files within two dependency hops of any changed file."}},{"k":"D","t":{"en":"Add chain-of-thought instructions asking the model to list all external references in the diff, then reason step-by-step about how each change might affect callers in other files."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“Evaluation shows cross-file bugs account for 35% of production incidents from”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Redesign the review as a turn-limited agentic task where the model”</b> <i>(trong đáp án A)</i>: Lỗi là do thiếu ngữ cảnh: người gọi sống trong các tệp không thay đổi mà prompt tĩnh…","elim":["<b>B. Run parallel review passes per changed file with direct dependents included in each pass, then aggregate and deduplicate findings using a final summarization call.</b>: Bỏ qua yêu cầu chính “Evaluation shows cross-file bugs account for 35% of”.","<b>C. Use static analysis to build a dependency graph of changed code, then expand the prompt to include all files within two dependency hops of any changed file.</b>: Bỏ qua yêu cầu chính “Evaluation shows cross-file bugs account for 35% of”.","<b>D. Add chain-of-thought instructions asking the model to list all external references in the diff, then reason step-by-step about how each change might affect callers in other files.</b>: Bỏ qua yêu cầu chính “Evaluation shows cross-file bugs account for 35% of”."]}},{"id":"t1q97","n":97,"topic":1,"type":"mcq","stem":{"en":"Your search Flights tool calls an external airline API that occasionally returns a 503 Service Unavailable error. What is the most effective way to handle this error in your tool implementation?"},"options":[{"k":"A","t":{"en":"Return an empty flight list as if the search succeeded but found no matching flights."}},{"k":"B","t":{"en":"Log the error internally and return an empty response, letting the model continue without the flight data."}},{"k":"C","t":{"en":"Return an error message in the tool result explaining the service is temporarily unavailable."}},{"k":"D","t":{"en":"Automatically retry the request up to five times with exponential backoff before returning results to the agent."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“Your search Flights tool calls an external airline API that occasionally”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Automatically retry the request up to five times with exponential backoff”</b> <i>(trong đáp án D)</i>: Tự động thử lại yêu cầu tối đa năm lần với thời gian chờ theo cấp số nhân…","elim":["<b>A. Return an empty flight list as if the search succeeded but found no matching flights.</b>: Bỏ qua yêu cầu chính “Your search Flights tool calls an external airline”.","<b>B. Log the error internally and return an empty response, letting the model continue without the flight data.</b>: Che giấu lỗi hoặc trả kết quả rỗng làm agent không phân biệt được “không…","<b>C. Return an error message in the tool result explaining the service is temporarily unavailable.</b>: Bỏ qua yêu cầu chính “Your search Flights tool calls an external airline”."]}},{"id":"t1q98","n":98,"topic":1,"type":"mcq","stem":{"en":"Your agent has a log_workout tool that accepts exercise_type (string), value (number), and measurement (string). Production monitoring shows the agent frequently passes mismatched combinations-using measurement: &quot;reps&quot; for cardio exercises like running, or measurement: &quot;miles&quot; for strength exercises like bench press. Your exercises naturally divide into two categories: cardio (measured in time or distance) and strength (measured in reps and sets). 23% of tool calls have invalid combinations. What approach would most effectively reduce these errors?"},"options":[{"k":"A","t":{"en":"Add explicit examples to the tool description showing valid combinations (e.g., &quot;For running: use minutes or miles. For push-ups: use reps&quot;) with constraints for each exercise category."}},{"k":"B","t":{"en":"Implement server-side validation returning descriptive errors for invalid combinations, allowing the agent to retry with corrections."}},{"k":"C","t":{"en":"Add enum constraints on measurement limiting values to &quot;minutes&quot;, &quot;miles&quot;, &quot;reps&quot;, or &quot;sets&quot; to prevent arbitrary measurement strings."}},{"k":"D","t":{"en":"Split into log_cardio_workout (with duration_minutes or distance_miles parameters) and log_strength_workout (with reps and sets parameters)."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“Production monitoring shows the agent frequently passes mismatched combinations-using measurement: &quot;reps&quot;”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Split into log_cardio_workout (with duration_minutes or distance_miles parameters) and log_strength_workout (with”</b> <i>(trong đáp án D)</i>: Chia thành log_cardio_workout (với thông số thời lượng_phút hoặc khoảng cách_miles) và log_ Strength_workout (với thông số số…","elim":["<b>A. Add explicit examples to the tool description showing valid combinations (e.g., &quot;For running: use minutes or miles. For push-ups: use reps&quot;) with constraints for each exercise category.</b>: Bỏ qua yêu cầu chính “Production monitoring shows the agent frequently passes mismatched”.","<b>B. Implement server-side validation returning descriptive errors for invalid combinations, allowing the agent to retry with corrections.</b>: Retry có thể che bớt lỗi tạm thời nhưng không cung cấp cho agent loại…","<b>C. Add enum constraints on measurement limiting values to &quot;minutes&quot;, &quot;miles&quot;, &quot;reps&quot;, or &quot;sets&quot; to prevent arbitrary measurement strings.</b>: Bỏ qua yêu cầu chính “Production monitoring shows the agent frequently passes mismatched”."]}},{"id":"t1q99","n":99,"topic":1,"type":"mcq","stem":{"en":"During initial testing, you notice that Claude doesn&#x27;t seem to remember vocabulary words from earlier in the conversation. When a student asks &quot;Can you quiz me on those words?&quot;, responds as if no words have been discussed. What is the most likely explanation?"},"options":[{"k":"A","t":{"en":"You&#x27;re not including prior messages in each API request—the stateless API doesn&#x27;t retain conversation history."}},{"k":"B","t":{"en":"The model&#x27;s context window has filled up, causing earlier conversation content to be dropped."}},{"k":"C","t":{"en":"Your system prompt needs explicit instructions telling Claude to remember information from earlier turns."}},{"k":"D","t":{"en":"You need to enable conversation persistence by passing a session ID parameter with each API call."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“During initial testing, you notice that Claude doesn&#x27;t seem to remember”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“You&#x27;re not including prior messages in each API request—the stateless API”</b> <i>(trong đáp án A)</i>: Bạn không đưa các tin nhắn trước đó vào mỗi yêu cầu API—API không trạng thái không lưu…","elim":["<b>B. The model&#x27;s context window has filled up, causing earlier conversation content to be dropped.</b>: Bỏ qua yêu cầu chính “During initial testing, you notice that Claude doesn&#x27;t”.","<b>C. Your system prompt needs explicit instructions telling Claude to remember information from earlier turns.</b>: Bỏ qua yêu cầu chính “During initial testing, you notice that Claude doesn&#x27;t”.","<b>D. You need to enable conversation persistence by passing a session ID parameter with each API call.</b>: Bỏ qua yêu cầu chính “During initial testing, you notice that Claude doesn&#x27;t”."]}},{"id":"t1q100","n":100,"topic":1,"type":"mcq","stem":{"en":"A new user&#x27;s first message is &quot;Set up my focus music,&quot; This could mean configure preferences, create a playlist, or play music immediately. Your system supports all three actions. What&#x27;s the effective approach?"},"options":[{"k":"A","t":{"en":"Ask one clarifying question about action type: play now or configure for later"}},{"k":"B","t":{"en":"Start preference configuration by asking about genres, temps, and artists they prefer for focus."}},{"k":"C","t":{"en":"Play popular focus tracks Immediately and let the user redirect if needed"}},{"k":"D","t":{"en":"Create a new &quot;Focus&quot; playlist with curated tracks and notify the user it&#x27;s ready."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“Your system supports all three actions.”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Ask one clarifying question about action type: play now or configure”</b> <i>(trong đáp án A)</i>: Hỏi một câu hỏi làm rõ về loại hành động: phát ngay hoặc định cấu hình để xem…","elim":["<b>B. Start preference configuration by asking about genres, temps, and artists they prefer for focus.</b>: Bỏ qua yêu cầu chính “Your system supports all three actions”.","<b>C. Play popular focus tracks Immediately and let the user redirect if needed</b>: Bỏ qua yêu cầu chính “Your system supports all three actions”.","<b>D. Create a new &quot;Focus&quot; playlist with curated tracks and notify the user it&#x27;s ready.</b>: Bỏ qua yêu cầu chính “Your system supports all three actions”."]}},{"id":"t1q101","n":101,"topic":1,"type":"mcq","stem":{"en":"Your conversational assistant frequently generates multiple clarifying questions when users make ambiguous requests. When a user asks &quot;Can you help me with the report?&quot;, the assistant responds: &quot;I&#x27;d be happy to help! Could you tell me: 1) Which report? 2) What kind of help—drafting, reviewing, or formatting? 3) What&#x27;s your deadline?&quot; User analytics show a 40% conversation abandonment rate after these multi-question responses. What&#x27;s the most effective way to reduce friction while appropriately handling ambiguity?"},"options":[{"k":"A","t":{"en":"Limit the assistant to one clarifying question per turn, using conversation history to accumulate answers over multiple exchanges rather than requesting everything upfront."}},{"k":"B","t":{"en":"Add a preprocessing step using a smaller model to classify request ambiguity on a 1-5 scale, routing high-ambiguity requests to a clarification dialog and low-ambiguity requests directly to the assistant."}},{"k":"C","t":{"en":"Modify the system prompt to instruct the assistant to make reasonable assumptions from available context, state those assumptions explicitly, and offer to adjust if the interpretation is wrong."}},{"k":"D","t":{"en":"Create a lookup table of common request patterns with predefined default interpretations, having the assistant respond with those defaults without stating the assumptions made."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“Your conversational assistant frequently generates multiple clarifying questions when users make”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Modify the system prompt to instruct the assistant to make reasonable”</b> <i>(trong đáp án C)</i>: Sửa đổi lời nhắc của hệ thống để hướng dẫn trợ lý đưa ra các giả định hợp…","elim":["<b>A. Limit the assistant to one clarifying question per turn, using conversation history to accumulate answers over multiple exchanges rather than requesting everything upfront.</b>: Bỏ qua yêu cầu chính “Your conversational assistant frequently generates multiple clarifying questions”.","<b>B. Add a preprocessing step using a smaller model to classify request ambiguity on a 1-5 scale, routing high-ambiguity requests to a clarification dialog and low-ambiguity requests directly to the assistant.</b>: Bỏ qua yêu cầu chính “Your conversational assistant frequently generates multiple clarifying questions”.","<b>D. Create a lookup table of common request patterns with predefined default interpretations, having the assistant respond with those defaults without stating the assumptions made.</b>: Bỏ qua yêu cầu chính “Your conversational assistant frequently generates multiple clarifying questions”."]}},{"id":"t1q102","n":102,"topic":1,"type":"mcq","stem":{"en":"You need to add a date validation check ensuring event dates are in the future. This requires adding a conditional statement to one existing function in a single file. What is the most appropriate approach?"},"options":[{"k":"A","t":{"en":"Use direct execution to make the change"}},{"k":"B","t":{"en":"Start with extended thinking mode enabled to ensure thorough reasoning about the validation logic"}},{"k":"C","t":{"en":"Enter plan mode to analyze how the validation might impact other parts of the reservation flow"}},{"k":"D","t":{"en":"Enter plan mode first to create a detailed implementation strategy before making the change"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“This requires adding a conditional statement to one existing function in”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Use direct execution to make the change”</b> <i>(trong đáp án A)</i>: Sử dụng thực thi trực tiếp để thực hiện thay đổi.","elim":["<b>B. Start with extended thinking mode enabled to ensure thorough reasoning about the validation logic</b>: Bỏ qua yêu cầu chính “This requires adding a conditional statement to one”.","<b>C. Enter plan mode to analyze how the validation might impact other parts of the reservation flow</b>: Bỏ qua yêu cầu chính “This requires adding a conditional statement to one”.","<b>D. Enter plan mode first to create a detailed implementation strategy before making the change</b>: Bỏ qua yêu cầu chính “This requires adding a conditional statement to one”."]}},{"id":"t1q103","n":103,"topic":1,"type":"mcq","stem":{"en":"Your team&#x27;s CLAUDE.md includes a rule: &quot;Use 4-space indentation and always run Prettier formatting.&quot; Despite this, code reviews reveal that roughly 30% of files Claude Code generates use inconsistent formatting — sometimes 2-space indentation, sometimes missing trailing commas. Adding emphasis (&quot;IMPORTANT: You MUST use Prettier formatting&quot;) reduces violations to about 15%, but doesn&#x27;t eliminate them. What is the most effective way to ensure all generated code is consistently formatted?"},"options":[{"k":"A","t":{"en":"Split the formatting rules into path-scoped .claude/rules/ files that load when Claude works on matching file types."}},{"k":"B","t":{"en":"Configure a Post ToolUse hook with an Edit|Write matcher that automatically runs Prettier on each file Claude modifies."}},{"k":"C","t":{"en":"Add a Stop hook with a prompt-based check that evaluates whether generated code follows formatting standards and prompts Claude to fix violations."}},{"k":"D","t":{"en":"Extract the formatting rules into a dedicated skill that Claude loads automatically when generating code, with more detailed examples of correct formatting."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“Adding emphasis (&quot;IMPORTANT: You MUST use Prettier formatting&quot;) reduces violations to”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Configure a Post ToolUse hook with an Edit|Write matcher that automatically”</b> <i>(trong đáp án B)</i>: Định cấu hình hook Post ToolUse bằng trình so khớp Chỉnh sửa|Viết tự động chạy Prettier trên mỗi…","elim":["<b>A. Split the formatting rules into path-scoped .claude/rules/ files that load when Claude works on matching file types.</b>: Bỏ qua yêu cầu chính “Adding emphasis (&quot;IMPORTANT: You MUST use Prettier formatting&quot;)”.","<b>C. Add a Stop hook with a prompt-based check that evaluates whether generated code follows formatting standards and prompts Claude to fix violations.</b>: Bash có thể thực hiện thao tác nhưng dễ vỡ và bỏ qua contract hoặc…","<b>D. Extract the formatting rules into a dedicated skill that Claude loads automatically when generating code, with more detailed examples of correct formatting.</b>: Bỏ qua yêu cầu chính “Adding emphasis (&quot;IMPORTANT: You MUST use Prettier formatting&quot;)”."]}},{"id":"t1q104","n":104,"topic":1,"type":"mcq","stem":{"en":"You&#x27;re implementing a caching layer for API responses to speed up the /products endpoint. You have a rough idea—Redis with a 5-minute TTL—but you&#x27;re new to production caching and aren&#x27;t sure what other considerations a robust implementation requires. What&#x27;s the most effective way to start your iterative workflow?"},"options":[{"k":"A","t":{"en":"Start with a minimal request: &quot;Add Redis caching to/products with 5-minute TTL.&quot; Add features and fix issues through follow-up prompts as problems surface during testing."}},{"k":"B","t":{"en":"Write a specification with your known requirements and &quot;TBD&quot; markers for uncertain areas, having Claude propose solutions for each TBD as it implements."}},{"k":"C","t":{"en":"Ask Claude to interview you about the caching requirements before implementing, surfacing considerations like invalidation strategies, cache layers, consistency guarantees, and failure modes."}},{"k":"D","t":{"en":"Use plan mode to analyze the current/products endpoint implementation, then provide your caching requirements once Claude explains how the existing code is structured."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“You have a rough idea—Redis with a 5-minute TTL—but you&#x27;re new”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Ask Claude to interview you about the caching requirements before implementing,”</b> <i>(trong đáp án C)</i>: Yêu cầu Claude phỏng vấn bạn về các yêu cầu về bộ nhớ đệm trước khi triển khai…","elim":["<b>A. Start with a minimal request: &quot;Add Redis caching to/products with 5-minute TTL.&quot; Add features and fix issues through follow-up prompts as problems surface during testing.</b>: Bỏ qua yêu cầu chính “You have a rough idea—Redis with a 5-minute”.","<b>B. Write a specification with your known requirements and &quot;TBD&quot; markers for uncertain areas, having Claude propose solutions for each TBD as it implements.</b>: Bỏ qua yêu cầu chính “You have a rough idea—Redis with a 5-minute”.","<b>D. Use plan mode to analyze the current/products endpoint implementation, then provide your caching requirements once Claude explains how the existing code is structured.</b>: Bỏ qua yêu cầu ch
