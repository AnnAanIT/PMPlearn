ính “You have a rough idea—Redis with a 5-minute”."]}},{"id":"t1q105","n":105,"topic":1,"type":"mcq","stem":{"en":"You&#x27;ve asked Claude to write a data migration script, but the initial output doesn&#x27;t correctly handle records with null values in required fields. What&#x27;s the most effective way to iterate toward a working solution?"},"options":[{"k":"A","t":{"en":"Manually edit the generated code to fix the null handling, then continue working with Claude on other parts."}},{"k":"B","t":{"en":"Provide a test case with example input containing null values and the expected output, then ask Claude to fix it."}},{"k":"C","t":{"en":"Describe the null value problem in detail and ask Claude to regenerate the entire script with improved edge case handling."}},{"k":"D","t":{"en":"Add &quot;think harder about edge cases&quot; to your prompt and request a complete rewrite of the migration logic."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“You&#x27;ve asked Claude to write a data migration script, but the”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Provide a test case with example input containing null values and”</b> <i>(trong đáp án B)</i>: Cung cấp một trường hợp thử nghiệm với đầu vào mẫu chứa giá trị null và đầu ra…","elim":["<b>A. Manually edit the generated code to fix the null handling, then continue working with Claude on other parts.</b>: Bỏ qua yêu cầu chính “You&#x27;ve asked Claude to write a data migration”.","<b>C. Describe the null value problem in detail and ask Claude to regenerate the entire script with improved edge case handling.</b>: Bỏ qua yêu cầu chính “You&#x27;ve asked Claude to write a data migration”.","<b>D. Add &quot;think harder about edge cases&quot; to your prompt and request a complete rewrite of the migration logic.</b>: Bỏ qua yêu cầu chính “You&#x27;ve asked Claude to write a data migration”."]}},{"id":"t1q106","n":106,"topic":1,"type":"mcq","stem":{"en":"Production monitoring shows the research phase takes longer than expected. Analysis reveals the coordinator invokes the web search subagent, then invokes the document analysis subagent and waits again. These tasks are independent—neither requires the other&#x27;s output. What is the most effective way to run these subagents concurrently?"},"options":[{"k":"A","t":{"en":"Create an async orchestration layer outside the agent that spawns parallel threads, each running a separate coordinator."}},{"k":"B","t":{"en":"Switch both subagents to use a Haiku-tier model instead of Sonnet to reduce their individual execution time."}},{"k":"C","t":{"en":"Structure the coordinator to emit both Task tool calls (for web search and document analysis) in a single response message."}},{"k":"D","t":{"en":"Add detailed instructions to the coordinator&#x27;s system prompt explaining the performance benefits of parallel execution at the same time."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“These tasks are independent—neither requires the other&#x27;s output.”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Structure the coordinator to emit both Task tool calls (for web”</b> <i>(trong đáp án C)</i>: Cấu trúc coordinator để phát ra cả hai lệnh tool call Tác vụ (để tìm kiếm trên web…","elim":["<b>A. Create an async orchestration layer outside the agent that spawns parallel threads, each running a separate coordinator.</b>: Bỏ qua yêu cầu chính “These tasks are independent—neither requires the other&#x27;s output”.","<b>B. Switch both subagents to use a Haiku-tier model instead of Sonnet to reduce their individual execution time.</b>: Bỏ qua yêu cầu chính “These tasks are independent—neither requires the other&#x27;s output”.","<b>D. Add detailed instructions to the coordinator&#x27;s system prompt explaining the performance benefits of parallel execution at the same time.</b>: Bỏ qua yêu cầu chính “These tasks are independent—neither requires the other&#x27;s output”."]}},{"id":"t1q107","n":107,"topic":1,"type":"mcq","stem":{"en":"Your automated review calls the Claude API for each PR, using tool_use with a report_findings tool that returns a JSON array of finding objects (each with file_path, line_number, severity, category, and description). During testing on a large PR touching 30+ files, the response hits the max_tokens limit and the output is truncated mid-JSON, causing your pipeline&#x27;s parser to fail. What is the most effective way to handle this?"},"options":[{"k":"A","t":{"en":"Switch from tool_use to prompting Claude to return findings as a markdown list."}},{"k":"B","t":{"en":"Increase max_tokens to the model&#x27;s maximum and instruct Claude to keep finding descriptions under 50 words each."}},{"k":"C","t":{"en":"Split the review into multiple API calls that each analyze a subset of the changed files, then merge the resulting findings arrays."}},{"k":"D","t":{"en":"Add retry logic that detects truncated JSON and re-sends the request with instructions to report only critical and high severity findings."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“During testing on a large PR touching 30+ files, the response”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Split the review into multiple API calls that each analyze a”</b> <i>(trong đáp án C)</i>: Chia đánh giá thành nhiều lệnh gọi API, mỗi lệnh gọi phân tích một tập hợp con của…","elim":["<b>A. Switch from tool_use to prompting Claude to return findings as a markdown list.</b>: Bỏ qua yêu cầu chính “During testing on a large PR touching 30+”.","<b>B. Increase max_tokens to the model&#x27;s maximum and instruct Claude to keep finding descriptions under 50 words each.</b>: Bỏ qua yêu cầu chính “During testing on a large PR touching 30+”.","<b>D. Add retry logic that detects truncated JSON and re-sends the request with instructions to report only critical and high severity findings.</b>: Retry có thể che bớt lỗi tạm thời nhưng không cung cấp cho agent loại…"]}},{"id":"t1q108","n":108,"topic":1,"type":"mcq","stem":{"en":"An engineer sees an unfamiliar error message &quot;SYNC_CONFLICT: entity version mismatch detected&quot; in production logs but doesn&#x27;t know which of the 12 services in the codebase generates it. They ask the agent to help locate the source code. What exploration approach will most efficiently find the responsible code?"},"options":[{"k":"A","t":{"en":"Use Grep to search for distinctive text from the error message (like &quot;SYNC_CONFLICT&quot; or &quot;entity version mismatch&quot;), then Read the matching files to understand context."}},{"k":"B","t":{"en":"Use Grep to find all files that import the project&#x27;s error handling module, then Read those files to locate custom error definitions."}},{"k":"C","t":{"en":"Use Glob to find files in directories commonly associated with error handling (such as errors/, exceptions/, or handlers/) across services, then Read each matching file."}},{"k":"D","t":{"en":"Read the project&#x27;s README and service configuration files to understand the architecture, then systematically Read source files in service directory."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“They ask the agent to help locate the source code.”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Use Grep to search for distinctive text from the error message”</b> <i>(trong đáp án A)</i>: Sử dụng Grep để tìm kiếm văn bản đặc biệt từ thông báo lỗi (như &quot;SYNC_CONFLICT&quot; hoặc &quot;phiên…","elim":["<b>B. Use Grep to find all files that import the project&#x27;s error handling module, then Read those files to locate custom error definitions.</b>: Bỏ qua yêu cầu chính “They ask the agent to help locate the”.","<b>C. Use Glob to find files in directories commonly associated with error handling (such as errors/, exceptions/, or handlers/) across services, then Read each matching file.</b>: Glob chủ yếu khớp tên hoặc đường dẫn tệp; nó không phải công cụ phù…","<b>D. Read the project&#x27;s README and service configuration files to understand the architecture, then systematically Read source files in service directory.</b>: Bỏ qua yêu cầu chính “They ask the agent to help locate the”."]}},{"id":"t1q109","n":109,"topic":1,"type":"mcq","stem":{"en":"An engineer asks your agent to add comprehensive tests to a legacy codebase with 200 files and minimal existing test coverage. The engineer hasn&#x27;t specified which modules to prioritize. How should the agent decompose this open-ended task?"},"options":[{"k":"A","t":{"en":"Systematically read all 200 files to create a complete function inventory before writing any tests, ensuring the testing plan accounts for every function before beginning."}},{"k":"B","t":{"en":"Create a fixed testing schedule upfront based on directory structure, allocating equal effort to each top-level directory regardless of code complexity or business importance."}},{"k":"C","t":{"en":"Use Glob and Grep to map codebase structure, identify heavily-coupled modules, create a prioritized plan for high-impact areas, and revise as dependencies are discovered."}},{"k":"D","t":{"en":"Start writing tests for the first module alphabetically, using test failures and imports to discover related files organically."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“The engineer hasn&#x27;t specified which modules to prioritize.”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Use Glob and Grep to map codebase structure, identify heavily-coupled modules,”</b> <i>(trong đáp án C)</i>: Các biện pháp thực hành tốt nhất của nhân viên Anthropic ưu tiên việc thu thập ngữ cảnh…","elim":["<b>A. Systematically read all 200 files to create a complete function inventory before writing any tests, ensuring the testing plan accounts for every function before beginning.</b>: Cách này giữ quá nhiều dữ liệu không cần thiết, làm tăng token, độ trễ…","<b>B. Create a fixed testing schedule upfront based on directory structure, allocating equal effort to each top-level directory regardless of code complexity or business importance.</b>: Bash có thể thực hiện thao tác nhưng dễ vỡ và bỏ qua contract hoặc…","<b>D. Start writing tests for the first module alphabetically, using test failures and imports to discover related files organically.</b>: Bỏ qua yêu cầu chính “The engineer hasn&#x27;t specified which modules to prioritize”."]}},{"id":"t1q110","n":110,"topic":1,"type":"mcq","stem":{"en":"Your productivity agent connects to three MCP servers: an issue tracker (search_issues, get_issue, create_comment), a documentation wiki (search_docs, get_page, list_spaces), and a database explorer (run_query, get_schema, list_databases). When engineers ask cross-system questions like &quot;What database tables are affected by the authentication refactor in PROJ-1234?&quot;, monitoring shows the agent makes 8-10 sequential tool calls, frequently issues exploratory calls because it lacks visibility into what content each server contains, and exhausts context space before completing complex investigations. What architectural change best leverages MCP capabilities to address these issues?"},"options":[{"k":"A","t":{"en":"Consolidate all three servers into a unified MCP server with cross-referencing capabilities"}},{"k":"B","t":{"en":"Expose each server&#x27;s content catalog as MCP resources—issue summaries, documentation hierarchy, database schemas"}},{"k":"C","t":{"en":"Add an orchestrator that routes questions to a single server based on keywords"}},{"k":"D","t":{"en":"Add a prepare_investigation tool to each server that accepts a natural language question and returns relevant content summaries"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“When engineers ask cross-system questions like &quot;What database tables are affected”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Expose each server&#x27;s content catalog as MCP resources—issue summaries, documentation hierarchy,”</b> <i>(trong đáp án B)</i>: Tài nguyên MCP là giao thức nguyên thủy được thiết kế cho chính xác vấn đề này: máy…","elim":["<b>A. Consolidate all three servers into a unified MCP server with cross-referencing capabilities</b>: Bỏ qua yêu cầu chính “When engineers ask cross-system questions like &quot;What database”.","<b>C. Add an orchestrator that routes questions to a single server based on keywords</b>: Bash có thể thực hiện thao tác nhưng dễ vỡ và bỏ qua contract hoặc…","<b>D. Add a prepare_investigation tool to each server that accepts a natural language question and returns relevant content summaries</b>: Bỏ qua yêu cầu chính “When engineers ask cross-system questions like &quot;What database”."]}},{"id":"t1q111","n":111,"topic":1,"type":"mcq","stem":{"en":"The synthesis agent completes its initial pass but flags that three key research questions remain unanswered because the web search and document analysis agents didn&#x27;t find relevant information on those specific subtopics. The coordinator currently proceeds directly to report generation, producing reports with incomplete coverage. What change would most effectively improve research completeness?"},"options":[{"k":"A","t":{"en":"Have the report generation agent note which research questions couldn&#x27;t be answered, so users understand the limitations of the final output."}},{"k":"B","t":{"en":"Give the synthesis agent direct access to web search tools so it can autonomously fill knowledge gaps without returning control to the coordinator."}},{"k":"C","t":{"en":"Have the coordinator evaluate synthesis output for gaps, then re-delegate to web search and document analysis with targeted queries before Invoking synthesis again."}},{"k":"D","t":{"en":"Increase the initial breadth of queries sent to web search and document analysis to reduce the probability of missing relevant information."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“The coordinator currently proceeds directly to report generation, producing reports with”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Have the coordinator evaluate synthesis output for gaps, then re-delegate to”</b> <i>(trong đáp án C)</i>: Yêu cầu coordinator đánh giá kết quả tổng hợp để tìm các khoảng trống, sau đó ủy quyền…","elim":["<b>A. Have the report generation agent note which research questions couldn&#x27;t be answered, so users understand the limitations of the final output.</b>: Bỏ qua yêu cầu chính “The coordinator currently proceeds directly to report generation,”.","<b>B. Give the synthesis agent direct access to web search tools so it can autonomously fill knowledge gaps without returning control to the coordinator.</b>: Bỏ qua yêu cầu chính “The coordinator currently proceeds directly to report generation,”.","<b>D. Increase the initial breadth of queries sent to web search and document analysis to reduce the probability of missing relevant information.</b>: Bỏ qua yêu cầu chính “The coordinator currently proceeds directly to report generation,”."]}},{"id":"t1q112","n":112,"topic":1,"type":"mcq","stem":{"en":"Your documents (query) tool returns results as &quot;Found 3 documents: Q2 Budget Proposal, Q2 Budget Forecast, Annual Review&quot;. You want the agent to document (4, multi) and doc (24, multi). What return format would best enable these multi-step workflows?"},"options":[{"k":"A","t":{"en":"Structured data containing document IDs and metadata for each result."}},{"k":"B","t":{"en":"URLs that users can click to open the document in their browser."}},{"k":"C","t":{"en":"More detailed human-readable descriptions including the size and authors."}},{"k":"D","t":{"en":"A JSON array of document titles extracted from the search results."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“You want the agent to document (4, multi) and doc (24,”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Structured data containing document IDs and metadata for each result.”</b> <i>(trong đáp án A)</i>: Dữ liệu có cấu trúc chứa ID tài liệu và siêu dữ liệu cho từng kết quả.","elim":["<b>B. URLs that users can click to open the document in their browser.</b>: Bỏ qua yêu cầu chính “You want the agent to document (4, multi)”.","<b>C. More detailed human-readable descriptions including the size and authors.</b>: Bỏ qua yêu cầu chính “You want the agent to document (4, multi)”.","<b>D. A JSON array of document titles extracted from the search results.</b>: Bỏ qua yêu cầu chính “You want the agent to document (4, multi)”."]}},{"id":"t1q113","n":113,"topic":1,"type":"mcq","stem":{"en":"Your agent has access to 50+ specialized API connectors for different external services. As the connector library grew, tool selection accuracy dropped to 58%. You design a search_connectors(description) tool that finds matching connectors, but in testing agents frequently skip searching and call connectors directly (often incorrectly), or search select wrong connectors from the filtered results. How should you design the tool composition pattern to address both issues?"},"options":[{"k":"A","t":{"en":"Enhance all connector descriptions with detailed usage samples, edge cases, and input requirements. Add few-shot examples showing the correct search-then-use workflow."}},{"k":"B","t":{"en":"Design a find_and_execute(description, params) composite tool that searches and immediately executes the best matching connector."}},{"k":"C","t":{"en":"Design connectors with built-in compatibility validation that return descriptive errors for mismatched requests."}},{"k":"D","t":{"en":"Design search_connectors to dynamically add matched connectors to the agent&#x27;s available tools. Connectors start unavailable and persist once discovered."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“You design a search_connectors(description) tool that finds matching connectors, but in”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Design search_connectors to dynamically add matched connectors to the agent&#x27;s available”</b> <i>(trong đáp án D)</i>: Thiết kế search_connectors để tự động thêm các trình kết nối phù hợp vào các công cụ có…","elim":["<b>A. Enhance all connector descriptions with detailed usage samples, edge cases, and input requirements. Add few-shot examples showing the correct search-then-use workflow.</b>: Bổ sung hướng dẫn chung có thể cải thiện phần nào nhưng không làm rõ…","<b>B. Design a find_and_execute(description, params) composite tool that searches and immediately executes the best matching connector.</b>: Bỏ qua yêu cầu chính “You design a search_connectors(description) tool that finds matching”.","<b>C. Design connectors with built-in compatibility validation that return descriptive errors for mismatched requests.</b>: Bỏ qua yêu cầu chính “You design a search_connectors(description) tool that finds matching”."]}},{"id":"t1q114","n":114,"topic":1,"type":"mcq","stem":{"en":"Your publish article tool calls an external CMS API that occasionally returns transient errors (network timeouts, 503s) and non-transient errors (403 permission denied, 422 validation failure). Currently, every error is returned directly to the agent, which leads to the agent retrying non-transient errors and wasting turns on failures that will never succeed. How should you partition error-handling responsibility between the tool implementation and the agent?"},"options":[{"k":"A","t":{"en":"Surface all errors to the agent immediately with detailed context, and let the agent decide which errors to retry and how many times-keeping the tool implementation stateless and simple."}},{"k":"B","t":{"en":"Handle transient errors (timeouts, 503s) with automatic retries inside the tool implementation, and surface non-transient errors (permission denied, validation fallures) to the agent with descriptive messages so it can take corrective action."}},{"k":"C","t":{"en":"Handle all errors inside the tool: Implement retries with exponential backoff for every error type, and only surface a failure to the agent after a fixed number of retry attempts have been exhausted."}},{"k":"D","t":{"en":"Implement a universal error handler that catches all exceptions and returns a generic &quot;tool unavailable- try again later&quot; message, shielding the agent from error complexity."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“Currently, every error is returned directly to the agent, which leads”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Handle transient errors (timeouts, 503s) with automatic retries inside the tool”</b> <i>(trong đáp án B)</i>: Xử lý các lỗi nhất thời (hết thời gian chờ, 503 giây) bằng tính năng tự động thử…","elim":["<b>A. Surface all errors to the agent immediately with detailed context, and let the agent decide which errors to retry and how many times-keeping the tool implementation stateless and simple.</b>: Retry không thể tạo ra dữ liệu còn thiếu hoặc sửa lỗi validation, permission hay…","<b>C. Handle all errors inside the tool: Implement retries with exponential backoff for every error type, and only surface a failure to the agent after a fixed number of retry attempts have been exhausted.</b>: Retry không thể tạo ra dữ liệu còn thiếu hoặc sửa lỗi validation, permission hay…","<b>D. Implement a universal error handler that catches all exceptions and returns a generic &quot;tool unavailable- try again later&quot; message, shielding the agent from error complexity.</b>: Che giấu lỗi hoặc trả kết quả rỗng làm agent không phân biệt được “không…"]}},{"id":"t1q115","n":115,"topic":1,"type":"mcq","stem":{"en":"Your scheduling agent uses get_available_slots(date, provider_id) to retrieve open appointment times, then book_appointment(provider_id, slot_time, patient_id) to reserve a slot. tickets show that 15% of booking attempts fall with &quot;slot no longer available&quot; because another user booked the slot between the availability check and the booking call. How should you refactor these tools?"},"options":[{"k":"A","t":{"en":"Combine both tools into a single find_and_book_appointment that atomically checks availability and books, returning either the confirmed booking or available alternatives."}},{"k":"B","t":{"en":"Add a hold_slot(provider_id, slot_time) tool that creates a 60 second temporary reservation, requiring the agent to call it between checking availability and booking."}},{"k":"C","t":{"en":"Modify book_appointment to return detailed failure information including currently available alternative slots when the requested slot is unavailable, enabling the agent to retry with a different time."}},{"k":"D","t":{"en":"Keep both tools but add retry logic to the agent&#x27;s system prompt, instructing it to call get_available_slots again and select a different time if booking fails."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“tickets show that 15% of booking attempts fall with &quot;slot no”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Combine both tools into a single find_and_book_appointment that atomically checks availability”</b> <i>(trong đáp án A)</i>: Kết hợp cả hai công cụ vào một find_and_book_appointment duy nhất để kiểm tra tình trạng phòng trống…","elim":["<b>B. Add a hold_slot(provider_id, slot_time) tool that creates a 60 second temporary reservation, requiring the agent to call it between checking availability and booking.</b>: Bỏ qua yêu cầu chính “tickets show that 15% of booking attempts fall”.","<b>C. Modify book_appointment to return detailed failure information including currently available alternative slots when the requested slot is unavailable, enabling the agent to retry with a different time.</b>: Retry có thể che bớt lỗi tạm thời nhưng không cung cấp cho agent loại…","<b>D. Keep both tools but add retry logic to the agent&#x27;s system prompt, instructing it to call get_available_slots again and select a different time if booking fails.</b>: Retry có thể che bớt lỗi tạm thời nhưng không cung cấp cho agent loại…"]}},{"id":"t1q116","n":116,"topic":1,"type":"mcq","stem":{"en":"Production monitoring shows your search_catalog tool fails 12% of the time: 8% are network timeouts that succeed when immediately retried, while 4% are query syntax errors from malformed user-provided filters that never succeed regardless of retry attempts. Currently, both error types are returned to the agent identically, causing it to waste turns retrying syntax errors and telling users to &quot;try again later&quot; for timeouts. How should you modify the tool&#x27;s error handling?"},"options":[{"k":"A","t":{"en":"Return all errors with a retryable boolean flag and error type details."}},{"k":"B","t":{"en":"Implement automatic retry with backoff for network timeouts inside the tool; return syntax errors immediately with parameter validation details."}},{"k":"C","t":{"en":"Apply exponential backoff retry logic to all errors uniformly, returning a generic &quot;service temporarily unavailable&quot; message after max retries are exhausted."}},{"k":"D","t":{"en":"Add few-shot examples to your system prompt demonstrating how to distinguish network errors from syntax errors and handle each case appropriately."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“Currently, both error types are returned to the agent identically, causing”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Implement automatic retry with backoff for network timeouts inside the tool;”</b> <i>(trong đáp án B)</i>: Triển khai thử lại tự động với thời gian chờ cho thời gian chờ mạng bên trong công…","elim":["<b>A. Return all errors with a retryable boolean flag and error type details.</b>: Retry không thể tạo ra dữ liệu còn thiếu hoặc sửa lỗi validation, permission hay…","<b>C. Apply exponential backoff retry logic to all errors uniformly, returning a generic &quot;service temporarily unavailable&quot; message after max retries are exhausted.</b>: Retry không thể tạo ra dữ liệu còn thiếu hoặc sửa lỗi validation, permission hay…","<b>D. Add few-shot examples to your system prompt demonstrating how to distinguish network errors from syntax errors and handle each case appropriately.</b>: Bỏ qua yêu cầu chính “Currently, both error types are returned to the”."]}},{"id":"t1q117","n":117,"topic":1,"type":"mcq","stem":{"en":"Your document extraction tool uses ML models to extract invoice fields (vendor, amount, date). The models return confidence scores (0.0-1.0) for each extracted field. In production, you observe: (1) the agent proceeds with low-confidence extractions that are incorrect 23% of the time, and (2) the agent requests unnecessary human review for 31% of extractions that were actually correct. How should you restructure the tool&#x27;s output?"},"options":[{"k":"A","t":{"en":"Return fields with confidence scores, plus a requires_review boolean computed using your tested confidence thresholds, along with a review_reasons array explaining which fields triggered review."}},{"k":"B","t":{"en":"Return fields organized into verified and needs_verification objects based on confidence thresholds."}},{"k":"C","t":{"en":"Return fields with their raw confidence scores and add detailed few-shot examples to your system prompt demonstrating how to interpret different confidence ranges and when to request human review."}},{"k":"D","t":{"en":"Compute an aggregate extraction quality score across all fields and return it alongside the extracted values. Include a text summary describing the overall extraction reliability."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“In production, you observe: (1) the agent proceeds with low-confidence extractions”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Return fields with confidence scores, plus a requires_review boolean computed using”</b> <i>(trong đáp án A)</i>: Trả về các trường có điểm tin cậy, cộng với boolean require_review được tính bằng ngưỡng tin cậy…","elim":["<b>B. Return fields organized into verified and needs_verification objects based on confidence thresholds.</b>: Bash có thể thực hiện thao tác nhưng dễ vỡ và bỏ qua contract hoặc…","<b>C. Return fields with their raw confidence scores and add detailed few-shot examples to your system prompt demonstrating how to interpret different confidence ranges and when to request human review.</b>: Bỏ qua yêu cầu chính “In production, you observe: (1) the agent proceeds”.","<b>D. Compute an aggregate extraction quality score across all fields and return it alongside the extracted values. Include a text summary describing the overall extraction reliability.</b>: Bản tóm tắt văn xuôi có thể làm mất ID, con số hoặc trạng thái…"]}},{"id":"t1q118","n":118,"topic":1,"type":"mcq","stem":{"en":"Your agent includes an update_game_score tool that accepts game_date (string), home_team (string), and away_team (string) parameters. Production logs reveal recurring issues: the agent uses team nicknames instead of official names, applies inconsistent date formats, and selects the wrong game when teams have rematches in the same season. What tool interface change would effectively prevent these errors?"},"options":[{"k":"A","t":{"en":"Add a season parameter to disambiguate rematches, and add a confirm_before_update flag that returns the resolved game details for the agent to verify before the score is committed."}},{"k":"B","t":{"en":"Add enum constraints listing valid team names for both team parameters, and add a regex pattern enforcing ISO 8601 format for the date parameter."}},{"k":"C","t":{"en":"Add detailed examples to the tool description showing the required date format and complete list of official team names."}},{"k":"D","t":{"en":"Replace the three parameters with a single game_id parameter and a separate search_games lookup tool that returns matching game IDs."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“Production logs reveal recurring issues: the agent uses team nicknames instead”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Replace the three parameters with a single game_id parameter and a”</b> <i>(trong đáp án D)</i>: Thay thế ba tham số bằng một tham số game_id và một công cụ tra cứu search_games riêng…","elim":["<b>A. Add a season parameter to disambiguate rematches, and add a confirm_before_update flag that returns the resolved game details for the agent to verify before the score is committed.</b>: Bỏ qua yêu cầu chính “Production logs reveal recurring issues: the agent uses”.","<b>B. Add enum constraints listing valid team names for both team parameters, and add a regex pattern enforcing ISO 8601 format for the date parameter.</b>: Đầu ra text tự do buộc downstream hoặc model phải parse lại, làm tăng lỗi…","<b>C. Add detailed examples to the tool description showing the required date format and complete list of official team names.</b>: Bỏ qua yêu cầu chính “Production logs reveal recurring issues: the agent uses”."]}},{"id":"t1q119","n":119,"topic":1,"type":"mcq","stem":{"en":"You&#x27;ve configured the system so that all four subagents have access to the complete set of 18 tools. During testing, agents frequently call tools outside their specialization—the synthesis agent attempts web searches, and the report generator tries to analyze documents. What is the primary cause of this poor tool selection behavior?"},"options":[{"k":"A","t":{"en":"The coordinator cannot track which capabilities each subagent has, leading to misrouted tasks."}},{"k":"B","t":{"en":"The agents&#x27; role descriptions in their system prompts conflict with having access to tools outside that role."}},{"k":"C","t":{"en":"Choosing from 18 tools instead of 4-5 relevant ones increases decision complexity beyond reliable selection thresholds."}},{"k":"D","t":{"en":"The tool definitions consume too much context window space, leaving insufficient room for task content."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“During testing, agents frequently call tools outside their specialization—the synthesis agent”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Choosing from 18 tools instead of 4-5 relevant ones increases decision”</b> <i>(trong đáp án C)</i>: Chọn từ 18 công cụ thay vì 4-5 công cụ phù hợp sẽ làm tăng độ phức tạp…","elim":["<b>A. The coordinator cannot track which capabilities each subagent has, leading to misrouted tasks.</b>: Bỏ qua yêu cầu chính “During testing, agents frequently call tools outside their”.","<b>B. The agents&#x27; role descriptions in their system prompts conflict with having access to tools outside that role.</b>: Bổ sung hướng dẫn chung có thể cải thiện phần nào nhưng không làm rõ…","<b>D. The tool definitions consume too much context window space, leaving insufficient room for task content.</b>: Bỏ qua yêu cầu chính “During testing, agents frequently call tools outside their”."]}},{"id":"t1q120","n":120,"topic":1,"type":"mcq","stem":{"en":"You&#x27;ve documented API error handling conventions in a CLAUDE.md file at your project root, specifying that endpoint handlers should use a custom ApiError class. After several sessions, you notice Claude Code sometimes follows these conventions and sometimes uses generic try/catch blocks with string messages. The inconsistency appears random across different coding sessions. What&#x27;s the most efficient first diagnostic step?"},"options":[{"k":"A","t":{"en":"Run /memory to check which memory files are loaded and verify your CLAUDE.md is included."}},{"k":"B","t":{"en":"Create path-specific rules in claude/rules/handlers.md with YAML frontmatter scoping the error handling instructions to your API handler files."}},{"k":"C","t":{"en":"Add more detailed code examples to your CLAUDE.md showing the exact ApiError usage pattern for different endpoint types."}},{"k":"D","t":{"en":"Search for conflicting instructions in ~/.claude/CLAUDE.md or ~/.claude/rules/ that might override your project conventions."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“After several sessions, you notice Claude Code sometimes follows these conventions”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Run /memory to check which memory files are loaded and verify”</b> <i>(trong đáp án A)</i>: Chạy /memory để kiểm tra xem tệp bộ nhớ nào đã được tải và xác minh CLAUDE.md của…","elim":["<b>B. Create path-specific rules in claude/rules/handlers.md with YAML frontmatter scoping the error handling instructions to your API handler files.</b>: Bỏ qua yêu cầu chính “After several sessions, you notice Claude Code sometimes”.","<b>C. Add more detailed code examples to your CLAUDE.md showing the exact ApiError usage pattern for different endpoint types.</b>: Bỏ qua yêu cầu chính “After several sessions, you notice Claude Code sometimes”.","<b>D. Search for conflicting instructions in ~/.claude/CLAUDE.md or ~/.claude/rules/ that might override your project conventions.</b>: Bỏ qua yêu cầu chính “After several sessions, you notice Claude Code sometimes”."]}},{"id":"t1q121","n":121,"topic":1,"type":"mcq","stem":{"en":"Your CI pipeline performs security-focused code reviews on approximately 50 PRs daily, currently costing $150/day using the synchronous API. Reviews are non-blocking—developers merge after tests pass and address findings in follow-up commits. You&#x27;re evaluating the Message Batches API for its 50% cost reduction. What factor most determines whether batch processing is appropriate for this use case?"},"options":[{"k":"A","t":{"en":"Whether you can structure each review as a single request without multi-turn refinement."}},{"k":"B","t":{"en":"Whether your result processing can handle reviews arriving in a different order than submitted."}},{"k":"C","t":{"en":"Whether reducing per-review latency from 30-60 seconds to near-instant matters for your workflow."}},{"k":"D","t":{"en":"Whether review feedback arriving up to 24 hours after PR creation remains actionable."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“Your CI pipeline performs security-focused code reviews on approximately 50 PRs”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Whether review feedback arriving up to 24 hours after PR creation”</b> <i>(trong đáp án D)</i>: API Lô tin nhắn không đồng bộ — hầu hết các lô kết thúc trong vòng 1 giờ…","elim":["<b>A. Whether you can structure each review as a single request without multi-turn refinement.</b>: Bỏ qua yêu cầu chính “Your CI pipeline performs security-focused code reviews on”.","<b>B. Whether your result processing can handle reviews arriving in a different order than submitted.</b>: Bỏ qua yêu cầu chính “Your CI pipeline performs security-focused code reviews on”.","<b>C. Whether reducing per-review latency from 30-60 seconds to near-instant matters for your workflow.</b>: Bỏ qua yêu cầu chính “Your CI pipeline performs security-focused code reviews on”."]}},{"id":"t1q122","n":122,"topic":1,"type":"mcq","stem":{"en":"After a 40-minute session helping plan a dinner party, the conversation has grown to 78,000 tokens. The history includes: (1) the user mentioning a guest has a severe shellfish allergy, (2) measurements for scaling recipes to 8 servings, (3) the user&#x27;s clarification that &quot;room temperature butter&quot; means 68°F in their kitchen, and (4) general back-and-forth about meal timing and presentation. You need to implement context management before the window limit is reached. What approach best balances information preservation with token reduction?"},"options":[{"k":"A","t":{"en":"Store the full conversation externally and use semantic search to retrieve relevant portions for each turn, loading only matching segments into context."}},{"k":"B","t":{"en":"Implement a sliding window retaining only the most recent 20,000 tokens relying on users to re-state important information when relevant."}},{"k":"C","t":{"en":"Summarize the entire conversation history into a concise summary capturing main topics discussed, then append new messages going forward."}},{"k":"D","t":{"en":"Extract critical structured data (allergies, serving counts, user-defined terms) into a compact reference section, summarize general discussion, and retain recent exchanges verbatim."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“You need to implement context management before the window limit is”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Extract critical structured data (allergies, serving counts, user-defined terms) into a”</b> <i>(trong đáp án D)</i>: Trích xuất dữ liệu có cấu trúc quan trọng (dị ứng, số lượng khẩu phần, thuật ngữ do…","elim":["<b>A. Store the full conversation externally and use semantic search to retrieve relevant portions for each turn, loading only matching segments into context.</b>: Retrieval có thể hữu ích ở quy mô lớn nhưng bổ sung hạ tầng và…","<b>B. Implement a sliding window retaining only the most recent 20,000 tokens relying on users to re-state important information when relevant.</b>: Sliding window chỉ giữ các turn gần nhất và có thể loại bỏ đúng dữ…","<b>C. Summarize the entire conversation history into a concise summary capturing main topics discussed, then append new messages going forward.</b>: Bash có thể thực hiện thao tác nhưng dễ vỡ và bỏ qua contract hoặc…"]}},{"id":"t1q123","n":123,"topic":1,"type":"mcq","stem":{"en":"Your resource allocation tool returns a simple acknowledgment message after provisioning is requested. Users frequently approve allocations and immediately ask &quot;how much did that cost?&quot; or &quot;which project was that?&quot; - indicating they confirmed without understanding the request. What tool design change would most effectively address this?"},"options":[{"k":"A","t":{"en":"Return structured data including cost estimate, target project, resource specifications, and impact summary in the tool response"}},{"k":"B","t":{"en":"Implement a 60-second hold before execution completes, allowing users time to review pending allocations and cancel if needed"}},{"k":"C","t":{"en":"Add a user_acknowledged: boolean parameter that must be set true, with instructions for the agent to only set it after the user explicitly confirms they reviewed the details"}},{"k":"D","t":{"en":"Add a detail_level parameter with options &quot;minimal&quot; or &quot;comprehensive&quot; that controls how much context the agent presents in confirmations"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“Users frequently approve allocations and immediately ask &quot;how much did that”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Return structured data including cost estimate, target project, resource specifications, and”</b> <i>(trong đáp án A)</i>: Trả về dữ liệu có cấu trúc bao gồm ước tính chi phí, dự án mục tiêu, thông…","elim":["<b>B. Implement a 60-second hold before execution completes, allowing users time to review pending allocations and cancel if needed</b>: Bỏ qua yêu cầu chính “Users frequently approve allocations and immediately ask &quot;how”.","<b>C. Add a user_acknowledged: boolean parameter that must be set true, with instructions for the agent to only set it after the user explicitly confirms they reviewed the details</b>: Bỏ qua yêu cầu chính “Users frequently approve allocations and immediately ask &quot;how”.","<b>D. Add a detail_level parameter with options &quot;minimal&quot; or &quot;comprehensive&quot; that controls how much context the agent presents in confirmations</b>: Bỏ qua yêu cầu chính “Users frequently approve allocations and immediately ask &quot;how”."]}},{"id":"t1q124","n":124,"topic":1,"type":"mcq","stem":{"en":"Your search products tool queries an external catalog API that returns paginated results (50 items per request). Production logs show queries frequently match 200+ products, and the design that auto-fetches all pages causes 15-20 second delays. How should you redesign the pagination handling?"},"options":[{"k":"A","t":{"en":"Return the first page with total match count and cursor for additional pages."}},{"k":"B","t":{"en":"Implement server-side relevance ranking and return only the top 50 most relevant items."}},{"k":"C","t":{"en":"Create separate search products and fetch more results tools for pagination."}},{"k":"D","t":{"en":"Add a max pages parameter (default: 2) that controls how many pages are fetched internally."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“Production logs show queries frequently match 200+ products, and the design”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Return the first page with total match count and cursor for”</b> <i>(trong đáp án A)</i>: Trả về trang đầu tiên với tổng số kết quả trùng khớp và con trỏ cho các trang…","elim":["<b>B. Implement server-side relevance ranking and return only the top 50 most relevant items.</b>: Bỏ qua yêu cầu chính “Production logs show queries frequently match 200+ products,”.","<b>C. Create separate search products and fetch more results tools for pagination.</b>: Bỏ qua yêu cầu chính “Production logs show queries frequently match 200+ products,”.","<b>D. Add a max pages parameter (default: 2) that controls how many pages are fetched internally.</b>: Bỏ qua yêu cầu chính “Production logs show queries frequently match 200+ products,”."]}},{"id":"t1q125","n":125,"topic":1,"type":"mcq","stem":{"en":"Your MCP server implements a check_availability tool that queries an external calendar API. During testing, you encounter three error conditions: (1) the tool is called with a malformed request, missing the required user_email parameter (2) the calendar API returns a 404 because the specified user doesn&#x27;t exist in the calendar system (3) the calendar API returns a 503 because the service is temporarily unavailable. How should each error be reported according to MCP&#x27;s error handling design?"},"options":[{"k":"A","t":{"en":"Report error 1 as a JSON-RPC protocol error, report errors 2 and 3 as tool results with isError: true"}},{"k":"B","t":{"en":"Report errors 1 and 2 as JSON-RPC protocol errors, report error 3 as a tool result with isError: true"}},{"k":"C","t":{"en":"Report all three as tool results with isError: true"}},{"k":"D","t":{"en":"Report all three as JSON-RPC protocol errors."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“During testing, you encounter three error conditions: (1) the tool is”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Report error 1 as a JSON-RPC protocol error, report errors 2”</b> <i>(trong đáp án A)</i>: Báo cáo lỗi 1 là lỗi giao thức JSON-RPC, báo cáo lỗi 2 và 3 dưới dạng kết…","elim":["<b>B. Report errors 1 and 2 as JSON-RPC protocol errors, report error 3 as a tool result with isError: true</b>: Bỏ qua yêu cầu chính “During testing, you encounter three error conditions: (1)”.","<b>C. Report all three as tool results with isError: true</b>: Bỏ qua yêu cầu chính “During testing, you encounter three error conditions: (1)”.","<b>D. Report all three as JSON-RPC protocol errors.</b>: Bỏ qua yêu cầu chính “During testing, you encounter three error conditions: (1)”."]}},{"id":"t1q126","n":126,"topic":1,"type":"mcq","stem":{"en":"Your system has been running for 3 weeks and human reviewers have corrected 847 extractions. Analysis reveals a recurring pattern: when recipes use informal measurements like &quot;a handful&quot; or &quot;a splash,&quot; the model either invents specific amounts or leaves fields empty—accounting for 23% of all corrections. How should you use this feedback to improve extraction accuracy?"},"options":[{"k":"A","t":{"en":"Add few-shot examples to your prompt demonstrating correct handling of informal measurements— extracting them verbatim rather than converting or omitting them."}},{"k":"B","t":{"en":"Fine-tune the model on the 847 corrected extractions."}},{"k":"C","t":{"en":"Implement a post-processing layer that uses pattern matching to detect informal measurement phrases in source text and automatically populate values when the extraction is empty."}},{"k":"D","t":{"en":"Update your JSON schema to add a &quot;measurement_type&quot; enum field (precise/informal)."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“Analysis reveals a recurring pattern: when recipes use informal measurements like”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Add few-shot examples to your prompt demonstrating correct handling of informal”</b> <i>(trong đáp án A)</i>: Thêm một vài ví dụ ngắn gọn vào lời nhắc của bạn để thể hiện cách xử lý…","elim":["<b>B. Fine-tune the model on the 847 corrected extractions.</b>: Bỏ qua yêu cầu chính “Analysis reveals a recurring pattern: when recipes use”.","<b>C. Implement a post-processing layer that uses pattern matching to detect informal measurement phrases in source text and automatically populate values when the extraction is empty.</b>: Bỏ qua yêu cầu chính “Analysis reveals a recurring pattern: when recipes use”.","<b>D. Update your JSON schema to add a &quot;measurement_type&quot; enum field (precise/informal).</b>: Bỏ qua yêu cầu chính “Analysis reveals a recurring pattern: when recipes use”."]}},{"id":"t1q127","n":127,"topic":1,"type":"mcq","stem":{"en":"&quot;You&#x27;re the Lead Data Scientist/Engineer on a critical project. Something is not completely right with technical details or the data, and it negative impacts expected outputs. They need to independently develop both approaches to evaluation data... How do you manage this scenario?&quot;"},"options":[{"k":"A","t":{"en":"Export the analysis session&#x27;s key findings to a file, then create two new sessions that reference this file."}},{"k":"B","t":{"en":"Continue in the original session, developing end-to-end tests first, then snapshot tests sequentially."}},{"k":"C","t":{"en":"Resume the analysis session with fork_session enabled, creating a separate branch for each testing strategy."}},{"k":"D","t":{"en":"Start two fresh sessions, having each re-read the relevant source files before beginning."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“They need to independently develop both approaches to evaluation data...”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Resume the analysis session with fork_session enabled, creating a separate branch”</b> <i>(trong đáp án C)</i>: Tiếp tục phiên phân tích khi bật fork_session, tạo một nhánh riêng cho từng chiến lược thử nghiệm.","elim":["<b>A. Export the analysis session&#x27;s key findings to a file, then create two new sessions that reference this file.</b>: Bỏ qua yêu cầu chính “They need to independently develop both approaches to”.","<b>B. Continue in the original session, developing end-to-end tests first, then snapshot tests sequentially.</b>: Bỏ qua yêu cầu chính “They need to independently develop both approaches to”.","<b>D. Start two fresh sessions, having each re-read the relevant source files before beginning.</b>: Bỏ qua yêu cầu chính “They need to independently develop both approaches to”."]}},{"id":"t1q128","n":128,"topic":1,"type":"mcq","stem":{"en":"Your automated reviewer uses a single prompt covering security issues, API design, and business logic correctness. Your evaluation suite shows strong recall findings (82%) but poor recall for business logic edge cases in quiz scoring (34%). When you add few-shot examples of logic bugs to the prompt, logic recall is 41% but API design recall drops to 68%. How should you address this trade-off to improve detection across both categories?"},"options":[{"k":"A","t":{"en":"Replace the few-shot examples with a detailed checklist of specific logic edge cases to verify, such as division-by-zero in score calculation or grading thresholds."}},{"k":"B","t":{"en":"Split the review into separate focused prompts - one for security and API design, another for business logic - each with dedicated examples, then combine findings before posting."}},{"k":"C","t":{"en":"Provide the full repository as context instead of just the changed files and surrounding code, giving the model deeper visibility into business logic."}},{"k":"D","t":{"en":"Upgrade to a more capable model tier, since its stronger reasoning will handle both concern types in a single prompt and eliminate the recall trade-off."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“Your evaluation suite shows strong recall findings (82%) but poor recall”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Split the review into separate focused prompts - one for security”</b> <i>(trong đáp án B)</i>: Chia bài đánh giá thành các lời nhắc tập trung riêng biệt - một lời nhắc dành cho…","elim":["<b>A. Replace the few-shot examples with a detailed checklist of specific logic edge cases to verify, such as division-by-zero in score calculation or grading thresholds.</b>: Bỏ qua yêu cầu chính “Your evaluation suite shows strong recall findings (82%)”.","<b>C. Provide the full repository as context instead of just the changed files and surrounding code, giving the model deeper visibility into business logic.</b>: Bỏ qua yêu cầu chính “Your evaluation suite shows strong recall findings (82%)”.","<b>D. Upgrade to a more capable model tier, since its stronger reasoning will handle both concern types in a single prompt and eliminate the recall trade-off.</b>: Đổi model có thể cải thiện chất lượng chung nhưng không xử lý nguyên nhân…"]}},{"id":"t1q129","n":129,"topic":1,"type":"mcq","stem":{"en":"Your code review assistant needs to analyze pull requests and provide feedback on three aspects: code style compliance, potential security issues, and documentation completeness. Each aspect requires reading files, running analysis tools, and generating a report section. The review process follows the same three-step workflow for every PR. Which task decomposition pattern is most appropriate for this workflow?"},"options":[{"k":"A","t":{"en":"Prompt chaining—break the review into sequential steps where each aspect (style, security, documentation) is analyzed separately, with outputs combined in a final synthesis step."}},{"k":"B","t":{"en":"Single comprehensive prompt—include all instructions in one prompt and let the model handle all three aspects simultaneously."}},{"k":"C","t":{"en":"Orchestrator-workers—have a central LLM analyze each PR to dynamically determine which checks are needed, then delegate to specialized worker LLMs for each identified subtask."}},{"k":"D","t":{"en":"Routing—classify each PR by type (feature, bugfix, refactor) first, then route to different review prompts optimized for that category."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“Each aspect requires reading files, running analysis tools, and generating a”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Prompt chaining—break the review into sequential steps where each aspect (style,”</b> <i>(trong đáp án A)</i>: Quy trình review luôn gồm ba bước cố định—style, security và documentation—nên prompt chaining là mẫu phù hợp…","elim":["<b>B. Single comprehensive prompt—include all instructions in one prompt and let the model handle all three aspects simultaneously.</b>: Bỏ qua yêu cầu chính “Each aspect requires reading files, running analysis tools,”.","<b>C. Orchestrator-workers—have a central LLM analyze each PR to dynamically determine which checks are needed, then delegate to specialized worker LLMs for each identified subtask.</b>: Bỏ qua yêu cầu chính “Each aspect requires reading files, running analysis tools,”.","<b>D. Routing—classify each PR by type (feature, bugfix, refactor) first, then route to different review prompts optimized for that category.</b>: Bỏ qua yêu cầu chính “Each aspect requires reading files, running analysis tools,”."]}},{"id":"t1q130","n":130,"topic":1,"type":"mcq","stem":{"en":"After the web search and document analysis subagents complete their tasks, the coordinator needs to spawn the synthesis subagent to synthesize the findings. What is the correct approach for providing the synthesis subagent with the information it needs?"},"options":[{"k":"A","t":{"en":"Provide the subagent with tool definitions that allow it to request outputs from other subagents via callbacks"}},{"k":"B","t":{"en":"Pass reference identifiers and configure the subagent with read access to a shared memory store where other subagents deposited their results"}},{"k":"C","t":{"en":"Include the complete findings from both subagents directly in the synthesis subagent&#x27;s prompt"}},{"k":"D","t":{"en":"Spawn the subagent with only a brief task description, relying on automatic context inheritance from the coordinator"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“spawn the synthesis subagent”</b> <i>(trong câu hỏi)</i>: Một subagent mới chạy trong context riêng và không tự nhìn thấy nội dung coordinator đã nhận từ…<br><b>“providing the synthesis subagent with the information it needs”</b> <i>(trong câu hỏi)</i>: Coordinator phải chủ động chuyển findings liên quan trong task prompt.","elim":["<b>A. ...request outputs from other subagents via callbacks.</b>: Subagent không mặc nhiên có callback để truy cập conversation history của subagent khác.","<b>B. ...shared memory store...</b>: Đây có thể là một thiết kế hợp lệ nếu hệ thống đã chủ động…","<b>D. ...automatic context inheritance...</b>: Subagent không tự kế thừa toàn bộ context của coordinator, nên brief task description sẽ…"]}},{"id":"t1q131","n":131,"topic":1,"type":"mcq","stem":{"en":"Developer Productivity An engineer asks the agent to find all files in the monorepo that import the @company/auth package to understand how authentication is used across services. Which built-in tool is most appropriate for this task?"},"options":[{"k":"A","t":{"en":"Bash, to execute find . -type d -name &quot;<i>auth</i>&quot; and explore matching directories"}},{"k":"B","t":{"en":"Grep, to search for the import statement pattern across file contents"}},{"k":"C","t":{"en":"Read, starting with package.json files to trace dependency declarations"}},{"k":"D","t":{"en":"Glob, to find files with &quot;auth&quot; in their filename or path"}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“Developer Productivity An engineer asks the agent to find all files”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Grep, to search for the import statement pattern across file contents”</b> <i>(trong đáp án B)</i>: Yêu cầu là tìm các file có <b>nội dung</b> chứa import <code>@company/auth</code>, nên Grep là công cụ phù…","elim":["<b>A. Bash, to execute find . -type d -name &quot;<i>auth</i>&quot; and explore matching directories</b>: Bash có thể thực hiện thao tác nhưng dễ vỡ và bỏ qua contract hoặc…","<b>C. Read, starting with package.json files to trace dependency declarations</b>: Bỏ qua yêu cầu chính “Developer Productivity An engineer asks the agent to”.","<b>D. Glob, to find files with &quot;auth&quot; in their filename or path</b>: Glob chủ yếu khớp tên hoặc đường dẫn tệp; nó không phải công cụ phù…"]}},{"id":"t1q132","n":132,"topic":1,"type":"mcq","stem":{"en":"Your MCP server includes archive_file(file_id) and delete_file(file_id) tools. Production logs show the agent calls delete_file when users ask to &quot;remove old backups,&quot; policy requires archiving backup files. Both tools currently have minimal descriptions: &quot;Archives a file&quot; and &quot;Deletes a file.&quot; Which change most directly improves tool selection?"},"options":[{"k":"A","t":{"en":"Implement server-side validation that rejects delete_file calls for files tagged as backups, returning an error message suggesting archive_file."}},{"k":"B","t":{"en":"Add few-shot examples to the system prompt demonstrating that requests involving &quot;backup&quot; or &quot;old&quot; should use archive_file."}},{"k":"C","t":{"en":"Expand tool descriptions to clarify use cases, adding guidance like &quot;Do not use for backup files&quot; to delete_file."}},{"k":"D","t":{"en":"Add a confirmation step that requires users to type &quot;CONFIRM DELETE&quot; before delete_file executes."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“Both tools currently have minimal descriptions: &quot;Archives a file&quot; and &quot;Deletes”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Expand tool descriptions to clarify use cases, adding guidance like &quot;Do”</b> <i>(trong đáp án C)</i>: Mở rộng mô tả công cụ để làm rõ các trường hợp sử dụng, thêm hướng dẫn như…","elim":["<b>A. Implement server-side validation that rejects delete_file calls for files tagged as backups, returning an error message suggesting archive_file.</b>: Bỏ qua yêu cầu chính “Both tools currently have minimal descriptions: &quot;Archives a”.","<b>B. Add few-shot examples to the system prompt demonstrating that requests involving &quot;backup&quot; or &quot;old&quot; should use archive_file.</b>: Bổ sung hướng dẫn chung có thể cải thiện phần nào nhưng không làm rõ…","<b>D. Add a confirmation step that requires users to type &quot;CONFIRM DELETE&quot; before delete_file executes.</b>: Bỏ qua yêu cầu chính “Both tools currently have minimal descriptions: &quot;Archives a”."]}},{"id":"t1q133","n":133,"topic":1,"type":"mcq","stem":{"en":"Your CRM agent&#x27;s delete_contact tool handles requests like &quot;delete the duplicate entry for Acme Corp.&quot; The database contains similarly named records (e.g., &quot;Acme Corp,&quot; &quot;Acme Corporation,&quot; &quot;ACME Corp Inc.&quot;), and analytics show 8% of deletions are reversed within 24 hours due to misidentified records. Users have also complained that the current multi-step confirmation flow adds too much friction to routine cleanup tasks. Which approach most effectively reduces the error rate while maintaining workflow efficiency?"},"options":[{"k":"A","t":{"en":"Require users to supply the exact record ID from the CRM Interface rather than using natural language references to contact names."}},{"k":"B","t":{"en":"Implement soft-delete with a 30-day recovery window so users can undo mistakes without slowing down the deletion workflow."}},{"k":"C","t":{"en":"Deploy automated duplicate detection that identifies and merges probable duplicates, removing the need for manual deletion requests."}},{"k":"D","t":{"en":"Present matched records with differentiating fields and require single-click confirmation of the intended target before executing deletion."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“Users have also complained that the current multi-step confirmation flow adds”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Present matched records with differentiating fields and require single-click confirmation of”</b> <i>(trong đáp án D)</i>: Trình bày các bản ghi trùng khớp với các trường khác nhau và yêu cầu xác nhận mục…","elim":["<b>A. Require users to supply the exact record ID from the CRM Interface rather than using natural language references to contact names.</b>: Bỏ qua yêu cầu chính “Users have also complained that the current multi-step”.","<b>B. Implement soft-delete with a 30-day recovery window so users can undo mistakes without slowing down the deletion workflow.</b>: Bỏ qua yêu cầu chính “Users have also complained that the current multi-step”.","<b>C. Deploy automated duplicate detection that identifies and merges probable duplicates, removing the need for manual deletion requests.</b>: Bỏ qua yêu cầu chính “Users have also complained that the current multi-step”."]}},{"id":"t1q134","n":134,"topic":1,"type":"mcq","stem":{"en":"Your team is extracting structured data from 50,000 legacy legal contracts under a two-week deadline. Initial testing with 500 sample documents shows 82% pass JSON schema first attempt, while the remaining 18% fall due to diverse issues—missing required fields, malformed dates, and incorrectly identified parties. Documents that fail typically need refinements targeting their specific failure modes. What&#x27;s the most effective processing strategy?"},"options":[{"k":"A","t":{"en":"Use the real-time API for all 50,000 documents since the batch API&#x27;s 24-hour processing window creates unacceptable deadline risk."}},{"k":"B","t":{"en":"Submit all 50,000 documents via batch API, then submit failed extractions in successive batches— refining prompts between each batch—until all documents pass validation."}},{"k":"C","t":{"en":"Split documents into 10 sequential batches of 5,000 each, analysing results and refining prompts between batches to improve extraction quality progressively."}},{"k":"D","t":{"en":"Process 2,000 sample documents via real time API to identify failure patterns and refine prompts, then batch process all 50,000 with the optimized prompts."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“50,000 legacy legal contracts”</b> <i>(trong câu hỏi)</i>: Khối lượng lớn phù hợp với batch processing sau khi request shape và prompt đã được kiểm chứng.<br><b>“18% ... diverse issues”</b> <i>(trong câu hỏi)</i>: Chạy ngay toàn bộ tập dữ liệu với prompt hiện tại có thể tạo khoảng 9,000 output cần…","elim":["<b>A. Use the real-time API for all 50,000...</b>: Bỏ qua lợi ích throughput và chi phí của batch dù deadline hai tuần vẫn…","<b>B. Submit all 50,000 documents...</b>: Gửi toàn bộ với prompt đã biết có failure rate 18% tạo lượng rework rất…","<b>C. Split documents into 10 sequential batches...</b>: Có thể cải thiện dần nhưng buộc toàn bộ tiến độ đi theo 10 vòng…"]}},{"id":"t1q135","n":135,"topic":1,"type":"mcq","stem":{"en":"After deploying an updated system prompt that improves response quality, users with multi-session conversations spanning several weeks report that the assistant now contradicts its earlier statements and has a noticeably different communication style. New users don&#x27;t experience these issues. What&#x27;s the best approach to resolve this?"},"options":[{"k":"A","t":{"en":"Regenerate summaries of existing conversations using the new prompt and replace the stored histories to align past context with current behavior."}},{"k":"B","t":{"en":"Add instructions to the new system prompt directing the assistant to maintain consistency with any prior statements in the conversation history."}},{"k":"C","t":{"en":"Add a transition message when sessions resume explaining that the assistant has been updated and behavior may differ."}},{"k":"D","t":{"en":"Version system prompts and associate each conversation with the prompt version under which it started, applying updates only to new conversations."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“After deploying an updated system prompt that improves response quality, users”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Version system prompts and associate each conversation with the prompt version”</b> <i>(trong đáp án D)</i>: sử dụng lời nhắc của hệ thống Phiên bản và liên kết từng cuộc hội thoại với phiên…","elim":["<b>A. Regenerate summaries of existing conversations using the new prompt and replace the stored histories to align past context with current behavior.</b>: Bỏ qua yêu cầu chính “After deploying an updated system prompt that improves”.","<b>B. Add instructions to the new system prompt directing the assistant to maintain consistency with any prior statements in the conversation history.</b>: Bỏ qua yêu cầu chính “After deploying an updated system prompt that improves”.","<b>C. Add a transition message when sessions resume explaining that the assistant has been updated and behavior may differ.</b>: Bỏ qua yêu cầu chính “After deploying an updated system prompt that improves”."]}},{"id":"t1q136","n":136,"topic":1,"type":"mcq","stem":{"en":"Evaluation shows 94% extraction accuracy on short meeting transcripts (&lt;30 minutes) but only 68% on longer transcripts (&gt;60 minutes) where discussions meander and key information is scattered throughout. Transcripts of both lengths fit within the model&#x27;s context window. What pattern most effectively improves accuracy on complex, lengthy documents?"},"options":[{"k":"A","t":{"en":"Add few-shot examples demonstrating correct extraction from lengthy meetings with scattered Information."}},{"k":"B","t":{"en":"Upgrade to a more capable model tier for the extraction task"}},{"k":"C","t":{"en":"Split lengthy transcripts Into chunks, extract from each chunk separately, then merge and deduplicate the results."}},{"k":"D","t":{"en":"Add a pre-extraction step where the model summarizes key discussions and conclusions before performing structured extraction."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“Transcripts of both lengths fit within the model&#x27;s context window.”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Split lengthy transcripts Into chunks, extract from each chunk separately, then”</b> <i>(trong đáp án C)</i>: Chia các bản ghi dài thành các phần, trích xuất từ mỗi phần riêng biệt, sau đó hợp…","elim":["<b>A. Add few-shot examples demonstrating correct extraction from lengthy meetings with scattered Information.</b>: Bỏ qua yêu cầu chính “Transcripts of both lengths fit within the model&#x27;s”.","<b>B. Upgrade to a more capable model tier for the extraction task</b>: Đổi model có thể cải thiện chất lượng chung nhưng không xử lý nguyên nhân…","<b>D. Add a pre-extraction step where the model summarizes key discussions and conclusions before performing structured extraction.</b>: Bỏ qua yêu cầu chính “Transcripts of both lengths fit within the model&#x27;s”."]}},{"id":"t1q137","n":137,"topic":1,"type":"mcq","stem":{"en":"You&#x27;re implementing a complex graph traversal algorithm with specific performance requirements and edge cases to handle (disconnected nodes, cycles, weighted edges). You want to structure your workflow for efficient iterative refinement with Claude. What approach will most effectively enable progressive improvement across multiple iterations?"},"options":[{"k":"A","t":{"en":"Have Claude extensively research the algorithm and create a detailed implementation plan using extended thinking, then implement the complete solution based on that plan."}},{"k":"B","t":{"en":"Write a test suite covering expected behavior, edge cases, and performance requirements before implementation. Ask Claude to write code that passes the tests, then iterate by sharing test failures with each refinement request."}},{"k":"C","t":{"en":"Provide Claude with a reference implementation from documentation, then ask it to rewrite the code to match your codebase style and add the required edge case handling, comparing outputs against the reference."}},{"k":"D","t":{"en":"Provide Claude with a detailed natural language specification of the algorithm, including all requirements and edge cases. Review each output manually and provide descriptive feedback on what behavior needs to change."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“You&#x27;re implementing a complex graph traversal algorithm with specific performance requirements”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Write a test suite covering expected behavior, edge cases, and performance”</b> <i>(trong đáp án B)</i>: Viết một bộ thử nghiệm bao gồm các hành vi dự kiến, các trường hợp khó khăn và…","elim":["<b>A. Have Claude extensively research the algorithm and create a detailed implementation plan using extended thinking, then implement the complete solution based on that plan.</b>: Bash có thể thực hiện thao tác nhưng dễ vỡ và bỏ qua contract hoặc…","<b>C. Provide Claude with a reference implementation from documentation, then ask it to rewrite the code to match your codebase style and add the required edge case handling, comparing outputs against the reference.</b>: Bỏ qua yêu cầu chính “You&#x27;re implementing a complex graph traversal algorithm with”.","<b>D. Provide Claude with a detailed natural language specification of the algorithm, including all requirements and edge cases. Review each output manually and provide descriptive feedback on what behavior needs to change.</b>: Bỏ qua yêu cầu chính “You&#x27;re implementing a complex graph traversal algorithm with”."]}},{"id":"t1q138","n":138,"topic":1,"type":"mcq","stem":{"en":"Your infrastructure-as-code repository includes Terraform modules (/terraform/), Kubernetes manifests (/kubernetes/), and CI/CD pipeline scripts (/pipelines/). Each requires different conventions, but your single root CLAUDE.md has grown to 500+ lines. When developers work on Kubernetes files, Terraform-specific rules load into context unnecessarily, consuming tokens. What is the best approach to reorganize so only relevant guidance loads when editing specific file types?"},"options":[{"k":"A","t":{"en":"Keep the root CLAUDE.md and use @path/to/import syntax to modularly include tool-specific guidance files from separate documents."}},{"k":"B","t":{"en":"Split content into subdirectory CLAUDE.md files (/terraform/CLAUDE.md, /kubernetes/CLAUDE.md), so Claude loads directory-specific guidance."}},{"k":"C","t":{"en":"Restructure the root CLAUDE.md into clearly labeled sections with headers (e.g., &quot;## Terraform Conventions&quot;), improving organization and readability."}},{"k":"D","t":{"en":"Create files in .claude/rules/ with YAML frontmatter path-scoping (e.g., paths: [&quot;terraform/**/*&quot;]), loading rules only when editing matching files."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“When developers work on Kubernetes files, Terraform-specific rules load into context”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Create files in .claude/rules/ with YAML frontmatter path-scoping (e.g., paths: [&quot;terraform/</b>/<i>&quot;]),”<b> </i>(trong đáp án D)<i>: Tạo tệp trong .claude/rules/ với phạm vi đường dẫn của YAML frontmatter (ví dụ: đường dẫn: [&quot;terraform/</b>/</i>&quot;]), chỉ…","elim":["<b>A. Keep the root CLAUDE.md and use @path/to/import syntax to modularly include tool-specific guidance files from separate documents.</b>: Bỏ qua yêu cầu chính “When developers work on Kubernetes files, Terraform-specific rules”.","<b>B. Split content into subdirectory CLAUDE.md files (/terraform/CLAUDE.md, /kubernetes/CLAUDE.md), so Claude loads directory-specific guidance.</b>: Bỏ qua yêu cầu chính “When developers work on Kubernetes files, Terraform-specific rules”.","<b>C. Restructure the root CLAUDE.md into clearly labeled sections with headers (e.g., &quot;## Terraform Conventions&quot;), improving organization and readability.</b>: Bỏ qua yêu cầu chính “When developers work on Kubernetes files, Terraform-specific rules”."]}},{"id":"t1q139","n":139,"topic":1,"type":"mcq","stem":{"en":"After expanding the agent&#x27;s MCP tools with delivery-specific capabilities (check_delivery_status, contact_driver, issue_credit, apply_promo_code, update_delivery_address, reschedule_delivery), the total tool count has grown from 4 to 10. Your evaluation suite shows tool selection accuracy has dropped to 71%. Log analysis reveals the majority of errors involve the agent selecting between semantically overlapping tools- calling issue_credit when process_refund is correct, and calling check_delivery_status when lookup_order already returns the needed data. Which approach structurally eliminates the semantic overlaps that are being logged as the error source?"},"options":[{"k":"A","t":{"en":"Split the tools across two sub-agents - a &quot;financial resolution&quot; agent with process_refund, issue_credit, and apply_promo_code, and a &quot;delivery&quot; agent with the remaining delivery tools - with a coordinator routing between them."}},{"k":"B","t":{"en":"Consolidate semantically overlapping tools-merge issue_credit and process_refund into a single resolve_compensation tool with an optional include_tracking flag."}},{"k":"C","t":{"en":"Enable the tool search tool with defer_loading on the six new tools, keeping the original four always loaded, so the agent dynamically calls it when needed."}},{"k":"D","t":{"en":"Add few-shot examples to the system prompt demonstrating correct selection for each ambiguous tool pair, such as showing when issue_credit or process_refund is appropriate."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“Log analysis reveals the majority of errors involve the agent selecting”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Consolidate semantically overlapping tools-merge issue_credit and process_refund into a single resolve_compensation”</b> <i>(trong đáp án B)</i>: Hợp nhất các công cụ chồng chéo về mặt ngữ nghĩa-hợp nhất issue_credit và process_refund vào một công…","elim":["<b>A. Split the tools across two sub-agents - a &quot;financial resolution&quot; agent with process_refund, issue_credit, and apply_promo_code, and a &quot;delivery&quot; agent with the remaining delivery tools - with a coordinator routing between them.</b>: Bỏ qua yêu cầu chính “Log analysis reveals the majority of errors involve”.","<b>C. Enable the tool search tool with defer_loading on the six new tools, keeping the original four always loaded, so the agent dynamically calls it when needed.</b>: Bỏ qua yêu cầu chính “Log analysis reveals the majority of errors involve”.","<b>D. Add few-shot examples to the system prompt demonstrating correct selection for each ambiguous tool pair, such as showing when issue_credit or process_refund is appropriate.</b>: Bổ sung hướng dẫn chung có thể cải thiện phần nào nhưng không làm rõ…"]}},{"id":"t1q140","n":140,"topic":1,"type":"mcq","stem":{"en":"After expanding the agent&#x27;s MCP tools with delivery-specific capabilities [apply_promo_code, update_delivery_address, reconcile_delivery], the total tool count has grown from 1 to 7. We have observed that the agent now shows tool selection accuracy has dropped from 86% to 71%. Log analysis reveals the majority of errors involve the agent selecting between semantically overlapping tools — calling issue_credit when process_refund was correct, and calling check_delivery_status when looking order_allready_returns_the_needed_data. Which approach structurally eliminates the semantic overlap identified in the error source?"},"options":[{"k":"A","t":{"en":"Add few-shot examples to the system prompt demonstrating correct selection for each ambiguous tool, such as showing when issue_credit applies versus when process_refund is appropriate."}},{"k":"B","t":{"en":"Enable the tool search tool with defer_loading on the six new tools, keeping the original two always loaded, so the agent dynamically discovers specialized tools only when needed."}},{"k":"C","t":{"en":"Split the tools across two sub-agents — a &#x27;financial resolution&#x27; agent with issue_credit, process_refund, return_order, and apply_promo_code and a &#x27;delivery operations&#x27; agent with the remaining delivery tools — with a coordinating routing between them."}},{"k":"D","t":{"en":"Consolidate semantically overlapping tools – merge issue_credit and process_refund into a single handle_promotions tool with an action parameter and fold check_delivery_status into lookup_order with an optional include_tracking flag."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“Log analysis reveals the majority of errors involve the agent selecting”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Consolidate semantically overlapping tools – merge issue_credit and process_refund into a”</b> <i>(trong đáp án D)</i>: Hợp nhất các công cụ chồng chéo về mặt ngữ nghĩa – hợp nhất issue_credit và process_refund vào…","elim":["<b>A. Add few-shot examples to the system prompt demonstrating correct selection for each ambiguous tool, such as showing when issue_credit applies versus when process_refund is appropriate.</b>: Bổ sung hướng dẫn chung có thể cải thiện phần nào nhưng không làm rõ…","<b>B. Enable the tool search tool with defer_loading on the six new tools, keeping the original two always loaded, so the agent dynamically discovers specialized tools only when needed.</b>: Bỏ qua yêu cầu chính “Log analysis reveals the majority of errors involve”.","<b>C. Split the tools across two sub-agents — a &#x27;financial resolution&#x27; agent with issue_credit, process_refund, return_order, and apply_promo_code and a &#x27;delivery operations&#x27; agent with the remaining delivery tools — with a coordinating routing between them.</b>: Bỏ qua yêu cầu chính “Log analysis reveals the majority of errors involve”."]}},{"id":"t1q141","n":141,"topic":1,"type":"mcq","stem":{"en":"Your order management system requires tools for three distinct operations: issuing refunds (requires amount and reason), canceling orders (requires reason), and res (requires shipping address). Each operation shares an order id parameter but has different additional requirements. You notice during testing that with your current frequently omits required parameters or includes irrelevant ones. What design change will most effectively improve parameter accuracy?"},"options":[{"k":"A","t":{"en":"Keep one unified tool with a nested operation object parameter whose internal structure varies by operation type, documented in the tool description."}},{"k":"B","t":{"en":"Split into three separate tools (each defining only the parameters required for that specific operation."}},{"k":"C","t":{"en":"Keep one unified tool but add JSON Schema if-then-else conditionals to enforce that parameters like amount are required only when the operation type is &quot;refund&quot;."}},{"k":"D","t":{"en":"Keep one unified tool with all parameters marked optional, but add few-shot examples in the system prompt showing correct parameter combinations for each operation."}}],"answer":["B"],"multi":false,"explai
