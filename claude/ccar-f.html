ter requiring explicit selection between extraction, summarization, and verification modes."}},{"k":"B","t":{"en":"Split the generic tool into purpose-specific tools– extract_data_points, summarize_content, verify_claim_against_source –each with defined input/output contracts."}},{"k":"C","t":{"en":"Have the coordinator pre-classify each analysis request before passing instructions to the document analysis agent."}},{"k":"D","t":{"en":"Enhance the tool description with detailed examples showing how different instruction phrasings should map to different output formats."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“The synthesis agent reports that 35% of analysis results require re-requests”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Split the generic tool into purpose-specific tools– extract_data_points, summarize_content, verify_claim_against_source –each”</b> <i>(trong đáp án B)</i>: Phân tích_tài liệu chung với các hướng dẫn văn bản tự do dẫn đến kết quả đầu ra…","elim":["<b>A. Keep the single tool but add an analysis_type enum parameter requiring explicit selection between extraction, summarization, and verification modes.</b>: Bỏ qua yêu cầu chính “The synthesis agent reports that 35% of analysis”.","<b>C. Have the coordinator pre-classify each analysis request before passing instructions to the document analysis agent.</b>: Bỏ qua yêu cầu chính “The synthesis agent reports that 35% of analysis”.","<b>D. Enhance the tool description with detailed examples showing how different instruction phrasings should map to different output formats.</b>: Bỏ qua yêu cầu chính “The synthesis agent reports that 35% of analysis”."]}},{"id":"t1q32","n":32,"topic":1,"type":"mcq","stem":{"en":"The coordinator agent has AgentFunctions configured for all four specialized subagents, each with appropriate descriptions and restrictions. During testing, you find the coordinator sometimes fails to delegate—it writes &quot;I&#x27;ll ask the web search agent to find sources&quot; without actually invoking it. What is the most likely cause?"},"options":[{"k":"A","t":{"en":"The AgentFunctions are configured correctly, but the coordinator&#x27;s system prompt includes a statement that prevents it from knowing the available subagent types."}},{"k":"B","t":{"en":"The coordinator&#x27;s allowed Tools configuration doesn&#x27;t include &quot;Task&quot;, so while it can describe delegation, it cannot actually invoke the tool required to spawn subagents."}},{"k":"C","t":{"en":"The coordinator&#x27;s max_tokens setting is too low, causing the Task tool invocation to be truncated before the subagent parameter can be specified."}},{"k":"D","t":{"en":"Subagent context limit descriptions from the coordinator don&#x27;t provide enough context; you need to configure explicit context content between coordinator and tool descriptions."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“During testing, you find the coordinator sometimes fails to delegate—it writes”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“The coordinator&#x27;s allowed Tools configuration doesn&#x27;t include &quot;Task&quot;, so while it”</b> <i>(trong đáp án B)</i>: Điều phối viên có thể mô tả ủy quyền (tạo văn bản), nhưng thực tế không thể gọi…","elim":["<b>A. The AgentFunctions are configured correctly, but the coordinator&#x27;s system prompt includes a statement that prevents it from knowing the available subagent types.</b>: Bỏ qua yêu cầu chính “During testing, you find the coordinator sometimes fails”.","<b>C. The coordinator&#x27;s max_tokens setting is too low, causing the Task tool invocation to be truncated before the subagent parameter can be specified.</b>: Bỏ qua yêu cầu chính “During testing, you find the coordinator sometimes fails”.","<b>D. Subagent context limit descriptions from the coordinator don&#x27;t provide enough context; you need to configure explicit context content between coordinator and tool descriptions.</b>: Bỏ qua yêu cầu chính “During testing, you find the coordinator sometimes fails”."]}},{"id":"t1q33","n":33,"topic":1,"type":"mcq","stem":{"en":"When researching &quot;renewable energy adoption,&quot; the web search agent returns recent statistics (2024: 35% adoption) while the document analysis agent extracts data from internal reports (2022: 18% adoption). The synthesis agent incorrectly flags these as contradictory sources rather than recognizing the data shows growth over time. What change would best enable the synthesis agent to correctly interpret such temporal differences?"},"options":[{"k":"A","t":{"en":"Add a conflict resolution agent that automatically discards older data when newer data exists for the same metric."}},{"k":"B","t":{"en":"Configure the web search agent to only return results from the past 6 months."}},{"k":"C","t":{"en":"Require subagents to include publication or data collection dates in their structured outputs."}},{"k":"D","t":{"en":"Instruct the synthesis agent to always treat the most recent data as authoritative and place older findings in a separate historical appendix."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“The synthesis agent incorrectly flags these as contradictory sources rather than”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Require subagents to include publication or data collection dates in their”</b> <i>(trong đáp án C)</i>: Tác nhân tổng hợp đọc sai dữ liệu vì nó không bao giờ nhìn thấy ngày tháng.","elim":["<b>A. Add a conflict resolution agent that automatically discards older data when newer data exists for the same metric.</b>: Bỏ qua yêu cầu chính “The synthesis agent incorrectly flags these as contradictory”.","<b>B. Configure the web search agent to only return results from the past 6 months.</b>: Bỏ qua yêu cầu chính “The synthesis agent incorrectly flags these as contradictory”.","<b>D. Instruct the synthesis agent to always treat the most recent data as authoritative and place older findings in a separate historical appendix.</b>: Bỏ qua yêu cầu chính “The synthesis agent incorrectly flags these as contradictory”."]}},{"id":"t1q34","n":34,"topic":1,"type":"mcq","stem":{"en":"Your multi-agent research pipeline crashed after processing 12 of 28 documents. The web search agent had identified relevant sources, the document analysis agent had partially completed extraction, and the synthesizer had begun pattern identification. You need to resume processing without repeating work or losing fidelity of prior findings. What state management approach best balances information fidelity with context efficiency when restoring agent state?"},"options":[{"k":"A","t":{"en":"Have each agent maintain its own persistent state file and reload it independently at the start of each session."}},{"k":"B","t":{"en":"Index all agent outputs in a shared vector store. When resuming, each agent queries the store using semantic search to retrieve relevant prior findings."}},{"k":"C","t":{"en":"Have each agent persist a structured report to a known location. On resume, the coordinator loads the reports and injects relevant state into agent prompts."}},{"k":"D","t":{"en":"Persist the coordinator&#x27;s conversation log containing all task delegations and responses, providing this to agents when resuming."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“You need to resume processing without repeating work or losing fidelity”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Have each agent persist a structured report to a known location.”</b> <i>(trong đáp án C)</i>: Các báo cáo có cấu trúc vẫn tồn tại ở các vị trí đã biết cho phép coordinator…","elim":["<b>A. Have each agent maintain its own persistent state file and reload it independently at the start of each session.</b>: Bỏ qua yêu cầu chính “You need to resume processing without repeating work”.","<b>B. Index all agent outputs in a shared vector store. When resuming, each agent queries the store using semantic search to retrieve relevant prior findings.</b>: Retrieval có thể hữu ích ở quy mô lớn nhưng bổ sung hạ tầng và…","<b>D. Persist the coordinator&#x27;s conversation log containing all task delegations and responses, providing this to agents when resuming.</b>: Bỏ qua yêu cầu chính “You need to resume processing without repeating work”."]}},{"id":"t1q35","n":35,"topic":1,"type":"mcq","stem":{"en":"Production reviews reveal inconsistent handling of uncertainty in final reports. Sometimes confidence calibrations are synthesized into standardized uncertainty expressions, while other times results produce vague estimates without clear methodology. Which system-level improvement best addresses this inconsistency?"},"options":[{"k":"A","t":{"en":"Implement a confidence calibration layer where synthesis agent normalizes uncertainty expressions into standardized probability representations (0.0-1.0), then weights their calibrated confidence."}},{"k":"B","t":{"en":"Instruct the synthesis agent to use explicit sections separating confirmed findings from contested analysis, preserving original source characterizations."}},{"k":"C","t":{"en":"Configure subagents to only report findings with sufficient coverage breadth, source diversity, and quality criteria before passing results to the synthesis agent."}},{"k":"D","t":{"en":"Add a verification subagent that cross-references findings across sources, only accepting synthesis corroborated by at least two independent sources."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“Sometimes confidence calibrations are synthesized into standardized uncertainty expressions, while other”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Instruct the synthesis agent to use explicit sections separating confirmed findings”</b> <i>(trong đáp án B)</i>: Cấu trúc báo cáo tách biệt rõ ràng những phát hiện đã được xác nhận với những phát…","elim":["<b>A. Implement a confidence calibration layer where synthesis agent normalizes uncertainty expressions into standardized probability representations (0.0-1.0), then weights their calibrated confidence.</b>: Bỏ qua yêu cầu chính “Sometimes confidence calibrations are synthesized into standardized uncertainty”.","<b>C. Configure subagents to only report findings with sufficient coverage breadth, source diversity, and quality criteria before passing results to the synthesis agent.</b>: Bỏ qua yêu cầu chính “Sometimes confidence calibrations are synthesized into standardized uncertainty”.","<b>D. Add a verification subagent that cross-references findings across sources, only accepting synthesis corroborated by at least two independent sources.</b>: Bỏ qua yêu cầu chính “Sometimes confidence calibrations are synthesized into standardized uncertainty”."]}},{"id":"t1q36","n":36,"topic":1,"type":"mcq","stem":{"en":"The coordinator provides detailed step-by-step instructions to the web search subagent, specifying exact search queries, source quality criteria (coverage breadth, source diversity), and content type classifications. The coordinator sometimes encounters challenges where instructions fail when the subagent encounters unexpected situations. What&#x27;s the most effective way to improve subagent adaptability?"},"options":[{"k":"A","t":{"en":"Remove procedural detail entirely, delegating with simple goals like &quot;research it thoroughly&quot; and relying on the subagent&#x27;s general capabilities."}},{"k":"B","t":{"en":"Specify research goals and quality criteria (coverage breadth, source diversity, content type) rather than procedural instructions, letting the subagent determine execution."}},{"k":"C","t":{"en":"Add explicit fallback directives to the detailed instructions: &quot;if specified searches fail, attempt alternative queries before reporting failure.&quot;"}},{"k":"D","t":{"en":"Implement a task classification step where the coordinator categorizes requests as &quot;analytical&quot; vs &quot;exploratory&quot; and uses different instruction sets for each category."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“The coordinator sometimes encounters challenges where instructions fail when the subagent”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Specify research goals and quality criteria (coverage breadth, source diversity, content”</b> <i>(trong đáp án B)</i>: Hướng dẫn từng bước quá cứng nhắc, khiến subagent không thể thích ứng khi gặp phải tình huống…","elim":["<b>A. Remove procedural detail entirely, delegating with simple goals like &quot;research it thoroughly&quot; and relying on the subagent&#x27;s general capabilities.</b>: Bỏ qua yêu cầu chính “The coordinator sometimes encounters challenges where instructions fail”.","<b>C. Add explicit fallback directives to the detailed instructions: &quot;if specified searches fail, attempt alternative queries before reporting failure.&quot;</b>: Bỏ qua yêu cầu chính “The coordinator sometimes encounters challenges where instructions fail”.","<b>D. Implement a task classification step where the coordinator categorizes requests as &quot;analytical&quot; vs &quot;exploratory&quot; and uses different instruction sets for each category.</b>: Bỏ qua yêu cầu chính “The coordinator sometimes encounters challenges where instructions fail”."]}},{"id":"t1q37","n":37,"topic":1,"type":"mcq","stem":{"en":"A user is expanding the research system beyond its single web search agent by adding specialized data sources. They add a financial API agent that returns structured JSON with revenue, margins, and growth rates; a news monitoring agent that returns prose summaries of recent developments; and a patent analysis agent that returns structured lists of technology areas. The synthesis agent combines these into executive briefings. Currently, it converts everything to bullet points, causing financial comparisons to lose tabular clarity and news summaries to lose narrative flow. What change would most improve briefing quality?"},"options":[{"k":"A","t":{"en":"Standardize all subagent outputs to prose summaries with inline citations."}},{"k":"B","t":{"en":"Add a format conversion layer between subagents and synthesis that transforms all outputs to a common intermediate representation."}},{"k":"C","t":{"en":"Update the synthesis agent to render each content type appropriately–financial data as tables, news as prose."}},{"k":"D","t":{"en":"Standardize all subagent outputs to JSON with fields for claim, evidence, source, and confidence."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“Currently, it converts everything to bullet points, causing financial comparisons to”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Update the synthesis agent to render each content type appropriately–financial data”</b> <i>(trong đáp án C)</i>: Vấn đề là agent tổng hợp chuyển đổi mọi thứ thành dấu đầu dòng.","elim":["<b>A. Standardize all subagent outputs to prose summaries with inline citations.</b>: Bỏ qua yêu cầu chính “Currently, it converts everything to bullet points, causing”.","<b>B. Add a format conversion layer between subagents and synthesis that transforms all outputs to a common intermediate representation.</b>: Bỏ qua yêu cầu chính “Currently, it converts everything to bullet points, causing”.","<b>D. Standardize all subagent outputs to JSON with fields for claim, evidence, source, and confidence.</b>: Bỏ qua yêu cầu chính “Currently, it converts everything to bullet points, causing”."]}},{"id":"t1q38","n":38,"topic":1,"type":"mcq","stem":{"en":"The web search agent has gathered several relevant sources for a research topic. The document analysis agent now needs to examine these sources. How does information typically flow between these two specialized subagents?"},"options":[{"k":"A","t":{"en":"The coordinator agent receives the web search agent&#x27;s output and includes relevant findings in the prompt when invoking the document analysis agent."}},{"k":"B","t":{"en":"Both agents access a shared memory store where the web search agent writes findings and the document analysis agent reads them."}},{"k":"C","t":{"en":"The web search agent directly invokes the document analysis agent, passing the discovered sources as parameters."}},{"k":"D","t":{"en":"The agents communicate through an event-driven message queue, with the document analysis agent subscribing to web search completion events."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“The document analysis agent now needs to examine these sources.”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“The coordinator agent receives the web search agent&#x27;s output and includes”</b> <i>(trong đáp án A)</i>: Trong kiến trúc đa agent có coordinator, thông tin sẽ chảy qua coordinator: agent tìm kiếm trên web…","elim":["<b>B. Both agents access a shared memory store where the web search agent writes findings and the document analysis agent reads them.</b>: Bỏ qua yêu cầu chính “The document analysis agent now needs to examine”.","<b>C. The web search agent directly invokes the document analysis agent, passing the discovered sources as parameters.</b>: Bỏ qua yêu cầu chính “The document analysis agent now needs to examine”.","<b>D. The agents communicate through an event-driven message queue, with the document analysis agent subscribing to web search completion events.</b>: Bỏ qua yêu cầu chính “The document analysis agent now needs to examine”."]}},{"id":"t1q39","n":39,"topic":1,"type":"mcq","stem":{"en":"After the web search agent and document analysis agent complete their tasks, the coordinator invokes the synthesis agent. However, the synthesis agent responds that it cannot complete the task because no research findings were provided. What is the most likely cause of this issue?"},"options":[{"k":"A","t":{"en":"The synthesis agent needs tools that can fetch results directly from the other agents&#x27; conversation histories."}},{"k":"B","t":{"en":"The subagents need to share a single API connection to enable automatic context sharing between invocations."}},{"k":"C","t":{"en":"The coordinator did not include the outputs from the previous agents in the synthesis agent&#x27;s prompt."}},{"k":"D","t":{"en":"The synthesis agent&#x27;s context window is not large enough to hold the combined outputs from both previous agents."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“However, the synthesis agent responds that it cannot complete the task”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“The coordinator did not include the outputs from the previous agents”</b> <i>(trong đáp án C)</i>: Các subagent không tự động chia sẻ ngữ cảnh.","elim":["<b>A. The synthesis agent needs tools that can fetch results directly from the other agents&#x27; conversation histories.</b>: Bỏ qua yêu cầu chính “However, the synthesis agent responds that it cannot”.","<b>B. The subagents need to share a single API connection to enable automatic context sharing between invocations.</b>: Bỏ qua yêu cầu chính “However, the synthesis agent responds that it cannot”.","<b>D. The synthesis agent&#x27;s context window is not large enough to hold the combined outputs from both previous agents.</b>: Bỏ qua yêu cầu chính “However, the synthesis agent responds that it cannot”."]}},{"id":"t1q40","n":40,"topic":1,"type":"mcq","stem":{"en":"In production, final reports frequently contain claims without proper source attribution. Investigation shows that while the web search and document analysis agents correctly attach citations to their outputs, the synthesis agent loses track of which sources support which conclusions when combining findings. What&#x27;s the most effective architectural change?"},"options":[{"k":"A","t":{"en":"Require all subagents to output structured claim-source mappings that the synthesis agent must preserve and merge when combining findings from multiple sources."}},{"k":"B","t":{"en":"Add a verification step where the report generator uses semantic similarity matching against original sources to reconstruct which claims came from which documents."}},{"k":"C","t":{"en":"Have the coordinator inject source identifier prefixes into text before each handoff, then parse these prefixes at report generation to reconstruct citations."}},{"k":"D","t":{"en":"Maintain complete transcripts of all subagent interactions and add a citation-resolution agent to analyze logs and determine attributions before report generation."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“Investigation shows that while the web search and document analysis agents”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Require all subagents to output structured claim-source mappings that the synthesis”</b> <i>(trong đáp án A)</i>: Lỗi là do mất thông tin ở giai đoạn tổng hợp, do đó, cách khắc phục là thực…","elim":["<b>B. Add a verification step where the report generator uses semantic similarity matching against original sources to reconstruct which claims came from which documents.</b>: Bỏ qua yêu cầu chính “Investigation shows that while the web search and”.","<b>C. Have the coordinator inject source identifier prefixes into text before each handoff, then parse these prefixes at report generation to reconstruct citations.</b>: Bỏ qua yêu cầu chính “Investigation shows that while the web search and”.","<b>D. Maintain complete transcripts of all subagent interactions and add a citation-resolution agent to analyze logs and determine attributions before report generation.</b>: Bỏ qua yêu cầu chính “Investigation shows that while the web search and”."]}},{"id":"t1q41","n":41,"topic":1,"type":"mcq","stem":{"en":"Production monitoring shows that follow-up queries like &quot;summarize what we learned about market trends&quot; consistently take 40+ seconds. Investigation reveals the coordinator spawns the synthesis subagent for each summarization request, passing 80K+ tokens of accumulated findings. The coordinator already has these findings in its context from orchestrating the research. What&#x27;s the most effective way to improve response time for these follow-up summaries?"},"options":[{"k":"A","t":{"en":"Spawn the synthesis subagent with reduced context and have it request specific findings from the coordinator on-demand."}},{"k":"B","t":{"en":"Pre-generate and cache summaries at multiple granularities whenever new findings accumulate."}},{"k":"C","t":{"en":"Have the coordinator handle straightforward summarization requests directly using its existing context, reserving subagent spawning for complex analysis."}},{"k":"D","t":{"en":"Enable prompt caching on the synthesis subagent to reduce the overhead of repeatedly transferring the same research findings."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“The coordinator already has these findings in its context from orchestrating”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Have the coordinator handle straightforward summarization requests directly using its existing”</b> <i>(trong đáp án C)</i>: Coordinator đã có toàn bộ findings trong context.","elim":["<b>A. Spawn the synthesis subagent with reduced context and have it request specific findings from the coordinator on-demand.</b>: Bỏ qua yêu cầu chính “The coordinator already has these findings in its”.","<b>B. Pre-generate and cache summaries at multiple granularities whenever new findings accumulate.</b>: Bỏ qua yêu cầu chính “The coordinator already has these findings in its”.","<b>D. Enable prompt caching on the synthesis subagent to reduce the overhead of repeatedly transferring the same research findings.</b>: Bỏ qua yêu cầu chính “The coordinator already has these findings in its”."]}},{"id":"t1q42","n":42,"topic":1,"type":"mcq","stem":{"en":"After the web search agent finds 25 sources (120K tokens of raw content), the document analysis agent extracts key insights (15K tokens), and the synthesis agent produces a coherent narrative draft (3K tokens), the coordinator must pass context to the report generation agent for the final output with proper source citations. What context-passing strategy provides the best balance of completeness and efficiency?"},"options":[{"k":"A","t":{"en":"Pass the full accumulated context from all prior agents."}},{"k":"B","t":{"en":"Pass the synthesis draft along with a structured source index that maps key claims to their source URLs and relevant excerpts."}},{"k":"C","t":{"en":"Pass a condensed summary of all prior stages that preserves the main findings and attributes them to sources by name only."}},{"k":"D","t":{"en":"Pass only the synthesis draft and have a separate post-processing pipeline match claims to sources and insert citations after the report is generated."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“After the web search agent finds 25 sources (120K tokens of”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Pass the synthesis draft along with a structured source index that”</b> <i>(trong đáp án B)</i>: Chuyển bản nháp tổng hợp (token 3K) + yêu cầu ánh xạ chỉ mục nguồn tới URL/đoạn trích…","elim":["<b>A. Pass the full accumulated context from all prior agents.</b>: Cách này giữ quá nhiều dữ liệu không cần thiết, làm tăng token, độ trễ…","<b>C. Pass a condensed summary of all prior stages that preserves the main findings and attributes them to sources by name only.</b>: Bash có thể thực hiện thao tác nhưng dễ vỡ và bỏ qua contract hoặc…","<b>D. Pass only the synthesis draft and have a separate post-processing pipeline match claims to sources and insert citations after the report is generated.</b>: Bỏ qua yêu cầu chính “After the web search agent finds 25 sources”."]}},{"id":"t1q43","n":43,"topic":1,"type":"mcq","stem":{"en":"When analyzing complex legal cases that cite multiple precedents, the document analysis subagent processes each sequentially. A landmark case citing 12 precedents takes over 3 minutes to analyze completely. What&#x27;s the most effective way to reduce this latency while preserving the coordinator&#x27;s ability to monitor and debug the system?"},"options":[{"k":"A","t":{"en":"Implement a message queue where precedent analysis tasks are processed asynchronously by a pool of worker agents."}},{"k":"B","t":{"en":"Create a recursive agent hierarchy where analysis agents subdivide work among child agents until reaching single-precedent granularity."}},{"k":"C","t":{"en":"Have the coordinator spawn parallel document analysis subagents, each handling a subset of precedents, then aggregate results before synthesis."}},{"k":"D","t":{"en":"Enable the document analysis subagent to spawn its own specialized subagents dynamically when it encounters cases with many citations."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“A landmark case citing 12 precedents takes over 3 minutes to”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Have the coordinator spawn parallel document analysis subagents, each handling a”</b> <i>(trong đáp án C)</i>: Các precedent có thể được chia thành những nhóm độc lập để phân tích song song.","elim":["<b>A. Implement a message queue where precedent analysis tasks are processed asynchronously by a pool of worker agents.</b>: Bash có thể thực hiện thao tác nhưng dễ vỡ và bỏ qua contract hoặc…","<b>B. Create a recursive agent hierarchy where analysis agents subdivide work among child agents until reaching single-precedent granularity.</b>: Bỏ qua yêu cầu chính “A landmark case citing 12 precedents takes over”.","<b>D. Enable the document analysis subagent to spawn its own specialized subagents dynamically when it encounters cases with many citations.</b>: Bỏ qua yêu cầu chính “A landmark case citing 12 precedents takes over”."]}},{"id":"t1q44","n":44,"topic":1,"type":"mcq","stem":{"en":"In production, you&#x27;re distributing complex queries to specialized subagents. The query distribution is uneven and evolving as users discover new applications. What&#x27;s the most effective approach to optimize for query complexity?"},"options":[{"k":"A","t":{"en":"Have the coordinator analyze each query dynamically and selectively route subagents based on the query&#x27;s complexity and routing characteristics."}},{"k":"B","t":{"en":"Create a fast-track path for factual questions that bypasses subagents entirely, routing only analytical queries through the complete pipeline."}},{"k":"C","t":{"en":"Train a query complexity classifier based on labeled historical data to predict optimal subagent combination."}},{"k":"D","t":{"en":"Implement pattern-based routing that categorizes queries based on factual vs analytical patterns and maps each to a predefined subagent combination."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“uneven and evolving”</b> <i>(trong câu hỏi)</i>: Phân bố truy vấn không ổn định, nên một cơ chế routing cố định sẽ nhanh chóng lỗi…<br><b>“analyze each query dynamically”</b> <i>(trong đáp án A)</i>: Coordinator đánh giá từng truy vấn tại thời điểm chạy và chỉ gọi những subagent thực sự cần…","elim":["<b>B. Create a fast-track path for factual questions...</b>: Chỉ chia truy vấn thành factual và analytical, trong khi đề nhấn mạnh phân bố…","<b>C. Train a query complexity classifier...</b>: Cần dữ liệu gán nhãn và tái huấn luyện khi phân bố thay đổi; do…","<b>D. Implement pattern-based routing...</b>: Các pattern và tổ hợp subagent được định trước, nên khó thích ứng với những…"]}},{"id":"t1q45","n":45,"topic":1,"type":"mcq","stem":{"en":"The synthesis agent receives summarized findings from the web search and document analysis agents, then passes a consolidated summary to the report generator. During testing, you discover the generated reports make factual claims without proper citations–the report generator cannot attribute statements to their original sources because that metadata was lost during the summarization steps. What&#x27;s the most effective approach to ensure proper source attribution in the final reports?"},"options":[{"k":"A","t":{"en":"Have the report generator query the web search agent to re-locate sources for claims in the final report."}},{"k":"B","t":{"en":"Instruct the synthesis agent to embed source references inline within its summary text using a consistent citation format."}},{"k":"C","t":{"en":"Have each agent output structured data separating content summaries from source metadata (URLs, document names, page numbers)."}},{"k":"D","t":{"en":"Skip summarization and pass full raw outputs from web search and document analysis directly to the report generator."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“During testing, you discover the generated reports make factual claims without”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Have each agent output structured data separating content summaries from source”</b> <i>(trong đáp án C)</i>: Thay vì sửa lỗi phân bổ sau khi bị mất, mỗi agent cần xuất dữ liệu có cấu…","elim":["<b>A. Have the report generator query the web search agent to re-locate sources for claims in the final report.</b>: Bỏ qua yêu cầu chính “During testing, you discover the generated reports make”.","<b>B. Instruct the synthesis agent to embed source references inline within its summary text using a consistent citation format.</b>: Bỏ qua yêu cầu chính “During testing, you discover the generated reports make”.","<b>D. Skip summarization and pass full raw outputs from web search and document analysis directly to the report generator.</b>: Cách này giữ quá nhiều dữ liệu không cần thiết, làm tăng token, độ trễ…"]}},{"id":"t1q46","n":46,"topic":1,"type":"mcq","stem":{"en":"When implementing your lookup_order MCP tool, the backend sometimes returns errors (e.g., &quot;Order not found&quot; or temporary database failures). What is the correct pattern for communicating these errors back to the agent?"},"options":[{"k":"A","t":{"en":"Return the error message in the tool result content with the isError flag set to true"}},{"k":"B","t":{"en":"Return a success response with a &quot;status&quot; field indicating the error type"}},{"k":"C","t":{"en":"Log the error server-side and return an empty result to avoid confusing the model"}},{"k":"D","t":{"en":"Throw an exception from the tool handler so the agent framework can catch and log it"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“When implementing your lookup_order MCP tool, the backend sometimes returns errors”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Return the error message in the tool result content with the”</b> <i>(trong đáp án A)</i>: Mẫu thiết kế của MCP: đặt văn bản lỗi vào trường nội dung và đánh dấu isError=true.","elim":["<b>B. Return a success response with a &quot;status&quot; field indicating the error type</b>: Che giấu lỗi hoặc trả kết quả rỗng làm agent không phân biệt được “không…","<b>C. Log the error server-side and return an empty result to avoid confusing the model</b>: Che giấu lỗi hoặc trả kết quả rỗng làm agent không phân biệt được “không…","<b>D. Throw an exception from the tool handler so the agent framework can catch and log it</b>: Exception của handler là lỗi thực thi phía server; agent cần nhận tool result có…"]}},{"id":"t1q47","n":47,"topic":1,"type":"mcq","stem":{"en":"After investigating a billing dispute over 25+ turns, you&#x27;ve identified that duplicate charges occurred due to a payment gateway timeout triggering retry logic. The required refund ($847) exceeds your $500 authorization limit. You need to call escalate_to_human, and the human agent won&#x27;t have access to your conversation transcript. What context should you pass to enable effective resolution?"},"options":[{"k":"A","t":{"en":"The customer&#x27;s original complaint verbatim plus the tool result excerpts showing duplicate transactions."}},{"k":"B","t":{"en":"The complete conversation transcript with all tool results."}},{"k":"C","t":{"en":"Your diagnosis and the refund amount only."}},{"k":"D","t":{"en":"A structured summary: customer ID, root cause, refund amount, and recommended action."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“You need to call escalate_to_human, and the human agent won&#x27;t have”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“A structured summary: customer ID, root cause, refund amount, and recommended”</b> <i>(trong đáp án D)</i>: Tác nhân con người cần có đủ thông tin để giải quyết nhanh chóng nhưng không cần toàn…","elim":["<b>A. The customer&#x27;s original complaint verbatim plus the tool result excerpts showing duplicate transactions.</b>: Bỏ qua yêu cầu chính “You need to call escalate_to_human, and the human”.","<b>B. The complete conversation transcript with all tool results.</b>: Cách này giữ quá nhiều dữ liệu không cần thiết, làm tăng token, độ trễ…","<b>C. Your diagnosis and the refund amount only.</b>: Bỏ qua yêu cầu chính “You need to call escalate_to_human, and the human”."]}},{"id":"t1q48","n":48,"topic":1,"type":"mcq","stem":{"en":"Your agent has called lookup_order multiple times while investigating a customer&#x27;s return requests. Each response includes 40+ fields (items, shipping details, payment info, status history). Tool outputs now represent the majority of the conversation&#x27;s context. The customer mentions two more orders they want to discuss. What&#x27;s the most effective approach before making additional lookups?"},"options":[{"k":"A","t":{"en":"Proceed with additional lookups without modifying the existing tool output context"}},{"k":"B","t":{"en":"Move all tool responses to a vector database with semantic indexing, retrieving relevant portions as the conversation continues"}},{"k":"C","t":{"en":"Have the model generate a natural language summary of each order&#x27;s key details, replacing structured responses with prose descriptions"}},{"k":"D","t":{"en":"Extract only return-relevant fields (items, purchase date, return window, status) from each existing order response, removing verbose details"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“Tool outputs now represent the majority of the conversation&#x27;s context.”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Extract only return-relevant fields (items, purchase date, return window, status) from”</b> <i>(trong đáp án D)</i>: Khi kết quả đầu ra của công cụ chiếm phần lớn bối cảnh, bạn cần cắt bớt để…","elim":["<b>A. Proceed with additional lookups without modifying the existing tool output context</b>: Bỏ qua yêu cầu chính “Tool outputs now represent the majority of the”.","<b>B. Move all tool responses to a vector database with semantic indexing, retrieving relevant portions as the conversation continues</b>: Retrieval có thể hữu ích ở quy mô lớn nhưng bổ sung hạ tầng và…","<b>C. Have the model generate a natural language summary of each order&#x27;s key details, replacing structured responses with prose descriptions</b>: Bản tóm tắt văn xuôi có thể làm mất ID, con số hoặc trạng thái…"]}},{"id":"t1q49","n":49,"topic":1,"type":"mcq","stem":{"en":"A customer sends: &quot;This is frustrating. I&#x27;ve explained my issue twice and nothing is being resolved. I want to talk to a real person NOW.&quot; The agent has not yet called any tools to investigate their account. What should the agent do?"},"options":[{"k":"A","t":{"en":"Immediately call escalate_to_human with the conversation history."}},{"k":"B","t":{"en":"Briefly explain what the agent can help with and offer to resolve the issue quickly, escalating only if the customer repeats their request."}},{"k":"C","t":{"en":"Acknowledge the frustration and ask one targeted question to understand the specific issue before escalating."}},{"k":"D","t":{"en":"First call get_customer and lookup_order to gather account context, then escalate to a human agent."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“I want to talk to a real person NOW”</b> <i>(trong câu hỏi)</i>: Đây là yêu cầu chuyển sang người thật rõ ràng và mang tính tức thời, không phải một…<br><b>“Immediately call escalate_to_human”</b> <i>(trong đáp án A)</i>: Hành động này tôn trọng đúng yêu cầu trực tiếp của khách hàng và không kéo dài thêm…","elim":["<b>B. ...escalating only if the customer repeats their request.</b>: Buộc khách hàng phải yêu cầu lần nữa dù họ đã nói rất rõ, làm…","<b>C. ...ask one targeted question...</b>: Một câu hỏi có thể hữu ích nếu khách hàng chưa yêu cầu người thật…","<b>D. First call get_customer and lookup_order...</b>: Tự ý điều tra trước khi handoff vừa chậm hơn vừa có thể thực hiện…"]}},{"id":"t1q50","n":50,"topic":1,"type":"mcq","stem":{"en":"You&#x27;re implementing the escalation logic for when the agent should call escalate_to_human. Your team proposes four different approaches for triggering escalation. Which approach will most reliably identify cases that genuinely require human intervention?"},"options":[{"k":"A","t":{"en":"Instruct the agent to escalate when the customer requests a human, when the issue requires policy exceptions, or when the agent cannot make meaningful progress."}},{"k":"B","t":{"en":"Configure the agent to escalate after three consecutive tool calls that fail to resolve the customer&#x27;s stated issue, ensuring a reasonable attempt before involving a human."}},{"k":"C","t":{"en":"Build a rules engine that maps specific issue types, customer segments, and product categories to escalation decisions, removing the need for model judgment calls."}},{"k":"D","t":{"en":"Implement sentiment analysis that monitors for frustration indicators (negative language, repeated questions, exclamation marks) and trigger escalation when the frustration score exceeds a configured threshold."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“Your team proposes four different approaches for triggering escalation.”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Instruct the agent to escalate when the customer requests a human,”</b> <i>(trong đáp án A)</i>: Xác định các điều kiện báo cáo rõ ràng (khách hàng yêu cầu về con người, cần có…","elim":["<b>B. Configure the agent to escalate after three consecutive tool calls that fail to resolve the customer&#x27;s stated issue, ensuring a reasonable attempt before involving a human.</b>: Ngưỡng số lần gọi cố định là máy móc: có trường hợp phải chuyển giao…","<b>C. Build a rules engine that maps specific issue types, customer segments, and product categories to escalation decisions, removing the need for model judgment calls.</b>: Rules engine cứng khó bao quát các tình huống mới và các ngoại lệ ngữ…","<b>D. Implement sentiment analysis that monitors for frustration indicators (negative language, repeated questions, exclamation marks) and trigger escalation when the frustration score exceeds a configured threshold.</b>: Sentiment chỉ là tín hiệu gián tiếp; người dùng có thể cần human dù bình…"]}},{"id":"t1q51","n":51,"topic":1,"type":"mcq","stem":{"en":"Your agent is handling a billing dispute. After calling get_customer and lookup_order, it identifies that the dispute involves a promotional pricing error requiring manager approval–beyond the agent&#x27;s authorization level. How should the workflow handle this mid-process escalation?"},"options":[{"k":"A","t":{"en":"Attempt the refund with process_refund anyway, escalating only if the system rejects the transaction."}},{"k":"B","t":{"en":"Compile a structured handoff with customer details, order info, and the identified issue before calling escalate_to_human."}},{"k":"C","t":{"en":"Call escalate_to_human passing only the customer&#x27;s original message."}},{"k":"D","t":{"en":"Persist the complete conversation and tool response history to a database, then call escalate_to_human with a reference ID."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“After calling get_customer and lookup_order, it identifies that the dispute involves”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Compile a structured handoff with customer details, order info, and the”</b> <i>(trong đáp án B)</i>: Việc chuyển lên cấp cao hơn giữa quá trình cần cung cấp đủ bối cảnh cho subagent người.","elim":["<b>A. Attempt the refund with process_refund anyway, escalating only if the system rejects the transaction.</b>: Bỏ qua yêu cầu chính “After calling get_customer and lookup_order, it identifies that”.","<b>C. Call escalate_to_human passing only the customer&#x27;s original message.</b>: Bỏ qua yêu cầu chính “After calling get_customer and lookup_order, it identifies that”.","<b>D. Persist the complete conversation and tool response history to a database, then call escalate_to_human with a reference ID.</b>: Bỏ qua yêu cầu chính “After calling get_customer and lookup_order, it identifies that”."]}},{"id":"t1q52","n":52,"topic":1,"type":"mcq","stem":{"en":"During a billing dispute resolution, your agent successfully retrieves customer info via get_customer and order details via lookup_order, but when attempting to process the refund via process_refund, the tool returns a timeout error. The agent has enough information to explain the billing, confirm the refund eligibility, and verify refund eligibility, but cannot actually process the refund due to the backend failure. What approach best balances first-contact resolution with appropriate error handling?"},"options":[{"k":"A","t":{"en":"Escalate immediately to a human agent since the refund action cannot be completed"}},{"k":"B","t":{"en":"Implement automatic retries with exponential backoff for process_refund, keeping the conversation open until the refund is successfully processed"}},{"k":"C","t":{"en":"Confirm the refund will be processed and close the conversation, since the system has all necessary information to complete it automatically"}},{"k":"D","t":{"en":"Explain the billing, confirm refund eligibility, acknowledge the system issue preventing immediate processing, and offer escalation or retry later"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“The agent has enough information to explain the billing, confirm the”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Explain the billing, confirm refund eligibility, acknowledge the system issue preventing”</b> <i>(trong đáp án D)</i>: Cung cấp một phần giá trị mà bạn có thể (giải thích + tính đủ điều kiện), thành…","elim":["<b>A. Escalate immediately to a human agent since the refund action cannot be completed</b>: Bỏ qua yêu cầu chính “The agent has enough information to explain the”.","<b>B. Implement automatic retries with exponential backoff for process_refund, keeping the conversation open until the refund is successfully processed</b>: Bash có thể thực hiện thao tác nhưng dễ vỡ và bỏ qua contract hoặc…","<b>C. Confirm the refund will be processed and close the conversation, since the system has all necessary information to complete it automatically</b>: Bash có thể thực hiện thao tác nhưng dễ vỡ và bỏ qua contract hoặc…"]}},{"id":"t1q53","n":53,"topic":1,"type":"mcq","stem":{"en":"Production logs reveal inconsistent error responses when lookup_order fails. The agent sometimes retries (wasting 3-4 turns) before concluding on the error. Your MCP tool currently returns only a plain text error message to Claude. What&#x27;s the most effective improvement?"},"options":[{"k":"A","t":{"en":"Implement retry logic with exponential backoff in your MCP server for all errors, returning only successful results to the agent."}},{"k":"B","t":{"en":"Create an analyze_error MCP tool the agent calls to determine the error type before deciding how to handle it."}},{"k":"C","t":{"en":"Return structured error responses with retryable: false for business errors and a customer-friendly explanation for Claude to use."}},{"k":"D","t":{"en":"Add few-shot examples to the system prompt showing how to distinguish retryable from non-retryable errors by parsing error message text."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“Your MCP tool currently returns only a plain text error message”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Return structured error responses with retryable: false for business errors and”</b> <i>(trong đáp án C)</i>: Khi công cụ chỉ trả về văn bản thuần túy, agent không thể phân biệt lỗi tạm thời…","elim":["<b>A. Implement retry logic with exponential backoff in your MCP server for all errors, returning only successful results to the agent.</b>: Retry có thể che bớt lỗi tạm thời nhưng không cung cấp cho agent loại…","<b>B. Create an analyze_error MCP tool the agent calls to determine the error type before deciding how to handle it.</b>: Bỏ qua yêu cầu chính “Your MCP tool currently returns only a plain”.","<b>D. Add few-shot examples to the system prompt showing how to distinguish retryable from non-retryable errors by parsing error message text.</b>: Bổ sung hướng dẫn chung có thể cải thiện phần nào nhưng không làm rõ…"]}},{"id":"t1q54","n":54,"topic":1,"type":"mcq","stem":{"en":"When the agent calls lookup_order and receives order details showing the item was purchased 45 days ago, how does the agentic loop determine whether to call process_refund or escalate_to_human next?"},"options":[{"k":"A","t":{"en":"The agent executes the remaining steps in a tool sequence planned at the start of the request."}},{"k":"B","t":{"en":"The agent follows a pre-configured decision tree mapping order attributes to specific tool calls."}},{"k":"C","t":{"en":"The order details are added to the conversation and the model reasons about which action to take."}},{"k":"D","t":{"en":"The orchestration layer automatically routes to the next tool based on the order&#x27;s status field."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“When the agent calls lookup_order and receives order details showing the”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“The order details are added to the conversation and the model”</b> <i>(trong đáp án C)</i>: Trong vòng lặp agent của Claude, sau khi công cụ trả về kết quả, chi tiết đơn hàng…","elim":["<b>A. The agent executes the remaining steps in a tool sequence planned at the start of the request.</b>: Bỏ qua yêu cầu chính “When the agent calls lookup_order and receives order”.","<b>B. The agent follows a pre-configured decision tree mapping order attributes to specific tool calls.</b>: Bỏ qua yêu cầu chính “When the agent calls lookup_order and receives order”.","<b>D. The orchestration layer automatically routes to the next tool based on the order&#x27;s status field.</b>: Bash có thể thực hiện thao tác nhưng dễ vỡ và bỏ qua contract hoặc…"]}},{"id":"t1q55","n":55,"topic":1,"type":"mcq","stem":{"en":"A customer writes: &quot;I&#x27;ve been going back and forth on this return for days. I just want to speak to someone who can actually help me.&quot; The agent has confirmed via lookup_order that the return is straightforward–within policy and eligible for immediate processing. What should the agent do?"},"options":[{"k":"A","t":{"en":"Process the refund via process_refund to resolve the underlying issue, then inform them it&#x27;s complete"}},{"k":"B","t":{"en":"Ask what specifically hasn&#x27;t worked in previous attempts before deciding whether to escalate or resolve automatically"}},{"k":"C","t":{"en":"Acknowledge frustration, inform them this is resolvable now, and offer to complete it or escalate"}},{"k":"D","t":{"en":"Call escalate_to_human immediately to honor the customer&#x27;s request"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“I just want to speak to someone who can actually help”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Acknowledge frustration, inform them this is resolvable now, and offer to”</b> <i>(trong đáp án C)</i>: Trả lại hàng đủ điều kiện và có thể được xử lý ngay lập tức, nhưng khách hàng…","elim":["<b>A. Process the refund via process_refund to resolve the underlying issue, then inform them it&#x27;s complete</b>: Bỏ qua yêu cầu chính “I just want to speak to someone who”.","<b>B. Ask what specifically hasn&#x27;t worked in previous attempts before deciding whether to escalate or resolve automatically</b>: Bỏ qua yêu cầu chính “I just want to speak to someone who”.","<b>D. Call escalate_to_human immediately to honor the customer&#x27;s request</b>: Bỏ qua yêu cầu chính “I just want to speak to someone who”."]}},{"id":"t1q56","n":56,"topic":1,"type":"mcq","stem":{"en":"Compliance requires that refunds exceeding $500 must automatically escalate to a human agent–this rule cannot be left to model discretion. Despite clear system prompt instructions, production logs show the agent occasionally processes high-value refunds directly (3% failure rate). How should you achieve guaranteed compliance?"},"options":[{"k":"A","t":{"en":"Implement a hook to intercept tool calls; when the refund process amount exceeds $500, block it and invoke human escalation."}},{"k":"B","t":{"en":"Strengthen the system prompt with emphatic language: &quot;CRITICAL POLICY: Refunds over $500 MUST trigger human escalation. NEVER process these directly.&quot;"}},{"k":"C","t":{"en":"Modify the refund tool to return an error with message &quot;Amount exceeds policy limit–please escalate&quot; when threshold is exceeded."}},{"k":"D","t":{"en":"Add few-shot examples to the prompt showing correct escalation behavior at various refund amounts ($400, $500, $600)."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“Compliance requires that refunds exceeding $500 must automatically escalate to a”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Implement a hook to intercept tool calls; when the refund process”</b> <i>(trong đáp án A)</i>: Khi việc tuân thủ là bắt buộc và không thể tùy ý lập mô hình, thì biện pháp…","elim":["<b>B. Strengthen the system prompt with emphatic language: &quot;CRITICAL POLICY: Refunds over $500 MUST trigger human escalation. NEVER process these directly.&quot;</b>: Prompt và ví dụ chỉ định hướng hành vi xác suất; chúng không thể bảo…","<b>C. Modify the refund tool to return an error with message &quot;Amount exceeds policy limit–please escalate&quot; when threshold is exceeded.</b>: Bỏ qua yêu cầu chính “Compliance requires that refunds exceeding $500 must automatically”.","<b>D. Add few-shot examples to the prompt showing correct escalation behavior at various refund amounts ($400, $500, $600).</b>: Prompt và ví dụ chỉ định hướng hành vi xác suất; chúng không thể bảo…"]}},{"id":"t1q57","n":57,"topic":1,"type":"mcq","stem":{"en":"A customer raises three separate issues during one session: a refund inquiry (turns 1-15), a subscription question (turns 16-30), and a payment method update (turns 31-45). At turn 48, the customer asks &quot;What happened with my refund?&quot; The conversation is approaching context limits. What strategy best maintains the agent&#x27;s ability to address all issues throughout the session?"},"options":[{"k":"A","t":{"en":"Extract and persist structured issue data (order IDs, amounts, statuses) into a separate context layer."}},{"k":"B","t":{"en":"Rely on MCP tools to re-fetch relevant information on demand when the customer references earlier issues."}},{"k":"C","t":{"en":"Implement sliding window context that retains the most recent 30 turns."}},{"k":"D","t":{"en":"Summarize earlier turns into a narrative description, preserving full message history only for the active issue."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“three separate issues”</b> <i>(trong câu hỏi)</i>: Agent cần duy trì trạng thái độc lập cho refund, subscription và payment method, thay vì chỉ nhớ…<br><b>“approaching context limits”</b> <i>(trong câu hỏi)</i>: Không thể tiếp tục giữ toàn bộ 48 lượt dưới dạng transcript thô.","elim":["<b>B. Rely on MCP tools to re-fetch...</b>: Tool có thể lấy trạng thái backend hiện tại, nhưng không nhất thiết phục hồi…","<b>C. ...retains the most recent 30 turns.</b>: Refund nằm ở turns 1-15 nên rất dễ bị loại khỏi cửa sổ khi đến…","<b>D. Summarize earlier turns into a narrative description...</b>: Narrative summary hữu ích nhưng dễ làm mất các giá trị chính xác như order…"]}},{"id":"t1q58","n":58,"topic":1,"type":"mcq","stem":{"en":"The agent verifies customer identity through a multi-step process before resetting passwords. During testing, you notice that after the customer answers the third verification question, the agent asks them to provide their name again, as if the earlier exchange never happened. What&#x27;s the most likely cause of this behavior?"},"options":[{"k":"A","t":{"en":"The prompt lacks instructions telling Claude to remember information across multiple exchanges."}},{"k":"B","t":{"en":"The verification tool is clearing the agent&#x27;s internal state after each successful validation step."}},{"k":"C","t":{"en":"Claude&#x27;s memory retention is limited to two conversational turns by default, requiring explicit configuration to extend it."}},{"k":"D","t":{"en":"The conversation history isn&#x27;t being passed in subsequent API requests."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“During testing, you notice that after the customer answers the third”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“The conversation history isn&#x27;t being passed in subsequent API requests.”</b> <i>(trong đáp án D)</i>: Claude không có bộ nhớ vốn có giữa các lệnh gọi API.","elim":["<b>A. The prompt lacks instructions telling Claude to remember information across multiple exchanges.</b>: Bỏ qua yêu cầu chính “During testing, you notice that after the customer”.","<b>B. The verification tool is clearing the agent&#x27;s internal state after each successful validation step.</b>: Bỏ qua yêu cầu chính “During testing, you notice that after the customer”.","<b>C. Claude&#x27;s memory retention is limited to two conversational turns by default, requiring explicit configuration to extend it.</b>: Bỏ qua yêu cầu chính “During testing, you notice that after the customer”."]}},{"id":"t1q59","n":59,"topic":1,"type":"mcq","stem":{"en":"Your process_refund tool returns two types of errors: technical errors (&quot;503 Service Unavailable&quot;, &quot;Connection timeout&quot;) that are transient (5% of calls), and business errors (&quot;Order exceeds 30-day return window&quot;, &quot;Item already refunded&quot;) that are permanent (12% of calls). Monitoring shows the agent wastes 3-4 turns retrying business errors that can never succeed. Currently, both error types return only a plain text message to Claude. What&#x27;s the most effective way to reduce wasted retries while improving customer-facing response quality?"},"options":[{"k":"A","t":{"en":"Add few-shot examples showing how to distinguish retryable from non-retryable errors by parsing error message text."}},{"k":"B","t":{"en":"Return structured error responses with retryable: false for business errors and a customer-friendly explanation for Claude to use."}},{"k":"C","t":{"en":"Implement automatic retry logic at the tool level for technical errors only, passing business errors to Claude without retries."}},{"k":"D","t":{"en":"Add a check_refund_eligibility tool that must be called before process_refund to prevent business rule violations."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“Currently, both error types return only a plain text message to”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Return structured error responses with retryable: false for business errors and”</b> <i>(trong đáp án B)</i>: Việc thêm cờ có thể thử lại: sai vào các lỗi kinh doanh cho phép Claude biết ngay…","elim":["<b>A. Add few-shot examples showing how to distinguish retryable from non-retryable errors by parsing error message text.</b>: Retry không thể tạo ra dữ liệu còn thiếu hoặc sửa lỗi validation, permission hay…","<b>C. Implement automatic retry logic at the tool level for technical errors only, passing business errors to Claude without retries.</b>: Retry không thể tạo ra dữ liệu còn thiếu hoặc sửa lỗi validation, permission hay…","<b>D. Add a check_refund_eligibility tool that must be called before process_refund to prevent business rule violations.</b>: Bỏ qua yêu cầu chính “Currently, both error types return only a plain”."]}},{"id":"t1q60","n":60,"topic":1,"type":"mcq","stem":{"en":"A customer returns 4 hours after their initial session about the same billing dispute. The previous 32-turn session contains context: lookup_status_result messages containing &quot;Status: Pending Refund&quot; and significant tokens from prior lookup results. The agent needs to be prepared to answer the customer fully. What approach most reliably handles returning customers?"},"options":[{"k":"A","t":{"en":"Start a new session, inject a structured summary of the previous interaction (issue type, resolution steps, current status), then make fresh tool calls as needed."}},{"k":"B","t":{"en":"Resume with the full conversation and add a system prompt instruction that instructs the agent to prioritize resolving the pending refund."}},{"k":"C","t":{"en":"Resume with state and configure the agent to automatically re-call all previous tool_results messages to ensure data freshness."}},{"k":"D","t":{"en":"Resume the previous session with the full history and ask the customer to restate the dispute before deciding whether fresh lookups are necessary."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“returns 4 hours after their initial session”</b> <i>(trong câu hỏi)</i>: Sau một khoảng gián đoạn, trạng thái refund có thể đã thay đổi nên tool result cũ không…<br><b>“significant tokens from prior lookup results”</b> <i>(trong câu hỏi)</i>: Nạp lại toàn bộ session làm tăng context mà không bảo đảm dữ liệu vẫn mới.","elim":["<b>B. Resume with the full conversation...</b>: System prompt mới không làm cho các tool result cũ trở thành dữ liệu hiện…","<b>C. ...automatically re-call all previous tool_results...</b>: Gọi lại mọi tool một cách máy móc có thể tốn thời gian và tạo…","<b>D. ...ask the customer to restate the dispute...</b>: Bắt khách hàng lặp lại thông tin đã có làm tăng ma sát và vẫn…"]}},{"id":"t1q61","n":61,"topic":1,"type":"mcq","stem":{"en":"Your extraction pipeline processes invoices and extracts line items, subtotals, tax amounts, and grand totals. During evaluation, you discover that in 18% of extractions, the sum of extracted line item amounts doesn&#x27;t match the extracted grand total—sometimes due to OCR errors in the source document, sometimes due to extraction mistakes by the model. Downstream accounting systems reject records with mismatched totals. What&#x27;s the most effective approach to improve extraction reliability?"},"options":[{"k":"A","t":{"en":"Add few-shot examples demonstrating invoices where extracted line items sum correctly to the stated total, encouraging the model to produce mathematically consistent extractions."}},{"k":"B","t":{"en":"Implement post-processing that automatically adjusts line item amounts proportionally when their sum doesn&#x27;t match the stated total."}},{"k":"C","t":{"en":"Extract line items and totals independently, then use a separate validation model to reconcile discrepancies by determining which extracted values are most likely correct."}},{"k":"D","t":{"en":"Add a &quot;calculated_total&quot; field where the model sums extracted line items alongside a &quot;stated_total&quot; field. Flag records for human review when values differ."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“Downstream accounting systems reject records with mismatched totals.”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Add a &quot;calculated_total&quot; field where the model sums extracted line items”</b> <i>(trong đáp án D)</i>: Việc ghi lại cả tổng_tổng_tính và tổng_tổng_đã nêu biến sự khác biệt thành tín hiệu hạng nhất …","elim":["<b>A. Add few-shot examples demonstrating invoices where extracted line items sum correctly to the stated total, encouraging the model to produce mathematically consistent extractions.</b>: Bỏ qua yêu cầu chính “Downstream accounting systems reject records with mismatched totals”.","<b>B. Implement post-processing that automatically adjusts line item amounts proportionally when their sum doesn&#x27;t match the stated total.</b>: Tự sửa số liệu để làm chúng khớp nhau có thể che giấu OCR hoặc…","<b>C. Extract line items and totals independently, then use a separate validation model to reconcile discrepancies by determining which extracted values are most likely correct.</b>: Bỏ qua yêu cầu chính “Downstream accounting systems reject records with mismatched totals”."]}},{"id":"t1q62","n":62,"topic":1,"type":"mcq","stem":{"en":"An engineer asks your agent to identify untested code paths in a legacy payment processing module spanning 45 files. After reading the first 8 source files, the agent&#x27;s responses are becoming noticeably less accurate — it&#x27;s forgetting previously discussed code patterns and hasn&#x27;t yet located all test files or traced critical payment flows. What&#x27;s the most effective approach to complete this investigation?"},"options":[{"k":"A","t":{"en":"Clear context with /clear, then selectively re-read only the most critical files discovered so far, writing key findings to a scratchpad file that persists between context resets."}},{"k":"B","t":{"en":"Spawn subagents to investigate specific questions (e.g., &quot;find all test files for payment processing&quot;, &quot;trace refund flow dependencies&quot;) while the main agent coordinates findings and preserves high-level understanding."}},{"k":"C","t":{"en":"Document all current findings in a summary report, clear context completely, then use that report as the sole reference for continuing the investigation."}},{"k":"D","t":{"en":"Switch to using Grep to search for specific function names instead of reading full files, reducing the content loaded into context for remaining exploration."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“After reading the first 8 source files, the agent&#x27;s responses are”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Spawn subagents to investigate specific questions (e.g., &quot;find all test files”</b> <i>(trong đáp án B)</i>: Cách tiếp cận mạnh mẽ nhất là giao các cuộc điều tra có phạm vi phù hợp cho…","elim":["<b>A. Clear context with /clear, then selectively re-read only the most critical files discovered so far, writing key findings to a scratchpad file that persists between context resets.</b>: Bắt đầu lại làm mất phần context đã tích lũy và buộc hệ thống lặp…","<b>C. Document all current findings in a summary report, clear context completely, then use that report as the sole reference for continuing the investigation.</b>: Bắt đầu lại làm mất phần context đã tích lũy và buộc hệ thống lặp…","<b>D. Switch to using Grep to search for specific function names instead of reading full files, reducing the content loaded into context for remaining exploration.</b>: Bỏ qua yêu cầu chính “After reading the first 8 source files, the”."]}},{"id":"t1q63","n":63,"topic":1,"type":"mcq","stem":{"en":"The coordinator agent has AgentDefinitions configured for all four specialized subagents, each with appropriate descriptions, prompts, and tool restrictions. During testing, you notice the coordinator correctly reasons about when to delegate — it generates messages like &quot;I&#x27;ll ask the web search agent to find sources on this topic&quot; — but no subagent execution ever occurs. The coordinator then proceeds as if the delegation happened and continues with incomplete information. Logs show no errors. What is the most likely cause?"},"options":[{"k":"A","t":{"en":"Subagent context isolation means task descriptions from the coordinator don&#x27;t automatically reach subagents; you need to configure explicit context forwarding in ClaudeAgentOptions."}},{"k":"B","t":{"en":"The AgentDefinitions are configured correctly, but the coordinator&#x27;s system prompt doesn&#x27;t explicitly list the available subagent types, preventing the model from knowing they can be invoked."}},{"k":"C","t":{"en":"The coordinator&#x27;s max_tokens setting is too low, causing the Task tool invocation to be truncated before the subagent type parameter can be specified."}},{"k":"D","t":{"en":"The coordinator&#x27;s allowedTools configuration doesn&#x27;t include &quot;Task&quot;, so while it can reason about delegation, it cannot invoke the tool required to spawn subagents."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“During testing, you notice the coordinator correctly reasons about when to”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“The coordinator&#x27;s allowedTools configuration doesn&#x27;t include &quot;Task&quot;, so while it can”</b> <i>(trong đáp án D)</i>: Nếu không có công cụ Tác vụ trong allowTools, coordinator có thể nói về việc ủy quyền nhưng…","elim":["<b>A. Subagent context isolation means task descriptions from the coordinator don&#x27;t automatically reach subagents; you need to configure explicit context forwarding in ClaudeAgentOptions.</b>: Bỏ qua yêu cầu chính “During testing, you notice the coordinator correctly reasons”.","<b>B. The AgentDefinitions are configured correctly, but the coordinator&#x27;s system prompt doesn&#x27;t explicitly list the available subagent types, preventing the model from knowing they can be invoked.</b>: Bỏ qua yêu cầu chính “During testing, you notice the coordinator correctly reasons”.","<b>C. The coordinator&#x27;s max_tokens setting is too low, causing the Task tool invocation to be truncated before the subagent type parameter can be specified.</b>: Bỏ qua yêu cầu chính “During testing, you notice the coordinator correctly reasons”."]}},{"id":"t1q64","n":64,"topic":1,"type":"mcq","stem":{"en":"In production, you observe that simple fact-checking queries (e.g., &quot;What year was the Paris Climate Agreement signed?&quot;) traverse all four subagents sequentially, consuming 40+ seconds and significant tokens per query. Complex comparative research benefits from the full pipeline. Your query distribution is diverse and evolving as users discover new applications. What&#x27;s the most effective approach to optimize for varying query complexity?"},"options":[{"k":"A","t":{"en":"Have the coordinator analyze each query and dynamically decide which subagents to invoke based on its assessment of query requirements."}},{"k":"B","t":{"en":"Train a query complexity classifier on labeled historical data to predict optimal subagent combinations, retraining periodically as query patterns evolve."}},{"k":"C","t":{"en":"Create a fast-path for factual questions that bypasses subagents entirely, routing all other queries through the complete pipeline to ensure research thoroughness."}},{"k":"D","t":{"en":"Implement pattern-based routing that categorizes queries by structure (single-fact vs. comparative vs. analytical) and maps each category to a predefined subagent combination."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“In production, you observe that simple fact-checking queries (e.g., &quot;What year”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Have the coordinator analyze each query and dynamically decide which subagents”</b> <i>(trong đáp án A)</i>: Hãy để coordinator LLM suy luận độc lập về từng truy vấn và chỉ chọn các subagent thực…","elim":["<b>B. Train a query complexity classifier on labeled historical data to predict optimal subagent combinations, retraining periodically as query patterns evolve.</b>: Bỏ qua yêu cầu chính “In production, you observe that simple fact-checking queries”.","<b>C. Create a fast-path for factual questions that bypasses subagents entirely, routing all other queries through the complete pipeline to ensure research thoroughness.</b>: Bỏ qua yêu cầu chính “In production, you observe that simple fact-checking queries”.","<b>D. Implement pattern-based routing that categorizes queries by structure (single-fact vs. comparative vs. analytical) and maps each category to a predefined subagent combination.</b>: Bash có thể thực hiện thao tác nhưng dễ vỡ và bỏ qua contract hoặc…"]}},{"id":"t1q65","n":65,"topic":1,"type":"mcq","stem":{"en":"Production logs reveal inconsistent error handling: when lookup_order fails, the agent sometimes retries 5+ times (wasteful when the order ID doesn&#x27;t exist), sometimes escalates immediately (premature for temporary network issues), and sometimes asks users for clarification (inappropriate when the issue is a backend permission error). Investigation shows your MCP tool returns uniform error responses: {&quot;isError&quot;: true, &quot;content&quot;: [{&quot;type&quot;: &quot;text&quot;, &quot;text&quot;: &quot;Operation failed&quot;}]}. The agent cannot distinguish between error types. What&#x27;s the most effective improvement?"},"options":[{"k":"A","t":{"en":"Create an analyze_error MCP tool the agent calls after any failure to determine the error category and recommended action."}},{"k":"B","t":{"en":"Enhance error responses with structured metadata: include errorCategory (transient/validation/permission), isRetryable boolean, and a description of what caused the failure."}},{"k":"C","t":{"en":"Add few-shot examples to the system prompt demonstrating how to interpret error message patterns and select appropriate responses for each."}},{"k":"D","t":{"en":"Implement retry logic with exponential backoff in your MCP server for all errors, returning to the agent only after retries are exhausted."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“The agent cannot distinguish between error types.”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Enhance error responses with structured metadata: include errorCategory (transient/validation/permission), isRetryable boolean,”</b> <i>(trong đáp án B)</i>: Tool result hiện chỉ nói “Operation failed”, nên agent không biết nên retry, hỏi lại hay escalate.","elim":["<b>A. Create an analyze_error MCP tool the agent calls after any failure to determine the error category and recommended action.</b>: Bỏ qua yêu cầu chính “The agent cannot distinguish between error types”.","<b>C. Add few-shot examples to the system prompt demonstrating how to interpret error message patterns and select appropriate responses for each.</b>: Bổ sung hướng dẫn chung có thể cải thiện phần nào nhưng không làm rõ…","<b>D. Implement retry logic with exponential backoff in your MCP server for all errors, returning to the agent only after retries are exhausted.</b>: Retry không thể tạo ra dữ liệu còn thiếu hoặc sửa lỗi validation, permission hay…"]}},{"id":"t1q66","n":66,"topic":1,"type":"mcq","stem":{"en":"Users report that final reports sometimes lack depth on specific subtopics. Investigation shows that the document analysis agent frequently identifies gaps—for instance, noting &quot;the retrieved sources discuss API authentication but lack details on token refresh patterns&quot;—but under the current strict pipeline, this insight isn&#x27;t actionable since search has already completed. What&#x27;s the most effective architectural change?"},"options":[{"k":"A","t":{"en":"Have the synthesis agent attach confidence scores to each section and flag areas with insufficient coverage for manual review."}},{"k":"B","t":{"en":"Have the analysis agent report specific gaps to the coordinator, which triggers targeted searches and re-invokes analysis until sufficient."}},{"k":"C","t":{"en":"Add a research planning agent before the search phase that decomposes topics into specific sub- questions."}},{"k":"D","t":{"en":"Have the coordinator review analysis output for gap indicators and re-invoke search with gapinformed queries when gaps are detected."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“Investigation shows that the document analysis agent frequently identifies gaps—for instance,”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Have the analysis agent report specific gaps to the coordinator, which”</b> <i>(trong đáp án B)</i>: Vấn đề cốt lõi là quy trình một chiều cứng nhắc, nơi những hiểu biết sâu sắc về…","elim":["<b>A. Have the synthesis agent attach confidence scores to each section and flag areas with insufficient coverage for manual review.</b>: Chuyển thẳng sang review thủ công chỉ xử lý hậu quả và không giảm tỷ…","<b>C. Add a research planning agent before the search phase that decomposes topics into specific sub- questions.</b>: Bỏ qua yêu cầu chính “Investigation shows that the document analysis agent frequently”.","<b>D. Have the coordinator review analysis output for gap indicators and re-invoke search with gapinformed queries when gaps are detected.</b>: Bỏ qua yêu cầu chính “Investigation shows that the document analysis agent frequently”."]}},{"id":"t1q67","n":67,"topic":1,"type":"mcq","stem":{"en":"This currently requires manually copy-pasting content into conversations. The team wants the agent to access this standard Jira ticket data directly. What&#x27;s the most effective approach?"},"options":[{"k":"A","t":{"en":"Use the Bash tool with curl to call Jira&#x27;s REST API, including authentication headers and parsing JSON responses inline."}},{"k":"B","t":{"en":"Build a custom MCP server wrapping Jira&#x27;s API with tools designed specifically for this team&#x27;s code review workflow."}},{"k":"C","t":{"en":"Integrate an existing Jira MCP server that exposes tickets, comments, and metadata through discoverable tool interfaces."}},{"k":"D","t":{"en":"Export Jira tickets to markdown files in the repository that the agent accesses using the Read tool."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“This currently requires manually copy-pasting content into conversations.”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Integrate an existing Jira MCP server that exposes tickets, comments, and”</b> <i>(trong đáp án C)</i>: Đối với dữ liệu dịch vụ tiêu chuẩn của bên thứ ba như vé Jira, cách thực hành…","elim":["<b>A. Use the Bash tool with curl to call Jira&#x27;s REST API, including authentication headers and parsing JSON responses inline.</b>: Bash có thể thực hiện thao tác nhưng dễ vỡ và bỏ qua contract hoặc…","<b>B. Build a custom MCP server wrapping Jira&#x27;s API with tools designed specifically for this team&#x27;s code review workflow.</b>: Bỏ qua yêu cầu chính “This currently requires manually copy-pasting content into conversations”.","<b>D. Export Jira tickets to markdown files in the repository that the agent accesses using the Read tool.</b>: Bỏ qua yêu cầu chính “This currently requires manually copy-pasting content into conversations”."]}},{"id":"t1q68","n":68,"topic":1,"type":"mcq","stem":{"en":"A critical bug is affecting production users. Error logs show exceptions in the OrderProcessing module with a clear stack trace pointing to a specific area, but you haven&#x27;t worked with this module before. What&#x27;s the most effective approach?"},"options":[{"k":"A","t":{"en":"Use direct execution to examine the stack trace, read the relevant code, and implement a fix once you identify the root cause."}},{"k":"B","t":{"en":"Use plan mode to analyze the error in context of the module&#x27;s design, enumerate potential root causes, and prioritize fixes systematically."}},{"k":"C","t":{"en":"Start with direct execution to gather initial information, then switch to plan mode to design a comprehensive solution before implementing."}},{"k":"D","t":{"en":"Enter plan mode to explore the module&#x27;s architecture and dependencies before attempting any fix."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“Error logs show exceptions in the OrderProcessing module with a clear”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Use direct execution to examine the stack trace, read the relevant”</b> <i>(trong đáp án A)</i>: Việc gỡ lỗi có tính thích ứng — mỗi tệp bạn đọc sẽ thay đổi bước tiếp theo…","elim":["<b>B. Use plan mode to analyze the error in context of the module&#x27;s design, enumerate potential root causes, and prioritize fixes systematically.</b>: Bỏ qua yêu cầu chính “Error logs show exceptions in the OrderProcessing module”.","<b>C. Start with direct execution to gather initial information, then switch to plan mode to design a comprehensive solution before implementing.</b>: Bỏ qua yêu cầu chính “Error logs show exceptions in the OrderProcessing module”.","<b>D. Enter plan mode to explore the module&#x27;s architecture and dependencies before attempting any fix.</b>: Bỏ qua yêu cầu chính “Error logs show exceptions in the OrderProcessing module”."]}},{"id":"t1q69","n":69,"topic":1,"type":"mcq","stem":{"en":"After deploying the automated review, you notice high precision but low recall — real bugs are slipping through undetected. Investigation reveals your review prompt instructs Claude to &quot;only report high- confidence issues you are certain about&quot; and &quot;err on the side of not commenting.&quot; Developers appreciate the low noise, but a race condition that caused a production outage was visible in a reviewed PR and went unreported. You need to substantially improve bug detection while keeping false positive rates manageable for your team. What is the most effective approach?"},"options":[{"k":"A","t":{"en":"Split the review into a finding stage where Claude&#x27;s goal is coverage — flagging every potential issue with confidence and severity metadata — and a separate stage that thresholds those findings."}},{"k":"B","t":{"en":"Add detailed few-shot examples demonstrating bug categories Claude should f
