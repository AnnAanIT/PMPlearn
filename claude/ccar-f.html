<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCAR-F · Claude Certified Architect - Foundations</title>
<meta name="description" content="Bộ đề luyện thi CCAR-F.">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<script>
/* đặt theme trước khi vẽ để không nháy màu */
(function(){
  var th="dark";
  try{
    var d=JSON.parse(localStorage.getItem('examtrainer.CCAR-F')||"{}");
    if(d.theme) th=d.theme;
    else if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches) th="light";
  }catch(e){}
  document.documentElement.setAttribute("data-theme",th);
})();
</script>
<style>
/* ============================================================
   Exam Trainer — bảng điều khiển + tờ đề in (tông ấm)
   ============================================================ */

:root{                      /* TỐI — mỗi màu chữ đều đo trên nền sáng nhất mà nó nằm lên */
  --shell:#171310;          /* khung ngoài            */
  --shell-2:#201A15;        /* cột trái / cột phải    */
  --shell-3:#2E251C;        /* nền nổi khi rê chuột   */
  --sunken:#100D0A;         /* ô nhập liệu — chìm     */
  --paper:#1C1712;          /* vùng đọc               */
  --paper-2:#252019;
  --ink:#F1EFEA;            /* ≥13.1:1 mọi nền        */
  --ink-2:#C6BCAA;          /* ≥ 8.0:1 — nhãn, chú thích */
  --ink-3:#ABA08B;          /* ≥ 5.8:1 — số đếm, gợi ý ô nhập */
  --rule:#3D3428;           /* kẻ trang trí           */
  --rule-2:#786853;         /* viền điều khiển ≥3:1   */
  --on-accent:#171310;      /* chữ nằm trên mảng màu đặc */
  --ok:#8FD98C;
  --ok-bg:rgba(143,217,140,.15);
  --bad:#FF9781;
  --bad-bg:rgba(255,151,129,.15);
  --flag:#F7C25A;
  --flag-bg:rgba(247,194,90,.17);
  --pick:#8ECBF0;
  --pick-bg:rgba(142,203,240,.15);
  --stamp:#FF9781;
  --focus:#F7C25A;
  --thumb:#5A4E3D;
  color-scheme:dark;
}
[data-theme="light"]{       /* SÁNG — cùng nguyên tắc, giấy ngà để bớt chói */
  --shell:#E9E3D5;
  --shell-2:#F2EDE2;
  --shell-3:#E7E1D2;
  --sunken:#FFFFFF;
  --paper:#FDFBF5;
  --paper-2:#F5F1E6;
  --ink:#201C16;            /* ≥13.0:1 */
  --ink-2:#463E35;          /* ≥ 8.0:1 */
  --ink-3:#5B5347;          /* ≥ 5.8:1 */
  --rule:#DED6C4;
  --rule-2:#8F8269;
  --on-accent:#FFFFFF;
  --ok:#256B42;
  --ok-bg:rgba(37,107,66,.10);
  --bad:#B32E1F;
  --bad-bg:rgba(179,46,31,.09);
  --flag:#7F5405;
  --flag-bg:rgba(127,84,5,.13);
  --pick:#175D91;
  --pick-bg:rgba(23,93,145,.09);
  --stamp:#B32E1F;
  --focus:#7F5405;
  --thumb:#B0A48D;
  color-scheme:light;
}
:root{
  --sans:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --top:52px;
  --gut:clamp(16px,1.8vw,26px);
  --pad:clamp(24px,2.6vw,46px);
  --perf:26px;
  --recpad:clamp(12px,1.2vw,20px);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
*{scrollbar-width:thin;scrollbar-color:var(--thumb) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent;border-left:1px solid var(--rule)}
::-webkit-scrollbar-thumb{background:var(--thumb);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
body{
  margin:0;background:var(--shell);color:var(--ink);
  font-family:var(--serif);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
b,strong{font-weight:600}
h1,h2,h3,h4{margin:0}
img{max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hide{display:none!important}
.grow{flex:1}

.lbl{
  font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-2);
}

/* ============================ TOP ============================ */
.top{
  position:sticky;top:0;z-index:60;height:var(--top);
  background:var(--shell-2);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:var(--gut);padding:0 var(--gut);
}
.mark{display:flex;align-items:baseline;gap:9px;flex:none}
.mark .w{font-family:var(--sans);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.mark .w em{font-style:normal;color:var(--stamp)}
.mark .s{font-family:var(--sans);font-size:12px;letter-spacing:.02em;color:var(--ink-2);white-space:nowrap}

.seg{display:flex;border:1px solid var(--rule-2);flex:none}
.seg button{
  background:transparent;border:0;border-right:1px solid var(--rule-2);
  font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-2);padding:6px 13px;cursor:pointer;line-height:1.45;
}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink);background:var(--shell-3)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-accent)}
.seg.mini button{padding:5px 9px;font-size:10px;letter-spacing:.1em}
.top .right{display:flex;gap:8px;align-items:center;flex:none}
.icb{
  background:transparent;border:1px solid var(--rule-2);color:var(--ink-2);
  width:29px;height:29px;display:grid;place-items:center;cursor:pointer;
  font-family:var(--sans);font-weight:700;font-size:12px;flex:none;
}
.icb:hover{color:var(--ink);border-color:var(--ink-3)}

/* ============================ GRID ============================ */
.app{
  display:grid;
  grid-template-columns:266px minmax(0,1fr) 304px;
  grid-template-areas:"rail main aside";
  align-items:stretch;min-height:calc(100vh - var(--top));
}
.rail{grid-area:rail;border-right:1px solid var(--rule);background:var(--shell-2)}
.main{grid-area:main;min-width:0;background:var(--paper);position:relative;min-height:calc(100vh - var(--top))}
.aside{grid-area:aside;border-left:1px solid var(--rule);background:var(--shell-2)}
.rail-in,.aside-in{
  position:sticky;top:var(--top);height:calc(100vh - var(--top));
  overflow-y:auto;overflow-x:hidden;padding:16px var(--gut) 40px;
}
@media(max-width:1319px){
  .app{grid-template-columns:244px minmax(0,1fr);grid-template-areas:"rail aside" "rail main";align-content:start}
  .aside{border-left:0;border-bottom:1px solid var(--rule)}
  .aside-in{position:static;height:auto;max-height:none;padding:12px var(--gut)}
  .aside .stack{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 26px;align-items:start}
}
@media(max-width:899px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"rail" "main" "aside"}
  .aside{border-top:1px solid var(--rule);border-bottom:0}
  .only-lg{display:none}
  .rail{border-right:0;border-bottom:1px solid var(--rule)}
  .rail-in{position:static;height:auto;max-height:none;padding:12px var(--gut) 18px}
  body:not(.rail-open) .rail-in{display:none}
  .rail-in .stack{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px 26px;align-items:start}
}
@media(min-width:900px){ .railtoggle{display:none} }
@media(max-width:899px){
  .top{height:auto;min-height:var(--top);flex-wrap:wrap;gap:8px 10px;padding:8px var(--gut)}
  .mark .s{display:none}
  .top .right{margin-left:auto}
  .seg button{padding:6px 9px;font-size:10px;letter-spacing:.07em}
  .seg.mini button{padding:5px 7px}
}
@media(max-width:640px){
  :root{--perf:14px}
  .paper::before,.paper::after{background-size:100% 20px}
}

/* ============================ CONTROLS ============================ */
.blk{margin-bottom:22px}
.blk > .lbl{display:block;margin-bottom:8px}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}

.fld{
  width:100%;background:var(--sunken);border:1px solid var(--rule-2);color:var(--ink);
  font-family:var(--serif);font-size:14.5px;padding:8px 10px;
}
.fld::placeholder{color:var(--ink-3);opacity:1}
.fld:focus{outline:none;border-color:var(--stamp);box-shadow:inset 0 0 0 1px var(--stamp)}

/* select tự vẽ — không dùng mũi tên mặc định của hệ điều hành */
.sel{position:relative;display:block}
.sel select{
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
  width:100%;background:var(--sunken);color:var(--ink);
  border:1px solid var(--rule-2);border-radius:0;
  padding:9px 42px 9px 12px;font-family:var(--mono);font-size:13.5px;line-height:1.35;
  cursor:pointer;
}
.sel select:hover{border-color:var(--ink-3)}
.sel select:focus{outline:none;border-color:var(--stamp);box-shadow:inset 0 0 0 1px var(--stamp)}
.sel .cap{
  position:absolute;top:1px;right:1px;bottom:1px;width:30px;
  border-left:1px solid var(--rule-2);background:var(--shell-3);
  display:grid;place-items:center;pointer-events:none;
}
.sel .cap::after{
  content:"";width:0;height:0;
  border-left:4.5px solid transparent;border-right:4.5px solid transparent;
  border-top:5.5px solid var(--ink-2);
}
.sel select:hover + .cap::after{border-top-color:var(--ink)}
.sel select:focus + .cap{background:var(--stamp);border-left-color:var(--stamp)}
.sel select:focus + .cap::after{border-top-color:var(--on-accent)}
.sel.on select{border-color:var(--pick);box-shadow:inset 0 0 0 1px var(--pick)}
.sel.on .cap{border-left-color:var(--pick)}

.tlist{display:grid;gap:1px}
.slist{display:grid;border-top:1px solid var(--rule)}
.srow{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:0;border-bottom:1px solid var(--rule);
  border-left:2px solid transparent;padding:8px 10px;
}
.srow:hover{background:var(--shell-3)}
.srow[aria-pressed="true"]{border-left-color:var(--stamp);background:var(--shell-3)}
.srow[aria-pressed="true"] .nm{color:var(--ink)}
.srow .dot{width:10px;height:10px;flex:none;position:relative;color:var(--ink-3)}
.srow[aria-pressed="true"] .dot{color:var(--ink)}
.srow .dot::before{content:"";position:absolute;inset:1px;border:1px solid currentColor}
.srow .dot.g{color:var(--ok)}   .srow .dot.g::before{background:currentColor}
.srow .dot.r{color:var(--bad)}  .srow .dot.r::before{background:currentColor}
.srow .dot.f{color:var(--flag)} .srow .dot.f::before{background:currentColor}
/* dấu hiệu của từng dạng câu, vẽ lại đúng hình dáng điều khiển tương ứng */
.srow .dot.m-mcq::before{box-shadow:inset 0 0 0 2px currentColor}
.srow .dot.m-yesno::before{border:0;background:linear-gradient(currentColor 0 34%,transparent 34% 66%,currentColor 66% 100%)}
.srow .dot.m-drop::before{border:0;background:currentColor;clip-path:polygon(0 22%,100% 22%,50% 86%)}
.srow .nm{flex:1;font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.03em;
  text-transform:uppercase;color:var(--ink-2)}
.srow .ct{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* nhóm nút dữ liệu — hàng đầy chiều rộng, thống nhất với các danh sách khác */
.vlist{display:grid;border-top:1px solid var(--rule)}
.vrow{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:0;border-bottom:1px solid var(--rule);padding:10px;
  font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);
}
.vrow:hover{background:var(--shell-3);color:var(--ink)}
.vrow svg{flex:none;width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7}
.vrow.danger{color:var(--bad)}
.vrow.danger:hover{background:var(--bad-bg)}
.trow{
  display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:center;
  background:transparent;border:0;border-left:2px solid transparent;
  padding:6px 8px;cursor:pointer;text-align:left;width:100%;min-width:0;
}
.trow:hover{background:var(--shell-3)}
.trow[aria-pressed="true"]{border-left-color:var(--stamp);background:var(--shell-3)}
.trow .nm{font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.trow .ct{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.meter{grid-column:1/-1;height:4px;background:var(--rule);display:flex;overflow:hidden}
.meter i{display:block;height:100%}
.meter .g{background:var(--ok)}
.meter .r{background:var(--bad)}

.act{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;background:transparent;color:var(--ink);
  border:1px solid var(--rule-2);padding:7px 13px;cursor:pointer;line-height:1.4;
}
.btn:hover{border-color:var(--ink);background:var(--shell-3)}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{border-color:var(--rule-2);background:transparent;color:var(--ink)}
.btn.solid{background:var(--ink);border-color:var(--ink);color:var(--on-accent)}
.btn.solid:hover:not(:disabled){filter:brightness(1.12)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{padding:5px 10px;font-size:10px}

/* ============================ ASIDE ============================ */
.kv{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:3px 0}
.kv span{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.kv b{font-family:var(--mono);font-size:12.5px;font-weight:600}
.bigbar{height:8px;border:1px solid var(--rule-2);display:flex;margin:6px 0;overflow:hidden}
.bigbar i{display:block;height:100%}
.queue{display:grid;gap:2px;max-height:270px;overflow:auto}
.qbtn{
  display:flex;gap:8px;align-items:baseline;background:transparent;border:0;
  border-left:2px solid var(--rule-2);padding:5px 8px;text-align:left;cursor:pointer;width:100%;min-width:0;
}
.qbtn:hover{background:var(--shell-3)}
.qbtn.is-wrong{border-left-color:var(--bad)}
.qbtn.is-flag{border-left-color:var(--flag)}
.qbtn .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);flex:none}
.qbtn .t{min-width:0;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.keys{display:grid;gap:3px}
.keyrow{display:flex;gap:8px;align-items:center;font-family:var(--serif);font-size:12.5px;color:var(--ink-2)}
kbd{
  font-family:var(--mono);font-size:10px;background:var(--shell-3);border:1px solid var(--rule-2);
  border-bottom-width:2px;padding:1px 5px;color:var(--ink);min-width:18px;text-align:center;
}

/* ============================ PAPER ============================ */
.paper{position:relative;padding:0 var(--perf);min-height:100%}
.paper::before,.paper::after{
  content:"";position:absolute;top:0;bottom:0;width:var(--perf);
  background:var(--paper-2);pointer-events:none;
}
.paper::before{left:0;border-right:1px solid var(--rule);box-shadow:inset -4px 0 0 -3px var(--rule)}
.paper::after{right:0;border-left:1px solid var(--rule);box-shadow:inset 4px 0 0 -3px var(--rule)}
.sheet{padding:0 var(--pad) 64px}

.head{padding:30px 0 18px;border-bottom:2px solid var(--ink);display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.head h2{font-family:var(--sans);font-weight:700;font-size:clamp(22px,2.6vw,34px);letter-spacing:-.01em;text-transform:uppercase;line-height:1}
.head p{font-family:var(--serif);font-size:14.5px;color:var(--ink-2);margin:8px 0 0;max-width:62ch}
.head .r{margin-left:auto;text-align:right}

.rec{
  border-bottom:1px solid var(--rule);
  padding:22px var(--recpad) 24px;margin:0 calc(-1 * var(--recpad));
  scroll-margin-top:calc(var(--top) + 12px);
}
.rec.cur{background:var(--paper-2);box-shadow:inset 3px 0 0 var(--stamp)}
.rec.cur .idx{color:var(--stamp)}
.rechead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px;max-width:86ch}
.idx{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.05em}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.flagbtn{
  flex:none;width:26px;height:24px;display:grid;place-items:center;cursor:pointer;
  background:transparent;border:1px solid var(--rule-2);color:var(--ink-2);
}
.flagbtn svg{width:12px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9}
.flagbtn:hover{color:var(--flag);border-color:var(--flag)}
.flagbtn[aria-pressed="true"]{color:var(--flag);border-color:var(--flag);background:var(--flag-bg)}
.flagbtn[aria-pressed="true"] svg{fill:currentColor}
.tag{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid var(--rule-2);color:var(--ink-2);padding:2px 6px;white-space:nowrap;
}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.bad{color:var(--bad);border-color:var(--bad)}
.tag.flag{color:var(--flag);border-color:var(--flag)}
.tag.multi{color:var(--pick);border-color:var(--pick)}

.stem{font-family:var(--mono);font-size:14.5px;line-height:1.62;margin:0;max-width:78ch}
.gloss{
  display:block;font-family:var(--serif);font-size:14.5px;line-height:1.6;
  color:var(--ink-2);max-width:74ch;margin:4px 0 0;
}
.qbody{margin-top:16px}
.qimg{display:block;margin:14px 0 4px;border:1px solid var(--rule-2);max-width:min(100%,620px);cursor:zoom-in}

/* --- phương án nhiều lựa chọn --- */
.opts{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-width:86ch}
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:transparent;border:1px solid transparent;color:var(--ink);
  padding:8px 10px;cursor:pointer;
}
.opt:hover{border-color:var(--rule-2)}
.opt .k{
  flex:none;width:22px;height:22px;display:grid;place-items:center;margin-top:1px;
  border:1px solid var(--rule-2);font-family:var(--mono);font-weight:600;font-size:11.5px;
}
.opt .tx{flex:1;min-width:0;font-family:var(--mono);font-size:13.5px;line-height:1.55}
.opt .tx .gloss{font-size:13.5px;margin-top:3px}
.opt .mk{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;white-space:nowrap;padding-top:5px;display:none;
}
.opt[data-pick="1"]{border-color:var(--pick);background:var(--pick-bg)}
.opt[data-pick="1"] .k{background:var(--pick);border-color:var(--pick);color:var(--on-accent)}
.opt[data-pick="1"] .mk-you{display:block;color:var(--pick)}
.rec[data-done="1"] .opt{cursor:default}
.rec[data-done="1"] .opt:hover{border-color:transparent}
.rec[data-done="1"] .opt[data-right="1"]{border-color:var(--ok);background:var(--ok-bg)}
.rec[data-done="1"] .opt[data-right="1"] .k{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.rec[data-done="1"] .opt[data-right="1"] .mk-ok{display:block;color:var(--ok)}
.rec[data-done="1"] .opt[data-right="1"] .mk-you{display:none}
.rec[data-done="1"] .opt[data-pick="1"][data-right="0"]{border-color:var(--bad);background:var(--bad-bg)}
.rec[data-done="1"] .opt[data-pick="1"][data-right="0"] .k{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}
.rec[data-done="1"] .opt[data-pick="1"][data-right="0"] .mk-you{display:block;color:var(--bad)}

/* --- dạng Có / Không theo dòng --- */
.ynlist{list-style:none;margin:0;padding:0;max-width:92ch;border-top:1px solid var(--rule)}
.yn{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:center;
  padding:12px 10px;border-bottom:1px solid var(--rule);
}
.yn .ynt{font-family:var(--mono);font-size:13.5px;line-height:1.55;min-width:0}
.yn .ynt .gloss{font-size:13.5px;margin-top:3px}
.ynb{display:flex;flex:none;border:1px solid var(--rule-2)}
.ynb button{
  background:transparent;border:0;border-right:1px solid var(--rule-2);
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-2);padding:6px 14px;cursor:pointer;min-width:64px;
}
.ynb button:last-child{border-right:0}
.ynb button:hover{background:var(--shell-3);color:var(--ink)}
.ynb button[aria-pressed="true"]{background:var(--pick);color:var(--on-accent)}
.rec[data-done="1"] .ynb button{cursor:default}
.rec[data-done="1"] .ynb button:hover{background:transparent;color:var(--ink-2)}
.rec[data-done="1"] .ynb button[aria-pressed="true"]{background:var(--bad);color:var(--on-accent)}
.rec[data-done="1"] .yn[data-right="1"] .ynb button[aria-pressed="true"]{background:var(--ok);color:var(--on-accent)}
.rec[data-done="1"] .yn[data-right="0"] .ynb button[data-correct="1"]{box-shadow:inset 0 0 0 2px var(--ok);color:var(--ok)}

/* --- dạng chọn từ danh sách --- */
.blanks{display:grid;gap:18px;max-width:78ch}
.blank .blabel{display:block;font-family:var(--mono);font-size:13px;line-height:1.55;margin-bottom:8px;color:var(--ink)}
.blank .blabel .gloss{font-size:13px;margin-top:3px}
.blank .ansline{
  font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  margin-top:7px;display:none;
}
.rec[data-done="1"] .blank[data-right="0"] .ansline{display:block}
.blank .ansline.ok{color:var(--ok)}
.blank .ansline.bad{color:var(--bad)}
.rec[data-done="1"] .sel select{pointer-events:none}
.rec[data-done="1"] .blank[data-right="1"] select{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.rec[data-done="1"] .blank[data-right="0"] select{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}

.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px;max-width:86ch}
.note{font-family:var(--serif);font-size:13.5px;color:var(--ink-2)}

/* --- khối đáp án --- */
.rev{display:none;margin-top:20px;border-top:1px solid var(--ink);padding-top:18px}
.rec[data-done="1"] .rev{display:block}
.revtop{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.stamp{
  border:2.5px solid var(--stamp);color:var(--stamp);padding:5px 13px 6px;
  transform:rotate(-2.2deg);box-shadow:inset 0 0 0 1px var(--stamp);
  display:flex;align-items:baseline;gap:10px;flex:none;max-width:100%;
}
.stamp .t{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.stamp .v{font-family:var(--sans);font-weight:700;font-size:26px;line-height:1;letter-spacing:.06em}
.stamp.txt .v{font-size:15px;letter-spacing:.02em;font-family:var(--mono);font-weight:600;line-height:1.35}
.verdict{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--bad)}
.conf{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid currentColor;padding:3px 8px;
}
.conf.h{color:var(--ok)}
.conf.m{color:var(--flag)}
.conf.l{color:var(--bad)}

.revgrid{display:grid;gap:20px 36px}
@media(min-width:1500px){ .revgrid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }
.sech{
  font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-2);display:flex;align-items:center;gap:10px;margin-bottom:8px;
}
.sech::after{content:"";flex:1;height:0;border-top:1px dotted var(--rule-2)}
.prose{font-family:var(--serif);font-size:15.5px;line-height:1.7;max-width:72ch;margin:0}
.prose b{box-shadow:inset 0 -2px 0 var(--flag)}
ul.elim{list-style:none;margin:0;padding:0;max-width:72ch}
ul.elim li{font-family:var(--serif);font-size:15px;line-height:1.65;padding-left:20px;position:relative;margin-bottom:6px}
ul.elim li::before{content:"\00D7";position:absolute;left:2px;top:-1px;font-family:var(--sans);font-weight:700;color:var(--bad);font-size:16px}
.cite{
  font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-top:16px;
  padding-top:10px;border-top:1px dotted var(--rule-2);max-width:78ch;word-break:break-word;
}
.notewrap{margin-top:20px;padding-top:16px;border-top:1px dotted var(--rule-2)}
.notewrap .lbl{display:block;margin-bottom:6px}
.notewrap textarea{
  display:block;width:100%;max-width:72ch;min-height:64px;resize:vertical;background:var(--sunken);
  border:1px solid var(--rule-2);color:var(--ink);font-family:var(--serif);font-size:14.5px;padding:9px 11px;
}
.notewrap textarea:focus{outline:none;border-color:var(--stamp)}

/* ============================ EXAM ============================ */
.panel{border:1px solid var(--rule-2);background:var(--paper-2);padding:24px var(--pad);margin-top:24px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px 24px;align-items:end}
.grid2 .lbl{min-height:15px}
.fldw{display:grid;gap:6px}
.timer{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:.06em}
.timer.low{color:var(--bad)}
.pal{display:flex;flex-wrap:wrap;gap:4px}
.pd{
  width:30px;height:28px;border:1px solid var(--rule-2);background:transparent;color:var(--ink-2);
  font-family:var(--mono);font-size:11px;cursor:pointer;position:relative;
}
.pd:hover{border-color:var(--ink-3);color:var(--ink)}
.pd.is-ans{border-color:var(--pick);color:var(--pick)}
.pd.is-flag::after{content:"";position:absolute;top:2px;right:2px;width:4px;height:4px;background:var(--flag)}
.pd.is-cur{background:var(--ink);border-color:var(--ink);color:var(--on-accent)}

.score{display:flex;gap:36px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .n b{font-family:var(--sans);font-weight:700;font-size:34px;line-height:1}
.ring .n span{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);letter-spacing:.1em;text-transform:uppercase}
.result-h{font-family:var(--sans);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase}
.result-h.ok{color:var(--ok)}
.result-h.bad{color:var(--flag)}
.figs{display:flex;gap:28px;flex-wrap:wrap;margin-top:12px}
.fig b{display:block;font-family:var(--mono);font-size:23px;font-weight:600}

/* ============================ TABLE ============================ */
.tw{overflow-x:auto;margin-top:12px}
.tw table{min-width:440px}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule)}
th{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);border-bottom-color:var(--rule-2)}
td:first-child{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.02em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.sbar{height:5px;background:var(--rule);display:flex;min-width:70px}
.sbar i{display:block;height:100%}

.empty{padding:64px 10px;text-align:center;font-family:var(--serif);font-size:14.5px;color:var(--ink-2)}
.empty b{display:block;font-family:var(--sans);font-size:18px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-bottom:8px}

/* ============================ OVERLAY ============================ */
.ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px}
.ov .box{background:var(--shell-2);border:1px solid var(--rule-2);max-width:520px;width:100%;padding:22px 24px;max-height:86vh;overflow:auto}
.ov h3{font-family:var(--sans);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.ov p{font-family:var(--serif);font-size:14.5px;color:var(--ink-2);margin:0 0 16px}
.ov.zoom{cursor:zoom-out}
.ov.zoom img{max-width:96vw;max-height:92vh;border:1px solid var(--rule-2)}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;
  background:var(--ink);color:var(--on-accent);font-family:var(--mono);font-size:12.5px;
  padding:9px 16px;border:1px solid var(--ink);
}

/* ============ RESPONSIVE OVERRIDES (phải nằm sau mọi component) ============ */
@media(max-width:640px){
  .yn{grid-template-columns:minmax(0,1fr);gap:12px}
  .ynb{justify-self:start}
  .ynb button{min-width:84px;padding:7px 16px}
  .stem,.opt .tx,.yn .ynt{font-size:13.5px}
  .revtop{gap:12px}
  .stamp{transform:none}
}

/* ============================ PRINT ============================ */
@media print{
  body{background:#fff;color:#000}
  .top,.rail,.aside,.bar,.notewrap,.ov,.toast{display:none!important}
  .app{display:block}
  .main{background:#fff}
  .paper{padding:0}
  .paper::before,.paper::after{display:none}
  .rec{break-inside:avoid;background:#fff!important}
  .rev{display:block!important}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

<script>
/* ============================================================
   Exam Trainer — engine
   Hỗ trợ 3 dạng câu: mcq · yesno · dropdown
   ============================================================ */
const DATA = {"meta":{"code":"CCAR-F","title":{"en":"Claude Certified Architect - Foundations"},"org":"Anthropic","pass":70},"topics":[{"n":1,"title":{"en":"Topic 1","vi":"Chủ đề 1"},"questions":[{"id":"t1q1","n":1,"topic":1,"type":"mcq","stem":{"en":"A developer asks the agent to investigate why a specific API endpoint intermittently returns 500 responses. The codebase has 200+ files and the developer doesn&#x27;t know which components are involved. The agent must trace the error through routing, middleware, business logic, and database layers. What task decomposition approach would be most effective?"},"options":[{"k":"A","t":{"en":"Run parallel worker agents on the file system of four layers, then combine their findings to reconstruct the complete error path."}},{"k":"B","t":{"en":"Have the agent dynamically generate investigation subtasks based on what it discovers at each step, adapting its exploration plan as new information about the error path emerges."}},{"k":"C","t":{"en":"Define a fixed sequence of investigation steps upfront—grep for error handlers, then examine middleware, then check database queries, then examine middleware-woven code."}},{"k":"D","t":{"en":"Have the agent first create a comprehensive plan mapping all code paths through documented components before beginning any exploration or code reading."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“The agent must trace the error through routing, middleware, business logic,”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Have the agent dynamically generate investigation subtasks based on what it”</b> <i>(trong đáp án B)</i>: gỡ lỗi là thích ứng — mỗi tệp bạn đọc sẽ thay đổi bước tiếp theo hữu ích…","elim":["<b>A. Run parallel worker agents on the file system of four layers, then combine their findings to reconstruct the complete error path.</b>: Bỏ qua yêu cầu chính “The agent must trace the error through routing,”.","<b>C. Define a fixed sequence of investigation steps upfront—grep for error handlers, then examine middleware, then check database queries, then examine middleware-woven code.</b>: Bỏ qua yêu cầu chính “The agent must trace the error through routing,”.","<b>D. Have the agent first create a comprehensive plan mapping all code paths through documented components before beginning any exploration or code reading.</b>: Bỏ qua yêu cầu chính “The agent must trace the error through routing,”."]}},{"id":"t1q2","n":2,"topic":1,"type":"mcq","stem":{"en":"Your agent needs to insert a new helper function into the middle of a 150-line utility module, between two existing functions. The Edit tool fails because its old_string parameter cannot find unique text to match – the file has repetitive docstrings, variable names, and structural patterns. What&#x27;s the most reliable way to complete this insertion?"},"options":[{"k":"A","t":{"en":"Use Read to load the file, add the function at the appropriate location, then Write the updated file"}},{"k":"B","t":{"en":"Use Edit&#x27;s replace_all parameter to target a common pattern and embed the new function in the replacement text"}},{"k":"C","t":{"en":"Use Edit with an extremely long old_string capturing 30+ lines of context to guarantee uniqueness"}},{"k":"D","t":{"en":"Use Bash to append the function definition to the end of the file using heredoc syntax"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“The Edit tool fails because its old_string parameter cannot find unique”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Use Read to load the file, add the function at the”</b> <i>(trong đáp án A)</i>: Khi Edit không thể tìm được old_string duy nhất vì tệp có nhiều đoạn lặp, cách chắc chắn…","elim":["<b>B. Use Edit&#x27;s replace_all parameter to target a common pattern and embed the new function in the replacement text</b>: Bỏ qua yêu cầu chính “The Edit tool fails because its old_string parameter”.","<b>C. Use Edit with an extremely long old_string capturing 30+ lines of context to guarantee uniqueness</b>: Bỏ qua yêu cầu chính “The Edit tool fails because its old_string parameter”.","<b>D. Use Bash to append the function definition to the end of the file using heredoc syntax</b>: Bash có thể thực hiện thao tác nhưng dễ vỡ và bỏ qua contract hoặc…"]}},{"id":"t1q3","n":3,"topic":1,"type":"mcq","stem":{"en":"An engineer used Claude Code yesterday to investigate authentication flows in a legacy monolith, building up significant context over a 2-hour session. Today she wants to continue that specific investigation. She&#x27;s worked on three other codebases since then and knows the session was named &quot;auth-deep-dive&quot;. How should she resume?"},"options":[{"k":"A","t":{"en":"Use --resume auth-deep-dive to load that specific session by name"}},{"k":"B","t":{"en":"Use --session-id with the UUID from yesterday&#x27;s session transcript file"}},{"k":"C","t":{"en":"Use --continue to pick up where the most recent conversation left off"}},{"k":"D","t":{"en":"Start fresh and re-read the same files"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“An engineer used Claude Code yesterday to investigate authentication flows in”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Use --resume auth-deep-dive to load that specific session by name”</b> <i>(trong đáp án A)</i>: --resume cho phép tiếp tục một phiên cụ thể theo tên.","elim":["<b>B. Use --session-id with the UUID from yesterday&#x27;s session transcript file</b>: Bỏ qua yêu cầu chính “An engineer used Claude Code yesterday to investigate”.","<b>C. Use --continue to pick up where the most recent conversation left off</b>: Bỏ qua yêu cầu chính “An engineer used Claude Code yesterday to investigate”.","<b>D. Start fresh and re-read the same files</b>: Bắt đầu lại làm mất phần context đã tích lũy và buộc hệ thống lặp…"]}},{"id":"t1q4","n":4,"topic":1,"type":"mcq","stem":{"en":"An engineer&#x27;s exploration subagent spent 30 minutes analyzing a legacy payment system, reading 47 files and documenting data flows. The session was interrupted when the engineer&#x27;s connection dropped. While away, a teammate merged a PR that renamed two utility functions. The engineer wants to continue the same exploration. What&#x27;s the most effective approach?"},"options":[{"k":"A","t":{"en":"Resume the subagent from its previous transcript without mentioning the changes–the architecture understanding remains valid."}},{"k":"B","t":{"en":"Resume the subagent from its previous transcript and inform it about the renamed functions."}},{"k":"C","t":{"en":"Launch a fresh subagent and include the prior transcript in the initial prompt for context."}},{"k":"D","t":{"en":"Launch a fresh subagent with a summary of prior findings."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“The engineer wants to continue the same exploration.”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Resume the subagent from its previous transcript and inform it about”</b> <i>(trong đáp án B)</i>: Tiếp tục từ bản ghi cũ với thông tin cập nhật về các chức năng đã được đổi…","elim":["<b>A. Resume the subagent from its previous transcript without mentioning the changes–the architecture understanding remains valid.</b>: Phương án này tiếp tục dựa trên trạng thái cũ mà không cập nhật thay…","<b>C. Launch a fresh subagent and include the prior transcript in the initial prompt for context.</b>: Bắt đầu lại làm mất phần context đã tích lũy và buộc hệ thống lặp…","<b>D. Launch a fresh subagent with a summary of prior findings.</b>: Bắt đầu lại làm mất phần context đã tích lũy và buộc hệ thống lặp…"]}},{"id":"t1q5","n":5,"topic":1,"type":"mcq","stem":{"en":"Your agent has spent 25 minutes exploring a game engine&#x27;s rendering subsystem–reading shader code, buffer management, and frame synchronization logic. An engineer now asks it to understand how the physics engine integrates with rendering for collision debug overlays. You notice recent responses reference &quot;typical rendering patterns&quot; rather than the specific VulkanPipeline and FrameGraph classes it discovered earlier. What&#x27;s the most effective approach?"},"options":[{"k":"A","t":{"en":"Use /clear to reset context completely, then start fresh with physics exploration using file paths from the project&#x27;s CLAUDE.md."}},{"k":"B","t":{"en":"Summarize key rendering findings, then spawn a sub-agent for physics exploration with that summary in its initial context."}},{"k":"C","t":{"en":"Spawn a sub-agent to explore physics independently, then manually synthesize its findings with the rendering knowledge accumulated in the main conversation."}},{"k":"D","t":{"en":"Continue in the current context with more targeted prompts referencing the specific classes by name."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“You notice recent responses reference &quot;typical rendering patterns&quot; rather than the”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Summarize key rendering findings, then spawn a sub-agent for physics exploration”</b> <i>(trong đáp án B)</i>: Phản hồi chung chung về &quot;mẫu kết xuất điển hình&quot; báo hiệu sự suy giảm bối cảnh sau…","elim":["<b>A. Use /clear to reset context completely, then start fresh with physics exploration using file paths from the project&#x27;s CLAUDE.md.</b>: Bắt đầu lại làm mất phần context đã tích lũy và buộc hệ thống lặp…","<b>C. Spawn a sub-agent to explore physics independently, then manually synthesize its findings with the rendering knowledge accumulated in the main conversation.</b>: Bỏ qua yêu cầu chính “You notice recent responses reference &quot;typical rendering patterns&quot;”.","<b>D. Continue in the current context with more targeted prompts referencing the specific classes by name.</b>: Bỏ qua yêu cầu chính “You notice recent responses reference &quot;typical rendering patterns&quot;”."]}},{"id":"t1q6","n":6,"topic":1,"type":"mcq","stem":{"en":"An engineer asks the agent to find all callers of a function before removing it. The function is defined in a core library but is also exposed through wrapper modules that rename the function for domain-specific use (e.g., calculateTax in the library becomes computeOrderTax in the orders module). What exploration strategy will most reliably identify all callers?"},"options":[{"k":"A","t":{"en":"Read the library and wrapper modules to identify all exposed names for the function, then Grep for each name across the codebase."}},{"k":"B","t":{"en":"Use Grep to search for the function&#x27;s original name across the codebase."}},{"k":"C","t":{"en":"Use Grep to find all files that import from the library or wrapper modules, then read each file to check whether it uses the function."}},{"k":"D","t":{"en":"Search for the function name in project documentation to understand intended usage patterns and navigate to documented integration points."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“The function is defined in a core library but is also”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Read the library and wrapper modules to identify all exposed names”</b> <i>(trong đáp án A)</i>: Vì hàm được hiển thị thông qua nhiều mô-đun trình bao bọc với các tên khác nhau nên…","elim":["<b>B. Use Grep to search for the function&#x27;s original name across the codebase.</b>: Tìm kiếm văn bản đơn thuần chỉ cho biết nơi một chuỗi xuất hiện; nó…","<b>C. Use Grep to find all files that import from the library or wrapper modules, then read each file to check whether it uses the function.</b>: Tìm kiếm văn bản đơn thuần chỉ cho biết nơi một chuỗi xuất hiện; nó…","<b>D. Search for the function name in project documentation to understand intended usage patterns and navigate to documented integration points.</b>: Tìm kiếm văn bản đơn thuần chỉ cho biết nơi một chuỗi xuất hiện; nó…"]}},{"id":"t1q7","n":7,"topic":1,"type":"mcq","stem":{"en":"During testing, you observe that in extended exploration sessions (30+ minutes), the agent starts giving inconsistent answers about code structure it discussed earlier. Engineers report having to repeat context about modules they&#x27;ve already explored. What&#x27;s the most effective approach to address this?"},"options":[{"k":"A","t":{"en":"Implement automatic context clearing every 15 minutes to ensure the agent starts with fresh, uncontaminated context."}},{"k":"B","t":{"en":"Switch to a higher-capacity model tier to provide more context window space for accumulated exploration data."}},{"k":"C","t":{"en":"Have the agent maintain a scratchpad file that records key findings, referencing it for subsequent questions."}},{"k":"D","t":{"en":"Create summaries of all source files before exploration begins, loading only these compressed representations into context."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“Engineers report having to repeat context about modules they&#x27;ve already explored.”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Have the agent maintain a scratchpad file that records key findings,”</b> <i>(trong đáp án C)</i>: context window bị giới hạn và sau hơn 30 phút, thông tin cũ sẽ bị đẩy ra ngoài.","elim":["<b>A. Implement automatic context clearing every 15 minutes to ensure the agent starts with fresh, uncontaminated context.</b>: Bỏ qua yêu cầu chính “Engineers report having to repeat context about modules”.","<b>B. Switch to a higher-capacity model tier to provide more context window space for accumulated exploration data.</b>: Đổi model có thể cải thiện chất lượng chung nhưng không xử lý nguyên nhân…","<b>D. Create summaries of all source files before exploration begins, loading only these compressed representations into context.</b>: Bash có thể thực hiện thao tác nhưng dễ vỡ và bỏ qua contract hoặc…"]}},{"id":"t1q8","n":8,"topic":1,"type":"mcq","stem":{"en":"After adding an MCP server with specialized code refactoring tools (extract_function, rename_variable, inline_function), you notice the agent still uses basic text manipulation via Write and Bash sed commands for refactoring tasks. The MCP server is connected and working. Examining the configuration, you find each MCP tool has a minimal description like &quot;extract_function: extracts a function from code.&quot; What&#x27;s the most effective way to improve adoption of the MCP refactoring tools?"},"options":[{"k":"A","t":{"en":"Accept this as expected behavior since simpler tools like sed are more predictable than specialized refactoring tools."}},{"k":"B","t":{"en":"Remove the Write tool from the agent&#x27;s configuration for refactoring sessions so it must use the MCP tools for code modifications."}},{"k":"C","t":{"en":"Enhance the MCP tool descriptions to explain when each tool is preferable to text manipulation and clarify expected inputs and outputs."}},{"k":"D","t":{"en":"Implement a request classifier that detects refactoring intent and automatically routes those requests to the MCP server before the agent processes them."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“After adding an MCP server with specialized code refactoring tools (extract_function,”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Enhance the MCP tool descriptions to explain when each tool is”</b> <i>(trong đáp án C)</i>: Việc lựa chọn công cụ được quyết định bởi những mô tả mà Claude nhìn thấy.","elim":["<b>A. Accept this as expected behavior since simpler tools like sed are more predictable than specialized refactoring tools.</b>: Bash có thể thực hiện thao tác nhưng dễ vỡ và bỏ qua contract hoặc…","<b>B. Remove the Write tool from the agent&#x27;s configuration for refactoring sessions so it must use the MCP tools for code modifications.</b>: Bỏ qua yêu cầu chính “After adding an MCP server with specialized code”.","<b>D. Implement a request classifier that detects refactoring intent and automatically routes those requests to the MCP server before the agent processes them.</b>: Bỏ qua yêu cầu chính “After adding an MCP server with specialized code”."]}},{"id":"t1q9","n":9,"topic":1,"type":"mcq","stem":{"en":"An engineer asks the agent to investigate error handling in a legacy payment processing module spanning 15 files. After reading the first 8 files, the agent&#x27;s responses are becoming noticeably less accurate—it&#x27;s forgetting previously discovered code patterns and hasn&#x27;t yet located all test files or traced the complete data flow. What&#x27;s the most effective approach to complete this investigation?"},"options":[{"k":"A","t":{"en":"Use Grep to search for specific function names across remaining files, reducing the content loaded into context."}},{"k":"B","t":{"en":"Spawn a subagent to explore the remaining files, providing a summary of discovered patterns as its initial context."}},{"k":"C","t":{"en":"Document a summary of findings so far in a file, then start fresh with a new context using that summary as reference."}},{"k":"D","t":{"en":"Close the current context with /clear and start fresh, re-reading only the most critical files."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“After reading the first 8 files, the agent&#x27;s responses are becoming”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Spawn a subagent to explore the remaining files, providing a summary”</b> <i>(trong đáp án B)</i>: Khi agent mất ngữ cảnh sau khi đọc quá nhiều tệp, việc tạo ra một subagent mới với…","elim":["<b>A. Use Grep to search for specific function names across remaining files, reducing the content loaded into context.</b>: Tìm kiếm văn bản đơn thuần chỉ cho biết nơi một chuỗi xuất hiện; nó…","<b>C. Document a summary of findings so far in a file, then start fresh with a new context using that summary as reference.</b>: Bắt đầu lại làm mất phần context đã tích lũy và buộc hệ thống lặp…","<b>D. Close the current context with /clear and start fresh, re-reading only the most critical files.</b>: Bắt đầu lại làm mất phần context đã tích lũy và buộc hệ thống lặp…"]}},{"id":"t1q10","n":10,"topic":1,"type":"mcq","stem":{"en":"An engineer used the agent yesterday to analyze a legacy authentication module, identifying two distinct refactoring approaches: extracting a microservice versus refactoring in-place. Today, they want to explore both approaches in depth–having the agent propose specific code changes for each–before deciding which to implement. What&#x27;s the most effective way to structure this exploration?"},"options":[{"k":"A","t":{"en":"Start two fresh sessions, manually providing a summary of yesterday&#x27;s analysis findings to establish context."}},{"k":"B","t":{"en":"Resume yesterday&#x27;s session to explore the first approach, then start a new session for the second, manually recreating the original context."}},{"k":"C","t":{"en":"Use fork_session to create two branches from yesterday&#x27;s analysis, exploring one approach in each fork."}},{"k":"D","t":{"en":"Resume yesterday&#x27;s session and explore both approaches sequentially within the same conversation thread."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“Today, they want to explore both approaches in depth–having the agent”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Use fork_session to create two branches from yesterday&#x27;s analysis, exploring one”</b> <i>(trong đáp án C)</i>: fork_session cho phép tạo hai nhánh từ cùng một điểm phân tích, mỗi nhánh khám phá một cách…","elim":["<b>A. Start two fresh sessions, manually providing a summary of yesterday&#x27;s analysis findings to establish context.</b>: Bỏ qua yêu cầu chính “Today, they want to explore both approaches in”.","<b>B. Resume yesterday&#x27;s session to explore the first approach, then start a new session for the second, manually recreating the original context.</b>: Bỏ qua yêu cầu chính “Today, they want to explore both approaches in”.","<b>D. Resume yesterday&#x27;s session and explore both approaches sequentially within the same conversation thread.</b>: Bỏ qua yêu cầu chính “Today, they want to explore both approaches in”."]}},{"id":"t1q11","n":11,"topic":1,"type":"mcq","stem":{"en":"Your agent has analyzed a complex service module–reading 23 source files, tracing request flows, and identifying error handling patterns. A developer wants to compare two testing strategies before committing to one: end-to-end tests with mocked external services vs. snapshot tests capturing expected outputs. They need to independently develop both approaches to evaluate trade-offs. How should you manage the sessions?"},"options":[{"k":"A","t":{"en":"Resume the analysis session with fork_session enabled, creating a separate branch for each testing strategy."}},{"k":"B","t":{"en":"Export the analysis session&#x27;s key findings to a file, then create two new sessions that reference this file."}},{"k":"C","t":{"en":"Continue in the original session, developing end-to-end tests first, then snapshot tests sequentially."}},{"k":"D","t":{"en":"Start two fresh sessions, having each re-read the relevant source files before beginning."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“They need to independently develop both approaches to evaluate trade-offs.”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Resume the analysis session with fork_session enabled, creating a separate branch”</b> <i>(trong đáp án A)</i>: Tại sao câu trả lời đúng lại hoạt động: fork_session cho phép tạo hai nhánh từ cùng một…","elim":["<b>B. Export the analysis session&#x27;s key findings to a file, then create two new sessions that reference this file.</b>: Bỏ qua yêu cầu chính “They need to independently develop both approaches to”.","<b>C. Continue in the original session, developing end-to-end tests first, then snapshot tests sequentially.</b>: Bỏ qua yêu cầu chính “They need to independently develop both approaches to”.","<b>D. Start two fresh sessions, having each re-read the relevant source files before beginning.</b>: Bỏ qua yêu cầu chính “They need to independently develop both approaches to”."]}},{"id":"t1q12","n":12,"topic":1,"type":"mcq","stem":{"en":"Your codebase exploration tool stores session IDs to allow engineers to continue investigations across work sessions. An engineer spent an hour yesterday analyzing a legacy authentication module, building context about its architecture and dependencies. They want to continue today. The session ID is valid, but version control shows 3 of the 12 files the agent previously read were modified overnight by a teammate&#x27;s merge. What approach best balances efficiency and accuracy?"},"options":[{"k":"A","t":{"en":"Resume the session and immediately have the agent re-read all 12 previously analyzed files"}},{"k":"B","t":{"en":"Start a fresh session to ensure the agent works with current codebase state without stale assumptions"}},{"k":"C","t":{"en":"Resume the session and inform the agent which specific files changed for targeted re-analysis"}},{"k":"D","t":{"en":"Resume the session without informing the agent about the changed files"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“The session ID is valid, but version control shows 3 of”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Resume the session and inform the agent which specific files changed”</b> <i>(trong đáp án C)</i>: Tiếp tục phiên + thông báo các tệp đã thay đổi là cách cân bằng nhất: giữ nguyên…","elim":["<b>A. Resume the session and immediately have the agent re-read all 12 previously analyzed files</b>: Cách này giữ quá nhiều dữ liệu không cần thiết, làm tăng token, độ trễ…","<b>B. Start a fresh session to ensure the agent works with current codebase state without stale assumptions</b>: Bỏ qua yêu cầu chính “The session ID is valid, but version control”.","<b>D. Resume the session without informing the agent about the changed files</b>: Phương án này tiếp tục dựa trên trạng thái cũ mà không cập nhật thay…"]}},{"id":"t1q13","n":13,"topic":1,"type":"mcq","stem":{"en":"An engineer asks the agent to understand how the caching layer works before adding a new cache invalidation trigger. After initial Grep searches, the agent has identified that caching logic spans 15 files including decorators, middleware, and service classes (~8,000 lines total). What&#x27;s the most effective next step for building understanding while managing context constraints?"},"options":[{"k":"A","t":{"en":"Use the Read tool to sequentially load all 15 files, building complete understanding across the full caching implementation."}},{"k":"B","t":{"en":"Analyze imports and class hierarchies to identify the base cache class, Read that file to understand the interface, then trace specific invalidation implementations."}},{"k":"C","t":{"en":"Use Grep to search for &quot;invalidate&quot; and &quot;expire&quot; patterns across all files, then Read only those specific line ranges with minimal surrounding context."}},{"k":"D","t":{"en":"Use Glob to find files matching common caching patterns (cache.py, caching/), prioritize the largest files by reading them first, then check smaller files for gaps."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“After initial Grep searches, the agent has identified that caching logic”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Analyze imports and class hierarchies to identify the base cache class,”</b> <i>(trong đáp án B)</i>: Bắt đầu từ hierarchy lớp để tìm lớp bộ đệm cơ sở, đọc giao diện, sau đó theo…","elim":["<b>A. Use the Read tool to sequentially load all 15 files, building complete understanding across the full caching implementation.</b>: Cách này giữ quá nhiều dữ liệu không cần thiết, làm tăng token, độ trễ…","<b>C. Use Grep to search for &quot;invalidate&quot; and &quot;expire&quot; patterns across all files, then Read only those specific line ranges with minimal surrounding context.</b>: Tìm kiếm văn bản đơn thuần chỉ cho biết nơi một chuỗi xuất hiện; nó…","<b>D. Use Glob to find files matching common caching patterns (cache.py, caching/), prioritize the largest files by reading them first, then check smaller files for gaps.</b>: Glob chủ yếu khớp tên hoặc đường dẫn tệp; nó không phải công cụ phù…"]}},{"id":"t1q14","n":14,"topic":1,"type":"mcq","stem":{"en":"An engineer who just joined the team asks the agent to help them understand the authentication and authorization architecture before making security improvements. The codebase has 800+ files across multiple services. What exploration strategy will most effectively build understanding, given Claude built-in tools and context limits?"},"options":[{"k":"A","t":{"en":"Read all files containing &quot;auth&quot;, &quot;login&quot;, &quot;permission&quot;, or &quot;token&quot; in their content or filename."}},{"k":"B","t":{"en":"Read any CLAUDE.md and README files first, then ask the engineer to specify which 10-15 files are most important for understanding the auth system."}},{"k":"C","t":{"en":"Use Grep to find authentication entry points, read those files, then follow imports and function calls to map the auth flow incrementally."}},{"k":"D","t":{"en":"Launch parallel subagents to explore different services simultaneously, then synthesize their findings into an architectural overview."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“The codebase has 800+ files across multiple services.”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Use Grep to find authentication entry points, read those files, then”</b> <i>(trong đáp án C)</i>: Với codebase gồm hơn 800 tệp, việc khám phá tăng dần từ các điểm đầu vào và bằng…","elim":["<b>A. Read all files containing &quot;auth&quot;, &quot;login&quot;, &quot;permission&quot;, or &quot;token&quot; in their content or filename.</b>: Cách này giữ quá nhiều dữ liệu không cần thiết, làm tăng token, độ trễ…","<b>B. Read any CLAUDE.md and README files first, then ask the engineer to specify which 10-15 files are most important for understanding the auth system.</b>: Bỏ qua yêu cầu chính “The codebase has 800+ files across multiple services”.","<b>D. Launch parallel subagents to explore different services simultaneously, then synthesize their findings into an architectural overview.</b>: Bỏ qua yêu cầu chính “The codebase has 800+ files across multiple services”."]}},{"id":"t1q15","n":15,"topic":1,"type":"mcq","stem":{"en":"After integrating a local MCP server providing code analysis tools (analyze_dependencies, find_dead_code, calculate_complexity), you notice the agent continues to use Grep to inspect dependencies even when users explicitly ask about &quot;code dependencies&quot;. Tool definitions reveal: analyze_dependencies returns a dependency graph by analyzing imports. What&#x27;s the most effective approach to improve the agent&#x27;s selection of MCP tools?"},"options":[{"k":"A","t":{"en":"Split analyze_dependencies into granular tools: list_imports, detect_transitive_deps, identify_circular_deps to avoid overlap with Grep."}},{"k":"B","t":{"en":"Expand MCP tool descriptions and outputs–e.g., &quot;Builds dependency graph with list_imports, direct_circular_deps&quot;–to clearly distinguish dependencies and cycle analysis from Grep."}},{"k":"C","t":{"en":"Remove Grep from the available tools to eliminate functional overlap."}},{"k":"D","t":{"en":"Add routing questions to the system prompt specifying that dependency-related questions should use MCP tools rather than Grep."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“After integrating a local MCP server providing code analysis tools (analyze_dependencies,”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Expand MCP tool descriptions and outputs–e.g., &quot;Builds dependency graph with list_imports,”</b> <i>(trong đáp án B)</i>: agent không sử dụng công cụ MCP vì mô tả công cụ không ược đồ.","elim":["<b>A. Randomly sample 20% of extractions for review, using corrections to track accuracy and identify error patterns.</b>: Bỏ qua yêu cầu chính “Human reviewers have capacity to check only 20%”.","<b>B. Review all extractions from documents with formatting anomalies such as unusual layouts or mixed content types.</b>: Bỏ qua yêu cầu chính “Human reviewers have capacity to check only 20%”.","<b>D. Prioritize review of all extractions where required fields are empty or explicitly marked as not found.</b>: Bỏ qua yêu cầu chính “Human reviewers have capacity to check only 20%”."]}},{"id":"t1q18","n":18,"topic":1,"type":"mcq","stem":{"en":"Your extraction pipeline processes invoices and extracts line items, tax amounts, and grand totals. You discover that 8% of documents have extracted line item amounts that don&#x27;t sum to the extracted grand total—the downstream accounting system has been detecting mismatches. What&#x27;s the most effective improvement?"},"options":[{"k":"A","t":{"en":"Extract line items and totals independently, then use a separate validation model to reconcile discrepancies."}},{"k":"B","t":{"en":"Implement post-processing that automatically adjusts line item amounts when the extracted total doesn&#x27;t match the sum."}},{"k":"C","t":{"en":"Add few-shot examples to the system prompt where extracted line items correctly sum to demonstrate the desired extraction behavior."}},{"k":"D","t":{"en":"Add a calculated_total field where the model extracts line items independently, then validate totals alongside a is_total_consistent boolean flag for human review when values differ."}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“You discover that 8% of documents have extracted line item amounts”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Add a calculated_total field where the model extracts line items independently,”</b> <i>(trong đáp án D)</i>: Thêm trường được tính_total để mô hình có thể tự xác thực bằng cách tính tổng từ các…","elim":["<b>A. Extract line items and totals independently, then use a separate validation model to reconcile discrepancies.</b>: Bỏ qua yêu cầu chính “You discover that 8% of documents have extracted”.","<b>B. Implement post-processing that automatically adjusts line item amounts when the extracted total doesn&#x27;t match the sum.</b>: Tự sửa số liệu để làm chúng khớp nhau có thể che giấu OCR hoặc…","<b>C. Add few-shot examples to the system prompt where extracted line items correctly sum to demonstrate the desired extraction behavior.</b>: Bỏ qua yêu cầu chính “You discover that 8% of documents have extracted”."]}},{"id":"t1q19","n":19,"topic":1,"type":"mcq","stem":{"en":"Your pipeline uses a tool called extract_metadata with a JSON schema for paper details. During testing, the agent sometimes fails to call extract_metadata because it wants to provide direct answers. What&#x27;s the most reliable way to ensure metadata extraction always happens first?"},"options":[{"k":"A","t":{"en":"Set tool_choice to &quot;auto&quot; in the API call, combined with tools so that Claude always prioritizes metadata before any other tool calls."}},{"k":"B","t":{"en":"Set tool_choice to &quot;auto&quot; and reorder the tool definitions placing extract_metadata first since Claude prioritizes earlier-listed tools."}},{"k":"C","t":{"en":"Set tool_choice to type &quot;tool&quot;, name &quot;extract_metadata&quot; and process the enrichment requests in subsequent turns after receiving the extracted metadata."}},{"k":"D","t":{"en":"Set tool_choice to type &quot;any&quot; so Claude must use a tool, combined with system prompt instructions to call extract_metadata first."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“During testing, the agent sometimes fails to call extract_metadata because it”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Set tool_choice to type &quot;tool&quot;, name &quot;extract_metadata&quot; and process the enrichment”</b> <i>(trong đáp án C)</i>: Việc sử dụng tool_choice với loại &quot;tool&quot; và tên &quot;extract_metadata&quot; buộc Claude phải gọi đúng công cụ trước.","elim":["<b>A. Set tool_choice to &quot;auto&quot; in the API call, combined with tools so that Claude always prioritizes metadata before any other tool calls.</b>: tool_choice: &quot;auto&quot; vẫn cho phép Claude trả lời bằng text hoặc chọn tool khác; nó…","<b>B. Set tool_choice to &quot;auto&quot; and reorder the tool definitions placing extract_metadata first since Claude prioritizes earlier-listed tools.</b>: tool_choice: &quot;auto&quot; vẫn cho phép Claude trả lời bằng text hoặc chọn tool khác; nó…","<b>D. Set tool_choice to type &quot;any&quot; so Claude must use a tool, combined with system prompt instructions to call extract_metadata first.</b>: tool_choice: &quot;any&quot; chỉ ép dùng một tool bất kỳ, không bảo đảm đúng tool hoặc…"]}},{"id":"t1q20","n":20,"topic":1,"type":"mcq","stem":{"en":"After your daily batch of 10,000 documents completes, 300 documents (3%) failed with &quot;context_length_exceeded&quot; errors. The results file identifies each failure by custom_id. What&#x27;s the most cost-effective approach to process these failures?"},"options":[{"k":"A","t":{"en":"Resubmit only the 300 failed documents after chunking them into smaller pieces, then combine the partial extractions"}},{"k":"B","t":{"en":"Increase the max_tokens parameter for the 300 failed documents and resubmit them in a new batch"}},{"k":"C","t":{"en":"Reprocess the entire batch with prompt caching enabled to reduce the cost of retrying requests with identical system prompts"}},{"k":"D","t":{"en":"Resubmit the entire 10,000 document batch using a model tier with a larger context window"}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“After your daily batch of 10,000 documents completes, 300 documents (3%)”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Resubmit only the 300 failed do list exists only in an external document not in the input"}},{"k":"D","t":{"en":"The model extracts dates as ISO 8601 datetime strings (&quot;2023-03-15T00:00:00Z&quot;) when the schema requires only the date portion (YYYY-MM-DD)"}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“Your extraction system implements automatic retries when validation fails.”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“The model extracts &quot;et al.&quot; for co-authors when the full list”</b> <i>(trong đáp án C)</i>: Không có lần thử lại nào sẽ hiển thị thông tin mô hình không có trong dữ liệu…","elim":["<b>A. The model extracts citation counts as locale-formatted strings (&quot;1,234&quot;) when the schema requires integers</b>: Bỏ qua yêu cầu chính “Your extraction system implements automatic retries when validation”.","<b>B. The model extracts keywords as a nested object organized by category when the schema requires a flat array of strings</b>: Bỏ qua yêu cầu chính “Your extraction system implements automatic retries when validation”.","<b>D. The model extracts dates as ISO 8601 datetime strings (&quot;2023-03-15T00:00:00Z&quot;) when the schema requires only the date portion (YYYY-MM-DD)</b>: Bỏ qua yêu cầu chính “Your extraction system implements automatic retries when validation”."]}},{"id":"t1q25","n":25,"topic":1,"type":"mcq","stem":{"en":"Your extraction pipeline processes restaurant menus and must output structured JSON with fields for item names, descriptions, prices, and dietary tags. Some menus use inconsistent formatting–prices as &quot;$12&quot; vs &quot;12.00&quot;, dietary info as icons vs text. What&#x27;s the most reliable approach?"},"options":[{"k":"A","t":{"en":"Define a strict output schema and include format normalization rules in your prompt."}},{"k":"B","t":{"en":"Use separate extraction calls for each field to ensure consistent handling of each type."}},{"k":"C","t":{"en":"Extract data as-is and normalize formats in post-processing code after Claude returns."}},{"k":"D","t":{"en":"Request multiple extraction attempts per document and select the most common format."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“Some menus use inconsistent formatting–prices as &quot;$12&quot; vs &quot;12.00&quot;, dietary info”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Define a strict output schema and include format normalization rules in”</b> <i>(trong đáp án A)</i>: Đối với các menu có định dạng không nhất quán, việc kết hợp lược đồ (cấu trúc) đầu…","elim":["<b>B. Use separate extraction calls for each field to ensure consistent handling of each type.</b>: Bỏ qua yêu cầu chính “Some menus use inconsistent formatting–prices as &quot;$12&quot; vs”.","<b>C. Extract data as-is and normalize formats in post-processing code after Claude returns.</b>: Bỏ qua yêu cầu chính “Some menus use inconsistent formatting–prices as &quot;$12&quot; vs”.","<b>D. Request multiple extraction attempts per document and select the most common format.</b>: Bỏ qua yêu cầu chính “Some menus use inconsistent formatting–prices as &quot;$12&quot; vs”."]}},{"id":"t1q26","n":26,"topic":1,"type":"mcq","stem":{"en":"Your extraction uses tool use with a JSON schema where property_type is defined as an enum: [&#x27;house&#x27;, &#x27;apartment&#x27;, &#x27;condo&#x27;, &#x27;townhouse&#x27;]. After deployment, 8% of extractions fail schema validation. Investigation reveals listings mention many uncommon property types –&quot;studio&quot;, &quot;loft&quot;, &quot;duplex&quot;, &quot;mobile home&quot;, &quot;tiny house&quot;, &quot;converted warehouse&quot;–and new types continue appearing regularly. What&#x27;s the most effective long-term solution?"},"options":[{"k":"A","t":{"en":"Add an &quot;other&quot; value to your enum with a separate property_type_detail string field for specifics when &quot;other&quot; is selected."}},{"k":"B","t":{"en":"Add few-shot examples to your prompt demonstrating how to map unexpected property types to the closest existing enum value."}},{"k":"C","t":{"en":"Change property_type from an enum to a free-form string and implement a normalization step in post-processing."}},{"k":"D","t":{"en":"Continuously expand the enum to include newly observed property types and add monitoring for additional edge cases."}}],"answer":["A"],"multi":false,"explain":{"key":"<b>“Investigation reveals listings mention many uncommon property types –&quot;studio&quot;, &quot;loft&quot;, &quot;duplex&quot;,”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Add an &quot;other&quot; value to your enum with a separate property_type_detail”</b> <i>(trong đáp án A)</i>: Bởi vì các loại thuộc tính mới liên tục xuất hiện nên các enum cứng sẽ luôn lỗi…","elim":["<b>B. Add few-shot examples to your prompt demonstrating how to map unexpected property types to the closest existing enum value.</b>: Bỏ qua yêu cầu chính “Investigation reveals listings mention many uncommon property types”.","<b>C. Change property_type from an enum to a free-form string and implement a normalization step in post-processing.</b>: Đầu ra text tự do buộc downstream hoặc model phải parse lại, làm tăng lỗi…","<b>D. Continuously expand the enum to include newly observed property types and add monitoring for additional edge cases.</b>: Bỏ qua yêu cầu chính “Investigation reveals listings mention many uncommon property types”."]}},{"id":"t1q27","n":27,"topic":1,"type":"mcq","stem":{"en":"Your system has been operating with 100% human review for 3 months. Analysis shows that extractions with model confidence &gt;90% have 97% accuracy overall. To reduce reviewer workload, you plan to automate high-confidence extractions Before deploying, what validation step is most critical?"},"options":[{"k":"A","t":{"en":"Run a two-week pilot routing 25% of high-confidence extractions directly to downstream systems and monitor error reports."}},{"k":"B","t":{"en":"Verify that 97% accuracy meets requirements for all downstream systems that consume the extracted data."}},{"k":"C","t":{"en":"Analyze accuracy by document type and field to verify high-confidence extractions perform consistently across all segments, not just in aggregate."}},{"k":"D","t":{"en":"Compare accuracy at different confidence thresholds (85%, 90%, 95%) to find the optimal cutoff that maximizes automation while minimizing errors."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“Analysis shows that extractions with model confidence &gt;90% have 97% accuracy”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Analyze accuracy by document type and field to verify high-confidence extractions”</b> <i>(trong đáp án C)</i>: Độ chính xác tổng hợp che giấu các lỗi phân đoạn - một loại tài liệu có thể…","elim":["<b>A. Run a two-week pilot routing 25% of high-confidence extractions directly to downstream systems and monitor error reports.</b>: Bỏ qua yêu cầu chính “Analysis shows that extractions with model confidence &gt;90%”.","<b>B. Verify that 97% accuracy meets requirements for all downstream systems that consume the extracted data.</b>: Bỏ qua yêu cầu chính “Analysis shows that extractions with model confidence &gt;90%”.","<b>D. Compare accuracy at different confidence thresholds (85%, 90%, 95%) to find the optimal cutoff that maximizes automation while minimizing errors.</b>: Bỏ qua yêu cầu chính “Analysis shows that extractions with model confidence &gt;90%”."]}},{"id":"t1q28","n":28,"topic":1,"type":"mcq","stem":{"en":"Documents arrive continuously throughout business hours and need structured data extracted. To reduce costs, you want to use the Message Batches API (50% discount, up-to-24-hour processing window). Your SLA specifies that extraction results must be available within 30 hours of document arrival with 99.9% reliability. Which batching strategy is most appropriate?"},"options":[{"k":"A","t":{"en":"Submit a single batch at end of day containing all documents from that day"}},{"k":"B","t":{"en":"Submit batches every 6 hours containing documents from that window"}},{"k":"C","t":{"en":"Use the real-time API for all documents instead of batch processing"}},{"k":"D","t":{"en":"Submit batches every 4 hours containing documents from that window"}}],"answer":["D"],"multi":false,"explain":{"key":"<b>“Your SLA specifies that extraction results must be available within 30”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Submit batches every 4 hours containing documents from that window”</b> <i>(trong đáp án D)</i>: Việc gửi các đợt 4 giờ một lần đảm bảo rằng trong trường hợp xấu nhất, tài liệu…","elim":["<b>A. Submit a single batch at end of day containing all documents from that day</b>: Batch có độ trễ bất đồng bộ; cách chia này không để đủ safety margin…","<b>B. Submit batches every 6 hours containing documents from that window</b>: Batch có độ trễ bất đồng bộ; cách chia này không để đủ safety margin…","<b>C. Use the real-time API for all documents instead of batch processing</b>: Dùng real-time cho toàn bộ khối lượng đáp ứng latency nhưng bỏ qua cơ hội…"]}},{"id":"t1q29","n":29,"topic":1,"type":"mcq","stem":{"en":"Your schema includes a skills: string[] field. Production monitoring reveals three consistency issues: (1) compound phrases like &quot;Python and SQL&quot; are sometimes kept as one entry, sometimes split; (2) implied but unstated skills occasionally appear in extractions; (3) similar documents produce wildly different array lengths (5-10 vs 40+ entries). Your prompt currently says &quot;Extract all skills mentioned.&quot; What&#x27;s the most effective improvement?"},"options":[{"k":"A","t":{"en":"Add post-extraction normalization that maps skills to a canonical taxonomy and deduplicates similar entries."}},{"k":"B","t":{"en":"Add constraints: &quot;Extract 10-20 skills maximum, one skill per entry, only explicitly named skills.&quot;"}},{"k":"C","t":{"en":"Add few-shot examples demonstrating compound phrase handling, explicit mention criteria, and appropriate entry granularity."}},{"k":"D","t":{"en":"Enrich the schema to {skill: string, confidence: float, source_quote: string[]} to capture extraction metadata."}}],"answer":["C"],"multi":false,"explain":{"key":"<b>“Your prompt currently says &quot;Extract all skills mentioned.&quot;”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Add few-shot examples demonstrating compound phrase handling, explicit mention criteria, and”</b> <i>(trong đáp án C)</i>: Ba vấn đề (cụm từ ghép, kỹ năng ngụ ý, độ dài không nhất quán) đều xuất phát…","elim":["<b>A. Add post-extraction normalization that maps skills to a canonical taxonomy and deduplicates similar entries.</b>: Bỏ qua yêu cầu chính “Your prompt currently says &quot;Extract all skills mentioned.&quot;”.","<b>B. Add constraints: &quot;Extract 10-20 skills maximum, one skill per entry, only explicitly named skills.&quot;</b>: Bỏ qua yêu cầu chính “Your prompt currently says &quot;Extract all skills mentioned.&quot;”.","<b>D. Enrich the schema to {skill: string, confidence: float, source_quote: string[]} to capture extraction metadata.</b>: Bỏ qua yêu cầu chính “Your prompt currently says &quot;Extract all skills mentioned.&quot;”."]}},{"id":"t1q30","n":30,"topic":1,"type":"mcq","stem":{"en":"Your extraction system processes two document types: standard monthly reports (archived after processing) and urgent exception reports (must trigger business alerts within 30 minutes of receipt). Both use the same JSON schema. You want to minimize API costs while meeting latency requirements. How should you architect the processing pipeline?"},"options":[{"k":"A","t":{"en":"Queue all documents and submit hourly batches, flagging urgent documents for expedited handling when batch results return."}},{"k":"B","t":{"en":"Route standard reports to the Batch API for 50% cost savings, and route urgent exception reports to the real-time Messages API."}},{"k":"C","t":{"en":"Submit all documents to the Batch API with custom_ids for tracking. When results arrive, immediately process urgent documents and trigger delayed alerts for exceptions."}},{"k":"D","t":{"en":"Submit all documents to the real-time Messages API to ensure consistent processing latency across document types."}}],"answer":["B"],"multi":false,"explain":{"key":"<b>“You want to minimize API costs while meeting latency requirements.”</b> <i>(trong câu hỏi)</i>: Xác định yêu cầu chính của câu hỏi.<br><b>“Route standard reports to the Batch API for 50% cost savings,”</b> <i>(trong đáp án B)</i>: Standard monthly reports không cần phản hồi ngay nên phù hợp với Batch API để giảm chi phí.","elim":["<b>A. Queue all documents and submit hourly batches, flagging urgent documents for expedited handling when batch results return.</b>: Batch có độ trễ bất đồng bộ; cách chia này không để đủ safety margin…","<b>C. Submit all documents to the Batch API with custom_ids for tracking. When results arrive, immediately process urgent documents and trigger delayed alerts for exceptions.</b>: Batch có độ trễ bất đồng bộ; cách chia này không để đủ safety margin…","<b>D. Submit all documents to the real-time Messages API to ensure consistent processing latency across document types.</b>: Bỏ qua yêu cầu chính “You want to minimize API costs while meeting”."]}},{"id":"t1q31","n":31,"topic":1,"type":"mcq","stem":{"en":"The document analysis agent has a single analyze_document tool that takes a document and a free-text instruction parameter. During evaluation, requests like &quot;extract the key financial metrics&quot; often return narrative summaries, while &quot;summarize the methodology&quot; sometimes returns raw data tables. The synthesis agent reports that 35% of analysis results require re-requests with clarified instructions. What&#x27;s the most effective way to improve reliability?"},"options":[{"k":"A","t":{"en":"Keep the single tool but add an analysis_type enum parame
